[package]
name = "system-monitor"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
bpf = ["cgroup-bpf/bpf"]
dora = ["monitor-output/dora"]

task-bpf = ["task-accounting/bpf"]

[dependencies]
task-accounting = { path = "../task-accounting" }
monitor-wire = { path = "../monitor-wire" }
monitor-core = { path = "../monitor-core" }
cgroup-bpf = { path = "../cgroup-bpf" }
monitor-output = { path = "../monitor-output" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
eyre = "0.6"
ctrlc = { version = "3.4", features = ["termination"] }
