[package]
name = "monitor-output"
version = "0.1.0"
edition = "2021"

[features]
default = []
dora = ["dep:dora-node-api"]

[dependencies]
monitor-wire = { path = "../monitor-wire" }
eyre = "0.6"
mcap = { version = "=0.25.0", default-features = false }
dora-node-api = { version = "=1.1.0", optional = true, default-features = false }

[[bin]]
name = "mcap-recorder"
path = "src/bin/mcap-recorder.rs"
required-features = ["dora"]

[dev-dependencies]
monitor-core = { path = "../monitor-core" }
