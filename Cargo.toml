[workspace]
members = [
    "console/server/native",
    "libs/activity-tracing",
    "libs/resources/cgroup-bpf",
    "libs/memory/cuda-host-memory",
    "libs/memory/cuda-dora-shm",
    "apps/cuda-shm-demo",
    "libs/resources/monitor-core",
    "libs/pbtxt-config",
    "libs/resources/resource-policy",
    "libs/step-provenance",
    "libs/session",
    "libs/workload-lifecycle",
    "libs/workload-supervisor",
    "libs/workload-docker",
    "libs/orchestrator",
    "libs/storage-persistence",
    "libs/resources/task-accounting",
    "libs/telemetry/mcap",
    "libs/telemetry/protocol",
    "libs/telemetry/workflow-protocol",
    "libs/fault/reporter",
    "libs/fault/aggregation",
    "libs/fault/protocol",
    "libs/fault/schema",
    "apps/system-monitor",
    "apps/system-monitor/dora",
    "apps/cpu-viewer/server",
    "apps/mcap-recorder",
    "apps/fault-watchdog",
    "apps/fault-demo",
    "apps/storage-demo",
    "apps/activity-demo/server",
    "apps/project-explorer/server",
    "apps/orchestrator-demo/server",
    "apps/provenance-demo/server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# Correctness CI: compact artifacts, fast compilation, and runtime checks.
[profile.ci]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"
incremental = false
debug-assertions = true
overflow-checks = true
