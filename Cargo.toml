[workspace]
members = [
    "libs/activity-tracing",
    "libs/cgroup-bpf",
    "libs/monitor-core",
    "libs/pbtxt-config",
    "libs/resource-policy",
    "libs/step-provenance",
    "libs/storage-persistence",
    "libs/task-accounting",
    "libs/telemetry-mcap",
    "libs/telemetry-protocol",
    "libs/fault/reporter",
    "libs/fault/aggregation",
    "libs/fault/protocol",
    "libs/fault/schema",
    "apps/system-monitor",
    "apps/system-monitor/dora",
    "apps/cpu-viewer/server",
    "apps/mcap-recorder",
    "apps/fault-watchdog",
    "apps/fault-demo",
    "apps/storage-demo",
    "apps/activity-demo/server",
    "apps/provenance-demo/server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
