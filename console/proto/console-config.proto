syntax = "proto3";
package doramcap.console.v1;
import "compose.proto";
import "dora.proto";
import "live.proto";

message ConsoleConfig {
  bool download_missing_images = 11; // Prepare selected images before Review.
  string listen_address = 1;
  string project_root = 2;
  string data_root = 3;
  string docker_socket = 4;
  string access_secret_file = 5;
  repeated SystemAppDefinition system_apps = 6;
  doramcap.dora.v1.DoraRuntime dora = 9;
  string public_origin = 7;
  RuntimeConfig runtime = 8;
  LiveBridge live_bridge = 10; // Absent hides the live bridge system app.
}

// Omitted fields preserve defaults; explicit zero is invalid.
message RuntimeConfig {
  optional uint32 readiness_seconds = 1; // Default: 60.
  optional uint32 stop_seconds = 2; // Default: 15.
  optional uint32 sample_interval_ms = 3; // Default: 100; also bounds activity publication cadence.
}


message OutputMount { string service = 1; string target = 2; }
// One way to launch an app. Its outputs add to the app's own.
message LaunchProfile {
  string id = 1;
  string label = 2;
  string config = 3; // Absolute pbtxt path, mounted read-only at the app's config_mount.
  repeated RecordingOutput recordings = 4;
  repeated LiveOutput live_outputs = 5;
  string graph = 6; // Optional complete native Dora graph for this profile.
}
message SystemAppDefinition {
  string id = 1;
  string label = 2;
  bool default_selected = 3;
  doramcap.compose.v1.ComposeProject input = 4;
  repeated RecordingOutput recordings = 5;
  string graph = 7;
  repeated OutputMount output_mounts = 8;
  repeated LiveOutput live_outputs = 9; // Relayed when the live bridge is selected.
  OutputMount config_mount = 10; // Required with launch_profiles.
  bool health_inputs = 12; // Subscribe this app's graph node to selected health outputs.
  repeated LaunchProfile launch_profiles = 11; // The first is the default.
}

// Prebuilt bridge image and its loopback WebSocket port; zero selects a free one at startup.
message LiveBridge { string image = 1; uint32 port = 2; }
// One Dora output, "node/output", and the codec of its payload bytes.
message LiveOutput { string source = 1; doramcap.console.live.v1.Kind kind = 2; }

message RecordingOutput { string id = 1; string path = 2; string stream = 3; bool cpu = 4; }

// Release metadata and relative playground configuration, resolved by the installer CLI.
message ReleaseManifest {
  string version = 1;
  string platform = 2;
  ConsoleConfig config = 3;
}
