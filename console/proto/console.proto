syntax = "proto3";
package doramcap.console.v1;

import "console-config.proto";
import "workflow.proto";
import "live.proto";
import "filesystem.proto";

// Omitted selection preserves host defaults; an explicit empty list selects no apps.
message SystemAppSelection {
  repeated string ids = 1;
  map<string, string> profiles = 2; // App ID to launch profile ID; omitted apps use their default.
}
message ProfileOption { string id = 1; string label = 2; }
message SystemApp {
  string id = 1;
  string label = 2;
  bool selected = 3;
  bool required = 4;
  repeated ProfileOption profiles = 5;
  string profile = 6; // The profile this app launches with when selected.
}
// `baseline_run_id` names the run a Run again review compares with; empty selects the latest completed run.
message PrepareRequest { repeated string profiles = 2; SystemAppSelection system_apps = 3; string baseline_run_id = 4; }
message StartRequest { string prepared_id = 1; string request_key = 2; }
message StopRequest { string run_id = 1; }
message StartResponse { string run_id = 1; }
message StopResponse { bool accepted = 1; }
message Service { string name = 1; string image_id = 2; }
message Review {
  string prepared_id = 1;
  string run_id = 2;
  repeated string available_profiles = 3;
  repeated string selected_profiles = 4;
  repeated Service services = 5;
  repeated string warnings = 6;
  repeated SystemApp system_apps = 7;
  repeated RecordingOutput recordings = 8;
  repeated LiveStream live_streams = 10;
  ReviewComparison comparison = 11;
  doramcap.filesystem.v1.WritePolicy write_policy = 12;
}

enum Phase {
  PHASE_UNSPECIFIED = 0;
  IDLE = 1;
  PREPARING = 2;
  REVIEWED = 3;
  STARTING = 4;
  RUNNING = 5;
  STOPPING = 6;
  FINISHED = 7;
  BLOCKED = 8;
}
message Outcome {
  string execution = 1;
  string error = 6; // Why the run failed; empty on success.
  optional bool writers_stopped = 2;
  optional bool recording_finalized = 3;
  optional bool boundary_clean = 4;
  optional bool event_stream_healthy = 5;
  repeated ServiceExit service_exits = 7;
}
// How one service container's main process ended, as reported by Docker.
message ServiceExit {
  string service = 1;
  int32 exit_code = 2; // 128+N when signal N ended it.
  bool oom_killed = 3;
  bool killed = 4; // SIGKILL or the OOM killer ended it, so unsent data may be lost.
}
// One service the stopping run is waiting on.
message StoppingService {
  string service = 1;
  uint32 force_stop_in_seconds = 2; // 0 once Docker's force stop is due.
}
// One relayed bridge input; frames carry `id` as their stream.
message LiveStream { string id = 1; string app_id = 2; doramcap.console.live.v1.Kind kind = 3; }
// One `/api/live` message: an encoded Status, or a live.v1.Frame relayed unmodified.
message LiveMessage { oneof body { bytes status = 1; bytes frame = 2; } }
// Saved bounded view of the immutable report; absent on runs without capture.
message FileChanges {
  doramcap.filesystem.v1.FileChangeReference report = 1;
  repeated doramcap.filesystem.v1.FileChange preview = 2;
  repeated string coverage_notes = 3;
  bool preview_incomplete = 4;
  bool notes_incomplete = 5;
  bool downloadable = 6;
  string error = 7;
  doramcap.filesystem.v1.ReportState state = 8;
  repeated uint64 preview_positions = 9; // Parallel to preview; zero-based positions across saved categories in report order.
  string kept_directory = 10; // Absolute intended KEEP destination; the folder may be absent or partial.
  repeated uint64 downloadable_positions = 11; // Available regular files in the bounded preview.
}
message Status {
  Phase phase = 1;
  string run_id = 2;
  repeated doramcap.workflow.v1.Event steps = 3;
  uint64 sequence = 4;
  uint64 lost_events = 5;
  uint64 truncated_steps = 6;
  bool progress_incomplete = 7;
  Outcome outcome = 8;
  uint64 overflow_steps = 9;
  bool cpu_available = 10;
  bool report_available = 11;
  string project_directory = 13;
  repeated string profiles = 14;
  repeated RunMetric metrics = 15;
  bool activity_available = 16;
  bool metrics_incomplete = 17;
  SystemAppSelection system_apps = 19;
  repeated RecordingOutput recordings = 21;
  repeated LiveStream live_streams = 23; // Empty when the live bridge is not selected.
  repeated StoppingService stopping_services = 24; // Empty once the run finishes.
  FileChanges file_changes = 26;
  repeated ComparisonRow machine_changes = 25; // What changed since Prepare; row `cells` are before and after. Never saved.
  doramcap.filesystem.v1.WritePolicy write_policy = 27;
}
message ConsoleError {
  string code = 1;
  string message = 2;
  string check = 3; // Source line of the failed Compose check; empty for other failures.
}
message Marker {
  uint32 version = 1;
  string run_id = 2;
  string request_key = 3;
  Phase phase = 4;
  string artifact_reference = 5;
  Outcome outcome = 6;
  bool start_accepted = 7;
  doramcap.filesystem.v1.FileChangeReference file_changes = 12;
  repeated RecordingOutput recordings = 11;
  repeated string profiles = 9;
  SystemAppSelection system_apps = 10;
  doramcap.filesystem.v1.WritePolicy write_policy = 13;
}

// One bounded, host-observed sample; absent values denote unavailable data.
message RunMetric {
  uint64 elapsed_ns = 1;
  optional uint64 recording_bytes = 2;
  optional double write_bytes_per_second = 3;
}

// Opaque per-connection cursor; an empty cursor requests a bounded checkpoint.
message StreamCursor { string run_id = 1; uint64 sequence = 2; uint64 metric_elapsed_ns = 3; }

// Indexed result of one past or current run.
enum HistoryState {
  HISTORY_STATE_UNSPECIFIED = 0;
  HISTORY_RUNNING = 1;
  HISTORY_COMPLETED = 2;
  HISTORY_FAILED = 3;
  HISTORY_CANCELLED = 4;
  HISTORY_BLOCKED = 5; // Cleanup was not verified.
  HISTORY_INTERRUPTED = 6; // Console stopped before the run reported a result.
}
// Zero preserves recordings in saved entries that predate artifact kinds.
enum ArtifactKind { RECORDING = 0; REPORT = 1; FILE_CHANGES = 2; RUN_FILE = 3; }
// Zero-based saved change-list position; zero selects the first change.
message RunFileRequest { uint64 change_position = 1; }
// One declared output; an absent size means no file exists on the host.
message HistoryArtifact {
  string id = 1;
  optional uint64 size_bytes = 2;
  bool downloadable = 3;
  ArtifactKind kind = 4;
}
message HistoryEntry {
  string run_id = 1;
  repeated string profiles = 3;
  SystemAppSelection system_apps = 4;
  uint64 started_at_ms = 5;
  optional uint64 finished_at_ms = 6; // Absent while running and after an interruption.
  HistoryState state = 7;
  string error_summary = 8;
  repeated HistoryArtifact artifacts = 9;
}
// Empty limit and state select the default page size and all runs.
message HistoryQuery {
  uint32 limit = 1;
  string cursor = 2;
  HistoryState state = 3;
}
message HistoryPage {
  repeated HistoryEntry entries = 1;
  string next_cursor = 2; // Empty on the last page.
}
message HistoryDetail { HistoryEntry entry = 1; Status status = 2; }

// How one compared fact differs. A fact unset in both runs has no row.
enum ComparisonResult {
  COMPARISON_RESULT_UNSPECIFIED = 0;
  COMPARISON_SAME = 1;
  COMPARISON_CHANGED = 2;
  COMPARISON_UNAVAILABLE = 3; // One run recorded nothing of this kind.
}
enum ComparisonGroup {
  COMPARISON_GROUP_UNSPECIFIED = 0;
  COMPARISON_OUTCOME = 1;
  COMPARISON_SETUP = 2;
  COMPARISON_CONFIGURATION = 3; // Differences here can change results.
  COMPARISON_CONDITION = 4;
}
// One side's values for one fact, aligned with that side's runs. Empty values are unset, or withheld when the row is hidden.
message ComparisonCell {
  repeated string values = 1;
}
// One compared fact, with one cell per side in the comparison's order.
message ComparisonRow {
  ComparisonGroup group = 1;
  string name = 2;
  repeated ComparisonCell cells = 3;
  ComparisonResult result = 4;
  bool hidden = 5;
}
// One run in a comparison. `captured` is false when the run has no machine capture.
message ComparedRun {
  HistoryEntry entry = 1;
  bool captured = 2;
}
// One side of a comparison, such as A or B, holding any number of runs.
message ComparisonSide {
  string label = 1;
  repeated ComparedRun runs = 2;
}
message HistoryComparison {
  repeated ComparisonSide sides = 1;
  repeated ComparisonRow rows = 2;
  bool truncated = 3; // True when bounded rows left some matching facts out.
}
// The runs selected for one side.
message ComparisonSelection {
  string label = 1;
  repeated string run_ids = 2;
}
message HistoryComparisonRequest {
  repeated ComparisonSelection sides = 1;
}
// What this review would run on, compared with an earlier run. Row `a` is the baseline and `b` is now.
message ReviewComparison {
  HistoryEntry baseline = 1; // Absent when no earlier run has a capture.
  repeated ComparisonRow rows = 2;
  bool truncated = 3;
}
