syntax = "proto3";
package doramcap.console.analysis.v1;
import "console.proto";
import "execution.proto";

// Original evidence beneath the authorized run directory; missing files remain evidence.
message AnalysisArtifact { string name = 1; string path = 2; }
// One immutable saved-run input. Host paths are constructed by the server, never the browser.
message AnalysisRun {
  string directory = 1;
  doramcap.console.v1.HistoryDetail detail = 2;
  doramcap.console.execution.v1.RunCapture capture = 3;
  repeated AnalysisArtifact artifacts = 4;
}
