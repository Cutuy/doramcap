syntax = "proto3";
package doramcap.console.execution.v1;
import "compose.proto";
import "filesystem.proto";
import "compose_plan.proto";
import "launch.proto";
import "systemd_plan.proto";
import "workflow.proto";
import "system_config.proto";

// One run for the native addon: the inputs every form shares, and one form's own.
message RunRequest {
  doramcap.launch.v1.RunPlan run = 1;
  oneof backend {
    doramcap.compose_plan.v1.ComposePlan compose = 2;
    doramcap.systemd_plan.v1.SystemdPlan systemd = 3;
  }
}
message Inspection {
  doramcap.compose.v1.ResolvedComposeProject plan = 1;
  oneof backend {
    doramcap.compose.v1.ConfigurationSnapshot compose_snapshot = 2;
    doramcap.systemd_plan.v1.ConfigurationSnapshot systemd_snapshot = 4;
  }
  doramcap.system_config.v1.MachineState machine = 3;
  string machine_error = 5; // Observation failed; machine is absent.
  repeated doramcap.filesystem.v1.WritableFolder writable_folders = 8;
  repeated string warnings = 6; // Review notices; excluded from frozen launch identity.
  doramcap.compose.v1.Diagnostic rejection = 7; // Rejected inputs; plan and snapshot are absent.
}
// List profiles declared by the project's Docker Compose files.
message ComposeProfilesRequest {
  string run_id = 1;
  string repository_root = 2;
  doramcap.compose.v1.ComposeProject project = 3;
}
message ComposeProfiles {
  repeated string names = 1;
  doramcap.compose.v1.Diagnostic rejection = 2; // Rejected inputs; names are empty.
}
// Limits shared by the native addon and TypeScript server.
enum Limit {
  LIMIT_UNSPECIFIED = 0;
  // Characters of a failure message sent to the browser, kept from its end, where its cause is.
  MAX_ERROR_CHARS = 2000;
}
message StartRequest {
  RunRequest run = 1;
  // Review fingerprint for the run's backend; required before admission.
  oneof backend {
    doramcap.compose.v1.ConfigurationSnapshot compose_expected = 2;
    doramcap.systemd_plan.v1.ConfigurationSnapshot systemd_expected = 3;
  }
}
// Execution facts are separate from the Console's phases and display outcomes.
message ExecutionResult {
  bool blocked = 1;
  optional string error = 2;
  optional bool writers_stopped = 3;
  optional bool recording_finalized = 4;
  optional bool boundary_clean = 5;
  optional bool event_stream_healthy = 6;
  repeated doramcap.compose.v1.ServiceExit service_exits = 7;
  doramcap.filesystem.v1.FileChangeReference file_changes = 8;
  reserved 9;
  reserved "file_changes_error";
  doramcap.filesystem.v1.ReportState file_changes_state = 10;
}
// The local image one service ran.
message ServiceImage {
  string service = 1;
  string image_id = 2;
}
// Whether the source tree was verified clean or dirty when a run started.
enum SourceState {
  SOURCE_STATE_UNKNOWN = 0;
  SOURCE_STATE_CLEAN = 1;
  SOURCE_STATE_DIRTY = 2;
}
// What one run ran; empty fields were unavailable when it started.
message ExperimentSetup {
  string source_commit = 1;
  SourceState source_state = 2;
  repeated ServiceImage images = 3;
}
// What one run ran and the machine it ran on, saved as each part becomes known.
message RunCapture {
  ExperimentSetup setup = 1;
  doramcap.system_config.v1.MachineState before = 2;
  string before_error = 4; // Observation or storage failed; before is absent.
  reserved 3; // Formerly the post-run state, which is no longer saved.
}
// Completion remains available even when the bounded progress queue overflows.
message ExecutionUpdate {
  string run_id = 1;
  repeated doramcap.workflow.v1.Event events = 2;
  uint64 dropped_events = 3;
  bool ready = 4;
  bool teardown_started = 5;
  ExecutionResult result = 6;
  repeated doramcap.compose.v1.StoppingService stopping_services = 7;
  doramcap.system_config.v1.MachineState machine_before = 8;
  doramcap.system_config.v1.MachineState machine_after = 9;
  string machine_before_error = 10; // Observation failed; machine_before is absent.
  string machine_after_error = 11; // Observation failed; machine_after is absent.
}
