syntax = "proto3";
package doramcap.console.execution.v1;
import "compose.proto";
import "dora.proto";
import "workflow.proto";
import "system_config.proto";

// Explicit inputs to the existing recorded Compose workflow.
message RunRequest {
  string id = 1;
  string repository_root = 2;
  string artifacts = 3;
  repeated doramcap.compose.v1.ComposeProject system_apps = 4;
  repeated doramcap.compose.v1.ComposeProject projects = 5;
  doramcap.dora.v1.DoraRuntime dora = 6;
  repeated Recording recordings = 7;
  uint64 readiness_seconds = 8;
  uint64 stop_seconds = 9; // Stop grace period for services declaring none.
  repeated string mcap_services = 10; // Services writing recordings through io_uring.
}
message Recording { string stream = 1; string recording = 2; }
message Inspection {
  doramcap.compose.v1.ResolvedComposeProject plan = 1;
  doramcap.compose.v1.ConfigurationSnapshot snapshot = 2;
  doramcap.system_config.v1.MachineState machine = 3;
}
message ProfilesRequest {
  string run_id = 1;
  string repository_root = 2;
  doramcap.compose.v1.ComposeProject project = 3;
}
message Profiles { repeated string names = 1; }
// Limits shared by the native addon and TypeScript server.
enum Limit {
  LIMIT_UNSPECIFIED = 0;
  // Characters of a failure message sent to the browser, kept from its end, where its cause is.
  MAX_ERROR_CHARS = 2000;
}
message StartRequest {
  RunRequest run = 1;
  doramcap.compose.v1.ConfigurationSnapshot expected = 2;
}
// Execution facts are separate from the Console's phases and display outcomes.
message ExecutionResult {
  bool blocked = 1;
  optional string error = 2;
  optional bool writers_stopped = 3;
  optional bool recording_finalized = 4;
  optional bool boundary_clean = 5;
  optional bool event_stream_healthy = 6;
  repeated doramcap.compose.v1.ServiceExit service_exits = 7;
}
// The local image one service ran.
message ServiceImage {
  string service = 1;
  string image_id = 2;
}
// Whether the source tree was verified clean or dirty when a run started.
enum SourceState {
  SOURCE_STATE_UNKNOWN = 0;
  SOURCE_STATE_CLEAN = 1;
  SOURCE_STATE_DIRTY = 2;
}
// What one run ran; empty fields were unavailable when it started.
message ExperimentSetup {
  string source_commit = 1;
  SourceState source_state = 2;
  repeated ServiceImage images = 3;
}
// What one run ran and the machine it ran on, saved as each part becomes known.
message RunCapture {
  ExperimentSetup setup = 1;
  doramcap.system_config.v1.MachineState before = 2;
  doramcap.system_config.v1.MachineState after = 3;
}
// Completion remains available even when the bounded progress queue overflows.
message ExecutionUpdate {
  string run_id = 1;
  repeated doramcap.workflow.v1.Event events = 2;
  uint64 dropped_events = 3;
  bool ready = 4;
  bool teardown_started = 5;
  ExecutionResult result = 6;
  repeated doramcap.compose.v1.StoppingService stopping_services = 7;
  doramcap.system_config.v1.MachineState machine_before = 8;
  doramcap.system_config.v1.MachineState machine_after = 9;
}
