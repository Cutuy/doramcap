<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1070" viewBox="0 0 1400 1070" role="img" aria-labelledby="title desc">
<title id="title">Console execution and persistence flow</title><desc id="desc">TypeScript inspects inputs through the native bridge, persists Start intent, submits execution with the inspected snapshot, reduces events into browser state, requests stop and persists completion. The Rust workflow owns reset, preflight and cleanup.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#236457"/></marker><style>text{font:18px Arial,sans-serif;fill:#18324a}.heading{font-size:22px;font-weight:bold}.flow{fill:none;stroke:#236457;stroke-width:2;marker-end:url(#a)}.life{stroke:#b8c5d1;stroke-dasharray:5 6}</style></defs>
<rect width="1400" height="1070" fill="white"/>
<rect x="35" y="25" width="250" height="70" rx="10" fill="#edf3ff" stroke="#afbdcc"/><text x="160" y="67" text-anchor="middle" class="heading">TypeScript server</text>
<rect x="405" y="25" width="250" height="70" rx="10" fill="#fff5e8" stroke="#afbdcc"/><text x="530" y="67" text-anchor="middle" class="heading">Rust bridge</text>
<rect x="775" y="25" width="250" height="70" rx="10" fill="#edf8f1" stroke="#afbdcc"/><text x="900" y="67" text-anchor="middle" class="heading">Compose workflow</text>
<rect x="1125" y="25" width="250" height="70" rx="10" fill="#f5f7fa" stroke="#afbdcc"/><text x="1250" y="67" text-anchor="middle" class="heading">Console metadata</text>
<path d="M160 95V1030M530 95V1030M900 95V1030M1250 95V1030" class="life"/>
<path d="M160 155H530" class="flow"/><text x="345" y="143" text-anchor="middle">Profiles / inspect explicit inputs</text>
<path d="M530 215H160" class="flow"/><text x="345" y="203" text-anchor="middle">Plan + configuration snapshot</text>
<path d="M160 275H1250" class="flow"/><text x="705" y="263" text-anchor="middle">Persist Start intent</text>
<path d="M160 335H530" class="flow"/><text x="345" y="323" text-anchor="middle">Start: fresh inputs + snapshot</text>
<path d="M530 395H900" class="flow"/><text x="715" y="383" text-anchor="middle">Reset → prepare → preflight</text>
<path d="M900 455H530" class="flow"/><text x="715" y="443" text-anchor="middle">Preflight accepted / rejected</text>
<path d="M530 515H160" class="flow"/><text x="345" y="503" text-anchor="middle">Start acknowledgement</text>
<path d="M900 575H530" class="flow"/><text x="715" y="563" text-anchor="middle">Step events · readiness · teardown</text>
<path d="M530 635H160" class="flow"/><text x="345" y="623" text-anchor="middle">Poll execution facts + events</text>
<path d="M160 695H1250" class="flow"/><text x="705" y="683" text-anchor="middle">Accepted marker · display state</text>
<path d="M160 755H530" class="flow"/><text x="345" y="743" text-anchor="middle">Explicit Stop</text>
<path d="M530 815H900" class="flow"/><text x="715" y="803" text-anchor="middle">Signal workflow observation loop</text>
<path d="M900 875H530" class="flow"/><text x="715" y="863" text-anchor="middle">Cleanup and completion facts</text>
<path d="M530 935H160" class="flow"/><text x="345" y="923" text-anchor="middle">Reliable terminal result</text>
<path d="M160 995H1250" class="flow"/><text x="705" y="983" text-anchor="middle">Terminal checkpoint + Console report</text>
</svg>
