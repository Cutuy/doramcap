<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="320" viewBox="0 0 1120 320" role="img" aria-labelledby="title desc">
<title id="title">Analysis execution and presentation ownership</title>
<desc id="desc">The registry supplies a selected definition to an A/B task. Both analyses produce private measurements for the module comparer. The resulting facts pass through the module TypeScript presenter to the shared renderer.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#475569"/></marker><style>.node{fill:#eef2ff;stroke:#818cf8;stroke-width:1.5}.text{font:18px system-ui,sans-serif;fill:#172033;text-anchor:middle}.edge{fill:none;stroke:#475569;stroke-width:1.5;marker-end:url(#arrow)}</style></defs>
<rect width="1120" height="320" fill="white"/>
<path class="edge" d="M110 95 V155"/><path class="edge" d="M195 190 H230 V90 H270"/><path class="edge" d="M230 190 V255 H270"/>
<path class="edge" d="M430 90 H465 V190 H500"/><path class="edge" d="M430 255 H465 V190"/>
<path class="edge" d="M660 190 H710"/><path class="edge" d="M900 190 H940"/>
<rect class="node" x="25" y="25" width="170" height="70" rx="6"/><text class="text" x="110" y="67">Registry</text>
<rect class="node" x="25" y="155" width="170" height="70" rx="6"/><text class="text" x="110" y="197">A/B task</text>
<rect class="node" x="270" y="55" width="160" height="70" rx="6"/><text class="text" x="350" y="97">Analyze A</text>
<rect class="node" x="270" y="220" width="160" height="70" rx="6"/><text class="text" x="350" y="262">Analyze B</text>
<rect class="node" x="500" y="155" width="160" height="70" rx="6"/><text class="text" x="580" y="185"><tspan x="580">Module</tspan><tspan x="580" dy="23">comparer</tspan></text>
<rect class="node" x="710" y="155" width="190" height="70" rx="6"/><text class="text" x="805" y="185"><tspan x="805">Module TS</tspan><tspan x="805" dy="23">presenter</tspan></text>
<rect class="node" x="940" y="155" width="160" height="70" rx="6"/><text class="text" x="1020" y="185"><tspan x="1020">Shared</tspan><tspan x="1020" dy="23">renderer</tspan></text>
</svg>
