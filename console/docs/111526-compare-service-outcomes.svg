<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
<title id="title">Shared materialized and recording analysis</title>
<desc id="desc">Console resolves saved records and current observations into per-run inputs. The analysis registry and runner invoke the default materialized module or selected recording modules. Modules extract per-run facts and compare them into bounded presentation rows for the shared renderer.</desc>
