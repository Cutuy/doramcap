<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
<title id="title">Independent materialized comparison and recording analytics</title>
<desc id="desc">Saved configuration, snapshots and outcomes feed materialized comparison, which supplies rows to its renderer and section. Run analysis invokes a request-owned task in the Console process. The module analyzes each run and compares both analyses, then supplies rows to another instance of the shared renderer and its own section. Both instances use the same row renderer.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#475569"/></marker>
