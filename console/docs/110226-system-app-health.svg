<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif" font-size="14">
  <title id="title">System app health</title>
  <desc id="desc">System apps publish a health output. Console links those outputs to the selected watchdog, which publishes to the live panel, MCAP and OTLP.</desc>
  <rect width="760" height="380" fill="#fff"/>
  <g fill="#f1efe8" stroke="#5f5e5a">
    <rect x="210" y="20" width="340" height="56" rx="8"/>
  </g>
  <g fill="#e1f5ee" stroke="#0f6e56">
    <rect x="30" y="130" width="180" height="62" rx="8"/>
    <rect x="30" y="250" width="180" height="62" rx="8"/>
    <rect x="290" y="176" width="180" height="90" rx="8"/>
    <rect x="550" y="110" width="180" height="56" rx="8"/>
    <rect x="550" y="193" width="180" height="56" rx="8"/>
    <rect x="550" y="276" width="180" height="56" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#2c2c2a">
    <text x="380" y="44" font-weight="600">Console graph composition</text>
    <text x="380" y="63" font-size="12">links each health output to the watchdog</text>
  </g>
  <g text-anchor="middle" fill="#04342c">
    <text x="120" y="156" font-weight="600">cpu-monitor</text>
    <text x="120" y="175" font-size="12">fault-reporter</text>
    <text x="120" y="276" font-weight="600">data-recorder</text>
    <text x="120" y="295" font-size="12">fault-reporter</text>
    <text x="380" y="210" font-weight="600">fault-watchdog</text>
    <text x="380" y="229" font-size="12">inputs from Dora</text>
    <text x="380" y="247" font-size="12">local diagnostics</text>
    <text x="640" y="134" font-weight="600">Live panel</text>
    <text x="640" y="153" font-size="12">every profile</text>
    <text x="640" y="217" font-weight="600">faults.mcap</text>
    <text x="640" y="236" font-size="12">mcap profile</text>
    <text x="640" y="300" font-weight="600">OTLP</text>
    <text x="640" y="319" font-size="12">otel profile</text>
  </g>
  <g fill="#444" font-size="12">
    <text x="214" y="155">health</text>
    <text x="214" y="275">health</text>
    <text x="474" y="210">faults</text>
  </g>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#444" stroke-width="1.5"/></marker></defs>
  <g stroke="#444" stroke-width="1" fill="none" marker-end="url(#a)">
    <path d="M380 76V174"/>
    <path d="M210 161H250V205H288"/>
    <path d="M210 281H250V237H288"/>
    <path d="M470 221H510V138H548"/>
    <path d="M470 221H548"/>
    <path d="M470 221H510V304H548"/>
  </g>
</svg>
