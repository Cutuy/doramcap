<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" font-family="system-ui,sans-serif" font-size="13">
  <title>Per-app cgroup paths carry each app's name to the browser and to recordings</title>
  <rect width="760" height="300" fill="#fff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l8 4-8 4" fill="none" stroke="#596b64" stroke-width="1.5"/></marker></defs>
  <rect x="20" y="20" width="200" height="160" rx="6" fill="#f0f3f0" stroke="#dde2df"/>
  <text x="36" y="46" font-weight="600" fill="#202a2e">Per-app cgroups</text>
  <rect x="36" y="58" width="168" height="34" rx="5" fill="#fff" stroke="#dde2df"/>
  <text x="120" y="80" text-anchor="middle" fill="#202a2e">Compose · systemd</text>
  <rect x="36" y="98" width="168" height="34" rx="5" fill="#fff" stroke="#dde2df"/>
  <text x="120" y="120" text-anchor="middle" fill="#202a2e">Compose · cgroupfs</text>
  <rect x="36" y="138" width="168" height="34" rx="5" fill="#fff" stroke="#dde2df"/>
  <text x="120" y="160" text-anchor="middle" fill="#202a2e">Native systemd</text>
  <rect x="290" y="72" width="170" height="58" rx="5" fill="#fff" stroke="#dde2df"/>
  <text x="375" y="96" text-anchor="middle" fill="#202a2e" font-weight="600">CPU monitor</text>
  <text x="375" y="115" text-anchor="middle" fill="#596b64" font-size="12">unchanged</text>
  <rect x="540" y="20" width="200" height="110" rx="6" fill="#e8f2ee" stroke="#236457"/>
  <text x="640" y="46" text-anchor="middle" fill="#202a2e" font-weight="600">Browser</text>
  <rect x="556" y="58" width="168" height="58" rx="5" fill="#fff" stroke="#236457"/>
  <text x="640" y="82" text-anchor="middle" fill="#202a2e">cgroupName(path)</text>
  <text x="640" y="101" text-anchor="middle" fill="#596b64" font-size="12">app name or last segment</text>
  <rect x="540" y="160" width="200" height="58" rx="5" fill="#fff" stroke="#dde2df"/>
  <text x="640" y="184" text-anchor="middle" fill="#202a2e" font-weight="600">MCAP recording</text>
  <text x="640" y="203" text-anchor="middle" fill="#596b64" font-size="12">dictionary paths</text>
  <rect x="290" y="232" width="170" height="50" rx="5" fill="#fff" stroke="#dde2df"/>
  <text x="375" y="254" text-anchor="middle" fill="#202a2e" font-weight="600">Demo telemetry</text>
  <text x="375" y="272" text-anchor="middle" fill="#596b64" font-size="12">real-format paths</text>
  <path d="M220 100H290" fill="none" stroke="#596b64" marker-end="url(#a)"/>
  <text x="255" y="92" text-anchor="middle" fill="#596b64" font-size="12">path</text>
  <path d="M460 92H540" fill="none" stroke="#596b64" marker-end="url(#a)"/>
  <text x="500" y="84" text-anchor="middle" fill="#596b64" font-size="12">id → path</text>
  <path d="M460 112H500V189H540" fill="none" stroke="#596b64" marker-end="url(#a)"/>
  <path d="M460 257H600V218" fill="none" stroke="#596b64" marker-end="url(#a)"/>
  <path d="M460 247H680V130" fill="none" stroke="#596b64" marker-end="url(#a)"/>
</svg>
