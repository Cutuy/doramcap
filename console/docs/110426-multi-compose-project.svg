<path d="M1120 822H1130V1223H1100" class="arrow"/>
<path d="M580 1265V1360" class="arrow"/>
<rect x="310" y="1288" width="540" height="54" fill="#fff"/>
<text x="425" y="1309" class="body">N-API · inspect(RunRequest)</text>
<text x="355" y="1335" class="body">start(StartRequest { run, expected })</text>
