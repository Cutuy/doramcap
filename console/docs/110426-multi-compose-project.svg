<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1620" viewBox="0 0 1160 1620" role="img" aria-labelledby="title desc">
<title id="title">How multiple Compose file sets converge into one native run</title>
<desc id="desc">Alpha and beta each have a base Compose file, an override and a local environment file. TypeScript invokes Compose separately for each source, combines the service catalogs, records source-specific selections, and builds one protobuf RunRequest containing two ComposeProject entries and system app inputs. Rust normalizes those inputs and merges them into one experiment.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4d6278"/></marker>
<style>text{font-family:Arial,sans-serif;fill:#172c43}.title{font-size:27px;font-weight:700}.heading{font-size:20px;font-weight:700}.body{font-size:18px}.code{font-family:monospace;font-size:16px}.small{font-size:16px;fill:#425b72}.label{font-size:15px;font-weight:700;letter-spacing:1px}.box{fill:#fff;stroke:#8ba0b6;stroke-width:1.5}.arrow{fill:none;stroke:#4d6278;stroke-width:2;marker-end:url(#arrow)}</style></defs>
<rect width="1160" height="1620" fill="#fff"/>
