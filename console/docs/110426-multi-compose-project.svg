<text x="76" y="1163" class="code">profiles: [dev]</text>
<rect x="600" y="977" width="500" height="206" rx="9" fill="#f5f8fc" stroke="#8ba0b6" stroke-width="1.5"/>
<text x="616" y="1004" class="heading">projects[1] : ComposeProject</text>
<text x="616" y="1033" class="code">key: workload-f44e64e75f3948e9</text>
<text x="616" y="1059" class="code">directory: /repo/beta</text>
<text x="616" y="1085" class="code">files: [compose.yaml, compose.override.yaml]</text>
<text x="616" y="1111" class="code">env_files: [.env]</text>
