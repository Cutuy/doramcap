<text x="58" y="383" class="code">-f compose.yaml -f compose.override.yaml</text>
<text x="58" y="411" class="code">--env-file .env --profile &quot;*&quot; → service catalog</text>
<rect x="610" y="100" width="510" height="145" rx="9" fill="#fafbfc" stroke="#8ba0b6" stroke-width="1.5"/>
<text x="628" y="130" class="heading">/repo/beta/</text>
<text x="630" y="164" class="code">compose.yaml</text>
<text x="630" y="194" class="code">compose.override.yaml</text>
<text x="630" y="224" class="code">.env</text>
<text x="925" y="164" class="small">base services</text>
<text x="925" y="194" class="small">service overrides</text>
<text x="925" y="224" class="small">interpolation values</text>
<path d="M865 245V325" class="arrow"/>
<rect x="610" y="325" width="510" height="108" rx="9" fill="#fff" stroke="#8ba0b6" stroke-width="1.5"/>
<text x="628" y="354" class="heading">Compose config · cwd=/repo/beta</text>
<text x="628" y="383" class="code">-f compose.yaml -f compose.override.yaml</text>
<text x="628" y="411" class="code">--env-file .env --profile &quot;*&quot; → service catalog</text>
