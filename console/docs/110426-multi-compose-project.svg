<text x="76" y="1033" class="code">key: workload-8ed3f6ad685b959e</text>
<text x="76" y="1059" class="code">directory: /repo/alpha</text>
<text x="76" y="1085" class="code">files: [compose.yaml, compose.override.yaml]</text>
