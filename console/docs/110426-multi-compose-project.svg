<text x="55" y="1440" class="heading">Normalize each selected input</text>
<rect x="425" y="1410" width="335" height="156" rx="9" fill="#fff" stroke="#8ba0b6" stroke-width="1.5"/>
<text x="440" y="1440" class="heading">Merge into one experiment</text>
<rect x="830" y="1410" width="290" height="156" rx="9" fill="#fff" stroke="#8ba0b6" stroke-width="1.5"/>
<text x="845" y="1440" class="heading">Run one lifecycle</text>
<text x="55" y="1471" class="small">alpha files + targets + profiles</text>
<text x="55" y="1497" class="small">beta files + targets + profiles</text>
<text x="55" y="1523" class="small">system-app inputs</text>
