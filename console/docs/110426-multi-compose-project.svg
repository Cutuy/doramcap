<text x="60" y="799" class="heading">Selection retains its source IDs</text>
<text x="60" y="829" class="code">alpha → services=[alpha_worker]  profiles=[dev]</text>
<text x="60" y="857" class="code">beta  → services=[beta_other]    profiles=[benchmark]</text>
<rect x="870" y="770" width="250" height="104" rx="9" fill="#f4f1fa" stroke="#9886b2" stroke-width="1.5"/>
<text x="890" y="799" class="heading">Selected system apps</text>
<text x="890" y="829" class="small">Configured Compose inputs</text>
<text x="890" y="857" class="small">Launch profiles + outputs</text>
<path d="M430 874V925" class="arrow"/>
<text x="475" y="905" class="small">Group targets by source; keep each ordered file list and directory</text>
<rect x="40" y="925" width="1080" height="340" rx="9" fill="#fff" stroke="#557ba8" stroke-width="1.5"/>
<text x="60" y="955" class="heading">One protobuf RunRequest</text>
<text x="690" y="955" class="code">repository_root: /repo</text>
<rect x="60" y="977" width="500" height="206" rx="9" fill="#f5f8fc" stroke="#8ba0b6" stroke-width="1.5"/>
