<rect x="52" y="689" width="1056" height="25" rx="3" fill="#e5effc"/>
<text x="60" y="708" class="code">beta / beta_other</text>
<text x="475" y="708" class="code">test, benchmark</text>
<text x="925" y="708" class="code">selected</text>
<path d="M440 724V770" class="arrow"/>
