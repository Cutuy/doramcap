<text x="820" y="279" font-size="18" fill="#20352F" font-weight="600" text-anchor="start">Before you begin</text>
<text x="820" y="326" font-size="14" fill="#20352F" font-weight="600" text-anchor="start">Project is on this host</text>
<text x="820" y="351" font-size="13" fill="#596B64" font-weight="400" text-anchor="start">The browser can be on another machine.</text>
<text x="820" y="403" font-size="14" fill="#20352F" font-weight="600" text-anchor="start">Images are already available</text>
<text x="820" y="428" font-size="13" fill="#596B64" font-weight="400" text-anchor="start">Build or pull them before using Console.</text>
<text x="820" y="480" font-size="14" fill="#20352F" font-weight="600" text-anchor="start">One application at a time</text>
<text x="820" y="505" font-size="13" fill="#596B64" font-weight="400" text-anchor="start">Finish and clean up before the next run.</text>
<text x="64" y="743" font-size="14" fill="#596B64" font-weight="400" text-anchor="start">Review checks the project before anything starts.</text>
