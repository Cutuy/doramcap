<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
<title id="title">Per-run native analysis</title>
<desc id="desc">Saved run metadata and original artifact references form one AnalysisRun protobuf. A module adapter invokes Rust analysis through the native addon. Rust reads run-scoped original evidence and returns a module-private analysis. The request owns cancellation and cleanup.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#475569"/></marker><style>.box{fill:#eef2ff;stroke:#818cf8;stroke-width:1.5}.text{font:18px system-ui,sans-serif;fill:#172033;text-anchor:middle}.label{font:16px system-ui,sans-serif;fill:#475569;text-anchor:middle}.edge{fill:none;stroke:#475569;stroke-width:1.5;marker-end:url(#arrow)}</style></defs>
<rect width="1120" height="360" fill="white"/>
<rect x="30" y="28" width="1060" height="304" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text class="text" x="560" y="60">Request-owned per-run analysis</text>
<rect class="box" x="55" y="105" width="210" height="75" rx="6"/><text class="text" x="160" y="136"><tspan x="160">Saved metadata</tspan><tspan x="160" dy="24">Artifact references</tspan></text>
<rect class="box" x="325" y="105" width="210" height="75" rx="6"/><text class="text" x="430" y="136"><tspan x="430">Module adapter</tspan><tspan x="430" dy="24">Native addon</tspan></text>
<rect class="box" x="605" y="105" width="190" height="75" rx="6"/><text class="text" x="700" y="148">Rust analyzer</text>
<rect class="box" x="855" y="105" width="210" height="75" rx="6"/><text class="text" x="960" y="136"><tspan x="960">Module-owned</tspan><tspan x="960" dy="24">Analysis protobuf</tspan></text>
<rect class="box" x="590" y="240" width="220" height="60" rx="6"/><text class="text" x="700" y="265"><tspan x="700">Original configuration</tspan><tspan x="700" dy="23">Recordings</tspan></text>
<path class="edge" d="M265 142 H325"/><path class="edge" d="M535 142 H605"/><path class="edge" d="M795 142 H855"/><path class="edge" d="M700 240 V180"/>
<text class="label" x="570" y="94">AnalysisRun protobuf</text><rect class="box" x="320" y="240" width="220" height="60" rx="6"/><text class="text" x="430" y="265"><tspan x="430">Task control</tspan><tspan x="430" dy="23">Cancellation · cleanup</tspan></text><path class="edge" d="M430 240 V180"/>
</svg>
