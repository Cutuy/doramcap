<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
  <title id="title">Per-run analysis, comparison, and shared rendering</title>
  <desc id="desc">Run A and Run B are analyzed separately inside one analysis module, CPU first. The module compares the two analyses and produces render-ready rows. Materialized comparison also produces render-ready rows. A shared renderer displays those rows.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#475569"/></marker>
    <style>
      .node { fill: #eef2ff; stroke: #818cf8; stroke-width: 1.5; }
      .text { font: 18px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #172033; text-anchor: middle; }
      .group-label { font: 18px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #334155; text-anchor: middle; }
      .edge { fill: none; stroke: #475569; stroke-width: 1.8; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1280" height="460" fill="#ffffff"/>
  <rect x="260" y="48" width="540" height="276" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="group-label" x="530" y="81">Analysis module · CPU first</text>
  <path class="edge" d="M210 151 H300"/>
  <path class="edge" d="M210 261 H300"/>
  <path class="edge" d="M470 151 H515 V206 H550"/>
  <path class="edge" d="M470 261 H515 V206 H550"/>
  <path class="edge" d="M760 206 H850"/>
  <path class="edge" d="M1040 206 H1090"/>
  <path class="edge" d="M790 391 H945 V237"/>
  <rect class="node" x="40" y="120" width="170" height="62" rx="6"/>
  <text class="text" x="125" y="157">Run A</text>
  <rect class="node" x="40" y="230" width="170" height="62" rx="6"/>
  <text class="text" x="125" y="267">Run B</text>
  <rect class="node" x="300" y="120" width="170" height="62" rx="6"/>
  <text class="text" x="385" y="157">Analyze A</text>
  <rect class="node" x="300" y="230" width="170" height="62" rx="6"/>
  <text class="text" x="385" y="267">Analyze B</text>
  <rect class="node" x="550" y="175" width="210" height="62" rx="6"/>
  <text class="text" x="655" y="200"><tspan x="655">Compare two</tspan><tspan x="655" dy="23">analyses</tspan></text>
  <rect class="node" x="850" y="175" width="190" height="62" rx="6"/>
  <text class="text" x="945" y="212">Render-ready rows</text>
  <rect class="node" x="1090" y="175" width="160" height="62" rx="6"/>
  <text class="text" x="1170" y="200"><tspan x="1170">Shared</tspan><tspan x="1170" dy="23">renderer</tspan></text>
  <rect class="node" x="550" y="360" width="240" height="62" rx="6"/>
  <text class="text" x="670" y="385"><tspan x="670">Materialized</tspan><tspan x="670" dy="23">comparison</tspan></text>
</svg>
