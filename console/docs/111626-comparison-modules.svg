<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="330" viewBox="0 0 1120 330" role="img" aria-labelledby="title desc">
<title id="title">Run and machine comparison ownership</title>
<desc id="desc">Console supplies saved or prepared run inputs to the run module and machine captures to the machine module. Each module compares facts and its TypeScript presenter supplies the shared renderer.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#475569"/></marker><style>.node{fill:#eef2ff;stroke:#818cf8;stroke-width:1.5}.text{font:18px system-ui,sans-serif;fill:#172033;text-anchor:middle}.edge{fill:none;stroke:#475569;stroke-width:1.5;marker-end:url(#arrow)}</style></defs>
<rect width="1120" height="330" fill="white"/>
<path class="edge" d="M195 80 H260"/><path class="edge" d="M195 250 H260"/>
<path class="edge" d="M450 80 H535"/><path class="edge" d="M450 250 H535"/>
<path class="edge" d="M755 80 H820 V165 H900"/><path class="edge" d="M755 250 H820 V165"/>
<rect class="node" x="15" y="45" width="180" height="70" rx="6"/><text class="text" x="105" y="75"><tspan x="105">Run inputs</tspan><tspan x="105" dy="23">A / B</tspan></text>
<rect class="node" x="15" y="215" width="180" height="70" rx="6"/><text class="text" x="105" y="245"><tspan x="105">Machine captures</tspan><tspan x="105" dy="23">A / B</tspan></text>
<rect class="node" x="260" y="45" width="190" height="70" rx="6"/><text class="text" x="355" y="86">Run module</text>
<rect class="node" x="260" y="215" width="190" height="70" rx="6"/><text class="text" x="355" y="256">Machine module</text>
<rect class="node" x="535" y="45" width="220" height="70" rx="6"/><text class="text" x="645" y="75"><tspan x="645">Run TS</tspan><tspan x="645" dy="23">presenter</tspan></text>
<rect class="node" x="535" y="215" width="220" height="70" rx="6"/><text class="text" x="645" y="245"><tspan x="645">Machine TS</tspan><tspan x="645" dy="23">presenter</tspan></text>
<rect class="node" x="900" y="130" width="195" height="70" rx="6"/><text class="text" x="997" y="160"><tspan x="997">Shared</tspan><tspan x="997" dy="23">renderer</tspan></text>
</svg>
