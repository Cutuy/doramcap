<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Console concept — watch workflow progress</title>
<desc id="desc">Workflow steps, including repeated observations, show emitted state and duration. Stop run finishes recording and cleanup; there is no container dashboard or completion percentage.</desc>
