<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="system-ui, sans-serif" font-size="13" role="img" aria-labelledby="title">
  <title id="title">Resolved launch profiles at Review</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="960" height="300" fill="#fff"/>
  <rect x="20" y="40" width="190" height="84" rx="6" fill="#f4f4f4" stroke="#777" stroke-width="1.5"/>
  <text x="115" y="68" text-anchor="middle">Profile sources</text>
  <text x="115" y="90" text-anchor="middle" fill="#555" font-size="12">watchdog.pbtxt (base)</text>
  <text x="115" y="108" text-anchor="middle" fill="#555" font-size="12">watchdog-mcap.pbtxt (include)</text>
  <rect x="20" y="180" width="190" height="72" rx="6" fill="#eef2fb" stroke="#3b5bab" stroke-width="1.5"/>
  <text x="115" y="210" text-anchor="middle">Console Review</text>
  <text x="115" y="230" text-anchor="middle" fill="#555" font-size="12">selected profile</text>
  <rect x="280" y="96" width="210" height="100" rx="6" fill="#fff6e5" stroke="#b7791f" stroke-width="1.5"/>
  <text x="385" y="126" text-anchor="middle">One-shot app container</text>
  <text x="385" y="148" text-anchor="middle" fill="#555" font-size="12">--resolve-config FILE</text>
  <text x="385" y="168" text-anchor="middle" fill="#555" font-size="12">includes · defaults · validation</text>
  <rect x="560" y="111" width="160" height="70" rx="6" fill="#f4f4f4" stroke="#777" stroke-width="1.5"/>
  <text x="640" y="140" text-anchor="middle">Resolved pbtxt</text>
  <text x="640" y="160" text-anchor="middle" fill="#555" font-size="12">frozen in the run</text>
  <rect x="790" y="111" width="150" height="70" rx="6" fill="#eef5f3" stroke="#177763" stroke-width="1.5"/>
  <text x="865" y="140" text-anchor="middle">App service</text>
  <text x="865" y="160" text-anchor="middle" fill="#555" font-size="12">config_mount</text>
  <g stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M210 82 H245 V125 H278"/>
    <path d="M210 216 H245 V168 H278"/>
    <path d="M490 146 H558"/>
    <path d="M720 146 H788"/>
  </g>
  <text x="248" y="112" fill="#555" font-size="12">read-only</text>
  <text x="524" y="136" text-anchor="middle" fill="#555" font-size="12">stdout</text>
  <text x="754" y="136" text-anchor="middle" fill="#555" font-size="12">mount</text>
</svg>
