<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" font-family="system-ui,sans-serif" font-size="13">
  <title>The system monitor adds Compose service names to its cgroup dictionary</title>
  <rect width="760" height="290" fill="#fff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l8 4-8 4" fill="none" stroke="#596b64" stroke-width="1.5"/></marker></defs>
  <rect x="20" y="20" width="400" height="250" rx="6" fill="#f0f3f0" stroke="#dde2df"/>
  <text x="36" y="46" font-weight="600" fill="#202a2e">System monitor</text>
  <rect x="36" y="62" width="168" height="52" rx="5" fill="#fff" stroke="#dde2df"/>
  <text x="120" y="84" text-anchor="middle" fill="#202a2e">Cgroup dictionary</text>
  <text x="120" y="102" text-anchor="middle" fill="#596b64" font-size="12">every 2 s</text>
  <rect x="236" y="62" width="168" height="52" rx="5" fill="#e8f2ee" stroke="#236457"/>
  <text x="320" y="84" text-anchor="middle" fill="#202a2e">Name resolver</text>
  <text x="320" y="102" text-anchor="middle" fill="#596b64" font-size="12">own thread</text>
  <rect x="36" y="196" width="168" height="52" rx="5" fill="#fff" stroke="#dde2df"/>
  <text x="120" y="218" text-anchor="middle" fill="#202a2e">CPU collection</text>
  <text x="120" y="236" text-anchor="middle" fill="#596b64" font-size="12">10 Hz, never blocked</text>
  <path d="M204 80H236" fill="none" stroke="#596b64" marker-end="url(#a)"/>
  <path d="M236 98H204" fill="none" stroke="#596b64" marker-end="url(#a)"/>
  <path d="M120 196V114" fill="none" stroke="#596b64" marker-end="url(#a)"/>
  <rect x="500" y="20" width="240" height="52" rx="5" fill="#e8f2ee" stroke="#236457"/>
  <text x="620" y="42" text-anchor="middle" fill="#202a2e">Docker</text>
  <text x="620" y="60" text-anchor="middle" fill="#596b64" font-size="12">Compose service label</text>
  <rect x="500" y="118" width="240" height="52" rx="5" fill="#fff" stroke="#dde2df"/>
  <text x="620" y="140" text-anchor="middle" fill="#202a2e">Live bridge → browser</text>
  <text x="620" y="158" text-anchor="middle" fill="#596b64" font-size="12">Top CPU consumers</text>
  <rect x="500" y="216" width="240" height="52" rx="5" fill="#fff" stroke="#dde2df"/>
  <text x="620" y="238" text-anchor="middle" fill="#202a2e">MCAP recording</text>
  <text x="620" y="256" text-anchor="middle" fill="#596b64" font-size="12">dictionary topic</text>
  <path d="M500 46H445V76H404" fill="none" stroke="#596b64" marker-end="url(#a)"/>
  <path d="M204 104L240 144H500" fill="none" stroke="#596b64" marker-end="url(#a)"/>
  <path d="M204 110L240 242H500" fill="none" stroke="#596b64" marker-end="url(#a)"/>
</svg>
