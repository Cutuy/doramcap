<path d="M530 140V300" class="command"/><text x="555" y="202" class="label">HTTP commands</text>
<path d="M785 300V140" class="result"/><text x="809" y="246" class="label">Status · live frames · downloads</text>
<path d="M850 385H960" class="command"/><text x="904" y="369" text-anchor="middle" class="label">Run inputs</text>
<path d="M960 452H850" class="result"/><text x="904" y="479" text-anchor="middle" class="label">Run facts</text>
