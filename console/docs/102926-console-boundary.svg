<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" role="img" aria-labelledby="title desc">
<title id="title">Console process and ownership boundaries</title>
<desc id="desc">The browser uses the TypeScript HTTP server. TypeScript owns configuration, reviews, request coordination, progress models and metadata persistence. A Rust bridge exposes execution and OS capabilities and calls the existing Compose workflow.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2563eb"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#087f5b"/></marker>
<style>text{font:19px Arial,sans-serif;fill:#18324a}.heading{font-size:24px;font-weight:bold}.label{font-size:17px}.command{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#a)}.result{fill:none;stroke:#087f5b;stroke-width:2;marker-end:url(#r)}rect{stroke:#afbdcc;stroke-width:1.5}</style></defs>
<rect width="1400" height="960" fill="white" stroke="none"/>
<rect x="60" y="40" width="1280" height="100" rx="12" fill="#f5f7fa"/><text x="88" y="81" class="heading">Console frontend · browser</text><text x="88" y="114">Project · review · run activity · result</text>
<rect x="60" y="300" width="790" height="380" rx="12" fill="#edf3ff"/><text x="88" y="344" class="heading">TypeScript Console server</text>
<text x="88" y="391">HTTP · authentication · assets</text><text x="88" y="437">Configuration · project discovery · selected app inputs</text><text x="88" y="483">Review model · request keys · Console phases</text><text x="88" y="529">Progress reduction · CPU feed · recording-size samples</text><text x="88" y="575">Live checkpoints / deltas · terminal display state</text><text x="88" y="621">Metadata persistence · recording download authorization</text>
<rect x="960" y="300" width="380" height="210" rx="12" fill="#fff5e8"/><text x="983" y="344" class="heading">Rust execution bridge</text><text x="983" y="389">Owner thread · profiles · inspect</text><text x="983" y="432">Start · stop · event transport</text><text x="983" y="475">Native parsers · file / lock handles</text>
<rect x="960" y="690" width="380" height="210" rx="12" fill="#edf8f1"/><text x="983" y="734" class="heading">Compose workflow · Rust</text><text x="983" y="779">Repository admission · reset</text><text x="983" y="822">Prepare · preflight · execution</text><text x="983" y="865">Steps · resource evidence · cleanup</text>
<rect x="60" y="820" width="790" height="80" rx="12" fill="#f5f7fa"/><text x="88" y="853" class="heading">Private Console metadata</text><text x="88" y="881">current.pb · activity.pb · console-report.json</text>
<rect x="60" y="185" width="290" height="70" rx="10" fill="#f4eefb"/><text x="80" y="213">Optional CPU feed app</text><text x="80" y="240" class="label">viewer.Packet over WebSocket</text>
