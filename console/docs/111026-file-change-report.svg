<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="590" viewBox="0 0 1240 590" role="img" aria-labelledby="title desc">
<title id="title">Run directory layers</title>
<desc id="desc">Left, bottom to top: host folders, declared mounts, one overlay per writable mount, the app view where Compose and systemd map the merged views, the change list read from upper layers, the write policy and the Console report and downloads. Right: the steps of one run with their owners.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#52677c"/></marker></defs>
<style>text{font:17px sans-serif;fill:#17324d;text-anchor:middle}.title{font-size:23px;font-weight:600}.label{font-size:15px;fill:#3d5468}.owner{font-size:15px;fill:#3d5468;text-anchor:start}.base{fill:#f0f6fa;stroke:#8aa4ba;stroke-width:1.5}.declare{fill:#eef0fb;stroke:#8a92c8;stroke-width:1.5}.overlay{fill:#e7f4ee;stroke:#68a188;stroke-width:1.5}.upper{fill:#fbefe9;stroke:#cf8a6a;stroke-width:1.5}.line{fill:none;stroke:#52677c;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1240" height="590" fill="white"/>
<text x="320" y="40" class="title">Layers</text>
<rect x="40" y="70" width="560" height="60" rx="10" class="upper"/><text x="320" y="96">Report and downloads</text><text x="320" y="119" class="label">Preview, change list, kept files</text>
<rect x="40" y="142" width="560" height="60" rx="10" class="upper"/><text x="320" y="168">Write policy</text><text x="320" y="191" class="label">Write back · keep with the run · discard</text>
<rect x="40" y="214" width="560" height="60" rx="10" class="upper"/><text x="320" y="240">Change list</text><text x="320" y="263" class="label">Upper layers read after writers stop</text>
<rect x="40" y="286" width="274" height="60" rx="10" class="base"/><text x="177" y="312">Compose service</text><text x="177" y="335" class="label">Bind of each view</text>
<rect x="326" y="286" width="274" height="60" rx="10" class="base"/><text x="463" y="312">systemd service</text><text x="463" y="335" class="label">BindPaths of each view</text>
<rect x="40" y="358" width="560" height="60" rx="10" class="overlay"/><text x="320" y="384">Overlay per writable mount</text><text x="320" y="407" class="label">Lower: host folder or empty · upper: run writes</text>
<rect x="40" y="430" width="560" height="60" rx="10" class="declare"/><text x="320" y="456">Declared mounts</text><text x="320" y="479" class="label">Source, app path, access</text>
<rect x="40" y="502" width="560" height="50" rx="10" class="base"/><text x="320" y="533">Host folders</text>
<text x="830" y="40" class="title">One run</text>
<rect x="660" y="70" width="300" height="52" rx="9" class="overlay"/><text x="810" y="102">Mount overlays</text><text x="980" y="102" class="owner">lifecycle</text>
<rect x="660" y="140" width="300" height="52" rx="9" class="base"/><text x="810" y="172">Launch with views</text><text x="980" y="172" class="owner">backend</text>
<rect x="660" y="210" width="300" height="52" rx="9" class="base"/><text x="810" y="242">Stop every writer</text><text x="980" y="242" class="owner">backend</text>
<rect x="660" y="280" width="300" height="52" rx="9" class="upper"/><text x="810" y="312">Read upper layers</text><text x="980" y="312" class="owner">host-filesystem</text>
<rect x="660" y="350" width="300" height="52" rx="9" class="upper"/><text x="810" y="382">Save report</text><text x="980" y="382" class="owner">host-filesystem, Console</text>
<rect x="660" y="420" width="300" height="52" rx="9" class="upper"/><text x="810" y="452">Apply write policy</text><text x="980" y="452" class="owner">host-filesystem</text>
<rect x="660" y="490" width="300" height="52" rx="9" class="overlay"/><text x="810" y="522">Unmount, clean up</text><text x="980" y="522" class="owner">lifecycle</text>
<path d="M810 122 V140" class="line"/><path d="M810 192 V210" class="line"/><path d="M810 262 V280" class="line"/><path d="M810 332 V350" class="line"/><path d="M810 402 V420" class="line"/><path d="M810 472 V490" class="line"/>
</svg>
