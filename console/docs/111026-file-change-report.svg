<text x="810.0" y="434.0">Unmount overlays</text>
<text x="980" y="434" class="label left">lifecycle</text>
<path d="M810 450 L810 462" class="line"/>
<rect x="660" y="462" width="300" height="44" rx="10" class="upper"/>
<text x="810.0" y="490.0">Apply write policy</text>
<text x="980" y="490" class="label left">host-filesystem</text>
<path d="M810 506 L810 518" class="line"/>
<rect x="660" y="518" width="300" height="44" rx="10" class="overlay"/>
<text x="810.0" y="546.0">Clean up</text>
<text x="980" y="546" class="label left">lifecycle</text>
</svg>
