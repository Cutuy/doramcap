<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040">
<defs>
 <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#2563eb"/></marker>
 <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#087f5b"/></marker>
 <marker id="purple" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#8055b4"/></marker>
 <style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b4d} .title{font-size:27px;font-weight:700}.heading{font-size:23px;font-weight:700}.body{font-size:19px}.small{font-size:17px}.label{font-size:18px;font-weight:600}.command{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#blue)}.result{fill:none;stroke:#087f5b;stroke-width:3;marker-end:url(#green)}.event{fill:none;stroke:#8055b4;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#purple)}.pill{fill:white;stroke:#d9e2ec;stroke-width:1}</style>
</defs>
<rect width="1400" height="1040" fill="#f8fafc"/>
<text x="60" y="46" class="title">Console → Compose workflow → step execution</text>
<!-- Console boundary -->
<rect x="60" y="78" width="1040" height="170" rx="16" fill="#eaf2ff" stroke="#8aace6" stroke-width="2"/>
<text x="85" y="112" class="heading">Console application</text>
<rect x="85" y="134" width="300" height="87" rx="9" fill="white" stroke="#bdd0ef"/>
<text x="104" y="165" class="body">Start / Stop commands</text><text x="104" y="195" class="small">Session state and admission</text>
<rect x="415" y="134" width="305" height="87" rx="9" fill="white" stroke="#bdd0ef"/>
<text x="434" y="165" class="body">Compose run status</text><text x="434" y="195" class="small">Starting · Running · Stopping</text>
<rect x="750" y="134" width="325" height="87" rx="9" fill="white" stroke="#bdd0ef"/>
<text x="769" y="165" class="body">Step activity and outcome</text><text x="769" y="195" class="small">Progress · Finished / Blocked</text>
<!-- Workflow boundary -->
<rect x="60" y="410" width="1040" height="205" rx="16" fill="#eaf8f1" stroke="#80b99d" stroke-width="2"/>
<text x="85" y="448" class="heading">Compose workflow  ·  workload-docker</text>
<text x="85" y="483" class="body">Workflow code invokes steps and awaits their results</text>
<rect x="85" y="505" width="990" height="49" rx="8" fill="white" stroke="#b4d7c4"/>
<text x="108" y="536" class="body">Prepare → preflight → launch → observe → stop writers → finalize → remove</text>
<text x="85" y="586" class="small">Owns ordering, readiness, teardown decisions and cleanup evidence</text>
<!-- Console/workflow exchanges -->
<path d="M220 248 V410" class="command"/>
<rect x="81" y="290" width="279" height="57" rx="7" class="pill"/>
<text x="220" y="313" text-anchor="middle" class="label">Start request / explicit Stop</text><text x="220" y="336" text-anchor="middle" class="small">Workflow control</text>
<path d="M570 410 V248" class="result"/>
<rect x="392" y="279" width="357" height="85" rx="7" class="pill"/>
<text x="570" y="304" text-anchor="middle" class="label">Compose notifications</text><text x="570" y="329" text-anchor="middle" class="small">Ready / teardown started</text><text x="570" y="352" text-anchor="middle" class="small">In-process oneshot channels</text>
<path d="M940 410 V248" class="result"/>
<rect x="792" y="290" width="296" height="57" rx="7" class="pill"/>
<text x="940" y="313" text-anchor="middle" class="label">Final result / report</text><text x="940" y="336" text-anchor="middle" class="small">Confirmed cleanup outcomes</text>
<!-- Generic execution boundary -->
<rect x="60" y="775" width="490" height="170" rx="16" fill="#f0edfa" stroke="#ad99d0" stroke-width="2"/>
<text x="85" y="813" class="heading">Generic orchestration / executor</text>
<text x="85" y="849" class="body">Dispatch invocation · return result</text>
<text x="85" y="879" class="body">Emit step execution events</text>
<text x="85" y="916" class="small">Step identity, input, output and failure</text>
<!-- Workflow calls/results -->
<path d="M220 615 V775" class="command"/>
<rect x="107" y="663" width="213" height="39" rx="7" class="pill"/><text x="220" y="689" text-anchor="middle" class="label">Invoke step + input</text>
<path d="M460 775 V615" class="result"/>
<rect x="348" y="710" width="220" height="39" rx="7" class="pill"/><text x="458" y="736" text-anchor="middle" class="label">Result / failure</text>
<!-- Implementation boundary -->
<rect x="810" y="775" width="490" height="170" rx="16" fill="#fff5e8" stroke="#d4ae73" stroke-width="2"/>
<text x="835" y="813" class="heading">Step implementation</text>
<text x="835" y="849" class="body">PrepareRun · LaunchProjects</text>
<text x="835" y="879" class="body">QuiesceProjects · FinalizeRun · …</text>
<text x="835" y="916" class="small">Docker operations and resource evidence</text>
<path d="M550 836 H810" class="command"/>
<path d="M810 895 H550" class="result"/>
<text x="680" y="800" text-anchor="middle" class="label">Execution boundary</text>
<text x="680" y="863" text-anchor="middle" class="small">Local call today</text>
<text x="680" y="924" text-anchor="middle" class="small">gRPC in future</text>
<!-- Observation path -->
<path d="M520 775 V727 H1230 V175 H1100" class="event"/>
<rect x="1117" y="415" width="227" height="115" rx="9" class="pill"/>
<text x="1230" y="444" text-anchor="middle" class="label">Step observation</text>
<text x="1230" y="471" text-anchor="middle" class="small">Started / succeeded</text>
<text x="1230" y="496" text-anchor="middle" class="small">Failed · invocation ID</text>
<text x="1230" y="520" text-anchor="middle" class="small">Bounded telemetry queue</text>
<!-- legend -->
<path d="M75 993 H125" class="command"/><text x="140" y="1000" class="small">Invocation / control</text>
<path d="M420 993 H470" class="result"/><text x="485" y="1000" class="small">Result / notification</text>
<path d="M790 993 H840" class="event"/><text x="855" y="1000" class="small">Progress observation</text>
</svg>
