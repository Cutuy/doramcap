<svg xmlns="http://www.w3.org/2000/svg" width="500" height="873" viewBox="0 0 500 873" role="img" aria-labelledby="ownership-after-title ownership-after-desc"><title id="ownership-after-title">Console execution boundaries</title><desc id="ownership-after-desc">TypeScript owns configuration, reviews, session coordination, view models and persistence. A thin Rust bridge owns execution control and event transport. The Compose workflow controls reset and resource lifecycle, invokes steps through generic orchestration, and emits bounded step events to the native bridge.</desc><defs><style>text{font:14px Arial,sans-serif;fill:#18324a}.heading{font-weight:500}</style><marker id="ownership-after-command" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#2563eb"/></marker><marker id="ownership-after-result" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#087f5b"/></marker><marker id="ownership-after-event" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#8055b4"/></marker></defs><rect width="500" height="873" fill="#fff"/><rect x="10" y="0" width="438" height="366.5" rx="10" fill="none" stroke="#18324a" stroke-opacity=".45"/><text x="24" y="24" class="heading">Console application</text><rect x="22" y="43" width="414" height="150" rx="7" fill="#2563eb" fill-opacity=".08" stroke="#aab8c5"/><text x="36" y="70" class="heading">TypeScript server</text><text x="36" y="91" >HTTP · auth · assets</text><text x="36" y="112" >Config · apps · graphs · review</text><text x="36" y="133" >Request keys · Console phases</text><text x="36" y="154" >Progress · metrics · view models</text><text x="36" y="175" >Persistence · artifact authorization</text><path d="M38 193V262.5" fill="none" stroke="#2563eb" stroke-width="1.6"  marker-end="url(#ownership-after-command)"/><path d="M420 266.5V197" fill="none" stroke="#087f5b" stroke-width="1.6"  marker-end="url(#ownership-after-result)"/><text x="229" y="224.15" text-anchor="middle">Typed execution inputs</text><text x="229" y="245.15" text-anchor="middle">Events + execution results</text><rect x="22" y="266.5" width="414" height="87" rx="7" fill="#b66b13" fill-opacity=".08" stroke="#aab8c5"/><text x="36" y="293.5" class="heading">Rust execution bridge</text><text x="36" y="314.5" >Owner thread · start / stop</text><text x="36" y="335.5" >Event transport · safe OS handles</text><path d="M38 353.5V436" fill="none" stroke="#2563eb" stroke-width="1.6"  marker-end="url(#ownership-after-command)"/><path d="M420 440V357.5" fill="none" stroke="#087f5b" stroke-width="1.6"  marker-end="url(#ownership-after-result)"/><text x="229" y="391.15" text-anchor="middle">Run / oneshot Stop</text><text x="229" y="412.15" text-anchor="middle">Notifications + report</text><rect x="10" y="440" width="438" height="108" rx="7" fill="#087f5b" fill-opacity=".08" stroke="#aab8c5"/><text x="24" y="467" class="heading">Compose workflow · Rust</text><text x="24" y="488" >Reset → prepare → preflight</text><text x="24" y="509" >Launch → observe → stop → cleanup</text><text x="24" y="530" >Repository admission · resource evidence</text><path d="M38 548V617.5" fill="none" stroke="#2563eb" stroke-width="1.6"  marker-end="url(#ownership-after-command)"/><path d="M420 621.5V552" fill="none" stroke="#087f5b" stroke-width="1.6"  marker-end="url(#ownership-after-result)"/><text x="229" y="579.15" text-anchor="middle">Invoke step + input</text><text x="229" y="600.15" text-anchor="middle">Result / failure</text><rect x="10" y="621.5" width="438" height="87" rx="7" fill="#8055b4" fill-opacity=".08" stroke="#aab8c5"/><text x="24" y="648.5" class="heading">Generic orchestration · Rust</text><text x="24" y="669.5" >Dispatch invocations · return results</text><text x="24" y="690.5" >Emit workflow step events</text><path d="M448 665H488V310H438" fill="none" stroke="#8055b4" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ownership-after-event)"/><text x="479" y="487.5" text-anchor="middle" transform="rotate(-90 479 487.5)">Step events · bounded queue</text><path d="M38 708.5V778" fill="none" stroke="#2563eb" stroke-width="1.6"  marker-end="url(#ownership-after-command)"/><path d="M420 782V712.5" fill="none" stroke="#087f5b" stroke-width="1.6"  marker-end="url(#ownership-after-result)"/><text x="229" y="739.65" text-anchor="middle">Local call / result</text><text x="229" y="760.65" text-anchor="middle">Future gRPC execution boundary</text><rect x="10" y="782" width="438" height="87" rx="7" fill="#718096" fill-opacity=".08" stroke="#aab8c5"/><text x="24" y="809" class="heading">Step implementation</text><text x="24" y="830" >Compose · Docker · filesystem</text><text x="24" y="851" >Step result · failure · evidence</text></svg>
