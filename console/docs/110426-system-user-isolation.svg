<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="770" viewBox="0 0 1000 770" role="img" aria-labelledby="title desc">
<title id="title">System and user Compose projects in one experiment</title>
<desc id="desc">Console sends one RunRequest. The native workflow prepares both projects together, starts a system project holding the Dora runtime and system apps, then starts the user project. Both share host IPC by default, and user services keep their declared settings. The run ends with one combined result.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4d6278"/></marker>
<style>text{font-family:Arial,sans-serif;fill:#172c43}.title{font-size:26px;font-weight:700}.heading{font-size:19px;font-weight:700}.body{font-size:16px}.code{font-family:monospace;font-size:15px}.arrow{fill:none;stroke:#4d6278;stroke-width:2;marker-end:url(#arrow)}</style></defs>
<rect width="1000" height="770" fill="#fff"/>
<text x="40" y="42" class="title">System project + user project → one experiment</text>

<rect x="40" y="66" width="920" height="78" rx="9" fill="#f1f6fd" stroke="#557ba8" stroke-width="1.5"/>
<text x="60" y="97" class="heading">Console (TypeScript)</text>
<text x="60" y="125" class="body">Discover the launch directory → select profiles and system apps → Review → Start</text>
<path d="M500 144V178" class="arrow"/>

<rect x="40" y="178" width="920" height="56" rx="9" fill="#fff" stroke="#557ba8" stroke-width="1.5"/>
<text x="60" y="212" class="heading">One RunRequest</text>
<text x="240" y="212" class="code">system_apps[]  +  projects[]</text>
<path d="M500 234V268" class="arrow"/>

<rect x="20" y="268" width="960" height="388" rx="12" fill="#edf5ef" stroke="#739782" stroke-width="1.5"/>
<text x="40" y="297" class="heading">One experiment (native workflow)</text>

<rect x="60" y="312" width="880" height="48" rx="9" fill="#fff" stroke="#8ba0b6" stroke-width="1.5"/>
<text x="80" y="342" class="body">Prepare both: reset → resolve each project → one snapshot → preflight</text>
<path d="M250 360V396" class="arrow"/>
<path d="M755 360V396" class="arrow"/>

<rect x="60" y="396" width="380" height="164" rx="9" fill="#f4f1fa" stroke="#9886b2" stroke-width="1.5"/>
<text x="80" y="426" class="heading">System project</text>
<rect x="80" y="440" width="340" height="50" rx="7" fill="#fff" stroke="#9886b2" stroke-width="1.2"/>
<text x="96" y="471" class="body">Dora runtime · host network, host IPC</text>
<rect x="80" y="498" width="340" height="50" rx="7" fill="#fff" stroke="#9886b2" stroke-width="1.2"/>
<text x="96" y="529" class="body">System apps · monitor, recorder, bridge</text>

<rect x="570" y="396" width="370" height="164" rx="9" fill="#fff4ec" stroke="#c98a5e" stroke-width="1.5"/>
<text x="590" y="426" class="heading">User project</text>
<text x="590" y="466" class="body">Selected services from the repository</text>
<text x="590" y="496" class="body">Own names and volumes</text>
<text x="590" y="526" class="body">Declared settings kept · IPC defaults to host</text>

<path d="M440 478H570" fill="none" stroke="#4d6278" stroke-width="2" stroke-dasharray="6 5"/>
<text x="505" y="464" class="body" text-anchor="middle">host IPC</text>

<text x="60" y="592" class="body">Start: Dora → system apps ready → user project → all ready → run until Stop</text>
<text x="60" y="622" class="body">Stop: user project → system apps → Dora → finalize → remove both projects</text>
<text x="60" y="645" class="body">Startup failure in either project stops both.</text>
<path d="M500 656V688" class="arrow"/>

<rect x="40" y="688" width="920" height="56" rx="9" fill="#f1f6fd" stroke="#557ba8" stroke-width="1.5"/>
<text x="60" y="722" class="body">One run: snapshot, history entry, recordings, and service results labelled system or user</text>
</svg>
