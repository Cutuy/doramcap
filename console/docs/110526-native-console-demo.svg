<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" font-family="system-ui,sans-serif" font-size="13">
  <title>The project explorer composes Console through a layout prop and themes it through tokens</title>
  <rect width="760" height="330" fill="#fff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l8 4-8 4" fill="none" stroke="#596b64" stroke-width="1.5"/></marker></defs>
  <rect x="20" y="20" width="340" height="290" rx="6" fill="#f0f3f0" stroke="#dde2df"/>
  <text x="36" y="46" font-weight="600" fill="#202a2e">Project explorer</text>
  <rect x="36" y="62" width="308" height="44" rx="5" fill="#fff" stroke="#dde2df"/>
  <text x="190" y="89" text-anchor="middle" fill="#202a2e">Run · History · phases · Reset</text>
  <rect x="36" y="118" width="308" height="44" rx="5" fill="#fff" stroke="#236457"/>
  <text x="190" y="145" text-anchor="middle" fill="#202a2e">Console window: screen</text>
  <rect x="36" y="174" width="308" height="44" rx="5" fill="#fff" stroke="#dde2df"/>
  <text x="190" y="201" text-anchor="middle" fill="#202a2e">Upcoming features</text>
  <rect x="36" y="244" width="308" height="44" rx="5" fill="#e8f2ee" stroke="#236457"/>
  <text x="190" y="271" text-anchor="middle" fill="#202a2e">Site theme → token mapping</text>
  <rect x="470" y="20" width="270" height="290" rx="6" fill="#f0f3f0" stroke="#dde2df"/>
  <text x="486" y="46" font-weight="600" fill="#202a2e">Console package</text>
  <rect x="486" y="62" width="238" height="44" rx="5" fill="#fff" stroke="#dde2df"/>
  <text x="605" y="89" text-anchor="middle" fill="#202a2e">App: run state, views, phases</text>
  <rect x="486" y="118" width="238" height="44" rx="5" fill="#fff" stroke="#dde2df"/>
  <text x="605" y="145" text-anchor="middle" fill="#202a2e">Screens</text>
  <rect x="486" y="244" width="238" height="44" rx="5" fill="#e8f2ee" stroke="#236457"/>
  <text x="605" y="271" text-anchor="middle" fill="#202a2e">--console-* tokens</text>
  <path d="M486 84H344" fill="none" stroke="#596b64" marker-end="url(#a)"/>
  <text x="415" y="77" text-anchor="middle" fill="#596b64">frame data</text>
  <path d="M486 140H344" fill="none" stroke="#596b64" marker-end="url(#a)"/>
  <text x="415" y="133" text-anchor="middle" fill="#596b64">screen</text>
  <path d="M344 266H486" fill="none" stroke="#596b64" marker-end="url(#a)"/>
  <text x="415" y="259" text-anchor="middle" fill="#596b64">CSS variables</text>
</svg>
