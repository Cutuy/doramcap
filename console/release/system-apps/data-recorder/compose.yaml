services:
  data-recorder:
    image: doramcap/mcap-recorder:local
    network_mode: host
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      DORAMCAP_READY_FILE: /tmp/data-recorder.ready
    healthcheck:
      test: [CMD, test, -s, /tmp/data-recorder.ready]
      interval: 200ms
      timeout: 1s
      retries: 150
