services:
  demo:
    image: doramcap/gpudirect-demo:local
    user: "${GPUDIRECT_UID:?}:${GPUDIRECT_GID:?}"
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 60s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true, seccomp:unconfined]
    tmpfs: [/tmp]
    ulimits:
      memlock: {soft: 268435456, hard: 268435456}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - type: bind
        source: ${GPUDIRECT_RESULTS_DIR:?}
        target: /results
