<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><title>Live CUDA shared memory observations</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#69d7ec"/></marker></defs><rect width="1000" height="560" fill="#0b1220"/><style>text{font:16px sans-serif;fill:#dfeafa}.head{font-size:22px;font-weight:bold}.edge{stroke:#69d7ec;stroke-width:2;fill:none;marker-end:url(#a)}rect.box{fill:#15243a;stroke:#3b526f;rx:10}</style><text x="30" y="40" class="head">Dora CUDA SPMC · live observations</text><text x="30" y="73">Correlation: process + slot + generation · host timestamps</text><rect class="box" x="30" y="110" width="420" height="110"/><text x="50" y="140" class="head">Producer + N consumer processes</text><text x="50" y="172">Ready / Done submission · returned · reclaimed</text><text x="50" y="199">Pool statistics · optional CPU checksum</text><rect class="box" x="550" y="110" width="420" height="110"/><text x="570" y="140" class="head">Dora control messages</text><text x="570" y="172">Frame(slot, generation) / Returned</text><text x="570" y="199">Payload stays in locked shared ring</text><path class="edge" d="M450 160H550"/><rect class="box" x="30" y="275" width="420" height="110"/><text x="50" y="305" class="head">activity-tracing runtime / process</text><text x="50" y="337">Bounded capture → encoder → sink workers</text><text x="50" y="364">MCAP recording + raw Protobuf batches</text><path class="edge" d="M240 220V275"/><rect class="box" x="550" y="275" width="420" height="110"/><text x="570" y="305" class="head">Local experiment server</text><text x="570" y="337">Relay batches · 4 MiB replay budget</text><text x="570" y="364">Launch Dora · preserve logs / MCAP</text><path class="edge" d="M450 330H550"/><rect class="box" x="260" y="440" width="710" height="90"/><text x="280" y="471" class="head">Interactive browser</text><text x="280" y="500">Timeline + stats + checksums · filters · pause · downloads</text><path class="edge" d="M760 385V440"/><text x="30" y="460">HTTP polling: 150 ms</text><text x="30" y="490">GPU execution timing</text><text x="30" y="515">requires a GPU profiler.</text></svg>
