[package]
name = "fault-watchdog"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
mcap = ["dep:storage-persistence"]
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:futures-executor"]

[dependencies]
dora-app = { path = "../../libs/dora-app" }
fault-reporter = { path = "../../libs/fault/reporter" }
fault-aggregation = { path = "../../libs/fault/aggregation" }
fault-protocol = { path = "../../libs/fault/protocol" }
pbtxt-config = { path = "../../libs/pbtxt-config" }
prost = "0.14"
crossbeam-channel = "0.5"
dora-node-api = { version = "=1.1.0", default-features = false }
eyre = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
storage-persistence = { path = "../../libs/storage-persistence", optional = true }
opentelemetry = { version = "0.33", optional = true, default-features = false, features = ["logs"] }
opentelemetry_sdk = { version = "0.33", optional = true, default-features = false, features = ["logs"] }
opentelemetry-otlp = { version = "0.33", optional = true, default-features = false, features = ["logs", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
futures-executor = { version = "0.3", optional = true }

[dev-dependencies]
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "logs"] }
mcap = { version = "=0.26.0", default-features = false }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[lints]
workspace = true
