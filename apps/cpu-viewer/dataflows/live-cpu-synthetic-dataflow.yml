nodes:
  - id: system-monitor
    path: ../../../target/debug/system-monitor
    args: --backend synthetic --dora
    outputs:
      - snapshots
      - dictionary
  - id: cpu-viewer
    path: ../../../target/debug/cpu-viewer
    args: --port 8080
    inputs:
      snapshots:
        source: system-monitor/snapshots
        queue_size: 4
      dictionary:
        source: system-monitor/dictionary
        queue_size: 4
