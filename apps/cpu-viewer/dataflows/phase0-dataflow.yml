nodes:
  - id: system-monitor
    path: ../../system-monitor/scripts/run-native-monitor.sh
    args: --backend bpf --samples 10 --dora
    outputs:
      - snapshots
      - dictionary
  - id: recorder
    path: ../../../target/debug/mcap-recorder
    args: phase0.mcap
    inputs:
      snapshots:
        source: system-monitor/snapshots
        queue_size: 64
      dictionary:
        source: system-monitor/dictionary
        queue_size: 4
