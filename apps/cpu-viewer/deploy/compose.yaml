x-runtime: &runtime
  type: bind
  source: ${DORAMCAP_DORA_RUNTIME_DIR:?}
  target: ${DORAMCAP_DORA_RUNTIME_DIR:?}
x-results: &results
  type: bind
  source: ${CPU_VIEWER_RESULTS_DIR:?}
  target: /results
x-node: &node
  image: doramcap/cpu-viewer:local
  user: ${CPU_VIEWER_UID:?}:${CPU_VIEWER_GID:?}
  network_mode: host
  ulimits:
    memlock: {soft: 268435456, hard: 268435456}
  volumes: [*runtime, *results]
services:
  monitor:
    <<: *node
    environment: {DORAMCAP_READY_FILE: "${DORAMCAP_DORA_RUNTIME_DIR:?}/monitor.ready"}
    healthcheck: {test: [CMD, test, -s, "${DORAMCAP_DORA_RUNTIME_DIR:?}/monitor.ready"], interval: 200ms, timeout: 1s, retries: 150}
    depends_on: {viewer: {condition: service_healthy}}
    entrypoint: [/usr/local/bin/system-monitor]
    cap_add: [BPF, PERFMON, SYSLOG]
    cgroup: host
    volumes:
      - *runtime
      - *results
      - {type: bind, source: /sys/fs/cgroup, target: /sys/fs/cgroup, read_only: true}
      - {type: bind, source: /sys/kernel/btf, target: /sys/kernel/btf, read_only: true}
      - {type: bind, source: ./monitor.pbtxt, target: /config/monitor.pbtxt, read_only: true}
    command: ["--config", "/config/monitor.pbtxt"]
  viewer:
    <<: *node
    environment: {DORAMCAP_READY_FILE: "${DORAMCAP_DORA_RUNTIME_DIR:?}/viewer.ready"}
    healthcheck: {test: [CMD, test, -s, "${DORAMCAP_DORA_RUNTIME_DIR:?}/viewer.ready"], interval: 200ms, timeout: 1s, retries: 150}
    entrypoint: [/usr/local/bin/cpu-viewer]
    command: ["--bind", "127.0.0.1", "--port", "8080", "--assets", "/opt/cpu-viewer/dist"]
