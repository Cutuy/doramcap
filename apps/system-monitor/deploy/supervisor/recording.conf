[program:system-monitor]
command="%(ENV_DORAMCAP_MONITOR)s" --backend bpf --records 32768 --output "%(ENV_DORAMCAP_RUN)s/cpu.pb" --record "%(ENV_DORAMCAP_RUN)s/cpu.mcap" --record-buffered
directory=%(ENV_DORAMCAP_RUN)s
autostart=false
autorestart=false
startsecs=0
startretries=0
stopsignal=TERM
stopwaitsecs=%(ENV_DORAMCAP_STOP_SECONDS)s
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_DORAMCAP_RUN)s/monitor.stdout.log
stderr_logfile=%(ENV_DORAMCAP_RUN)s/monitor.stderr.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
