[package]
name = "system-monitor"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
bpf = ["cgroup-bpf/bpf"]
dora = ["dep:system-monitor-dora"]

task-bpf = ["task-accounting/bpf"]

[dependencies]
dora-app = { path = "../../libs/dora-app", default-features = false }
storage-persistence = { path = "../../libs/storage-persistence" }
prost = "0.14"
prost-reflect = { version = "0.16", features = ["text-format"] }
libc = "0.2"
task-accounting = { path = "../../libs/resources/task-accounting" }
telemetry-protocol = { path = "../../libs/telemetry/protocol" }
monitor-core = { path = "../../libs/resources/monitor-core" }
cgroup-bpf = { path = "../../libs/resources/cgroup-bpf" }
system-monitor-dora = { path = "dora", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
eyre = "0.6"
ctrlc = { version = "3.4", features = ["termination"] }

[dev-dependencies]
mcap = { version = "=0.26.0", default-features = false }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[lints]
workspace = true
