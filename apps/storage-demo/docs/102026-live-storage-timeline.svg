<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 520" role="img" aria-labelledby="title desc">
<title id="title">Storage live activity timeline</title><desc id="desc">Writer activity enters bounded capture queues. Separate sink workers deliver optional MCAP and bounded WebSocket replay. React groups writes with their I/O children.</desc>
