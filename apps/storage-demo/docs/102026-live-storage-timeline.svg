<g font-size="15" text-anchor="middle"><text x="140" y="142">activity-tracing</text><text x="140" y="174">storage.combining</text><text x="140" y="196">storage.write → io</text><text x="382" y="149">Runtime</text><text x="382" y="181">bounded queues</text><text x="575" y="144">LiveSink</text><text x="575" y="175">Feed + replay</text><text x="575" y="199">4 MiB / 512 batches</text><text x="575" y="303">McapSink · optional</text><text x="850" y="145">TraceStore</text><text x="850" y="177">buffer lanes · write / I/O</text><text x="850" y="200">selection · zoom · filter</text></g>
