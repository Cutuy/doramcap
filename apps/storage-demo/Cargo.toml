[package]
name = "storage-demo"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[features]
default = ["activity-tracing"]
activity-tracing = ["dep:activity-tracing", "dep:tracing", "storage-persistence/activity-tracing"]
tracing-export = ["dep:tracing", "dep:tracing-subscriber"]

[dependencies]
activity-tracing = { path = "../../libs/activity-tracing", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["fmt"] }
storage-persistence = { path = "../../libs/storage-persistence", default-features = true }
telemetry-protocol = { path = "../../libs/telemetry/protocol" }
prost = "0.14"
serde_json = "1"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"] }
futures-util = "0.3"
libc = "0.2"

[dev-dependencies]
mcap = { version = "=0.26.0", default-features = false }

[lints]
workspace = true

[[example]]
name = "validate_activity"
required-features = ["activity-tracing"]

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
