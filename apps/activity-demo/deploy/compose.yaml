services:
  activity:
    image: doramcap/activity-lab:local
    user: "${ACTIVITY_UID:?}:${ACTIVITY_GID:?}"
    command: ["--bind", "0.0.0.0", "--port", "8088", "--assets", "/opt/activity-lab/dist", "--record", "/results/activity.mcap"]
    stop_signal: SIGINT
    stop_grace_period: 30s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes:
      - type: bind
        source: ${ACTIVITY_RESULTS_DIR:?}
        target: /results
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8088/api/status"]
      interval: 2s
      timeout: 2s
      retries: 30
