<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290" role="img" aria-labelledby="title desc">
<title id="title">Compose adoption experience</title>
<desc id="desc">A local browser reviews repository inputs and submits settings to the doramcap server. The server runs Compose workloads and streams activity, then saves a report and artifacts.</desc>
