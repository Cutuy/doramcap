<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-labelledby="title desc"><title id="title">Project explorer architecture</title><desc id="desc">Cargo metadata, Markdown and SVG files feed a static catalog build. The React explorer serves the catalog, documentation and assets through a static HTTP host.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#657173"/></marker></defs><rect width="760" height="220" fill="#fafaf8"/><g fill="#fff" stroke="#dde2df"><rect x="20" y="30" width="170" height="65" rx="5"/><rect x="20" y="125" width="170" height="65" rx="5"/><rect x="285" y="75" width="180" height="80" rx="5"/><rect x="565" y="75" width="175" height="80" rx="5"/></g><g font-family="system-ui,sans-serif" font-size="14" fill="#202a2e" text-anchor="middle"><text x="105" y="57">Cargo metadata</text><text x="105" y="79" font-size="12">Packages and edges</text><text x="105" y="153">READMEs and docs</text><text x="105" y="175" font-size="12">Markdown and SVGs</text><text x="375" y="108">Static build</text><text x="375" y="132" font-size="12">Catalog and assets</text><text x="652" y="108">React explorer</text><text x="652" y="132" font-size="12">Static HTTP host</text></g><g fill="none" stroke="#657173" marker-end="url(#arrow)"><path d="M190 63H237V100H283"/><path d="M190 157H237V130H283"/><path d="M465 115H563"/></g></svg>
