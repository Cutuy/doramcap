<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Explore doramcap use cases, applications, crates, documentation and dependencies."><title>doramcap · Project explorer</title>
<script>
  // Apply the saved choice before the browser can paint the system theme.
  try {
    const STORAGE_KEY = 'doramcap-explorer-theme';
    const storedTheme = window.localStorage.getItem(STORAGE_KEY);
    if (storedTheme === 'light' || storedTheme === 'dark') {
      document.documentElement.style.colorScheme = storedTheme;
    }
  } catch {
    // Storage is blocked: CSS follows the system preference.
  }
</script>
</head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
