<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
  <title id="title">Independent app hosting and remaining integration work</title>
  <desc id="desc">Trusted protobuf registrations configure the gallery manager, which invokes the shared Rust Compose workflow. Caddy routes browser traffic to workload containers. Supporting services also run in Docker containers; Dora nodes run inside a daemon container. Each generation retains outputs and declares host requirements.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#64748b"/></marker>
  </defs>
  <rect width="1080" height="520" fill="#fff"/>
  <g font-family="sans-serif" fill="#18344d">
    <text x="30" y="34" font-size="21" font-weight="600">Independent apps, shared hosting</text>
    <g stroke="#94a3b8" stroke-width="1.3" fill="#edf4fb">
      <rect x="30" y="80" width="190" height="90" rx="8"/>
      <rect x="30" y="250" width="190" height="100" rx="8"/>
      <rect x="315" y="80" width="215" height="90" rx="8"/>
      <rect x="315" y="250" width="215" height="100" rx="8"/>
      <rect x="640" y="65" width="410" height="290" rx="10" fill="#f8fafc"/>
      <rect x="665" y="110" width="360" height="80" rx="7" fill="#edf4fb"/>
      <rect x="665" y="220" width="360" height="105" rx="7" fill="#edf4fb"/>
      <rect x="315" y="425" width="285" height="65" rx="8" fill="#f0fdf4"/>
      <rect x="700" y="425" width="350" height="65" rx="8" fill="#fff7ed"/>
    </g>
    <g text-anchor="middle" font-size="17">
      <text x="125" y="116">Browser viewers</text><text x="125" y="143" font-size="13">Shared session shell</text>
      <text x="125" y="282">Trusted registrations</text><text x="125" y="309" font-size="13">Compose + pbtxt</text><text x="125" y="330" font-size="13">Prebuilt images per app</text>
      <text x="422" y="116">Caddy</text><text x="422" y="143" font-size="13">HTTP · WebSocket · SSE</text>
      <text x="422" y="283">Gallery manager</text><text x="422" y="309" font-size="13">Sessions · results</text><text x="422" y="331" font-size="13">Shared Rust Compose workflow</text>
      <text x="845" y="93" font-weight="600">One owned generation per app</text>
      <text x="845" y="143">Workload containers</text><text x="845" y="169" font-size="13">Web UI or headless app</text>
      <text x="845" y="249">Supporting service containers</text><text x="845" y="278" font-size="13">Collectors · Dora coordinator / daemon</text><text x="845" y="302" font-size="13">Dora nodes run inside the daemon container</text>
      <text x="457" y="451">Retained artifacts</text><text x="457" y="476" font-size="13">Declared results · private logs</text>
      <text x="875" y="451">Explicit host requirements</text><text x="875" y="476" font-size="13">Docker worker · BPF · io_uring · GPU/IPC</text>
    </g>
    <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
      <path d="M220 125H315" marker-start="url(#arrow)"/>
      <path d="M530 125H665" marker-start="url(#arrow)"/>
      <path d="M422 170V250" marker-start="url(#arrow)"/>
      <path d="M220 295H315"/>
      <path d="M530 295H640"/>
      <path d="M845 190V220" marker-start="url(#arrow)"/>
      <path d="M730 355V390H457V425"/>
      <path d="M385 350V425"/>
      <path d="M875 425V355"/>
    </g>
    <g font-size="12" text-anchor="middle">
      <text x="267" y="111">Open</text><text x="588" y="111">App traffic</text>
      <text x="491" y="210">Launch / renew</text><text x="491" y="229">Status / results</text>
      <text x="267" y="281">Load</text><text x="585" y="281">Start / stop</text>
      <text x="591" y="381">Finalized outputs</text><text x="347" y="391">Index</text>
      <text x="967" y="392">Opt-in + preflight</text>
    </g>
  </g>
</svg>
