services:
  monitor:
    image: doramcap/dataflow-tracing-demo:local
    user: "${PROVENANCE_UID:?}:${PROVENANCE_GID:?}"
    init: true
    stop_signal: SIGINT
    stop_grace_period: 80s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes:
      - type: bind
        source: ${PROVENANCE_RESULTS_DIR:?}
        target: /results
