# The experiment supplies user, output/config mounts and approved Dora connection.
services:
  workload-recorder:
    image: doramcap/mcap-recorder:local
    entrypoint: [/usr/local/bin/mcap-recorder]
    command: [--config, /config/recorder.pbtxt]
    network_mode: host
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    stop_signal: SIGINT
    stop_grace_period: 30s
