syntax = "proto3";
package doramcap.recorder.v1;

// The payload of a pbtxt-config app with ID "recorder". An include's fields apply first;
// a later nonempty value replaces them, and a later input list replaces its whole predecessor.
message RecorderConfig {
  string output_path = 1;
  // Defaults to output_path + ".report.pbtxt". Both files are created exclusively.
  string report_path = 2;
  repeated Input input = 3;
}
message Input {
  string input = 1;
  string topic = 2;
  string message_encoding = 3;
  // Set schema_name, schema_encoding and schema_path together, or none of them.
  // Required for "protobuf", which readers cannot decode without one. Contents are not validated.
  string schema_name = 4;
  string schema_encoding = 5;
  // File embedded as the schema, such as a binary FileDescriptorSet for "protobuf".
  // Read once at startup. Relative to the config file.
  string schema_path = 6;
  // Metadata key with decimal-string Unix nanoseconds. Empty means unavailable.
  string timestamp_key = 7;
  // Metadata key with a decimal-string u32. Empty means unavailable (MCAP zero).
  string sequence_key = 8;
}
message RecordingReport {
  enum State { RUNNING = 0; DRAINED = 1; INTERRUPTED = 2; FAILED = 3; }
  State state = 1;
  bool finalized = 2;
  string error = 3;
  repeated InputReport input = 4;
  // Dora has no per-input queue loss counter.
  bool transport_loss_unknown = 5;
}
message InputReport {
  string input = 1;
  uint64 received = 2;
  uint64 written = 3;
}
