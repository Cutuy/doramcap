[package]
name = "mcap-recorder"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1", features = ["rt", "time", "macros"] }
fault-dora = { path = "../../libs/fault/dora" }
dora-app = { path = "../../libs/dora-app" }
storage-persistence = { path = "../../libs/storage-persistence" }
dora-node-api.workspace = true
eyre = "0.6"
prost = "0.14"
prost-reflect = { version = "0.16", features = ["text-format"] }
serde_json = "1"

[dev-dependencies]
mcap = { version = "=0.26.0", default-features = false }
telemetry-protocol = { path = "../../libs/telemetry/protocol" }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[[example]]
name = "dora_attachment_fixture"
test = true

[[example]]
name = "compare_recordings"

[lints]
workspace = true
