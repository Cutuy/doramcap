services:
  server:
    image: doramcap/orchestrator-web:local
    user: "${ORCHESTRATOR_UID:?}:${ORCHESTRATOR_GID:?}"
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 10s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    depends_on:
      worker:
        condition: service_started
    volumes:
      - type: bind
        source: ${ORCHESTRATOR_PRIVATE_SOCKET_DIR:?}
        target: /socket
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "1", "http://127.0.0.1:8080/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 45
  worker:
    image: doramcap/orchestrator-worker:local
    user: "${ORCHESTRATOR_UID:?}:${ORCHESTRATOR_GID:?}"
    group_add: ["${ORCHESTRATOR_DOCKER_GID:?}"]
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 110s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    tmpfs: [/tmp]
    environment:
      ORCHESTRATOR_RESULTS_DIR: ${ORCHESTRATOR_RESULTS_DIR:?}
      ORCHESTRATOR_RUN_ID: ${ORCHESTRATOR_RUN_ID:?}
      ORCHESTRATOR_MONITOR_IMAGE: doramcap/system-monitor:local
    volumes:
      - type: bind
        source: ${ORCHESTRATOR_PRIVATE_SOCKET_DIR:?}
        target: /socket
      - type: bind
        source: ${ORCHESTRATOR_PRIVATE_RECOVERY_DIR:?}
        target: /recovery
      - type: bind
        source: ${ORCHESTRATOR_RESULTS_DIR:?}
        target: ${ORCHESTRATOR_RESULTS_DIR:?}
      - type: bind
        source: ${ORCHESTRATOR_DOCKER_SOCKET:?}
        target: /var/run/docker.sock
