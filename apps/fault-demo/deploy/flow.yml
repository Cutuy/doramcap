nodes:
  - id: controls
    path: dynamic
    outputs: [controls]
  - id: source-a
    path: dynamic
    inputs:
      controls: {source: controls/controls, queue_policy: backpressure}
    outputs: [reports]
  - id: source-b
    path: dynamic
    inputs:
      controls: {source: controls/controls, queue_policy: backpressure}
    outputs: [reports]
  - id: watchdog
    path: dynamic
    inputs:
      source_a: {source: source-a/reports, queue_policy: backpressure}
      source_b: {source: source-b/reports, queue_policy: backpressure}
    outputs: [faults]
  - id: dashboard
    path: dynamic
    inputs:
      faults: {source: watchdog/faults, queue_policy: backpressure}
