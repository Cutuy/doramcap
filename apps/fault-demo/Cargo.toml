[package]
name = "fault-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
fault-watchdog = { path = "../fault-watchdog" }
fault-reporter = { path = "../../libs/fault/reporter" }
fault-aggregation = { path = "../../libs/fault/aggregation" }
fault-protocol = { path = "../../libs/fault/protocol" }
dora-node-api = { version = "=1.1.0", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "signal"] }
axum = "0.8"
serde_json = "1"
eyre = "0.6"
[lints]
workspace = true

[[bin]]
name = "fault-demo-source"
path = "src/bin/source.rs"
[[bin]]
name = "fault-demo-dashboard"
path = "src/bin/dashboard.rs"
