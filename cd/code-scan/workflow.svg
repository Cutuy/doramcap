<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 1600 1300" role="img" aria-labelledby="title desc">
<title id="title">Code scan pipeline with a harness around every model call</title>
<desc id="desc">Guides pass through a harness and rule model to form tasks with source code. Up to eight filter calls and two confirmation calls run concurrently, each behind its own harness with prepared inputs and structured outputs. Candidates stream to confirmation and confirmed tasks enter one serial repair and verification path per repository. Any harness can request a contextual user decision and resume from a recorded answer.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526880"/></marker>
<marker id="model-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526880"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a36c1a"/></marker>
<style>text{font-family:DejaVu Sans,sans-serif}.title{font-size:31px;font-weight:700;fill:#172d45}.head{font-size:22px;font-weight:700;fill:#172d45}.body{font-size:18px;fill:#405770}.small{font-size:16px;fill:#4d6279}.label{font-size:16px;font-weight:600;fill:#435a72}.harness{font-size:17px;font-weight:700;fill:#fff}.model{font-size:17px;fill:#243d59}.flow{fill:none;stroke:#526880;stroke-width:2;stroke-linejoin:round;marker-end:url(#arrow)}.model-link{fill:none;stroke:#526880;stroke-width:2;marker-start:url(#model-arrow);marker-end:url(#model-arrow)}.bus{fill:none;stroke:#526880;stroke-width:2;stroke-linejoin:round}.choice{fill:none;stroke:#a36c1a;stroke-width:2;stroke-linejoin:round;marker-end:url(#amber)}</style>
</defs><rect width="1600" height="1300" fill="#f7f9fc"/>
<text x="60" y="53" class="title" text-anchor="start">Code scan: every model call runs through a harness</text>
<text x="60" y="85" class="body" text-anchor="start">Prepared input files → harness ↔ model → validated output artifacts</text>
<rect x="60" y="125" width="200" height="70" rx="12" fill="#fff" stroke="#d4dfeb" stroke-width="1.4"/>
<text x="160.0" y="154" class="head" text-anchor="middle">Guides</text>
<text x="160.0" y="179" class="small" text-anchor="middle">Design + impl. rules</text>
<text x="450" y="123" class="label" text-anchor="middle">Prepare changed rules · 1 at a time</text>
<rect x="350" y="145" width="200" height="30" rx="7" fill="#253f5b" stroke="#253f5b" stroke-width="1.4"/>
<text x="450.0" y="166" class="harness" text-anchor="middle">Harness</text>
<path d="M450.0 176 V199" class="model-link"/>
<rect x="350" y="200" width="200" height="38" rx="8" fill="#f0f1ff" stroke="#d2dce9" stroke-width="1.4"/>
