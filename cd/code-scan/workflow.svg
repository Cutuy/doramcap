<text x="50" y="55" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#15253b" text-anchor="start">Scan one rule × one code unit</text>
<text x="50" y="90" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#445875" text-anchor="start">Luna / low → Sol / high → Astra / xhigh</text>
<text x="50" y="119" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#52657e" text-anchor="start">Code owns routing, evidence, budgets and tools. Models return schema-validated JSON.</text>
