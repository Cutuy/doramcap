<rect x="540" y="515" width="200" height="70" rx="12" fill="#fff" stroke="#d4dfeb" stroke-width="1.4"/>
<text x="640.0" y="544" class="head" text-anchor="middle">Candidates</text>
<text x="640.0" y="569" class="small" text-anchor="middle">Output artifacts</text>
