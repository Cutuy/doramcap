<text x="82" y="870" class="head" text-anchor="start">One repair per repository</text>
<text x="82" y="898" class="small" text-anchor="start">Fix → checks → independent review → final validation</text>
<rect x="120" y="940" width="180" height="30" rx="7" fill="#253f5b" stroke="#253f5b" stroke-width="1.4"/>
