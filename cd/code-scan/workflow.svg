<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1030" viewBox="0 0 1280 1030" role="img" aria-labelledby="title desc">
<title id="title">Code review: prepared inputs, agent calls, structured outputs</title>
<desc id="desc">A harness advances one rule and one code unit through filtering, confirmation, repair and verification. For every call it prepares an input directory, runs one agent, and validates the saved output. A required user choice includes repository and pull request context, the problem and options. The harness saves the answer into the next input before resuming.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#536780"/></marker>
<marker id="user-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#a56b16"/></marker>
<style>text { font-family: DejaVu Sans, sans-serif; } .title { fill:#172b43; font-size:30px; font-weight:700; } .heading { fill:#172b43; font-size:21px; font-weight:700; } .body { fill:#435870; font-size:17px; } .small { fill:#52667d; font-size:15px; } .label { fill:#435870; font-size:15px; font-weight:600; } .flow { fill:none; stroke:#536780; stroke-width:2.2; stroke-linejoin:round; marker-end:url(#arrow); } .user-flow { fill:none; stroke:#a56b16; stroke-width:2.2; stroke-linejoin:round; marker-end:url(#user-arrow); }</style>
</defs>
<rect width="1280" height="1030" fill="#f6f8fc"/>

<text x="60" y="57" class="title" text-anchor="start">One rule × one code unit</text>
<text x="60" y="89" class="body" text-anchor="start">The harness moves work through four stages; every invocation uses the same file handoff.</text>
<rect x="60" y="123" width="260" height="105" rx="14" fill="#edf6ff" stroke="#d5dfeb" stroke-width="1.5"/>
<text x="78" y="154" class="heading" text-anchor="start">Filter</text>
<text x="78" y="182" class="small" text-anchor="start">Cheap model · low effort</text>
<text x="78" y="207" class="small" text-anchor="start">Up to 8 in parallel</text>
<rect x="360" y="123" width="260" height="105" rx="14" fill="#f0f1ff" stroke="#d5dfeb" stroke-width="1.5"/>
<text x="378" y="154" class="heading" text-anchor="start">Confirm</text>
<text x="378" y="182" class="small" text-anchor="start">Stronger model · high effort</text>
<text x="378" y="207" class="small" text-anchor="start">Up to 2 in parallel</text>
<rect x="660" y="123" width="260" height="105" rx="14" fill="#f5efff" stroke="#d5dfeb" stroke-width="1.5"/>
<text x="678" y="154" class="heading" text-anchor="start">Fix</text>
<text x="678" y="182" class="small" text-anchor="start">Strongest model · deep effort</text>
<text x="678" y="207" class="small" text-anchor="start">One repair at a time</text>
<rect x="960" y="123" width="260" height="105" rx="14" fill="#eaf7f1" stroke="#d5dfeb" stroke-width="1.5"/>
<text x="978" y="154" class="heading" text-anchor="start">Verify</text>
<text x="978" y="182" class="small" text-anchor="start">Fresh review + code checks</text>
<text x="978" y="207" class="small" text-anchor="start">Shares the repair slot</text>
<path d="M320 175 H360" class="flow"/>
<path d="M620 175 H660" class="flow"/>
<path d="M920 175 H960" class="flow"/>
<rect x="60" y="267" width="1160" height="461" rx="20" fill="#eaf0f7" stroke="#cbd8e7" stroke-width="1.5"/>
<text x="84" y="307" class="heading" text-anchor="start">Harness</text>
<text x="221" y="307" class="small" text-anchor="start">Chooses the stage · controls tools and leases · saves progress · runs checks and publishes</text>
<rect x="90" y="348" width="330" height="181" rx="14" fill="#ffffff" stroke="#d5dfeb" stroke-width="1.5"/>
<text x="112" y="384" class="heading" text-anchor="start">Prepared input directory</text>
<text x="112" y="417" class="body" text-anchor="start">Task, scope, repository and PR</text>
<text x="112" y="447" class="body" text-anchor="start">Rule, pinned code and evidence</text>
<text x="112" y="477" class="body" text-anchor="start">Prior results and user decisions</text>
<text x="112" y="508" class="small" text-anchor="start">JSON + referenced files</text>
<rect x="480" y="373" width="240" height="131" rx="14" fill="#f4f0ff" stroke="#d8cbea" stroke-width="1.5"/>
<text x="600" y="411" class="heading" text-anchor="middle">One agent call</text>
<text x="600" y="444" class="body" text-anchor="middle">Reads prepared files</text>
<text x="600" y="475" class="body" text-anchor="middle">Returns schema JSON</text>
<rect x="780" y="348" width="410" height="181" rx="14" fill="#ffffff" stroke="#d5dfeb" stroke-width="1.5"/>
<text x="802" y="384" class="heading" text-anchor="start">Saved output directory</text>
<text x="802" y="417" class="body" text-anchor="start">Result, evidence and proposed patch</text>
<text x="802" y="447" class="body" text-anchor="start">Decision request, when needed</text>
<text x="802" y="477" class="body" text-anchor="start">Logs, token usage and cost</text>
<text x="802" y="508" class="small" text-anchor="start">JSON + produced artifacts</text>
<path d="M420 438 H480" class="flow"/>
<path d="M720 438 H780" class="flow"/>
<path d="M985 529 V579" class="flow"/>
<rect x="780" y="579" width="410" height="119" rx="14" fill="#ffffff" stroke="#d5dfeb" stroke-width="1.5"/>
<text x="802" y="614" class="heading" text-anchor="start">Harness validates and routes</text>
<text x="802" y="646" class="body" text-anchor="start">Checks schema, evidence and edit scope</text>
<text x="802" y="678" class="body" text-anchor="start">Advances, finishes, or requests a decision</text>
<path d="M780 624 H255 V529" class="flow"/>
<text x="485" y="605" class="label" text-anchor="middle">Next stage or bounded retry</text>
<path d="M780 672 H640 V874 H590" class="user-flow"/>
<text x="650" y="774" class="label" text-anchor="start">Only if a decision is required</text>
<rect x="90" y="795" width="500" height="170" rx="14" fill="#fff6e5" stroke="#e0bd7f" stroke-width="1.5"/>
<text x="112" y="834" class="heading" text-anchor="start">User decision</text>
<text x="112" y="869" class="body" text-anchor="start">Repository / PR + problem + options</text>
<text x="112" y="901" class="body" text-anchor="start">User selects an option</text>
<text x="112" y="933" class="body" text-anchor="start">Harness saves the answer into the next input</text>
<path d="M90 881 H32 V438 H90" class="user-flow"/>
<path d="M985 698 V795" class="flow"/>
<text x="1003" y="758" class="label" text-anchor="start">Task complete</text>
<rect x="780" y="795" width="410" height="137" rx="14" fill="#eaf7f1" stroke="#b9d9cb" stroke-width="1.5"/>
<text x="802" y="834" class="heading" text-anchor="start">Recorded outcome</text>
<text x="802" y="869" class="body" text-anchor="start">Finding, unresolved task, or verified fix</text>
<text x="802" y="901" class="body" text-anchor="start">Evidence, checks and PR when applicable</text>
</svg>
