<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1560" viewBox="0 0 1280 1560" role="img" aria-labelledby="title desc">
<title id="title">One rule by one code unit: agentic review workflow</title>
<desc id="desc">A code-owned controller builds narrow tasks, sends them through cheap screening and deep confirmation, routes authorized findings to a high-capability fixer, and validates independently. JSON artifacts connect every stage.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker></defs>
