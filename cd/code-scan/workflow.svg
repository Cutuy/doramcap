<path d="M260 160 H350" class="flow"/>
<path d="M550 160 H800" class="flow"/>
<text x="675" y="146" class="small" text-anchor="middle">Rule clauses</text>
<rect x="60" y="235" width="200" height="70" rx="12" fill="#fff" stroke="#d4dfeb" stroke-width="1.4"/>
<text x="160.0" y="264" class="head" text-anchor="middle">Code snapshot</text>
<text x="160.0" y="289" class="small" text-anchor="middle">Pinned revision</text>
<rect x="800" y="125" width="740" height="140" rx="12" fill="#fff" stroke="#d4dfeb" stroke-width="1.4"/>
<text x="824" y="160" class="head" text-anchor="start">Task queue</text>
<text x="824" y="190" class="body" text-anchor="start">One rule clause × one code unit</text>
<text x="824" y="220" class="small" text-anchor="start">Input directory: repository / PR, scope, rule, source and evidence</text>
<text x="824" y="246" class="small" text-anchor="start">Prior results and recorded user decisions</text>
<path d="M260 270 H720 V225 H800" class="flow"/>
<text x="630" y="299" class="label" text-anchor="middle">Dispatch independent tasks</text>
