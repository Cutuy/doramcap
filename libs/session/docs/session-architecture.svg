<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="540" viewBox="0 0 1040 540" role="img" aria-labelledby="title desc">
<title id="title">Session identity and evidence architecture</title>
<desc id="desc">An optional experiment groups a field capture, cloud replay and target replay. Each has its own session identity. Session manifests join participants, recipes, recordings and results. Adapters expose evidence in Foxglove and Rerun.</desc>
