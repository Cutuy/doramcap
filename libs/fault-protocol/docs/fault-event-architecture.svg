<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#9aaec8" stroke-width="1.6"/></marker><style>text{font-family:Arial,sans-serif;fill:#ebf2fa;font-size:20px}.title{font-size:29px;font-weight:700}.h{font-size:22px;font-weight:700}.s{font-size:16px;fill:#b3c3d8}.box{fill:#1b3049;stroke:#6686aa;stroke-width:1.5;rx:12}.panel{fill:#112138;stroke:#334b68;rx:16}.green{fill:#153e3a;stroke:#61d6b6}.red{fill:#452b35;stroke:#fa929d}.amber{fill:#403621;stroke:#dfbf70}.edge{fill:none;stroke:#9aaec8;stroke-width:2;marker-end:url(#a)}.dep{fill:none;stroke:#9aaec8;stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#a)}</style></defs><rect width="1280" height="850" rx="20" fill="#0b1525"/><text x="35" y="48" class="title" text-anchor="start">Fault publication architecture</text><text x="35" y="78" class="s" text-anchor="start">CORE IMPLEMENTED · generated enums · event-driven publication · host adapters deferred</text><rect class="panel" x="30" y="105" width="1220" height="145"/><rect class="box " x="60" y="140" width="250" height="70"/><text x="185.0" y="172" class="" text-anchor="middle">.proto definitions</text><text x="185.0" y="198" class="s" text-anchor="middle">field + enum source of truth</text><rect class="box green" x="420" y="140" width="310" height="70"/><text x="575.0" y="172" class="" text-anchor="middle">fault-schema</text><text x="575.0" y="198" class="s" text-anchor="middle">prost messages + enums + descriptors</text><rect class="box " x="860" y="140" width="350" height="70"/><text x="1035.0" y="172" class="" text-anchor="middle">Compatibility gate</text><text x="1035.0" y="198" class="s" text-anchor="middle">descriptor baseline + round trips</text><path class="edge" d="M310 175H420"/><text x="365" y="162" class="s" text-anchor="middle">generate</text><path class="edge" d="M730 175H860"/><rect class="panel" x="30" y="285" width="390" height="385"/><text x="55" y="320" class="h" text-anchor="start">Producer process</text><rect class="box " x="60" y="345" width="330" height="70"/><text x="225.0" y="377" class="" text-anchor="middle">High-level caller</text><text x="225.0" y="403" class="s" text-anchor="middle">Result → outcome + recovery</text><rect class="box green" x="60" y="450" width="330" height="75"/><text x="225.0" y="482" class="" text-anchor="middle">fault-reporter</text><text x="225.0" y="508" class="s" text-anchor="middle">separate success / failure queues</text><rect class="box " x="60" y="570" width="330" height="70"/><text x="225.0" y="602" class="" text-anchor="middle">Publisher + fault-protocol</text><text x="225.0" y="628" class="s" text-anchor="middle">wake → encode → send</text><path class="edge" d="M225 415V450"/><path class="edge" d="M225 525V570"/><text x="240" y="551" class="s" text-anchor="start">urgent / summary</text><rect class="panel" x="470" y="285" width="370" height="385"/><text x="495" y="320" class="h" text-anchor="start">Watchdog process</text><rect class="box " x="500" y="345" width="310" height="70"/><text x="655.0" y="377" class="" text-anchor="middle">Dora host + fault-protocol</text><text x="655.0" y="403" class="s" text-anchor="middle">receive → decode</text><rect class="box green" x="500" y="450" width="310" height="75"/><text x="655.0" y="482" class="" text-anchor="middle">fault-aggregation</text><text x="655.0" y="508" class="s" text-anchor="middle">health + freshness + revisions</text><rect class="box " x="500" y="570" width="310" height="70"/><text x="655.0" y="602" class="" text-anchor="middle">Output publisher</text><text x="655.0" y="628" class="s" text-anchor="middle">wake → drain ready updates</text><path class="edge" d="M390 605H445V380H500"/><text x="442" y="441" class="s" text-anchor="middle">IPC</text><path class="edge" d="M655 415V450"/><path class="edge" d="M655 525V570"/><rect class="panel" x="890" y="285" width="360" height="385"/><text x="915" y="320" class="h" text-anchor="start">Independent consumers</text><rect class="box green" x="920" y="365" width="300" height="75"/><text x="1070.0" y="397" class="" text-anchor="middle">Frontend</text><text x="1070.0" y="423" class="s" text-anchor="middle">updates + snapshots</text><rect class="box " x="920" y="535" width="300" height="95"/><text x="1070.0" y="567" class="" text-anchor="middle">MCAP recorder</text><text x="1070.0" y="593" class="s" text-anchor="middle">own queue + write batching</text><path class="edge" d="M810 605H865V403H920"/><path class="edge" d="M865 605V582H920"/><text x="864" y="484" class="s" text-anchor="middle">IPC</text><path class="dep" d="M500 210V267H45V487H60"/><path class="dep" d="M730 200H855V487H810"/><rect class="panel" x="30" y="710" width="1220" height="105"/><text x="55" y="746" class="h" text-anchor="start">Core crates import generated enums. Codec crate translates bounded records.</text><text x="55" y="782" class="s" text-anchor="start">Urgent traffic has no intentional batching delay. Disk latency stays in the recorder.</text></svg>