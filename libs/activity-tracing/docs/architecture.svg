<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Activity tracing architecture"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#607a94"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#258a75"/></marker></defs><style>text{font-family:DejaVu Sans,sans-serif;fill:#19324d}.title{font-size:27px;font-weight:700}.name{font-size:18px;font-weight:700}.label{font-size:14px;fill:#526c84}.tag{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#526c84}.flow{fill:none;stroke:#607a94;stroke-width:2;marker-end:url(#arrow)}.recycle{fill:none;stroke:#258a75;stroke-width:2;marker-end:url(#green)}.box{fill:#fff;stroke:#b9ccdb}.dma{fill:#e6f6f1;stroke:#258a75}</style><rect width="1200" height="620" fill="#f8fafc"/><text x="40" y="52" class="title">Activity tracing</text><text x="40" y="92" class="tag">APPLICATION THREADS</text><rect x="40" y="112" width="220" height="70" rx="10" class="box"/><text x="150" y="140" text-anchor="middle" class="name">tracing</text><text x="150" y="162" text-anchor="middle" class="label">spans and events</text><rect x="40" y="222" width="220" height="70" rx="10" class="box"/><text x="150" y="250" text-anchor="middle" class="name">Capture block</text><text x="150" y="272" text-anchor="middle" class="label">records + string bytes</text><rect x="40" y="332" width="220" height="70" rx="10" class="box"/><text x="150" y="360" text-anchor="middle" class="name">Publish</text><text x="150" y="382" text-anchor="middle" class="label">one reference per sink</text><rect x="40" y="480" width="220" height="70" rx="10" class="box"/><text x="150" y="508" text-anchor="middle" class="name">Block pool</text><text x="150" y="530" text-anchor="middle" class="label">Crossbeam ArrayQueue</text><path d="M150 182 V222" class="flow"/><path d="M150 292 V332" class="flow"/><text x="340" y="92" class="tag">SINK QUEUES</text><rect x="340" y="222" width="190" height="70" rx="10" class="box"/><text x="435" y="250" text-anchor="middle" class="name">MCAP queue</text><text x="435" y="272" text-anchor="middle" class="label">bounded references</text><rect x="340" y="352" width="190" height="70" rx="10" class="box"/><text x="435" y="380" text-anchor="middle" class="name">Other queues</text><text x="435" y="402" text-anchor="middle" class="label">bounded references</text><path d="M260 367 H300 V257 H340" class="flow"/><path d="M260 367 H300 V387 H340" class="flow"/><text x="600" y="92" class="tag">SINK WORKERS</text><rect x="600" y="222" width="230" height="70" rx="10" class="box"/><text x="715" y="250" text-anchor="middle" class="name">MCAP worker</text><text x="715" y="272" text-anchor="middle" class="label">many blocks, one message</text><rect x="600" y="352" width="230" height="70" rx="10" class="box"/><text x="715" y="380" text-anchor="middle" class="name">Sink worker</text><text x="715" y="402" text-anchor="middle" class="label">one block, one Batch</text><path d="M530 257 H600" class="flow"/><path d="M530 387 H600" class="flow"/><text x="900" y="92" class="tag">OUTPUTS</text><rect x="900" y="222" width="260" height="70" rx="10" class="dma"/><text x="1030" y="250" text-anchor="middle" class="name">McapWriter reservation</text><text x="1030" y="272" text-anchor="middle" class="label">protobuf in pinned memory</text><rect x="900" y="112" width="260" height="70" rx="10" class="dma"/><text x="1030" y="140" text-anchor="middle" class="name">.mcap</text><text x="1030" y="162" text-anchor="middle" class="label">io_uring · O_DIRECT</text><rect x="900" y="352" width="260" height="70" rx="10" class="box"/><text x="1030" y="380" text-anchor="middle" class="name">Live or OTel</text><text x="1030" y="402" text-anchor="middle" class="label">write(BatchView)</text><path d="M830 257 H900" class="flow"/><path d="M1030 222 V182" class="flow"/><path d="M830 387 H900" class="flow"/><path d="M715 422 V515 H260" class="recycle"/><text x="480" y="505" text-anchor="middle" class="label">last reader releases</text><path d="M65 480 H20 V247 H40" class="recycle"/></svg>
