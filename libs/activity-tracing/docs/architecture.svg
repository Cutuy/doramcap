<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930" role="img" aria-labelledby="title desc"><title id="title">Activity tracing — data flow and buffer lifetimes</title><desc id="desc">Events enter capture blocks, then block handles pass through a shared Crossbeam ready queue to a background encoder. The encoder produces pooled Protobuf batches. Independent bounded queues send leases to MCAP, live and OpenTelemetry workers. Separate lifecycle diagrams show capture blocks recycled after encoding and encoded buffers recycled after their last reader releases them.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#607a94"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#258a75"/></marker></defs><style>text{font-family:DejaVu Sans,sans-serif;fill:#19324d}.title{font-size:27px;font-weight:700}.name{font-size:18px;font-weight:700}.label{font-size:14px;fill:#526c84}.tag{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#526c84}.flow{fill:none;stroke:#607a94;stroke-width:2;marker-end:url(#arrow)}.recycle{fill:none;stroke:#258a75;stroke-width:2;marker-end:url(#green)}</style><rect width="1440" height="930" fill="#f8fafc"/><text x="40" y="48" class="title">Activity tracing</text><rect x="25" y="80" width="1390" height="165" rx="16" fill="#eaf5ef"/><text x="45" y="107" class="tag">APPLICATION THREADS</text><rect x="25" y="275" width="1390" height="390" rx="16" fill="#edf2f8"/><text x="45" y="303" class="tag">BACKGROUND WORKERS · EMBEDDED LIBRARY</text><rect x="60" y="140" width="190" height="70" rx="10" fill="#fff" stroke="#b9ccdb"/><text x="155.0" y="181.0" text-anchor="middle" class="name">tracing</text><rect x="360" y="140" width="220" height="70" rx="10" fill="#fff" stroke="#b9ccdb"/><text x="470.0" y="181.0" text-anchor="middle" class="name">Capture</text><rect x="700" y="140" width="240" height="70" rx="10" fill="#fff" stroke="#b9ccdb"/><text x="820.0" y="170" text-anchor="middle" class="name">Capture block</text><text x="820.0" y="193" text-anchor="middle" class="label">records + string bytes</text><rect x="1090" y="140" width="270" height="70" rx="10" fill="#fff" stroke="#b9ccdb"/><text x="1225.0" y="170" text-anchor="middle" class="name">Ready queue</text><text x="1225.0" y="193" text-anchor="middle" class="label">Crossbeam ArrayQueue</text><path d="M250 175 H360" class="flow"/><text x="305" y="161" text-anchor="middle" class="label">events</text><path d="M580 175 H700" class="flow"/><text x="640" y="161" text-anchor="middle" class="label">append</text><path d="M940 175 H1090" class="flow"/><text x="1015" y="161" text-anchor="middle" class="label">block handle</text><rect x="1090" y="335" width="270" height="70" rx="10" fill="#fff" stroke="#b9ccdb"/><text x="1225.0" y="365" text-anchor="middle" class="name">Encoder</text><text x="1225.0" y="388" text-anchor="middle" class="label">Protobuf</text><path d="M1225 210 V335" class="flow"/><text x="1260" y="270" text-anchor="middle" class="label">drain</text><rect x="590" y="335" width="280" height="70" rx="10" fill="#fff" stroke="#b9ccdb"/><text x="730.0" y="365" text-anchor="middle" class="name">Encoded batch</text><text x="730.0" y="388" text-anchor="middle" class="label">pooled bytes</text><path d="M1090 370 H870" class="flow"/><text x="980" y="356" text-anchor="middle" class="label">encode once</text><path d="M730 405 V445 H250 M730 445 H1210" fill="none" stroke="#607a94" stroke-width="2"/><path d="M250 445 V485" class="flow"/><rect x="120" y="485" width="260" height="55" rx="10" fill="#fff" stroke="#b9ccdb"/><text x="250.0" y="518.5" text-anchor="middle" class="name">MCAP queue</text><path d="M730 445 V485" class="flow"/><rect x="600" y="485" width="260" height="55" rx="10" fill="#fff" stroke="#b9ccdb"/><text x="730.0" y="518.5" text-anchor="middle" class="name">Live queue</text><path d="M1210 445 V485" class="flow"/><rect x="1080" y="485" width="260" height="55" rx="10" fill="#fff" stroke="#b9ccdb"/><text x="1210.0" y="518.5" text-anchor="middle" class="name">OTel queue</text><text x="470" y="433" text-anchor="middle" class="label">buffer leases · Crossbeam bounded</text><path d="M250 540 V585" class="flow"/><rect x="120" y="585" width="260" height="60" rx="10" fill="#fff" stroke="#b9ccdb"/><text x="250.0" y="621.0" text-anchor="middle" class="name">MCAP writer</text><path d="M730 540 V585" class="flow"/><rect x="600" y="585" width="260" height="60" rx="10" fill="#fff" stroke="#b9ccdb"/><text x="730.0" y="621.0" text-anchor="middle" class="name">Live transport</text><path d="M1210 540 V585" class="flow"/><rect x="1080" y="585" width="260" height="60" rx="10" fill="#fff" stroke="#b9ccdb"/><text x="1210.0" y="621.0" text-anchor="middle" class="name">OTel exporter</text><path d="M250 645 V700" class="flow"/><text x="295" y="684" text-anchor="middle" class="label">MCAP</text><rect x="150" y="700" width="200" height="45" rx="10" fill="#fff2d8" stroke="#b9ccdb"/><text x="250.0" y="728.5" text-anchor="middle" class="name">.mcap</text><path d="M730 645 V700" class="flow"/><text x="775" y="684" text-anchor="middle" class="label">frames</text><rect x="630" y="700" width="200" height="45" rx="10" fill="#fff2d8" stroke="#b9ccdb"/><text x="730.0" y="728.5" text-anchor="middle" class="name">Viewer</text><path d="M1210 645 V700" class="flow"/><text x="1255" y="684" text-anchor="middle" class="label">OTLP</text><rect x="1110" y="700" width="200" height="45" rx="10" fill="#fff2d8" stroke="#b9ccdb"/><text x="1210.0" y="728.5" text-anchor="middle" class="name">Collector</text><text x="40" y="790" class="tag">BUFFER LIFETIMES</text><rect x="45" y="815" width="150" height="45" rx="10" fill="#fff" stroke="#b9ccdb"/><text x="120.0" y="843.5" text-anchor="middle" class="name">Free block</text><rect x="245" y="815" width="150" height="45" rx="10" fill="#fff" stroke="#b9ccdb"/><text x="320.0" y="843.5" text-anchor="middle" class="name">Capture</text><rect x="445" y="815" width="150" height="45" rx="10" fill="#fff" stroke="#b9ccdb"/><text x="520.0" y="843.5" text-anchor="middle" class="name">Encode</text><rect x="790" y="815" width="150" height="45" rx="10" fill="#fff" stroke="#b9ccdb"/><text x="865.0" y="843.5" text-anchor="middle" class="name">Free buffer</text><rect x="990" y="815" width="150" height="45" rx="10" fill="#fff" stroke="#b9ccdb"/><text x="1065.0" y="843.5" text-anchor="middle" class="name">Encode</text><rect x="1190" y="815" width="190" height="45" rx="10" fill="#fff" stroke="#b9ccdb"/><text x="1285.0" y="843.5" text-anchor="middle" class="name">Readers</text><path d="M195 837 H245" class="flow"/><path d="M395 837 H445" class="flow"/><path d="M520 860 V897 H120 V860" class="recycle"/><text x="320" y="888" text-anchor="middle" class="label">recycle</text><path d="M940 837 H990" class="flow"/><path d="M1140 837 H1190" class="flow"/><path d="M1285 860 V897 H865 V860" class="recycle"/><text x="1075" y="888" text-anchor="middle" class="label">last lease released</text></svg>