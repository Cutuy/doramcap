<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc">
<title id="title">PR 128: activity sink worker waits before and after</title>
<desc id="desc">Before: empty MCAP workers repeatedly park for ten milliseconds, check their queue and poll the sink. Other sinks use a two millisecond park timeout. MCAP publication unparks at half queue capacity. After: workers select on work and shutdown channels, plus a flush deadline only while data is buffered. Each block can wake the worker. The MCAP merge interval is removed; the writer's hundred millisecond batch age remains.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#526176"/></marker>
<style>
text{font-family:Arial,sans-serif;fill:#172033;font-size:17px}.title{font-size:26px;font-weight:600}.heading{font-size:22px;font-weight:600}.label{font-size:18px;font-weight:600}.small{font-size:15px;fill:#526176}.line{stroke:#dbe1e9;stroke-width:1}.arrow{fill:none;stroke:#526176;stroke-width:2;marker-end:url(#arrow)}.before{fill:#fff1df;stroke:#bd7628}.after{fill:#e4f4ee;stroke:#36856a}.wake{fill:#bd7628}
</style>
</defs>
<rect width="1000" height="820" fill="#fff"/>
<text x="32" y="44" class="title">Activity sink worker waits · PR #128</text>
<text x="32" y="77" class="small">Capture threads publish blocks; each sink has its own worker.</text>
<text x="32" y="123" class="heading">Before · timed parking</text>
<text x="520" y="123" class="heading">After · channel + deadline waits</text>
<path d="M493 106 V788" class="line"/>
<text x="32" y="169" class="label">Empty MCAP sink</text>
<text x="520" y="169" class="label">Empty MCAP sink</text>
<rect x="40" y="193" width="395" height="26" rx="3" class="before"/>
<rect x="134" y="190" width="8" height="32" class="wake"/><rect x="232" y="190" width="8" height="32" class="wake"/><rect x="330" y="190" width="8" height="32" class="wake"/><rect x="428" y="190" width="8" height="32" class="wake"/>
<text x="36" y="245" class="small">0</text><text x="127" y="245" class="small">10</text><text x="225" y="245" class="small">20</text><text x="323" y="245" class="small">30</text><text x="414" y="245" class="small">40 ms</text>
<text x="32" y="279">Wake → inspect queue → poll → park again</text>
<text x="32" y="308" class="small">MCAP: 10 ms timeout · other sinks: 2 ms</text>
<rect x="528" y="193" width="395" height="26" rx="3" class="after"/>
<text x="536" y="245" class="small">Blocked continuously until work or stop</text>
<text x="520" y="279">select_biased!: work | stop | deadline</text>
<text x="520" y="308" class="small">Empty writer: no flush deadline is armed</text>
<path d="M32 332 H466 M520 332 H965" class="line"/>
<text x="32" y="369" class="label">A capture block arrives</text>
<text x="520" y="369" class="label">A capture block arrives</text>
<rect x="32" y="392" width="150" height="45" rx="5" class="before"/><text x="46" y="420">ArrayQueue push</text>
<path d="M182 414 H222" class="arrow"/>
<rect x="224" y="392" width="230" height="45" rx="5" class="before"/><text x="238" y="420">unpark at half-full queue</text>
<text x="32" y="467">Below threshold: await timeout or wake</text>
<text x="32" y="495" class="small">Worker drains queued blocks on waking</text>
<rect x="520" y="392" width="184" height="45" rx="5" class="after"/><text x="534" y="420">Bounded channel send</text>
<path d="M704 414 H746" class="arrow"/>
<rect x="748" y="392" width="210" height="45" rx="5" class="after"/><text x="762" y="420">Wake waiting worker</text>
<text x="520" y="467">Deliver + poll; merge blocks already queued</text>
<text x="520" y="495" class="small">No timed collection window</text>
<path d="M32 518 H466 M520 518 H965" class="line"/>
<text x="32" y="555" class="label">MCAP has buffered data</text>
<text x="520" y="555" class="label">MCAP has buffered data</text>
<text x="32" y="590">Repeated wakes call writer.poll(now)</text>
<text x="32" y="620">Age ≥ 100 ms → flush combined buffer</text>
<text x="32" y="649" class="small">Idle timeouts continue after the buffer empties</text>
<text x="520" y="590">Wait until work, stop, or next_flush_deadline()</text>
<text x="520" y="620">MAX_BATCH_AGE (100 ms) → flush_written()</text>
<text x="520" y="649" class="small">Flush drains writes; cleared deadline ends timer wakes</text>
<path d="M32 672 H466 M520 672 H965" class="line"/>
<text x="32" y="709" class="label">Shutdown</text>
<text x="520" y="709" class="label">Shutdown</text>
<text x="32" y="744">Stop capture → unpark worker</text>
<text x="32" y="774">Drain accepted blocks → finish sink</text>
<text x="520" y="744">Stop capture → disconnect stop channel</text>
<text x="520" y="774">Wake all workers → drain blocks → finish</text>
</svg>
