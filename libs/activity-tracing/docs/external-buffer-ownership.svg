<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">Proposed activity slab lifecycle</title>
<desc id="desc">A capture pool supplies records to the encoder. The encoder writes Protobuf batches into aligned slabs using reserved MCAP framing. Sealed slabs share ownership with payload readers and an io_uring MCAP writer. The writer retains its lease through I/O retirement. The last lease returns the slab to the pool. A layout strip shows MCAP headers, batches of records and outer padding. Zero payload copies after encoding is a design target; direct DMA needs target validation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526b80"/></marker><marker id="recycle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18836b"/></marker></defs>
<style>text{font-family:DejaVu Sans,sans-serif;fill:#18334b}.title{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.s{font-size:15px;fill:#48647b}.tag{font-size:13px;font-weight:700;letter-spacing:1.4px;fill:#48647b}.edge{fill:none;stroke:#526b80;stroke-width:2;marker-end:url(#arrow)}.return{fill:none;stroke:#18836b;stroke-width:2;marker-end:url(#recycle)}</style>
<rect width="1440" height="820" fill="#f7f9fc"/>
<text x="40" y="45" class="title" text-anchor="start">Activity recording · proposed slab lifecycle</text>
<text x="40" y="74" class="tag" text-anchor="start">DESIGN TARGET · ZERO PAYLOAD COPIES AFTER ENCODING</text>
<rect x="45" y="145" width="230" height="85" rx="10" fill="#fff" stroke="#c5d2dc"/>
<text x="160.0" y="179" class="h" text-anchor="middle">Capture pool</text>
<text x="160.0" y="204" class="s" text-anchor="middle">records + strings</text>
<rect x="385" y="145" width="230" height="85" rx="10" fill="#fff" stroke="#c5d2dc"/>
<text x="500.0" y="179" class="h" text-anchor="middle">Encoder</text>
<text x="500.0" y="204" class="s" text-anchor="middle">size → serialize</text>
<rect x="760" y="145" width="230" height="85" rx="10" fill="#e5f3ed" stroke="#c5d2dc"/>
<text x="875.0" y="179" class="h" text-anchor="middle">Aligned slab</text>
<text x="875.0" y="204" class="s" text-anchor="middle">exclusive → sealed</text>
<rect x="1130" y="145" width="260" height="85" rx="10" fill="#fff" stroke="#c5d2dc"/>
<text x="1260.0" y="179" class="h" text-anchor="middle">Payload readers</text>
<text x="1260.0" y="204" class="s" text-anchor="middle">Protobuf ranges</text>
<path d="M275 175 H385" class="edge"/>
<text x="330" y="161" class="s" text-anchor="middle">block</text>
<path d="M385 210 H275" class="return"/>
<text x="330" y="248" class="s" text-anchor="middle">recycle</text>
<path d="M615 187 H760" class="edge"/>
<text x="687" y="170" class="s" text-anchor="middle">encode in place</text>
<path d="M990 187 H1130" class="edge"/>
<text x="1060" y="170" class="s" text-anchor="middle">lease + ranges</text>
<rect x="385" y="345" width="230" height="85" rx="10" fill="#e5f3ed" stroke="#c5d2dc"/>
<text x="500.0" y="379" class="h" text-anchor="middle">Slab pool</text>
<text x="500.0" y="404" class="s" text-anchor="middle">reusable aligned memory</text>
<path d="M615 370 H680 V270 H800 V230" class="return"/>
<text x="725" y="292" class="s" text-anchor="middle">exclusive lease</text>
<rect x="760" y="345" width="230" height="85" rx="10" fill="#fff" stroke="#c5d2dc"/>
<text x="875.0" y="379" class="h" text-anchor="middle">McapSink</text>
<text x="875.0" y="404" class="s" text-anchor="middle">slab + owner</text>
<path d="M875 230 V345" class="edge"/>
<text x="932" y="294" class="s" text-anchor="middle">lease</text>
<rect x="1130" y="345" width="260" height="85" rx="10" fill="#fff" stroke="#c5d2dc"/>
<text x="1260.0" y="379" class="h" text-anchor="middle">McapWriter</text>
<text x="1260.0" y="404" class="s" text-anchor="middle">io_uring · O_DIRECT</text>
<path d="M990 387 H1130" class="edge"/>
<text x="1060" y="369" class="s" text-anchor="middle">same bytes</text>
<rect x="1130" y="500" width="260" height="70" rx="10" fill="#fff" stroke="#c5d2dc"/>
<text x="1260.0" y="542.0" class="h" text-anchor="middle">Device</text>
<path d="M1260 430 V500" class="edge"/>
<text x="1307" y="471" class="s" text-anchor="middle">DMA*</text>
<rect x="760" y="500" width="230" height="70" rx="10" fill="#fff" stroke="#c5d2dc"/>
<text x="875.0" y="542.0" class="h" text-anchor="middle">Last lease released</text>
<path d="M1130 417 H1040 V535 H990" class="return"/>
<text x="1050" y="478" class="s" text-anchor="middle">I/O retired</text>
<path d="M1390 187 H1410 V608 H875 V570" class="return"/>
<text x="1190" y="631" class="s" text-anchor="middle">readers done</text>
<path d="M760 535 H500 V430" class="return"/>
<text x="624" y="518" class="s" text-anchor="middle">recycle</text>
<text x="45" y="660" class="tag" text-anchor="start">SEALED SLAB · ALIGNED ADDRESS / LENGTH / FILE OFFSET</text>
<rect x="45" y="680" width="130" height="78" rx="10" fill="#ffecd0" stroke="#c5d2dc"/>
<text x="110.0" y="714" class="h" text-anchor="middle">Header</text>
<text x="110.0" y="739" class="s" text-anchor="middle">MCAP · 31 B</text>
<rect x="175" y="680" width="400" height="78" rx="10" fill="#e5f3ed" stroke="#c5d2dc"/>
<text x="375.0" y="714" class="h" text-anchor="middle">Protobuf Batch A</text>
<text x="375.0" y="739" class="s" text-anchor="middle">records 1 … N</text>
<rect x="575" y="680" width="130" height="78" rx="10" fill="#ffecd0" stroke="#c5d2dc"/>
<text x="640.0" y="714" class="h" text-anchor="middle">Header</text>
<text x="640.0" y="739" class="s" text-anchor="middle">MCAP · 31 B</text>
<rect x="705" y="680" width="400" height="78" rx="10" fill="#e5f3ed" stroke="#c5d2dc"/>
<text x="905.0" y="714" class="h" text-anchor="middle">Protobuf Batch B</text>
<text x="905.0" y="739" class="s" text-anchor="middle">records 1 … M</text>
<rect x="1105" y="680" width="290" height="78" rx="10" fill="#e9edf4" stroke="#c5d2dc"/>
<text x="1250.0" y="714" class="h" text-anchor="middle">Padding</text>
<text x="1250.0" y="739" class="s" text-anchor="middle">MCAP record</text>
<text x="45" y="795" class="s" text-anchor="start">* Direct DMA requires target validation. Headers and padding are written in reserved slab space.</text>
</svg>
