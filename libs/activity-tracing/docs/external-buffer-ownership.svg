<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">Activity recording buffer ownership</title>
<desc id="desc">App threads fill capture blocks and publish one reference to each sink queue. The MCAP worker merges blocks and serializes them into a reservation in the pinned buffer of McapWriter, which writes those bytes with direct I/O. Other sink workers serialize one Batch per block into their own buffer. The last sink returns a block to the capture pool, and retired I/O returns the pinned buffer.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526b80"/></marker><marker id="recycle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18836b"/></marker></defs>
<style>text{font-family:DejaVu Sans,sans-serif;fill:#18334b}.title{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.s{font-size:15px;fill:#48647b}.tag{font-size:13px;font-weight:700;letter-spacing:1.4px;fill:#48647b}.edge{fill:none;stroke:#526b80;stroke-width:2;marker-end:url(#arrow)}.return{fill:none;stroke:#18836b;stroke-width:2;marker-end:url(#recycle)}</style>
<rect width="1440" height="820" fill="#f7f9fc"/>
<text x="40" y="45" class="title" text-anchor="start">Activity recording · buffer ownership</text>
<text x="40" y="74" class="tag" text-anchor="start">ONE SERIALIZATION PER SINK · ZERO PAYLOAD COPIES AFTER MCAP ENCODING</text>
<rect x="45" y="145" width="230" height="85" rx="10" fill="#fff" stroke="#c5d2dc"/>
<text x="160.0" y="179" class="h" text-anchor="middle">Capture pool</text>
<text x="160.0" y="204" class="s" text-anchor="middle">records + strings</text>
<rect x="385" y="145" width="230" height="85" rx="10" fill="#fff" stroke="#c5d2dc"/>
<text x="500.0" y="179" class="h" text-anchor="middle">Sink queues</text>
<text x="500.0" y="204" class="s" text-anchor="middle">one reference per sink</text>
<rect x="760" y="145" width="230" height="85" rx="10" fill="#fff" stroke="#c5d2dc"/>
<text x="875.0" y="179" class="h" text-anchor="middle">MCAP worker</text>
<text x="875.0" y="204" class="s" text-anchor="middle">merge · measure · serialize</text>
<rect x="1130" y="145" width="260" height="85" rx="10" fill="#e5f3ed" stroke="#c5d2dc"/>
<text x="1260.0" y="179" class="h" text-anchor="middle">Pinned buffer</text>
<text x="1260.0" y="204" class="s" text-anchor="middle">McapWriter reservation</text>
<path d="M275 175 H385" class="edge"/>
<text x="330" y="161" class="s" text-anchor="middle">block</text>
<path d="M385 210 H275" class="return"/>
<text x="330" y="248" class="s" text-anchor="middle">last sink releases</text>
<path d="M615 187 H760" class="edge"/>
<text x="687" y="170" class="s" text-anchor="middle">blocks</text>
<path d="M990 187 H1130" class="edge"/>
<text x="1060" y="170" class="s" text-anchor="middle">encode in place</text>
<rect x="1130" y="335" width="260" height="85" rx="10" fill="#e5f3ed" stroke="#c5d2dc"/>
<text x="1260.0" y="369" class="h" text-anchor="middle">McapWriter</text>
<text x="1260.0" y="394" class="s" text-anchor="middle">io_uring · O_DIRECT</text>
<rect x="760" y="335" width="230" height="85" rx="10" fill="#fff" stroke="#c5d2dc"/>
<text x="875.0" y="369" class="h" text-anchor="middle">Device</text>
<text x="875.0" y="394" class="s" text-anchor="middle">.mcap</text>
<path d="M1225 230 V335" class="edge"/>
<text x="1215" y="288" class="s" text-anchor="end">same bytes</text>
<path d="M1295 335 V230" class="return"/>
<text x="1305" y="288" class="s" text-anchor="start">I/O retired</text>
<path d="M1130 377 H990" class="edge"/>
<text x="1060" y="360" class="s" text-anchor="middle">DMA</text>
<rect x="760" y="510" width="230" height="85" rx="10" fill="#fff" stroke="#c5d2dc"/>
<text x="875.0" y="544" class="h" text-anchor="middle">Other sink workers</text>
<text x="875.0" y="569" class="s" text-anchor="middle">one Batch per block</text>
<rect x="1130" y="510" width="260" height="85" rx="10" fill="#fff" stroke="#c5d2dc"/>
<text x="1260.0" y="544" class="h" text-anchor="middle">Worker buffer</text>
<text x="1260.0" y="569" class="s" text-anchor="middle">write(BatchView)</text>
<path d="M500 230 V552 H760" class="edge"/>
<text x="630" y="535" class="s" text-anchor="middle">blocks</text>
<path d="M990 552 H1130" class="edge"/>
<text x="1060" y="535" class="s" text-anchor="middle">serialize</text>
<text x="40" y="650" class="tag" text-anchor="start">PINNED BUFFER · ALIGNED ADDRESS / LENGTH / FILE OFFSET</text>
<rect x="40" y="670" width="150" height="85" rx="10" fill="#fff" stroke="#c5d2dc"/>
<text x="115.0" y="704" class="h" text-anchor="middle">Header</text>
<text x="115.0" y="729" class="s" text-anchor="middle">MCAP · 31 B</text>
<rect x="195" y="670" width="420" height="85" rx="10" fill="#e5f3ed" stroke="#c5d2dc"/>
<text x="405.0" y="704" class="h" text-anchor="middle">Protobuf message A</text>
<text x="405.0" y="729" class="s" text-anchor="middle">merged blocks 1 … N</text>
<rect x="620" y="670" width="150" height="85" rx="10" fill="#fff" stroke="#c5d2dc"/>
<text x="695.0" y="704" class="h" text-anchor="middle">Header</text>
<text x="695.0" y="729" class="s" text-anchor="middle">MCAP · 31 B</text>
<rect x="775" y="670" width="420" height="85" rx="10" fill="#e5f3ed" stroke="#c5d2dc"/>
<text x="985.0" y="704" class="h" text-anchor="middle">Protobuf message B</text>
<text x="985.0" y="729" class="s" text-anchor="middle">merged blocks 1 … M</text>
<rect x="1200" y="670" width="220" height="85" rx="10" fill="#fff" stroke="#c5d2dc"/>
<text x="1310.0" y="704" class="h" text-anchor="middle">Padding</text>
<text x="1310.0" y="729" class="s" text-anchor="middle">MCAP record</text>
</svg>
