[package]
name = "cuda-dora-shm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Fixed-slot CUDA host-memory IPC adapter for Dora"

[dependencies]
cuda-host-memory = { path = "../cuda-host-memory" }
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "runtime", "dynamic-loading", "cuda-12090"] }
dora-node-api = { version = "=1.1.0", default-features = false }
memmap2 = "0.9"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
eyre = "0.6"

[lints]
workspace = true
