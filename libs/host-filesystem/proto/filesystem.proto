syntax = "proto3";
package doramcap.filesystem.v1;

// Available stat metadata. Modification detection does not prove content equality.
message FileMetadata {
  // Unix file type and permission bits.
  uint32 mode = 1;
  // Byte length reported by stat.
  uint64 size = 2;
  // Owning user identifier.
  uint32 uid = 3;
  // Owning group identifier.
  uint32 gid = 4;
  // Modification time, split into seconds and nanoseconds.
  sint64 mtime_seconds = 5;
  sint64 mtime_nanoseconds = 6;
  // Change time, split into seconds and nanoseconds.
  sint64 ctime_seconds = 7;
  sint64 ctime_nanoseconds = 8;
  // Symlink destination as Unix bytes; never followed during traversal.
  optional bytes symlink = 9;
}

// Storage category is retained on every record and in separate artifact files.
enum StorageCategory {
  STORAGE_CATEGORY_UNSPECIFIED = 0;
  // A host file or directory bind-mounted into a workload.
  // The source identifies the host path; change paths are relative to it.
  STORAGE_CATEGORY_HOST_BIND = 1;
  // A Docker container's writable filesystem layer above its image.
  // The source identifies the container; change paths are container-absolute.
  // Bind mounts and volumes have their own categories.
  STORAGE_CATEGORY_CONTAINER_LAYER = 2;
  // A Docker-managed persistent volume mounted by name.
  // The source identifies the volume; change paths are relative to its root.
  STORAGE_CATEGORY_NAMED_VOLUME = 3;
}
// An individual path transition, retained separately as added, modified or deleted.
enum ChangeKind {
  CHANGE_KIND_UNSPECIFIED = 0;
  CHANGE_KIND_ADDED = 1;
  CHANGE_KIND_MODIFIED = 2;
  CHANGE_KIND_DELETED = 3;
}
// One change with its original category, source and consumers.
message FileChange {
  StorageCategory category = 1;
  // Host source path, volume name or container ID.
  string source = 2;
  // Project/service/container-target associations; shared sources appear once.
  repeated string consumers = 3;
  // Unix bytes: source-relative, or container-absolute for Engine diffs.
  bytes path = 4;
  ChangeKind kind = 5;
  // Unavailable for Engine changes and for absent sides of a transition.
  FileMetadata before = 6;
  // Unavailable for Engine changes and for absent sides of a transition.
  FileMetadata after = 7;
}
enum ActionKind {
  ACTION_KIND_UNSPECIFIED = 0;
  ACTION_KIND_REMOVE = 1;
  ACTION_KIND_TRANSFER = 2;
}
message FileAction { ActionKind kind = 1; bytes path = 2; }

enum SourceKind {
  SOURCE_KIND_UNSPECIFIED = 0;
  SOURCE_KIND_OVERLAY = 1;
  SOURCE_KIND_RUN_OUTPUT = 2;
  SOURCE_KIND_HOST_SHARED_MEMORY = 3;
  SOURCE_KIND_UNTRACKED = 4;
}

// A backend-resolved directory mount, with native access preserved by the backend.
message DirectoryMount {
  string consumer = 1;
  string source = 2;
  string target = 3;
  bool read_only = 4;
}
// A backend-declared source whose writes cannot be listed.
message MetadataSource {
  StorageCategory category = 1;
  string identity = 2;
  reserved 3; // Former metadata path; sources are no longer inventoried.
  string consumer = 4;
  bool read_only = 5;
  // Reason the backend cannot track this source.
  string reason = 6;
}

// Counts describe metadata transitions. All references are relative to one run.
message ChangeCounts { uint64 added = 1; uint64 modified = 2; uint64 deleted = 3; }
message CategorySummary {
  StorageCategory category = 1;
  ChangeCounts counts = 2;
  bool coverage_complete = 3;
  string manifest = 4;
  uint64 coverage_note_count = 5;
}
message CategoryReport { CategorySummary summary = 1; repeated string coverage_notes = 2; }
// Checkpoint-unknown asks the consumer to inspect the published capture checkpoint.
enum ReportState { REPORT_STATE_UNAVAILABLE = 0; REPORT_STATE_COMPLETE = 1; REPORT_STATE_FAILED = 2; REPORT_STATE_CHECKPOINT_UNKNOWN = 3; }
// Published only after all manifests and their directory have been synced.
message FileChangeReport { repeated CategoryReport categories = 1; ReportState state = 2; }
// Small completion fact; full source notes and change lists stay on disk.
message FileChangeReference { string checkpoint = 1; repeated CategorySummary categories = 2; }
