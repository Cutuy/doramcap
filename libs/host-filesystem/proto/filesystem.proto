syntax = "proto3";
package doramcap.filesystem.v1;

message FileMetadata {
  uint32 mode = 1;
  uint64 size = 2;
  uint32 uid = 3;
  uint32 gid = 4;
  sint64 mtime_seconds = 5;
  sint64 mtime_nanoseconds = 6;
  sint64 ctime_seconds = 7;
  sint64 ctime_nanoseconds = 8;
  optional bytes symlink = 9;
}
enum StorageCategory { STORAGE_CATEGORY_UNSPECIFIED = 0; HOST_BIND = 1; CONTAINER_LAYER = 2; NAMED_VOLUME = 3; }
enum ChangeKind { CHANGE_KIND_UNSPECIFIED = 0; ADDED = 1; MODIFIED = 2; DELETED = 3; }
message FileChange {
  StorageCategory category = 1;
  string source = 2;
  repeated string consumers = 3;
  bytes path = 4;
  ChangeKind kind = 5;
  FileMetadata before = 6;
  FileMetadata after = 7;
}
enum ActionKind { ACTION_KIND_UNSPECIFIED = 0; REMOVE = 1; TRANSFER = 2; }
message FileAction { ActionKind kind = 1; bytes path = 2; }

// How a host source participates in filesystem recording; access flags remain separate.
enum SourceKind {
  SOURCE_KIND_UNSPECIFIED = 0;
  OVERLAY = 1;
  RUN_OUTPUT = 2;
  HOST_SHARED_MEMORY = 3;
  UNTRACKED = 4;
}

// A backend-resolved directory mount, with native access preserved by the backend.
message DirectoryMount {
  string consumer = 1;
  string source = 2;
  string target = 3;
  bool read_only = 4;
}
// A backend-declared source whose writes cannot be listed.
message MetadataSource {
  StorageCategory category = 1;
  string identity = 2;
  reserved 3; // Former resolved metadata path; sources are no longer walked.
  string consumer = 4;
  bool read_only = 5;
  // Reason the backend cannot track this source.
  string reason = 6;
}
// Counts describe metadata transitions. All references are relative to one run.
message ChangeCounts { uint64 added = 1; uint64 modified = 2; uint64 deleted = 3; }
message CategorySummary {
  StorageCategory category = 1;
  ChangeCounts counts = 2;
  bool coverage_complete = 3;
  string manifest = 4;
  uint64 coverage_note_count = 5;
}
message CategoryReport { CategorySummary summary = 1; repeated string coverage_notes = 2; }
// Published only after all manifests and their directory have been synced.
enum ReportState { REPORT_UNAVAILABLE = 0; REPORT_COMPLETE = 1; REPORT_FAILED = 2; }
message FileChangeReport { repeated CategoryReport categories = 1; ReportState state = 2; }
// Small completion fact; full source notes and change lists stay on disk.
message FileChangeReference { string checkpoint = 1; repeated CategorySummary categories = 2; }
