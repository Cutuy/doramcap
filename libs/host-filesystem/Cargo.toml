[package]
name = "host-filesystem"
description = "Native Linux filesystem views and metadata capture"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libc = "0.2"
hex = "0.4"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
