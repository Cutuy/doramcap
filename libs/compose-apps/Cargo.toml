[package]
name = "compose-apps"
description = "Compose project steps, Dora runtime and shared app preparation"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dora-control = { path = "../dora-control" }
docker-engine = { path = "../docker-engine" }
host-filesystem = { path = "../host-filesystem" }
dora-app = { path = "../dora-app", default-features = false }
workload-lifecycle = { path = "../workload-lifecycle" }
orchestrator = { path = "../orchestrator" }
prost = "0.14"
prost-reflect = { version = "0.16", features = ["text-format"] }
dora-core.workspace = true
bollard = { version = "=0.21.1", default-features = false, features = ["http", "pipe"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
thiserror = "2"
humantime = "2"
futures-util = "0.3"
libc = "0.2"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "signal", "sync", "time"] }
zbus = { version = "6", default-features = false, features = ["tokio"] }
zbus_systemd = { version = "0.26201", features = ["systemd1"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[lints]
workspace = true
