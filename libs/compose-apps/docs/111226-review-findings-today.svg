<svg xmlns="http://www.w3.org/2000/svg" width="960" height="270" viewBox="0 0 960 270" role="img" aria-labelledby="title">
  <title id="title">Review messages today</title>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
    <style>
      text { font-family: sans-serif; fill: #172554; text-anchor: middle; }
      .label { font-size: 17px; }
      .small { font-size: 13px; fill: #475569; }
      .box { fill: white; stroke: #94a3b8; stroke-width: 1.5; rx: 10; }
      .flow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="960" height="270" rx="14" fill="#f8fafc"/>
  <rect class="box" x="20" y="105" width="150" height="60"/><text class="label" x="95" y="140">Resolution</text>
  <rect class="box" x="260" y="20" width="250" height="64"/><text class="label" x="385" y="48">Plan warnings</text><text class="small" x="385" y="70">project logging text</text>
  <rect class="box" x="260" y="103" width="250" height="64"/><text class="label" x="385" y="131">Plan diagnostics</text><text class="small" x="385" y="153">other notes as text</text>
  <rect class="box" x="260" y="186" width="250" height="64"/><text class="label" x="385" y="214">Invalid(String)</text><text class="small" x="385" y="236">rejections</text>
  <rect class="box" x="620" y="20" width="320" height="64"/><text class="label" x="780" y="57">Shown at Review</text>
  <rect class="box" x="620" y="103" width="320" height="64"/><text class="label" x="780" y="140">Not shown</text>
  <rect class="box" x="620" y="186" width="320" height="64"/><text class="label" x="780" y="223">InvalidInput + raw text</text>
  <path class="flow" d="M170 125L252 60"/>
  <path class="flow" d="M170 135H252"/>
  <path class="flow" d="M170 145L252 210"/>
  <path class="flow" d="M510 52H612"/>
  <path class="flow" d="M510 135H612"/>
  <path class="flow" d="M510 218H612"/>
</svg>
