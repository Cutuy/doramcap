<svg xmlns="http://www.w3.org/2000/svg" width="960" height="210" viewBox="0 0 960 210" role="img" aria-labelledby="title">
  <title id="title">Review messages today</title>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
    <style>
      text { font-family: sans-serif; fill: #172554; text-anchor: middle; }
      .label { font-size: 17px; }
      .edge { font-size: 13px; fill: #475569; }
      .box { fill: white; stroke: #94a3b8; stroke-width: 1.5; rx: 10; }
      .flow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="960" height="210" rx="14" fill="#f8fafc"/>
  <rect class="box" x="20" y="77" width="170" height="56"/><text class="label" x="105" y="111">Resolution</text>
  <rect class="box" x="330" y="25" width="260" height="56"/><text class="label" x="460" y="59">Text in plan diagnostics</text>
  <rect class="box" x="330" y="129" width="260" height="56"/><text class="label" x="460" y="163">Invalid(String) error</text>
  <rect class="box" x="700" y="25" width="240" height="56"/><text class="label" x="820" y="59">Not shown at Review</text>
  <rect class="box" x="700" y="129" width="240" height="56"/><text class="label" x="820" y="163">InvalidInput + raw text</text>
  <path class="flow" d="M190 95L322 57"/><text class="edge" x="236" y="62">warnings</text>
  <path class="flow" d="M190 115L322 153"/><text class="edge" x="236" y="156">rejections</text>
  <path class="flow" d="M590 53H692"/><text class="edge" x="645" y="44">never read</text>
  <path class="flow" d="M590 157H692"/><text class="edge" x="645" y="148">browser</text>
</svg>
