<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" role="img" font-family="system-ui,sans-serif" font-size="13">
  <title>Apps report health to the watchdog; the live bridge proxies app data and watchdog publications to Console</title>
  <rect width="1040" height="440" fill="#fff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l8 4-8 4" fill="none" stroke="#596b64" stroke-width="1.5"/></marker></defs>
  <rect x="20" y="20" width="660" height="320" rx="6" fill="#f0f3f0" stroke="#dde2df"/>
  <text x="38" y="45" font-weight="600" fill="#202a2e">System apps</text>
  <rect x="40" y="70" width="180" height="76" rx="5" fill="#fff" stroke="#dde2df"/>
  <text x="130" y="101" text-anchor="middle" fill="#202a2e">CPU monitor</text>
  <text x="130" y="125" text-anchor="middle" fill="#202a2e">Data recorder</text>
  <rect x="40" y="250" width="180" height="64" rx="5" fill="#fff" stroke="#dde2df"/>
  <text x="130" y="276" text-anchor="middle" fill="#202a2e">Dora coordinator</text>
  <text x="130" y="298" text-anchor="middle" fill="#202a2e">Dora daemon</text>
  <rect x="370" y="78" width="200" height="64" rx="6" fill="#e8f2ee" stroke="#bcd8cc"/>
  <text x="470" y="104" text-anchor="middle" fill="#202a2e" font-weight="600">Fault watchdog</text>
  <text x="470" y="126" text-anchor="middle" fill="#596b64" font-size="12">app health</text>
  <rect x="370" y="230" width="200" height="64" rx="6" fill="#e8f2ee" stroke="#bcd8cc"/>
  <text x="470" y="256" text-anchor="middle" fill="#202a2e" font-weight="600">Live bridge</text>
  <text x="470" y="278" text-anchor="middle" fill="#596b64" font-size="12">opaque frames</text>
  <line x1="220" y1="110" x2="366" y2="110" stroke="#596b64" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="293" y="100" text-anchor="middle" fill="#596b64" font-size="12">health</text>
  <path d="M130 146 V207 H310 V262 H366" fill="none" stroke="#596b64" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="230" y="197" text-anchor="middle" fill="#596b64" font-size="12">live data</text>
  <line x1="420" y1="142" x2="420" y2="226" stroke="#596b64" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="408" y="179" text-anchor="end" fill="#596b64" font-size="12">faults</text>
  <line x1="520" y1="230" x2="520" y2="146" stroke="#596b64" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="532" y="195" fill="#596b64" font-size="12">bridge health</text>
  <rect x="750" y="20" width="270" height="320" rx="6" fill="#f0f3f0" stroke="#dde2df"/>
  <text x="768" y="45" font-weight="600" fill="#202a2e">Console</text>
  <rect x="775" y="70" width="220" height="64" rx="5" fill="#fff" stroke="#dde2df"/>
  <text x="885" y="96" text-anchor="middle" fill="#202a2e">Live health panel</text>
  <text x="885" y="118" text-anchor="middle" fill="#596b64" font-size="12">one row per app</text>
  <rect x="775" y="230" width="140" height="64" rx="5" fill="#fff" stroke="#dde2df"/>
  <text x="845" y="268" text-anchor="middle" fill="#202a2e">Server</text>
  <line x1="570" y1="262" x2="771" y2="262" stroke="#596b64" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="671" y="252" text-anchor="middle" fill="#596b64" font-size="12">WebSocket frames</text>
  <line x1="845" y1="230" x2="845" y2="138" stroke="#596b64" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="832" y="183" text-anchor="end" fill="#596b64" font-size="12">live frames</text>
  <rect x="785" y="370" width="200" height="50" rx="5" fill="#fff" stroke="#dde2df"/>
  <text x="885" y="392" text-anchor="middle" fill="#202a2e">Run state</text>
  <text x="885" y="410" text-anchor="middle" fill="#596b64" font-size="12">starts · exits</text>
  <path d="M985 395 H1007 V102 H999" fill="none" stroke="#596b64" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="370" y="370" width="200" height="50" rx="6" fill="#fff" stroke="#dde2df"/>
  <text x="470" y="392" text-anchor="middle" fill="#202a2e" font-weight="600">Docker events</text>
  <text x="470" y="410" text-anchor="middle" fill="#596b64" font-size="12">start · die + exit code</text>
  <line x1="570" y1="395" x2="781" y2="395" stroke="#596b64" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M130 340 V395 H366" fill="none" stroke="#596b64" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="244" y="385" text-anchor="middle" fill="#596b64" font-size="12">containers</text>
</svg>
