<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" font-family="system-ui,sans-serif" font-size="13">
  <title>Apps report health to the fault watchdog, Dora runtime health comes from the coordinator link, and Console learns exits from Docker events</title>
  <rect width="760" height="370" fill="#fff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l8 4-8 4" fill="none" stroke="#596b64" stroke-width="1.5"/></marker></defs>
  <rect x="20" y="20" width="190" height="250" rx="6" fill="#f0f3f0" stroke="#dde2df"/>
  <text x="36" y="44" font-weight="600" fill="#202a2e">System apps</text>
  <rect x="36" y="56" width="158" height="34" rx="5" fill="#fff" stroke="#dde2df"/>
  <text x="115" y="78" text-anchor="middle" fill="#202a2e">cpu-monitor</text>
  <rect x="36" y="98" width="158" height="34" rx="5" fill="#fff" stroke="#dde2df"/>
  <text x="115" y="120" text-anchor="middle" fill="#202a2e">data-recorder</text>
  <rect x="36" y="140" width="158" height="34" rx="5" fill="#fff" stroke="#dde2df"/>
  <text x="115" y="162" text-anchor="middle" fill="#202a2e">live-bridge</text>
  <rect x="36" y="196" width="158" height="54" rx="5" fill="#fff" stroke="#dde2df"/>
  <text x="115" y="218" text-anchor="middle" fill="#202a2e">Dora coordinator</text>
  <text x="115" y="238" text-anchor="middle" fill="#202a2e">Dora daemon</text>
  <rect x="290" y="83" width="170" height="64" rx="6" fill="#e8f2ee" stroke="#bcd8cc"/>
  <text x="375" y="109" text-anchor="middle" fill="#202a2e" font-weight="600">Fault watchdog</text>
  <text x="375" y="129" text-anchor="middle" fill="#596b64" font-size="12">judges app health</text>
  <line x1="194" y1="115" x2="286" y2="115" stroke="#596b64" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="240" y="105" text-anchor="middle" fill="#596b64" font-size="12">health</text>
  <rect x="290" y="190" width="170" height="64" rx="6" fill="#e8f2ee" stroke="#bcd8cc"/>
  <text x="375" y="216" text-anchor="middle" fill="#202a2e" font-weight="600">Coordinator link</text>
  <text x="375" y="236" text-anchor="middle" fill="#596b64" font-size="12">Console WebSocket</text>
  <line x1="194" y1="222" x2="286" y2="222" stroke="#596b64" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="540" y="20" width="200" height="250" rx="6" fill="#f0f3f0" stroke="#dde2df"/>
  <text x="556" y="44" font-weight="600" fill="#202a2e">Console</text>
  <rect x="556" y="83" width="168" height="64" rx="5" fill="#fff" stroke="#dde2df"/>
  <text x="640" y="109" text-anchor="middle" fill="#202a2e">Live health panel</text>
  <text x="640" y="129" text-anchor="middle" fill="#596b64" font-size="12">one row per app</text>
  <rect x="556" y="196" width="168" height="54" rx="5" fill="#fff" stroke="#dde2df"/>
  <text x="640" y="219" text-anchor="middle" fill="#202a2e">Run state</text>
  <text x="640" y="238" text-anchor="middle" fill="#596b64" font-size="12">starts · exits</text>
  <line x1="460" y1="115" x2="552" y2="115" stroke="#596b64" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="506" y="105" text-anchor="middle" fill="#596b64" font-size="12">via bridge</text>
  <path d="M460 222 H500 V140 H552" fill="none" stroke="#596b64" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="290" y="296" width="170" height="54" rx="6" fill="#fff" stroke="#dde2df"/>
  <text x="375" y="319" text-anchor="middle" fill="#202a2e" font-weight="600">Docker events</text>
  <text x="375" y="338" text-anchor="middle" fill="#596b64" font-size="12">start · die + exit code</text>
  <path d="M460 323 H640 V254" fill="none" stroke="#596b64" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M115 270 V323 H286" fill="none" stroke="#596b64" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="200" y="314" text-anchor="middle" fill="#596b64" font-size="12">containers</text>
</svg>
