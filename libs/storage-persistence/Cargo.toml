[package]
name = "storage-persistence"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
diagnostics = []
activity-tracing = ["dep:tracing"]

[dependencies]
tracing = { version = "0.1", optional = true }
memmap2 = "0.9"
bytes = "1.12"
io-uring = "0.7.15"
libc = "0.2"

[dev-dependencies]
activity-tracing = { path = "../activity-tracing" }
zenoh = { version = "=1.10.1", default-features = false, features = ["shared-memory", "unstable"] }
mcap = { version = "=0.25.0", default-features = false }
prost = "0.14"

[lints]
workspace = true
