[package]
name = "storage-persistence"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
diagnostics = []
activity-tracing = ["dep:tracing"]

[dependencies]
crossbeam-channel = "0.5"
tracing = { version = "0.1", optional = true }
memmap2 = "0.9"
bytes = "1.12"
io-uring = "0.7.15"
libc = "0.2"

[dev-dependencies]
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "runtime", "nvrtc", "dynamic-loading", "cuda-12090"] }
activity-tracing = { path = "../activity-tracing" }
zenoh = { version = "=1.10.1", default-features = false, features = ["shared-memory", "unstable"] }
mcap = { version = "=0.26.0", default-features = false }
prost = "0.14"
telemetry-protocol = { path = "../telemetry/protocol" }
fault-protocol = { path = "../fault/protocol" }

[lints]
workspace = true
