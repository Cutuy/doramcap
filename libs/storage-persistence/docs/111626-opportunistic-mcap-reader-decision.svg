<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="456" viewBox="0 0 1200 456" role="img" aria-labelledby="title desc">
<title id="title">R1 agreed: official sequential reader</title><desc id="desc">Option A uses the official sequential reader for mixed chunks. Option B requires indexed seeking and therefore complete message indexes or upstream reader work.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs><style>text{font-family:'DejaVu Sans',Arial,sans-serif;fill:#172337}.title{font-size:28px;font-weight:700}.section{font-size:20px;font-weight:700}.label{font-size:16px;font-weight:700}.small{font-size:14px}.muted{fill:#526176}.white{fill:#fff}</style>
<rect width="1200" height="456" fill="#f2f5fa"/>
<text x="32" y="49" class="title" text-anchor="start">R1 · Official sequential reader agreed</text>
<text x="32" y="79" class="small muted" text-anchor="start">Input: a file containing chunks with and without Message Index records</text>
<rect x="32" y="105" width="550" height="318" rx="12" fill="#fff" stroke="#bfdccf"/>
<rect x="50" y="123" width="514" height="43" rx="6" fill="#e6f3ec" stroke="#dbe3ed"/>
<text x="67" y="151" class="section" text-anchor="start">A · Sequential reader · Agreed</text>
<text x="56" y="203" class="label" text-anchor="start">@mcap/core · McapStreamReader</text>
<text x="56" y="236" class="small" text-anchor="start">Reads every chunk in file order</text>
<text x="56" y="265" class="small" text-anchor="start">Time/topic filtering scans records</text>
<text x="56" y="294" class="small" text-anchor="start">Retains the padding-only index policy</text>
<text x="56" y="360" class="label" text-anchor="start">Existing official reader; no reader fork</text>
<rect x="618" y="105" width="550" height="318" rx="12" fill="#fff" stroke="#dbe3ed"/>
<rect x="636" y="123" width="514" height="43" rx="6" fill="#edf1f6" stroke="#dbe3ed"/>
<text x="653" y="151" class="section" text-anchor="start">B · Require indexed seeking</text>
<text x="642" y="203" class="label" text-anchor="start">@mcap/core · McapIndexedReader</text>
<text x="642" y="236" class="small" text-anchor="start">2.4.0 rejects missing message indexes</text>
<text x="642" y="265" class="small" text-anchor="start">Needs full indexes in every populated chunk</text>
<text x="642" y="294" class="small" text-anchor="start">or upstream reader fallback support</text>
<text x="642" y="360" class="label" text-anchor="start">Changes policy or adds reader work</text>
</svg>
