<rect x="32" y="659" width="1216" height="157" rx="9" fill="#fff" stroke="#dbe3ed"/>
<text x="52" y="697" class="section" text-anchor="start">File tail at finish / rotation</text>
<rect x="52" y="718" width="144" height="64" rx="6" fill="#edf1f6" stroke="#dbe3ed"/>
<text x="124.0" y="756" class="label" text-anchor="middle">DataEnd</text>
<rect x="210" y="718" width="285" height="64" rx="6" fill="#f0eafa" stroke="#dbe3ed"/>
<text x="352.5" y="756" class="label" text-anchor="middle">Schemas + Channels</text>
<rect x="509" y="718" width="420" height="64" rx="6" fill="#d5f0e6" stroke="#dbe3ed"/>
<text x="719.0" y="756" class="label" text-anchor="middle">Chunk Index for every chunk</text>
<rect x="943" y="718" width="285" height="64" rx="6" fill="#edf1f6" stroke="#dbe3ed"/>
