<rect x="32" y="842" width="1216" height="155" rx="9" fill="#fff" stroke="#dbe3ed"/>
<text x="52" y="880" class="section" text-anchor="start">Official readers</text>
<rect x="52" y="901" width="570" height="65" rx="6" fill="#e6f3ec" stroke="#c2dfce"/>
<text x="337" y="927" class="label" text-anchor="middle">McapStreamReader</text>
