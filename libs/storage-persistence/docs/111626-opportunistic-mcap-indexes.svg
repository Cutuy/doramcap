<text x="985" y="526" class="label" text-anchor="middle">0x80 padding</text>
<line x1="195" y1="566" x2="755" y2="566" stroke="#64748b" stroke-width="1.6"/>
<line x1="195" y1="560" x2="195" y2="572" stroke="#64748b" stroke-width="1.6"/>
<line x1="755" y1="560" x2="755" y2="572" stroke="#64748b" stroke-width="1.6"/>
<text x="475" y="589" class="small muted" text-anchor="middle">Chunk record</text>
