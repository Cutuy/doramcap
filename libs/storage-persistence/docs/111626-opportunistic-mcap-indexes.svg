<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1030" viewBox="0 0 1280 1030" role="img" aria-labelledby="title desc">
<title id="title">MCAP indexes from alignment padding</title><desc id="desc">Proposed three-path architecture. Complete message indexes replace trailing padding only when they fit. Every chunk has a summary entry. Sequential readers traverse all chunks.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs><style>text{font-family:'DejaVu Sans',Arial,sans-serif;fill:#172337}.title{font-size:28px;font-weight:700}.section{font-size:20px;font-weight:700}.label{font-size:16px;font-weight:700}.small{font-size:14px}.muted{fill:#526176}.white{fill:#fff}</style>
<rect width="1280" height="1030" fill="#f2f5fa"/>
<text x="32" y="49" class="title" text-anchor="start">MCAP indexes from alignment padding</text>
<text x="32" y="79" class="small muted" text-anchor="start">Proposed layout · write-combine, large-message DMA and slab</text>
<rect x="32" y="104" width="396" height="150" rx="9" fill="#fff" stroke="#dbe3ed"/>
<text x="50" y="136" class="section" text-anchor="start">Per-message write-combine</text>
<text x="50" y="164" class="small muted" text-anchor="start">reserve → flush_combining</text>
<rect x="50" y="184" width="360" height="47" rx="6" fill="#f0eafa" stroke="#c6afe9"/>
<text x="230" y="214" class="label" text-anchor="middle">One chunk per flushed batch</text>
<line x1="230" y1="254" x2="230" y2="285" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="442" y="104" width="396" height="150" rx="9" fill="#fff" stroke="#dbe3ed"/>
<text x="460" y="136" class="section" text-anchor="start">Large-message DMA</text>
<text x="460" y="164" class="small muted" text-anchor="start">reserve → commit</text>
<rect x="460" y="184" width="360" height="47" rx="6" fill="#f0eafa" stroke="#c6afe9"/>
<text x="640" y="214" class="label" text-anchor="middle">One chunk per complete message</text>
<line x1="640" y1="254" x2="640" y2="285" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="852" y="104" width="396" height="150" rx="9" fill="#fff" stroke="#dbe3ed"/>
<text x="870" y="136" class="section" text-anchor="start">Slab</text>
<text x="870" y="164" class="small muted" text-anchor="start">builder → seal → append</text>
<rect x="870" y="184" width="360" height="47" rx="6" fill="#f0eafa" stroke="#c6afe9"/>
<text x="1050" y="214" class="label" text-anchor="middle">One chunk per sealed slab</text>
<line x1="1050" y1="254" x2="1050" y2="285" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="32" y="288" width="1216" height="347" rx="9" fill="#fff" stroke="#dbe3ed"/>
<text x="52" y="326" class="section" text-anchor="start">One aligned append</text>
<text x="52" y="351" class="small muted" text-anchor="start">Same file extent with message indexes present or absent</text>
<text x="54" y="411" class="label" text-anchor="start">Fits</text>
<rect x="195" y="380" width="155" height="62" rx="0" fill="#7044a7" stroke="#7044a7"/>
<text x="272.5" y="416" class="small white" text-anchor="middle">Chunk header</text>
<rect x="350" y="380" width="405" height="62" rx="0" fill="#d5e9fe" stroke="#d5e9fe"/>
