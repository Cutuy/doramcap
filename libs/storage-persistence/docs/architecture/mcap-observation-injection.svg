<style>text{font-family:DejaVu Sans,sans-serif;fill:#18334b;font-size:16px}.title{font-size:26px;font-weight:bold}.head{font-size:19px;font-weight:bold}.code{font-family:DejaVu Sans Mono,monospace;font-size:16px}.edge{fill:none;stroke:#52778b;stroke-width:2;marker-end:url(#arrow)}.label{fill:#18334b}</style>
