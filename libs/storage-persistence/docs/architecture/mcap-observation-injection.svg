<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
<title id="title">MCAP observation dependency injection</title><desc id="desc">The application injects Observer and McapMetrics at construction. Writer emits events to Collector and stage metadata to a bounded metrics channel. A separate McapMonitor supplies snapshots and active writes to the demo. Memory leases remain inside the recording core.</desc>
