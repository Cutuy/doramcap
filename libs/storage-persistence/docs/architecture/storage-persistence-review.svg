<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><title>Direct encoding into managed MCAP buffers</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#475569"/></marker><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#059669"/></marker></defs><rect width="1400" height="1000" fill="#f8fafc"/><g font-family="DejaVu Sans,sans-serif">
<text x="700" y="47" text-anchor="middle" font-size="30" fill="#0f172a" font-weight="700">Reserve → encode in place → submit → reclaim</text>
<text x="700" y="78" text-anchor="middle" font-size="17" fill="#64748b" font-weight="400">One owner thread · one io_uring per writer · SQPOLL off</text>
