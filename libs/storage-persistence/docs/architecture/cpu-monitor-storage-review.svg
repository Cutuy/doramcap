<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400"><title>CPU monitoring with embedded MCAP persistence</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#475569"/></marker><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#059669"/></marker></defs><rect width="1600" height="1400" fill="#f8fafc"/><g font-family="DejaVu Sans,sans-serif">
<text x="800" y="48" text-anchor="middle" font-size="30" fill="#0f172a" font-weight="700">CPU monitoring · embedded MCAP recording</text>
<text x="800" y="80" text-anchor="middle" font-size="18" fill="#64748b" font-weight="400">Proposed process and component boundaries</text>
