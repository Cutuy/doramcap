<text x="565.0" y="530.0" text-anchor="middle" font-size="22" fill="#0f172a" font-weight="600">Bounded snapshot handoff</text>
<text x="565.0" y="558.0" text-anchor="middle" font-size="16" fill="#64748b" font-weight="400">preallocated batches · explicit overflow</text>
