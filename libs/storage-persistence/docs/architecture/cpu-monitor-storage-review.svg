<text x="1210" y="789" text-anchor="middle" font-size="16" fill="#475569" font-weight="400">Dora transport</text>
<rect x="1140" y="440" width="415" height="280" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2" stroke-dasharray=""/>
<text x="1347" y="477" text-anchor="middle" font-size="17" fill="#9a3412" font-weight="700">PUBLICATION COPY BOUNDARY</text>
<text x="1347" y="521" text-anchor="middle" font-size="17" fill="#334155" font-weight="400">Current Dora API owns its buffers.</text>
<text x="1347" y="558" text-anchor="middle" font-size="17" fill="#334155" font-weight="400">Publishing this reserved payload</text>
<text x="1347" y="585" text-anchor="middle" font-size="17" fill="#334155" font-weight="400">requires a copy into Dora storage.</text>
<text x="1347" y="634" text-anchor="middle" font-size="17" fill="#334155" font-weight="400">Borrowed-buffer transport needs</text>
<text x="1347" y="661" text-anchor="middle" font-size="17" fill="#334155" font-weight="400">a separate lifetime / API design.</text>
<text x="800" y="1374" text-anchor="middle" font-size="17" fill="#64748b" font-weight="400">Recording is embedded in system-monitor. CPU collection stays on its dedicated thread. Draft for review.</text>
