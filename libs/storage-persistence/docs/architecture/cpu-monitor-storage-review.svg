<path d="M1347 975 V1040" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<text x="1400" y="1012" text-anchor="middle" font-size="16" fill="#475569" font-weight="400">telemetry</text>
