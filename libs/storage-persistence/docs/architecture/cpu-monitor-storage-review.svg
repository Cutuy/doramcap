<text x="310.0" y="1072.5" text-anchor="middle" font-size="22" fill="#0f172a" font-weight="600">Storage writer</text>
<text x="310.0" y="1100.5" text-anchor="middle" font-size="16" fill="#64748b" font-weight="400">offset allocator + one io_uring</text>
<rect x="700" y="1030" width="340" height="85" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2" stroke-dasharray=""/>
<text x="870.0" y="1072.5" text-anchor="middle" font-size="22" fill="#0f172a" font-weight="600">Dora publisher</text>
<text x="870.0" y="1100.5" text-anchor="middle" font-size="16" fill="#64748b" font-weight="400">application-owned adapter</text>
<path d="M310 970 V1030" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<text x="403" y="1007" text-anchor="middle" font-size="16" fill="#475569" font-weight="400">commit buffer lease</text>
