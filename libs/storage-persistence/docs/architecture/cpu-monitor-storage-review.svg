<text x="565.0" y="1280.0" text-anchor="middle" font-size="22" fill="#0f172a" font-weight="600">Linux filesystem → storage driver → NVMe</text>
<text x="565.0" y="1308.0" text-anchor="middle" font-size="16" fill="#64748b" font-weight="400">file descriptor + aligned offset / length + registered buffer</text>
<path d="M310 1115 V1230" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<text x="373" y="1207" text-anchor="middle" font-size="16" fill="#475569" font-weight="400">file writes</text>
