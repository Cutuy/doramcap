<text x="565.0" y="387.5" text-anchor="middle" font-size="22" fill="#0f172a" font-weight="600">Collector thread · 10 Hz</text>
<text x="565.0" y="415.5" text-anchor="middle" font-size="16" fill="#64748b" font-weight="400">cgroup-bpf → monitor-core snapshot lease</text>
