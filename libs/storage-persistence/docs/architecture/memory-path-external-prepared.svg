<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="490" viewBox="0 0 1300 490" role="img" aria-labelledby="title desc">
<title id="title">3 · Prepared external block — producer supplies final file bytes</title><desc id="desc">PROPOSED · any block size meeting direct-I/O alignment · copy avoidance drives this path; no size cutoff</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#52657a"/></marker></defs>
<style>text{font-family:DejaVu Sans,sans-serif;fill:#17324d}.title{font-size:25px;font-weight:700}.sub{font-size:15px;fill:#52657a}.head{font-size:19px;font-weight:700}.small{font-size:14px}.tag{font-size:12px;font-weight:700;fill:#52657a}</style><rect width="1300" height="490" fill="#f8fafc"/>
<text x="40" y="42" class="title" text-anchor="start">3 · Prepared external block — producer supplies final file bytes</text>
<text x="40" y="69" class="sub" text-anchor="start">PROPOSED · any block size meeting direct-I/O alignment · copy avoidance drives this path; no size cutoff</text>
<rect x="40" y="115" width="245" height="100" rx="10" fill="#def2e9" stroke="#c5d2df"/>
<text x="162.5" y="146" class="head" text-anchor="middle">Producer / tracing</text>
<text x="162.5" y="172" class="small" text-anchor="middle">encode + frame + align</text>
<text x="162.5" y="195" class="small" text-anchor="middle">seal block; share read leases</text>
<path d="M285 165H365" fill="none" stroke="#52657a" stroke-width="2" marker-end="url(#a)"/>
<text x="325" y="144" class="small" text-anchor="middle">block</text>
<rect x="365" y="115" width="245" height="100" rx="10" fill="#fff0d6" stroke="#c5d2df"/>
<text x="487.5" y="146" class="head" text-anchor="middle">MCAP admission</text>
<text x="487.5" y="172" class="small" text-anchor="middle">verify record boundaries</text>
<text x="487.5" y="195" class="small" text-anchor="middle">order with prior buffered data</text>
<path d="M610 165H690" fill="none" stroke="#52657a" stroke-width="2" marker-end="url(#a)"/>
<text x="650" y="144" class="small" text-anchor="middle">lease</text>
<rect x="690" y="115" width="245" height="100" rx="10" fill="#e6efff" stroke="#c5d2df"/>
<text x="812.5" y="146" class="head" text-anchor="middle">Append scheduler</text>
<text x="812.5" y="172" class="small" text-anchor="middle">file range + retained lease</text>
<text x="812.5" y="195" class="small" text-anchor="middle">admission / retries / CQEs</text>
<path d="M935 165H1015" fill="none" stroke="#52657a" stroke-width="2" marker-end="url(#a)"/>
<text x="975" y="144" class="small" text-anchor="middle">SQEs</text>
<rect x="1015" y="115" width="245" height="100" rx="10" fill="#eaf0f6" stroke="#c5d2df"/>
<text x="1137.5" y="146" class="head" text-anchor="middle">io_uring</text>
<text x="1137.5" y="172" class="small" text-anchor="middle">registered address + length</text>
<text x="1137.5" y="195" class="small" text-anchor="middle">O_DIRECT write requests</text>
<text x="40" y="257" class="tag" text-anchor="start">FILE LAYOUT · APPEND ORDER</text>
<text x="1260" y="257" class="small" text-anchor="end">f → increasing file offset</text>
<rect x="40" y="272" width="300" height="65" fill="#def2e9" stroke="#c5d2df"/>
<text x="190.0" y="297" class="head" text-anchor="middle">Header + batch A</text>
<text x="190.0" y="320" class="small" text-anchor="middle">producer-prepared</text>
<rect x="340" y="272" width="650" height="65" fill="#def2e9" stroke="#c5d2df"/>
<text x="665.0" y="297" class="head" text-anchor="middle">Header + batch B …</text>
<text x="665.0" y="320" class="small" text-anchor="middle">same sealed slab · multiple packed records</text>
<rect x="990" y="272" width="270" height="65" fill="#def2e9" stroke="#c5d2df"/>
<text x="1125.0" y="297" class="head" text-anchor="middle">MCAP padding</text>
<text x="1125.0" y="320" class="small" text-anchor="middle">producer-prepared</text>
<text x="40" y="361" class="sub" text-anchor="start">One aligned block passes unchanged to the writer. Storage adds no framing and performs no combining or payload copies.</text>
<rect x="40" y="375" width="1220" height="35" rx="6" fill="#eaf0f6"/>
<text x="54" y="398" class="tag" text-anchor="start">BYTE LEASE</text>
<text x="205" y="398" class="small" text-anchor="start">Writer + payload readers hold sealed-block leases; last release recycles the slab after I/O retirement.</text>
<rect x="40" y="421" width="1220" height="35" rx="6" fill="#eaf0f6"/>
<text x="54" y="444" class="tag" text-anchor="start">REGISTRATION</text>
<text x="205" y="444" class="small" text-anchor="start">A separate mapping guard retains registration; it must allow completed slabs to return to the producer pool.</text>
</svg>