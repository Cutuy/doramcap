<text x="142.5" y="397" class="s" text-anchor="middle">header</text>
<rect x="190" y="370" width="185" height="42" rx="0" fill="#dce8ff" stroke="#c5d2df" stroke-width="1.5"/>
<text x="282.5" y="397" class="s" text-anchor="middle">payload</text>
<rect x="375" y="370" width="90" height="42" rx="0" fill="#eaf0f6" stroke="#c5d2df" stroke-width="1.5"/>
<text x="420.0" y="397" class="s" text-anchor="middle">padding</text>
<rect x="565" y="370" width="135" height="42" rx="0" fill="#fff0d6" stroke="#c5d2df" stroke-width="1.5"/>
<text x="632.5" y="397" class="s" text-anchor="middle">prefix</text>
<rect x="700" y="370" width="235" height="42" rx="0" fill="#c6e9d9" stroke="#c5d2df" stroke-width="1.5"/>
<text x="817.5" y="397" class="s" text-anchor="middle">payload</text>
<rect x="1035" y="370" width="245" height="42" rx="0" fill="#ddd3fc" stroke="#c5d2df" stroke-width="1.5"/>
<text x="1157.5" y="397" class="s" text-anchor="middle">records A…N</text>
<rect x="1280" y="370" width="125" height="42" rx="0" fill="#ddd3fc" stroke="#c5d2df" stroke-width="1.5"/>
<text x="1342.5" y="397" class="s" text-anchor="middle">padding</text>
<text x="280" y="438" class="s" text-anchor="middle">combine small · dedicate large</text>
<text x="750" y="438" class="s" text-anchor="middle">prefix = padding + MCAP header</text>
<text x="1220" y="438" class="s" text-anchor="middle">bypass storage framing + combining</text>
<path d="M280 455V505" fill="none" stroke="#52657a" stroke-width="2.4"/>
<path d="M750 455V505" fill="none" stroke="#52657a" stroke-width="2.4"/>
<path d="M1220 455V505" fill="none" stroke="#52657a" stroke-width="2.4"/>
<path d="M280 505H1220" fill="none" stroke="#52657a" stroke-width="2.4"/>
