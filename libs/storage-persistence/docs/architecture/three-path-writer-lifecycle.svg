<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1130" viewBox="0 0 1500 1130" role="img" aria-labelledby="title desc">
<title id="title">Three inputs, one MCAP writer lifecycle</title>
<desc id="desc">Managed reservations, large external payloads and prepared external blocks converge on retained write requests, registration, file-offset allocation and io_uring. CQEs release leases back to their owners; external reuse also waits for readers. Registrations persist separately. DMA reads retained source bytes.</desc>
<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#52657a"/></marker>
<marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#18836b"/></marker>
<marker id="d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#7c3aed"/></marker>
</defs>
<style>text{font-family:DejaVu Sans,sans-serif;fill:#18334b}.title{font-size:28px;font-weight:700}.h{font-size:21px;font-weight:700}.s{font-size:16px}.tag{font-size:13px;font-weight:700;letter-spacing:.7px;fill:#52657a}</style><rect width="1500" height="1130" fill="#f8fafc"/>
<text x="750" y="42" class="title" text-anchor="middle">Three inputs · one MCAP writer lifecycle</text>
<text x="750" y="70" class="s" text-anchor="middle" style="fill:#52657a">Managed + intra-process prepared paths implemented · external payload path planned</text>
<path d="M80 825H30V120H1220" fill="none" stroke="#18836b" stroke-width="2.4" stroke-dasharray="7 5"/>
<text x="750" y="108" class="tag" text-anchor="middle" style="fill:#18836b">REUSE AFTER I/O RETIREMENT · external reuse also waits for payload readers</text>
