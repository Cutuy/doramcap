<path d="M1220 120V155" fill="none" stroke="#18836b" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#g)"/>
<rect x="80" y="155" width="400" height="98" rx="12" fill="#e6efff" stroke="#c5d2df" stroke-width="1.5"/>
<text x="280" y="187" class="h" text-anchor="middle">1 · Managed pool</text>
<text x="280" y="214" class="s" text-anchor="middle">small batch / large reservation</text>
<text x="280" y="239" class="s" text-anchor="middle" style="fill:#52657a">allocation returned to free list</text>
<path d="M280 253V325" fill="none" stroke="#52657a" stroke-width="2.4" marker-end="url(#a)"/>
<rect x="550" y="155" width="400" height="98" rx="12" fill="#def2e9" stroke="#c5d2df" stroke-width="1.5"/>
<text x="750" y="187" class="h" text-anchor="middle">2 · External payload owner</text>
<text x="750" y="214" class="s" text-anchor="middle">large payload &gt;256 KiB</text>
<text x="750" y="239" class="s" text-anchor="middle" style="fill:#52657a">producer read lease released</text>
<path d="M750 253V325" fill="none" stroke="#52657a" stroke-width="2.4" marker-end="url(#a)"/>
<rect x="1020" y="155" width="400" height="98" rx="12" fill="#ede9fe" stroke="#c5d2df" stroke-width="1.5"/>
<text x="1220" y="187" class="h" text-anchor="middle">3 · Producer / tracing pool</text>
<text x="1220" y="214" class="s" text-anchor="middle">prepared block · any aligned size</text>
<text x="1220" y="239" class="s" text-anchor="middle" style="fill:#52657a">last reader + I/O lease recycles slab</text>
<path d="M1220 253V325" fill="none" stroke="#52657a" stroke-width="2.4" marker-end="url(#a)"/>
<text x="280" y="294" paint-order="stroke" stroke="#f8fafc" stroke-width="6" stroke-linejoin="round" class="s" text-anchor="middle">caller fills reserved slice</text>
<text x="750" y="294" paint-order="stroke" stroke="#f8fafc" stroke-width="6" stroke-linejoin="round" class="s" text-anchor="middle">storage builds framing spans</text>
<text x="1220" y="294" paint-order="stroke" stroke="#f8fafc" stroke-width="6" stroke-linejoin="round" class="s" text-anchor="middle">producer frames + seals</text>
<rect x="80" y="325" width="400" height="130" rx="12" fill="#e6efff" stroke="#c5d2df" stroke-width="1.5"/>
<rect x="550" y="325" width="400" height="130" rx="12" fill="#def2e9" stroke="#c5d2df" stroke-width="1.5"/>
<rect x="1020" y="325" width="400" height="130" rx="12" fill="#ede9fe" stroke="#c5d2df" stroke-width="1.5"/>
<text x="280" y="353" class="tag" text-anchor="middle">MANAGED ALLOCATION</text>
<text x="750" y="353" class="tag" text-anchor="middle">MANAGED + BORROWED SPANS</text>
<text x="1220" y="353" class="tag" text-anchor="middle">SEALED EXTERNAL BLOCK</text>
