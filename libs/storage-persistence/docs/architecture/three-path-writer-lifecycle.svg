<text x="280" y="486" paint-order="stroke" stroke="#f8fafc" stroke-width="6" stroke-linejoin="round" class="s" text-anchor="middle">commit</text>
<text x="750" y="486" paint-order="stroke" stroke="#f8fafc" stroke-width="6" stroke-linejoin="round" class="s" text-anchor="middle">append payload</text>
<text x="1220" y="486" paint-order="stroke" stroke="#f8fafc" stroke-width="6" stroke-linejoin="round" class="s" text-anchor="middle">append prepared</text>
<text x="750" y="541" paint-order="stroke" stroke="#f8fafc" stroke-width="6" stroke-linejoin="round" class="tag" text-anchor="middle">Contiguous range admission</text>
<rect x="550" y="555" width="400" height="132" rx="12" fill="#e6efff" stroke="#c5d2df" stroke-width="1.5"/>
<text x="750" y="589" class="h" text-anchor="middle">Retained write request</text>
<text x="750" y="620" class="s" text-anchor="middle">source spans + leases</text>
<text x="750" y="647" class="s" text-anchor="middle">one logical append · aligned file range</text>
<text x="750" y="673" class="s" text-anchor="middle" style="fill:#52657a">reject → caller keeps ownership</text>
<rect x="80" y="565" width="350" height="112" rx="12" fill="#def2e9" stroke="#c5d2df" stroke-width="1.5"/>
<text x="255" y="599" class="h" text-anchor="middle">Registration cache</text>
<text x="255" y="627" class="s" text-anchor="middle">first use → register region</text>
<text x="255" y="654" class="s" text-anchor="middle">mapping guard retained across reuse</text>
<path d="M550 589H430" fill="none" stroke="#52657a" stroke-width="2.4" marker-end="url(#a)"/>
<text x="490" y="578" class="s" text-anchor="middle">region</text>
