<text x="1245" y="912" paint-order="stroke" stroke="#f8fafc" stroke-width="6" stroke-linejoin="round" class="s" text-anchor="middle">writes land at assigned offsets</text>
<text x="80" y="948" class="tag" text-anchor="start">FILE OFFSETS · EXAMPLE APPEND ORDER</text>
<rect x="80" y="975" width="420" height="78" rx="0" fill="#e6efff" stroke="#c5d2df" stroke-width="1.5"/>
