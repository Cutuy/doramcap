<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-labelledby="title desc"><title id="title">External SHM: two immutable inputs</title><desc id="desc">Implemented external ingress. The caller owns and publishes memory. Payload-only input is paired with a managed aligned prefix page; externally framed MCAP blocks pass unchanged. A logical write retains both owners, reserves contiguous offsets and tracks all operations. Registration retains the mapping separately from block reuse.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#52657a"/></marker></defs><style>text{font-family:DejaVu Sans,sans-serif;fill:#18334b}.title{font-size:28px;font-weight:700}.head{font-size:19px;font-weight:700}.small{font-size:15px}.tag{font-size:13px;font-weight:700;letter-spacing:1px}.arrow{fill:none;stroke:#52657a;stroke-width:2;marker-end:url(#a)}</style><rect width="1440" height="1050" fill="#f8fafc"/>
