<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" role="img" aria-labelledby="title desc"><title id="title">External memory · data path</title><desc id="desc">The caller supplies mapped memory and ownership guards. Storage chooses the size-qualified path.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#53657b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#192e45}.title{font-size:25px;font-weight:700}.label{font-size:16px;font-weight:700}.note{font-size:14px;fill:#52657a}.edge{font-size:13px;fill:#40566e}.step{font-size:17px;font-weight:700}</style><rect width="1120" height="400" fill="#f8fafc"/><text class="title" x="36" y="43">External memory · data path</text>
<text class="label" x="36" y="89" text-anchor="start">≤256 KiB · COPY INTO MANAGED STORAGE</text>
