<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1180" viewBox="0 0 1700 1180" role="img" aria-labelledby="title desc"><title id="title">Shared mapping ownership: whole units, pools and custom rings</title><desc id="desc">Proposed shared-memory architecture. Whole-unit, fixed-slot and custom-ring adapters provide immutable byte-range leases. The region owner retains mapping validity independently of per-block reuse. Mutable ring headers remain inside the adapter protocol. The writer registers regions and retains leases until terminal I/O completion. See external-memory.svg for the corrected two-input MCAP contract.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#50677c"/></marker><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#19765e"/></marker><marker id="p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#946b28"/></marker></defs><style>text{font-family:DejaVu Sans,sans-serif;fill:#18334b}.title{font-size:29px;font-weight:700}.h{font-size:21px;font-weight:700}.s{font-size:16px}.tag{font-size:14px;font-weight:700;letter-spacing:1px}.flow,.guard,.reuse{fill:none;stroke-width:2.2}.flow{stroke:#50677c;marker-end:url(#a)}.guard{stroke:#946b28;stroke-dasharray:7 5;marker-end:url(#p)}.reuse{stroke:#19765e;marker-end:url(#g)}.label{font-size:15px;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round}</style><rect width="1700" height="1180" fill="#f8fafc"/>
