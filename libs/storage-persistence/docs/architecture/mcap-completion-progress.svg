<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="DejaVu Sans,sans-serif" text-anchor="middle" dominant-baseline="central"><title>MCAP writer completion progress on the application thread</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#475569"/></marker><style>text{dominant-baseline:central;text-anchor:middle}.t{font-size:13px;font-weight:700}.s{font-size:11px}.h{font-size:13px;font-weight:700;fill:#0f172a;text-anchor:start}.g rect{fill:#f1efe8;stroke:#5f5e5a}.g .t{fill:#444441}.g .s{fill:#5f5e5a}.k rect{fill:#e1f5ee;stroke:#0f6e56}.k .t{fill:#085041}.k .s{fill:#0f6e56}.w rect{fill:#faeeda;stroke:#854f0b}.w .t{fill:#633806}.l{fill:none;stroke:#475569;stroke-width:1.5;marker-end:url(#a)}</style></defs>
<rect width="680" height="400" fill="#ffffff"/>
<text class="h" x="40" y="30">Application thread</text>
<g class="g"><rect x="40" y="48" width="170" height="56" rx="8"/><text class="t" x="125" y="67">write</text><text class="s" x="125" y="86">Submits, then continues</text></g>
<g class="g"><rect x="255" y="48" width="170" height="56" rx="8"/><text class="t" x="340" y="67">Next writer call</text><text class="s" x="340" y="86">Sees the flag</text></g>
<g class="g"><rect x="470" y="48" width="170" height="56" rx="8"/><text class="t" x="555" y="67">retire_completion</text><text class="s" x="555" y="86">Frees the slot</text></g>
<text class="h" x="40" y="152">Shared ring memory</text>
<g class="k"><rect x="255" y="130" width="170" height="44" rx="8"/><text class="t" x="340" y="152">IORING_SQ_TASKRUN</text></g>
<text class="h" x="40" y="212">Kernel</text>
<g class="k"><rect x="40" y="230" width="170" height="56" rx="8"/><text class="t" x="125" y="249">Performs the write</text><text class="s" x="125" y="268">No polling needed</text></g>
<g class="k"><rect x="255" y="230" width="170" height="56" rx="8"/><text class="t" x="340" y="249">Write finished</text><text class="s" x="340" y="268">Holds the completion</text></g>
<g class="k"><rect x="470" y="230" width="170" height="56" rx="8"/><text class="t" x="555" y="249">GETEVENTS enter</text><text class="s" x="555" y="268">Posts the completion</text></g>
<path class="l" d="M210 76 H253"/><path class="l" d="M425 76 H468"/><path class="l" d="M125 104 V228"/><path class="l" d="M210 258 H253"/><path class="l" d="M340 230 V176"/><path class="l" d="M340 130 V106"/><path class="l" d="M425 90 H450 V210 H530 V228"/><path class="l" d="M580 230 V106"/>
<g class="w"><rect x="40" y="326" width="600" height="44" rx="8"/><text class="t" x="340" y="348">Writes stop: last batch waits for poll, flush_written or finish</text></g>
</svg>
