<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc"><title id="title">Slab lifecycle: planned observation points</title><desc id="desc">Companion to rust-slab-writer-lifecycle.svg. The same pool, writable slab, builder, sealed slab, registration, Pending and final-release objects are shown. Amber observation points identify acquire and seal, admission, I/O, registration, readers and recycling. Typed metadata feeds stage snapshots, per-write inspection and bounded event history, then a recorder exporter and optional tracing adapter. Ownership flows remain independent of observation.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#52657a"/></marker><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#18836b"/></marker><marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#b97817"/></marker></defs><style>text{font-family:DejaVu Sans,sans-serif;fill:#18334b}.title{font-size:28px;font-weight:700}.h{font-size:19px;font-weight:700}.s{font-size:16px}.code{font-family:DejaVu Sans Mono,monospace;font-size:15px}.tag{font-size:13px;font-weight:700;letter-spacing:.7px;fill:#52657a}.label{paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round}.edge{fill:none;stroke:#52657a;stroke-width:2;marker-end:url(#a)}.reuse{fill:none;stroke:#18836b;stroke-width:2;marker-end:url(#g)}.obs{fill:none;stroke:#b97817;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#o)}.badge{font-size:15px;font-weight:700;fill:#8a4b00}</style><rect width="1800" height="1120" fill="#f8fafc"/>
