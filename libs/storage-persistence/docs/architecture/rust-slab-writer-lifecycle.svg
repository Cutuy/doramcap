<text x="185.0" y="435" class="h" text-anchor="middle">Rejected block</text>
<text x="185.0" y="463" class="s" text-anchor="middle">PreparedBlock returned intact</text>
<text x="185.0" y="488" class="s" text-anchor="middle">retry keeps the same lease</text>
<path d="M420 462H320" class="edge"/>
<text x="370" y="447" class="code label" text-anchor="middle">Err</text>
<rect x="420" y="585" width="705" height="140" rx="12" fill="#e6efff" stroke="#c5d2df" stroke-width="1.5"/>
<text x="772.5" y="615" class="h" text-anchor="middle">Pending</text>
<text x="772.5" y="643" class="code" text-anchor="middle">source: WriteSource::Slab(SealedSlab)</text>
<text x="772.5" y="668" class="code" text-anchor="middle">segments: Rc&lt;[RegistrationSegment]&gt; · offset: u64</text>
<text x="772.5" y="693" class="s" text-anchor="middle">split / retry state · owns lease through retirement</text>
<path d="M770 520V585" class="edge"/>
<text x="770" y="559" class="code label" text-anchor="middle">accepted → move block lease</text>
<rect x="460" y="815" width="625" height="115" rx="12" fill="#e2e8f0" stroke="#c5d2df" stroke-width="1.5"/>
<text x="772.5" y="845" class="h" text-anchor="middle">io_uring · outstanding operations</text>
<text x="772.5" y="873" class="code" text-anchor="middle">SQE: address + len + buffer ID + file offset</text>
<text x="772.5" y="898" class="s" text-anchor="middle">terminal CQEs → retire every source reference</text>
<path d="M770 725V815" class="edge"/>
<text x="770" y="772" class="code label" text-anchor="middle">submit / retry</text>
<rect x="50" y="625" width="270" height="145" rx="12" fill="#def2e9" stroke="#c5d2df" stroke-width="1.5"/>
<text x="185.0" y="655" class="h" text-anchor="middle">Registered</text>
<text x="185.0" y="683" class="code" text-anchor="middle">slot + allocation identity</text>
<text x="185.0" y="708" class="code" text-anchor="middle">Arc&lt;SlabAllocation&gt;</text>
<text x="185.0" y="733" class="s" text-anchor="middle">cached across slab reuse</text>
<text x="185.0" y="758" class="s" text-anchor="middle">and file rotation</text>
<path d="M420 630H320" class="edge"/>
<text x="369" y="616" class="code label" text-anchor="middle">region</text>
<path d="M320 710H420" class="edge"/>
<text x="368" y="697" class="code label" text-anchor="middle">buffer ID</text>
<text x="185" y="565" class="tag" text-anchor="middle">allocation lifetime guard</text>
<rect x="1240" y="585" width="310" height="140" rx="12" fill="#ede9fe" stroke="#c5d2df" stroke-width="1.5"/>
<text x="1395.0" y="615" class="h" text-anchor="middle">SlabLeaseInner</text>
<text x="1395.0" y="643" class="s" text-anchor="middle">one batch / slab generation</text>
<text x="1395.0" y="668" class="code" text-anchor="middle">Arc&lt;SlabAllocation&gt;</text>
<text x="1395.0" y="693" class="s" text-anchor="middle">recycle token + pool handle</text>
<text x="1395.0" y="718" class="s" text-anchor="middle">last read lease → recycle</text>
<path d="M1395 475V585" class="edge"/>
<text x="1395" y="536" class="code label" text-anchor="middle">retains batch</text>
<path d="M1125 660H1240" class="edge"/>
<text x="1182" y="647" class="code label" text-anchor="middle">retains</text>
<text x="1395" y="767" class="s" text-anchor="middle">SealedSlab also retains this batch</text>
<rect x="1240" y="815" width="310" height="115" rx="12" fill="#fff" stroke="#c5d2df" stroke-width="1.5"/>
<text x="1395.0" y="845" class="h" text-anchor="middle">Filesystem / device</text>
<text x="1395.0" y="873" class="s" text-anchor="middle">reads submitted source bytes</text>
<text x="1395.0" y="898" class="s" text-anchor="middle">direct path requires validation</text>
<path d="M1085 872H1240" class="edge"/>
<text x="1162" y="857" class="code label" text-anchor="middle">I/O</text>
<rect x="420" y="1020" width="705" height="105" rx="12" fill="#ede9fe" stroke="#c5d2df" stroke-width="1.5"/>
<text x="772.5" y="1050" class="h" text-anchor="middle">Release writer’s SealedSlab</text>
<text x="772.5" y="1078" class="s" text-anchor="middle">after terminal completion of all parts / retries</text>
<text x="772.5" y="1103" class="s" text-anchor="middle">cancellation waits for original I/O retirement</text>
<path d="M770 930V1020" class="return"/>
<text x="770" y="995" class="code label" text-anchor="middle">retire Pending</text>
<rect x="1240" y="1020" width="310" height="105" rx="12" fill="#def2e9" stroke="#c5d2df" stroke-width="1.5"/>
<text x="1395.0" y="1050" class="h" text-anchor="middle">Final slab lease drop</text>
<text x="1395.0" y="1078" class="s" text-anchor="middle">readers = 0 · I/O leases = 0</text>
<text x="1395.0" y="1103" class="s" text-anchor="middle">return exclusive slot to pool</text>
<path d="M1125 1070H1240" class="return"/>
<text x="1182" y="1057" class="code label" text-anchor="middle">release</text>
<path d="M1515 725H1575V990H1515V1020" class="return"/>
<text x="1435" y="969" class="s label" text-anchor="middle">reader releases</text>
<path d="M1395 1125V1170H25V205H50" class="return"/>
<text x="750" y="1155" class="s label" text-anchor="middle">Recycle bytes while Registered continues retaining SlabAllocation</text>
<rect x="50" y="1220" width="720" height="75" rx="12" fill="#def2e9" stroke="#c5d2df" stroke-width="1.5"/>
<text x="410.0" y="1250" class="h" text-anchor="middle">Registration retirement</text>
<text x="410.0" y="1278" class="s" text-anchor="middle">stop admission → drain referencing I/O → unregister → drop owner guard</text>
<rect x="800" y="1220" width="750" height="75" rx="12" fill="#e6efff" stroke="#c5d2df" stroke-width="1.5"/>
<text x="1175.0" y="1250" class="h" text-anchor="middle">Safe public API · narrow unsafe implementation</text>
<text x="1175.0" y="1278" class="s" text-anchor="middle">unique mutation · checked ranges · stable address · synchronized recycling</text>
</svg>