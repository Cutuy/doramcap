[package]
name = "task-accounting"
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0 AND GPL-2.0-only"

[features]
default = []
bpf = ["dep:libbpf-rs", "dep:libbpf-cargo"]

[dependencies]
libbpf-rs = { version = "0.27", optional = true }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
libbpf-cargo = { version = "0.27", optional = true }

[lints]
workspace = true
