<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">Resource policy configuration and deployment architecture</title><desc id="desc">Protobuf schemas define pbtxt fragments and resolved policies. Profiles and host facts feed validation. Caller reconciliation, systemd and Kubernetes adapters consume the goal state; effective policy records feed telemetry.</desc>
