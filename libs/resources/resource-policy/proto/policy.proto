syntax = "proto3";
package resource_policy.v1;

// Explicit desired placement, independent of the caller's current affinity.
message Placement {
  string cpus = 1; // Decimal Linux cpulist, e.g. "4,5-7,9-11".
}
// Presence is significant during composition. A selection replaces its predecessor.
message Policy {
  reserved 2;
  reserved "cpus", "inherit_cpus";
  Placement placement = 1;
  optional uint32 rt_priority = 3; // 0: OTHER; 1..99: RR.
}
message App {
  string id = 1;
  Policy policy = 2;
}
message Fragment {
  repeated string include = 1; // Relative to this file, ordered, depth-first.
  repeated App app = 2;
}
message ResolvedDeployment {
  uint32 version = 1;
  repeated App app = 2; // Sorted by ID; cpulists canonical, defaults explicit.
}
message EffectivePolicy {
  string cpus = 1;
  int32 scheduler = 2; // Linux SCHED_* constant; preserves observed policies.
  int32 priority = 3;
}
