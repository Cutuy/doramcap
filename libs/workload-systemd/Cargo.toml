[package]
name = "workload-systemd"
description = "Owned systemd units for one run, controlled over D-Bus"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dora-app = { path = "../dora-app", default-features = false }
futures-util = "0.3"
orchestrator = { path = "../orchestrator" }
prost = "0.14"
prost-reflect = { version = "0.16", features = ["text-format"] }
resource-policy = { path = "../resources/resource-policy" }
rustix = { version = "1.1.5", features = ["fs", "mount", "thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
tokio = { version = "1", features = ["fs", "macros", "rt", "signal", "sync", "time"] }
workload-lifecycle = { path = "../workload-lifecycle" }
zbus = { version = "6", default-features = false, features = ["tokio"] }
zbus_systemd = { version = "0.26201", features = ["systemd1"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[lints]
workspace = true
