syntax = "proto3";
package doramcap.systemd_plan.v1;
import "launch.proto";

// Flat launch inputs; Rust starts Dora, system apps, then user apps.
message SystemdPlan {
  string binaries = 1;
  repeated Program programs = 2;
  repeated string unit_files = 3;
  repeated AppUnit app_units = 4;
}

message AppUnit {
  // Manifest app ID, unique within the run: 1..40 of [a-z0-9-].
  string id = 3;
  // Absolute unit file, loaded under the app ID.
  string file = 1;
  repeated Bind binds = 2;
}

// One transient service unit.
message Program {
  // Unique within the run: 1..40 of [a-z0-9-].
  string id = 1;
  // Absolute executable followed by its arguments.
  repeated string argv = 2;
  // Empty runs as the service manager's default user.
  string user = 3;
  // Absolute; empty keeps the service manager's default.
  string working_directory = 4;
  repeated EnvironmentVariable environment = 5;
  // Zero keeps the service manager's default limit.
  uint64 memlock_bytes = 6;
  // Decimal Linux cpulist; empty allows every CPU.
  string cpus = 7;
  // Signal number sent first on stop; zero sends SIGTERM.
  int32 kill_signal = 8;
  // Host paths shown at other paths in the unit's own mount namespace.
  repeated Bind binds = 9;
  // Per-app stop grace; zero uses RunPlan.stop_seconds.
  uint64 stop_seconds = 10;
}

// One bind mount; the source must exist when the unit starts.
message Bind {
  string source = 1;
  string target = 2;
  bool read_only = 3;
}

message EnvironmentVariable {
  string name = 1;
  string value = 2;
}

// Stable fingerprint of the typed launch configuration and captured explicit input files.
// Runtime identity and artifact paths are normalized; live directories and binaries remain native.
message ConfigurationSnapshot {
  string sha256 = 1;
}

// Explicit inputs for inspection and preparation on the execution host.
message PreparationInput {
  doramcap.launch.v1.RunPlan run = 1;
  SystemdPlan plan = 2;
}

// Captured inputs owned by this run's new artifact directory.
message PreparedRun {
  doramcap.launch.v1.RunPlan run = 1;
  SystemdPlan plan = 2;
  ConfigurationSnapshot snapshot = 3;
}

// Successful removal of a rejected preparation's owned artifacts.
message DiscardedRun {}

// One observed change to the launcher's owned accounting boundary.
message SystemAppsCgroupsInput {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    CREATE = 1;
    REMOVE = 2;
  }
  Action action = 1;
  // Create requires an existing absolute artifact directory and a positive budget.
  string artifacts = 2;
  uint64 readiness_seconds = 3;
}
