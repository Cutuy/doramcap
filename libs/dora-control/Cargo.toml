[package]
name = "dora-control"
description = "Experiment-owned asynchronous Dora coordinator control"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dora-message = "=1.1.0"
futures-util = { version = "0.3", features = ["sink"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "time"] }
tokio-tungstenite = "=0.30.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "process", "rt", "sync", "test-util"] }

[lints]
workspace = true
