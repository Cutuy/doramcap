<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290" role="img" aria-labelledby="title desc">
 <title id="title">Dora coordinator client ownership</title>
 <desc id="desc">The experiment and step factories retain one shared DoraCoordinatorClient. Transient steps use its typed methods over a reused WebSocket to the owned coordinator.</desc>
 <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
 <rect width="880" height="290" rx="14" fill="#f8fafc"/>
 <g font-family="sans-serif" text-anchor="middle" fill="#0f172a">
  <rect x="20" y="25" width="200" height="70" rx="9" fill="#dbeafe"/><text x="120" y="54" font-size="18">Experiment + factories</text><text x="120" y="79" font-size="15">Retain shared reference</text>
  <rect x="20" y="185" width="200" height="70" rx="9" fill="#dbeafe"/><text x="120" y="226" font-size="18">Transient steps</text>
  <rect x="300" y="95" width="290" height="105" rx="9" fill="#ccfbf1"/><text x="445" y="129" font-size="21">DoraCoordinatorClient</text><text x="445" y="158" font-size="15">Connection · attempted start · UUID</text><text x="445" y="183" font-size="15">Absolute operation deadlines</text>
  <rect x="700" y="105" width="160" height="80" rx="9" fill="#e0e7ff"/><text x="780" y="138" font-size="18">Dora coordinator</text><text x="780" y="165" font-size="15">Graph lifecycle</text>
  <text x="251" y="102" font-size="14">Reference</text><text x="251" y="211" font-size="14">Typed calls</text><text x="645" y="132" font-size="14">WebSocket</text>
 </g>
 <g fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"><path d="M220 60H260V115H300"/><path d="M220 220H260V180H300"/><path d="M590 146H700"/><path d="M700 167H590"/></g>
</svg>
