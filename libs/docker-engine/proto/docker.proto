syntax = "proto3";
package doramcap.docker.v1;

// A resolved host bind and the backend's display name for its consumer.
message BindMount {
  string consumer = 1;
  string source = 2;
  string target = 3;
  bool read_only = 4;
  string propagation = 5;
  bool selinux = 6;
}
// A resolved Docker volume name and its container destination.
message VolumeMount {
  string consumer = 1;
  string name = 2;
  string target = 3;
  bool read_only = 4;
}
// A container whose ownership the calling backend has verified.
message OwnedContainer {
  string consumer = 1;
  string id = 2;
}

// doramcap metadata represented by flat Docker labels; field numbers are stable.
// Native label-map presence retains caller-specific defaults for older resources.
message ResourceLabels {
  // io.doramcap.controller: exact repository scope used by Docker label filters.
  string controller = 1;
  // io.doramcap.run: run identity; never infer ownership from another label.
  string run = 2;
  // io.doramcap.artifacts: original run directory, including after controller restart.
  string artifacts = 3;
  // io.doramcap.experiment-owner: legacy presence marker, regardless of its value.
  bool experiment_owner = 4;
  // io.doramcap.remove-volume: only literal "true" enables deletion; absence uses caller policy.
  bool remove_volume = 5;
  // io.doramcap.journal-export: only literal "true" exports; absence has no export metadata.
  bool journal_export = 6;
}
