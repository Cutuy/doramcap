<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs><rect width="1120" height="530" rx="18" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#0f172a"><text x="32" y="42" font-size="26" font-weight="700">1 / Dora native SHM</text><text x="32" y="72" font-size="16" fill="#475569">EXISTING • Dora owns the sample API; Zenoh owns shared-buffer allocation and lifetime.</text><rect x="32" y="110" width="280" height="105" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="48" y="139" font-size="18" font-weight="700">Producer process</text><text x="48" y="165" font-size="16" font-weight="400">Dora allocates DataSample</text><text x="48" y="188" font-size="16" font-weight="400">Fill bytes → send consumes it</text><rect x="410" y="110" width="300" height="105" rx="12" fill="#dcfce7" stroke="#94a3b8"/><text x="426" y="139" font-size="18" font-weight="700">Zenoh SHM delivery</text><text x="426" y="165" font-size="16" font-weight="400">Local: buffer descriptor</text><text x="426" y="188" font-size="16" font-weight="400">Remote: transmit payload bytes</text><rect x="808" y="110" width="280" height="105" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="824" y="139" font-size="18" font-weight="700">Consumer process</text><text x="824" y="165" font-size="16" font-weight="400">Dora input / Arrow buffer</text><text x="824" y="188" font-size="16" font-weight="400">Retain owner while reading</text><path d="M312,161 L410,161" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="361.0" y="151.0" text-anchor="middle" font-size="14" fill="#334155">publish</text><path d="M710,161 L808,161" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="759.0" y="151.0" text-anchor="middle" font-size="14" fill="#334155">deliver</text><rect x="295" y="285" width="530" height="105" rx="12" fill="#dcfce7" stroke="#94a3b8"/><text x="311" y="314" font-size="18" font-weight="700">Reusable POSIX SHM pool</text><text x="311" y="340" font-size="16" font-weight="400">Allocated chunks have per-publication ownership</text><text x="311" y="363" font-size="16" font-weight="400">Reclaim when references are gone; reuse storage</text><path d="M172,215 L295,285" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M948,215 L825,285" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="32" y="434" font-size="20" font-weight="700">Block:  FREE  →  WRITABLE  →  SHARED READERS  →  FREE</text><text x="32" y="469" font-size="16" font-weight="400">Pool-backed, reusable chunks. No fixed-slot ring guarantee; no external-ring import in Dora’s sample API.</text><text x="32" y="498" font-size="14" font-weight="400">Eligible SHM path shown. Heap / routing fallbacks exist. Device completion remains the caller’s responsibility.</text></g></svg>