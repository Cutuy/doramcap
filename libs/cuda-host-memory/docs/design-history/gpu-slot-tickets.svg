<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#55708c"/></marker></defs><rect width="1120" height="660" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#18324b} .t{font-size:17px;font-weight:bold}.b{font-size:15px}.l{font-size:13px;fill:#526b82}</style><text x="30" y="36" class="t">Fixed slots: GPU releases a use ticket • proposed adapter</text><rect x="30" y="76" width="325" height="118" rx="10" fill="white" stroke="#8ba5be"/><text x="46" y="103" class="t">CPU lease API</text><text x="46" y="128" class="b">Acquire before access / submission</text><text x="46" y="150" class="b">Reserve GPU ticket before enqueue</text><text x="46" y="172" class="b">Drop CPU ticket after CPU work</text><rect x="735" y="76" width="355" height="118" rx="10" fill="white" stroke="#8ba5be"/><text x="751" y="103" class="t">Dora delivery adapter</text><text x="751" y="128" class="b">Reserve delivery hold before send</text><text x="751" y="150" class="b">Consumer adopts hold; adds GPU ticket</text><text x="751" y="172" class="b">Pending descriptor includes Ready42</text><rect x="340" y="270" width="440" height="114" rx="10" fill="white" stroke="#8ba5be"/><text x="356" y="297" class="t">Shared control block: slot 7 / gen 42</text><text x="356" y="322" class="b">uses = CPU + queued GPU + delivery holds</text><text x="356" y="344" class="b">Zero → allocator may claim generation 43</text><text x="356" y="366" class="b">Explicit ABI and system-scope atomics</text><rect x="30" y="473" width="325" height="115" rx="10" fill="white" stroke="#8ba5be"/><text x="46" y="500" class="t">Producer CUDA stream</text><text x="46" y="525" class="b">Write frame → record Ready42</text><text x="46" y="547" class="b">Tail kernel: release GPU ticket</text><text x="46" y="569" class="b">No host callback</text><rect x="735" y="473" width="355" height="115" rx="10" fill="white" stroke="#8ba5be"/><text x="751" y="500" class="t">Each consumer CUDA stream</text><text x="751" y="525" class="b">Wait Ready42 → read frame</text><text x="751" y="547" class="b">Tail kernel: release GPU ticket</text><text x="751" y="569" class="b">One ticket per independent use</text><path d="M355 130H735" fill="none" stroke="#55708c" stroke-width="2" marker-end="url(#a)"/><text x="438" y="119" class="l">descriptor + transferred hold</text><path d="M190 194V315H340" fill="none" stroke="#55708c" stroke-width="2" marker-end="url(#a)"/><text x="42" y="252" class="l">CPU acquire / release</text><path d="M910 194V315H780" fill="none" stroke="#55708c" stroke-width="2" marker-end="url(#a)"/><text x="853" y="252" class="l">delivery acquire / release</text><path d="M190 473V415H430V384" fill="none" stroke="#55708c" stroke-width="2" marker-end="url(#a)"/><text x="195" y="437" class="l">system atomic −1</text><path d="M910 473V415H690V384" fill="none" stroke="#55708c" stroke-width="2" marker-end="url(#a)"/><text x="773" y="437" class="l">system atomic −1</text><path d="M355 530H735" fill="none" stroke="#55708c" stroke-width="2" marker-end="url(#a)"/><text x="422" y="519" class="l">Ready42: CUDA event dependency</text><text x="30" y="630" class="b">Pool owner stays alive. CPU observes zero to allocate; GPU decrement alone does not wake a sleeping CPU.</text></svg>