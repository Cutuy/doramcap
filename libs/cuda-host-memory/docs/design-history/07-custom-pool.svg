<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#475569"/></marker></defs><rect width="1120" height="650" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#0f172a"><text x="28" y="40" font-size="26" font-weight="700">3 / Custom fixed-block pool under Zenoh</text><text x="28" y="70" font-size="16" fill="#475569">PROPOSED INTEGRATION · Keep Zenoh’s reference tracking; implement allocation, mapping and device completion.</text><rect x="28" y="112" width="250" height="72" rx="10" fill="#ffedd5" stroke="#94a3b8"/><text x="42" y="140" font-size="18" font-weight="700">Your ring / device</text><text x="42" y="165" font-size="15" font-weight="400">Free slots + stable mappings</text><rect x="355" y="112" width="330" height="72" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="369" y="140" font-size="18" font-weight="700">Zenoh provider</text><text x="369" y="165" font-size="15" font-weight="400">alloc() or map(external chunk)</text><rect x="762" y="112" width="330" height="72" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="776" y="140" font-size="18" font-weight="700">Zenoh clients</text><text x="776" y="165" font-size="15" font-weight="400">attach(segment) → map(chunk)</text><path d="M278 148L355 148" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="316.5" y="139.0" text-anchor="middle" font-size="14">chunk</text><path d="M685 148L762 148" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="723.5" y="139.0" text-anchor="middle" font-size="14">descriptor</text><rect x="28" y="255" width="250" height="72" rx="10" fill="#ffedd5" stroke="#94a3b8"/><text x="42" y="283" font-size="18" font-weight="700">Completion adapter</text><text x="42" y="308" font-size="15" font-weight="400">Fence + retained owner</text><rect x="355" y="255" width="330" height="72" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="369" y="283" font-size="18" font-weight="700">Zenoh shared owners</text><text x="369" y="308" font-size="15" font-weight="400">Local + remote-transfer users</text><rect x="762" y="255" width="330" height="72" rx="10" fill="#ffedd5" stroke="#94a3b8"/><text x="776" y="283" font-size="18" font-weight="700">backend.free(chunk)</text><text x="776" y="308" font-size="15" font-weight="400">Return slot to device’s free list</text><path d="M153 184L153 255" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M278 291L355 291" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="316.5" y="282.0" text-anchor="middle" font-size="14">ready</text><path d="M685 291L762 291" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="723.5" y="282.0" text-anchor="middle" font-size="14">count = 0</text><text x="28" y="390" font-size="21" font-weight="700">Your backend obligations</text><rect x="28" y="418" width="330" height="72" rx="10" fill="#ffedd5" stroke="#94a3b8"/><text x="42" y="446" font-size="18" font-weight="700">Allocation</text><text x="42" y="471" font-size="15" font-weight="400">No overlapping live slots</text><rect x="381" y="418" width="330" height="72" rx="10" fill="#ffedd5" stroke="#94a3b8"/><text x="395" y="446" font-size="18" font-weight="700">Mapping</text><text x="395" y="471" font-size="15" font-weight="400">Stable address, size, alignment</text><rect x="734" y="418" width="358" height="72" rx="10" fill="#ffedd5" stroke="#94a3b8"/><text x="748" y="446" font-size="18" font-weight="700">Byte contract</text><text x="748" y="471" font-size="15" font-weight="400">CPU-readable; frozen while shared</text><rect x="28" y="510" width="330" height="72" rx="10" fill="#ffedd5" stroke="#94a3b8"/><text x="42" y="538" font-size="18" font-weight="700">Reuse</text><text x="42" y="563" font-size="15" font-weight="400">Only after Zenoh releases the slot</text><rect x="381" y="510" width="330" height="72" rx="10" fill="#ffedd5" stroke="#94a3b8"/><text x="395" y="538" font-size="18" font-weight="700">Device lifetime</text><text x="395" y="563" font-size="15" font-weight="400">Hold owner until DMA / GPU done</text><rect x="734" y="510" width="358" height="72" rx="10" fill="#ffedd5" stroke="#94a3b8"/><text x="748" y="538" font-size="18" font-weight="700">Exhaustion</text><text x="748" y="563" font-size="15" font-weight="400">Wait / drop new frame / spill</text><text x="28" y="625" font-size="14" font-weight="400">GPU-only or special BAR access → descriptor transport + custom leases. Dora needs a provider/import hook for this path.</text></g></svg>