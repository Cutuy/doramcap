<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#475569"/></marker></defs><rect width="1120" height="660" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#0f172a"><text x="28" y="40" font-size="26" font-weight="700">2 / Zenoh pool internals</text><text x="28" y="70" font-size="16" fill="#475569">VERIFIED · zenoh-shm 1.10.1 · Default POSIX backend uses Talc.</text><rect x="28" y="115" width="260" height="72" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="42" y="143" font-size="18" font-weight="700">POSIX data segment</text><text x="42" y="168" font-size="15" font-weight="400">Reusable, variable-size chunks</text><rect x="35" y="207" width="60" height="45" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="49" y="235" font-size="18" font-weight="700">free</text><rect x="99" y="207" width="60" height="45" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="113" y="235" font-size="18" font-weight="700">A</text><rect x="163" y="207" width="60" height="45" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="177" y="235" font-size="18" font-weight="700">B</text><rect x="227" y="207" width="60" height="45" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="241" y="235" font-size="18" font-weight="700">free</text><rect x="365" y="115" width="360" height="72" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="379" y="143" font-size="18" font-weight="700">ShmProvider</text><text x="379" y="168" font-size="15" font-weight="400">Backend allocator + busy-chunk list</text><rect x="802" y="115" width="290" height="72" rx="10" fill="#ede9fe" stroke="#94a3b8"/><text x="816" y="143" font-size="18" font-weight="700">Shared metadata</text><text x="816" y="168" font-size="15" font-weight="400">refcount · generation · validity</text><path d="M288 151L365 151" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="326.5" y="142.0" text-anchor="middle" font-size="14">alloc</text><path d="M725 151L802 151" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="763.5" y="142.0" text-anchor="middle" font-size="14">attach</text><rect x="28" y="310" width="235" height="72" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="42" y="338" font-size="18" font-weight="700">ZShmMut</text><text x="42" y="363" font-size="15" font-weight="400">Exclusive mutable access</text><rect x="331" y="310" width="235" height="72" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="345" y="338" font-size="18" font-weight="700">ZShm / ZBytes</text><text x="345" y="363" font-size="15" font-weight="400">Shared immutable ownership</text><rect x="634" y="310" width="210" height="72" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="648" y="338" font-size="18" font-weight="700">Other processes</text><text x="648" y="363" font-size="15" font-weight="400">Map + retain owner</text><rect x="912" y="310" width="180" height="72" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="926" y="338" font-size="18" font-weight="700">Drop</text><text x="926" y="363" font-size="15" font-weight="400">release reference</text><path d="M263 346L331 346" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="297.0" y="337.0" text-anchor="middle" font-size="14">publish</text><path d="M566 346L634 346" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="600.0" y="337.0" text-anchor="middle" font-size="14">descriptor</text><path d="M844 346L912 346" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="28" y="450" width="315" height="72" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="42" y="478" font-size="18" font-weight="700">Rust: local borrowing</text><text x="42" y="503" font-size="15" font-weight="400">Move ends producer’s mutable access</text><rect x="390" y="450" width="315" height="72" rx="10" fill="#ede9fe" stroke="#94a3b8"/><text x="404" y="478" font-size="18" font-weight="700">Runtime: shared atomics</text><text x="404" y="503" font-size="15" font-weight="400">Inner clone +1 / inner drop −1</text><rect x="752" y="450" width="340" height="72" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="766" y="478" font-size="18" font-weight="700">Safe GC: refcount == 0</text><text x="766" y="503" font-size="15" font-weight="400">backend.free(chunk) → reusable</text><path d="M1002 382L1002 450" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="28" y="570" font-size="18" font-weight="700">Retained owner + count == 1 + valid → mutable conversion can succeed.</text><text x="28" y="605" font-size="16" font-weight="400">count &gt; 1 → no safe mutable access. Raw pointers and DMA must obey the same rule.</text><text x="28" y="638" font-size="14" font-weight="400">Watchdog invalidation alone does not authorize safe reuse; forced GC has an unsafe no-race contract.</text></g></svg>