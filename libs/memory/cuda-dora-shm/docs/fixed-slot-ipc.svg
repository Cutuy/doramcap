<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="870" viewBox="0 0 1120 870" role="img" aria-labelledby="title desc"><title id="title">Dora fixed-slot CUDA host-memory IPC</title><desc id="desc">Producer and multiple consumers independently mmap and register shared tmpfs pages. Dora carries descriptors. Ready and Done events order GPU accesses. Generation reuse requires all returns and completed events.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#52647d"/></marker></defs><rect width="1120" height="870" fill="#f6f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17283c} .title{font-size:24px;font-weight:bold}.sub{font-size:14px;fill:#52647d}.head{font-size:17px;font-weight:bold}.label{font-size:15px}.edge{fill:none;stroke:#52647d;stroke-width:2;marker-end:url(#arrow)}</style><text x="32" y="40" class="title">Fixed slots · one producer · N consumer processes</text><text x="32" y="65" class="sub">Same Linux host + GPU • fixed membership • ordinary host RAM • no CUDA IPC memory handles</text><text x="24" y="105" class="head">API</text><path d="M24 117 H1096" stroke="#dbe3ef"/><text x="24" y="290" class="head">POOL</text><path d="M24 302 H1096" stroke="#dbe3ef"/><text x="24" y="485" class="head">FENCES</text><path d="M24 497 H1096" stroke="#dbe3ef"/><text x="24" y="685" class="head">MEMORY</text><path d="M24 697 H1096" stroke="#dbe3ef"/><rect x="140" y="135" width="310" height="102" rx="9" fill="#fff" stroke="#bdcadd"/><text x="154" y="160" class="head">Producer application</text><text x="154" y="182" class="label">try_acquire → scoped writer</text><text x="154" y="204" class="label">queue kernel → publish metadata</text><rect x="525" y="135" width="180" height="102" rx="9" fill="#e4efff" stroke="#bdcadd"/><text x="539" y="160" class="head">Dora native IPC</text><text x="539" y="182" class="label">Manifest / Frame</text><text x="539" y="204" class="label">Returned / Closed</text><rect x="780" y="135" width="310" height="102" rx="9" fill="#fff" stroke="#bdcadd"/><text x="794" y="160" class="head">Consumer applications × N</text><text x="794" y="182" class="label">begin → chosen stream → read</text><text x="794" y="204" class="label">finish → send Returned</text><path d="M450 161 H525" class="edge"/><text x="450" y="127" class="sub">Frame(slot, gen, len)</text><path d="M705 161 H780" class="edge"/><path d="M780 218 H705" class="edge"/><path d="M525 218 H450" class="edge"/><text x="450" y="257" class="sub">Returned(slot, gen, peer)</text><rect x="140" y="320" width="310" height="125" rx="9" fill="#e4efff" stroke="#bdcadd"/><text x="154" y="345" class="head">Producer adapter / ledger</text><text x="154" y="367" class="label">Free → Writing → Published</text><text x="154" y="389" class="label">Reserve every configured reader</text><text x="154" y="411" class="label">Full → None (backpressure)</text><rect x="780" y="320" width="310" height="125" rx="9" fill="#e4efff" stroke="#bdcadd"/><text x="794" y="345" class="head">Consumer adapter × N</text><text x="794" y="367" class="label">Validate generation</text><text x="794" y="389" class="label">Local read lease retains mapping</text><text x="794" y="411" class="label">No further use after finish</text><path d="M285 237 V320" class="edge"/><path d="M935 237 V320" class="edge"/><rect x="140" y="515" width="310" height="125" rx="9" fill="#fff0d8" stroke="#bdcadd"/><text x="154" y="540" class="head">Ready[slot] — producer-owned</text><text x="154" y="562" class="label">Record after writes in stream</text><text x="154" y="584" class="label">Publish while GPU is pending</text><text x="154" y="606" class="label">Re-record only after reclamation</text><rect x="780" y="515" width="310" height="125" rx="9" fill="#fff0d8" stroke="#bdcadd"/><text x="794" y="540" class="head">Done[peer, slot] — reader-owned</text><text x="794" y="562" class="label">Stream wait Ready → read kernel</text><text x="794" y="584" class="label">Record Done → return immediately</text><text x="794" y="606" class="label">Event handle cached at attach</text><rect x="495" y="340" width="240" height="105" rx="9" fill="#e1f4e9" stroke="#bdcadd"/><text x="509" y="365" class="head">Reclamation gate</text><text x="509" y="387" class="label">All Returned(generation)</text><text x="509" y="409" class="label">AND Ready + all Done complete</text><path d="M780 384 H735" class="edge"/><text x="737" y="375" class="sub">returns</text><path d="M495 384 H450" class="edge"/><text x="457" y="375" class="sub">reuse</text><path d="M285 445 V515" class="edge"/><path d="M935 445 V515" class="edge"/><path d="M450 554 H780" class="edge"/><text x="463" y="545" class="sub">Ready handle / GPU stream dependency</text><path d="M780 610 H615 V445" class="edge"/><text x="475" y="636" class="sub">CPU event queries (no callbacks)</text><path d="M450 610 H495 V445" class="edge"/><rect x="140" y="715" width="310" height="102" rx="9" fill="#fff" stroke="#bdcadd"/><text x="154" y="740" class="head">Producer mapping</text><text x="154" y="762" class="label">mmap + mlock (entire ring)</text><text x="154" y="784" class="label">cudaHostRegister → device alias</text><rect x="780" y="715" width="310" height="102" rx="9" fill="#fff" stroke="#bdcadd"/><text x="794" y="740" class="head">Each consumer mapping</text><text x="794" y="762" class="label">mmap + mlock (entire ring)</text><text x="794" y="784" class="label">cudaHostRegister → device alias</text><rect x="495" y="715" width="240" height="102" rx="9" fill="#e1f4e9" stroke="#bdcadd"/><text x="509" y="740" class="head">Shared tmpfs pages</text><text x="509" y="762" class="label">/dev/shm/private/ring</text><text x="509" y="784" class="label">One backing; disjoint slots</text><path d="M285 640 V715" class="edge"/><path d="M935 640 V715" class="edge"/><path d="M450 768 H495" class="edge"/><path d="M780 768 H735" class="edge"/><text x="32" y="850" class="sub">Generation 42 stays reserved until every Done42 completes. Only then may the same slot carry generation 43.</text></svg>