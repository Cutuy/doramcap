<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="595" viewBox="0 0 1120 595"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#475569"/></marker></defs><rect width="1120" height="595" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#0f172a"><text x="28" y="40" font-size="26" font-weight="700">1 / Completion adapter</text><text x="28" y="70" font-size="16" fill="#475569">PROPOSED WRAPPER · Owns the buffer while GPU / DMA work is pending.</text><rect x="28" y="115" width="210" height="72" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="42" y="143" font-size="18" font-weight="700">Writable owner</text><text x="42" y="168" font-size="15" font-weight="400">Dora sample / slot</text><rect x="312" y="115" width="230" height="72" rx="10" fill="#ffedd5" stroke="#94a3b8"/><text x="326" y="143" font-size="18" font-weight="700">Pending write</text><text x="326" y="168" font-size="15" font-weight="400">buffer + completion fence</text><rect x="616" y="115" width="200" height="72" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="630" y="143" font-size="18" font-weight="700">Ready frame</text><text x="630" y="168" font-size="15" font-weight="400">publish / share</text><rect x="890" y="115" width="200" height="72" rx="10" fill="#ffedd5" stroke="#94a3b8"/><text x="904" y="143" font-size="18" font-weight="700">Pending read</text><text x="904" y="168" font-size="15" font-weight="400">owner + completion fence</text><path d="M238 151L312 151" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="275.0" y="142.0" text-anchor="middle" font-size="14">submit</text><path d="M542 151L616 151" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="579.0" y="142.0" text-anchor="middle" font-size="14">ready</text><path d="M816 151L890 151" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="853.0" y="142.0" text-anchor="middle" font-size="14">consume</text><path d="M990 187L990 244" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="1030.0" y="206.5" text-anchor="middle" font-size="14">done</text><rect x="805" y="244" width="285" height="72" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="819" y="272" font-size="18" font-weight="700">Release owner / ACK</text><text x="819" y="297" font-size="15" font-weight="400">Only after device completion</text><text x="28" y="245" font-size="18" font-weight="700">Drop or cancellation → completion worker keeps the owner</text><text x="28" y="282" font-size="16" font-weight="400">CPU access / network copy starts only after producer completion.</text><rect x="28" y="333" width="210" height="54" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="42" y="361" font-size="18" font-weight="700">Native Dora</text><rect x="272" y="333" width="360" height="54" rx="10" fill="#ffedd5" stroke="#94a3b8"/><text x="286" y="361" font-size="18" font-weight="700">Hold DataSample before send</text><rect x="666" y="333" width="424" height="54" rx="10" fill="#ffedd5" stroke="#94a3b8"/><text x="680" y="361" font-size="18" font-weight="700">Hold received buffer until GPU done</text><path d="M238 360L272 360" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M632 360L666 360" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="28" y="405" width="210" height="54" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="42" y="433" font-size="18" font-weight="700">Generic extension</text><rect x="272" y="405" width="360" height="54" rx="10" fill="#ffedd5" stroke="#94a3b8"/><text x="286" y="433" font-size="18" font-weight="700">Hold exclusive slot lease</text><rect x="666" y="405" width="424" height="54" rx="10" fill="#ffedd5" stroke="#94a3b8"/><text x="680" y="433" font-size="18" font-weight="700">Release slot lease / send ACK</text><path d="M238 432L272 432" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M632 432L666 432" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="28" y="477" width="210" height="54" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="42" y="505" font-size="18" font-weight="700">Tensor-pool</text><rect x="272" y="477" width="360" height="54" rx="10" fill="#ffedd5" stroke="#94a3b8"/><text x="286" y="505" font-size="18" font-weight="700">Order source work before write</text><rect x="666" y="477" width="424" height="54" rx="10" fill="#ffedd5" stroke="#94a3b8"/><text x="680" y="505" font-size="18" font-weight="700">Wait for GPU → send next_require</text><path d="M238 504L272 504" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M632 504L666 504" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="28" y="577" font-size="14" font-weight="400">Fence = CUDA event / driver completion. Native byte payloads require readiness before publication.</text></g></svg>