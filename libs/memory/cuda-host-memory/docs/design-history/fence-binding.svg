<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="890" viewBox="0 0 1380 890"><defs><marker id="owner" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#b45309" stroke-width="1.4"/></marker><marker id="cuda" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#7c3aed" stroke-width="1.4"/></marker><marker id="data" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#15803d" stroke-width="1.4"/></marker><marker id="msg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#2563eb" stroke-width="1.4"/></marker></defs><rect width="1380" height="890" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#0f172a"><text x="28" y="42" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#0f172a">Concrete example: slot 3, frame 42, CUDA event E17</text><text x="28" y="74" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">Proposed adapter · illustrative pointer and IDs · the binding lives in one owned job record</text><rect x="28" y="120" width="310" height="270" rx="12" fill="#dcfce7" stroke="#94a3b8"/><text x="44" y="151" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a">POOL A · SLOT 3</text><text x="48" y="188" font-family="monospace" font-size="19" font-weight="700" fill="#0f172a">pointer = 0x400000</text><text x="48" y="228" font-family="monospace" font-size="19" font-weight="700" fill="#0f172a">generation = 42</text><text x="48" y="268" font-family="monospace" font-size="19" font-weight="700" fill="#0f172a">state = WRITING</text><text x="48" y="325" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">Lease 42 is outstanding.</text><text x="48" y="355" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">Slot 3 cannot be reassigned.</text><rect x="468" y="120" width="405" height="270" rx="12" fill="#ffedd5" stroke="#94a3b8"/><text x="484" y="151" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a">ADAPTER · PENDING JOB #108</text><rect x="488" y="175" width="365" height="94" rx="12" fill="#fef3c7" stroke="#94a3b8"/><text x="504" y="206" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a">Owned lease</text><text x="505" y="241" font-family="monospace" font-size="17" font-weight="700" fill="#0f172a">{ pool: A, slot: 3, gen: 42 }</text><rect x="488" y="287" width="365" height="79" rx="12" fill="#ede9fe" stroke="#94a3b8"/><text x="504" y="318" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a">Owned CUDA event</text><text x="505" y="347" font-family="monospace" font-size="17" font-weight="700" fill="#0f172a">E17  → recorded on stream S0</text><path d="M338 220 H468" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#owner)"/><rect x="346" y="187" width="100" height="25" rx="4" fill="#f8fafc"/><text x="351" y="205" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#b45309">move lease</text><rect x="1003" y="120" width="349" height="270" rx="12" fill="#ede9fe" stroke="#94a3b8"/><text x="1019" y="151" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a">CUDA STREAM S0</text><text x="1023" y="190" font-family="monospace" font-size="19" font-weight="700" fill="#0f172a">fill_frame(0x400000)</text><text x="1023" y="219" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">writes frame 42</text><path d="M1178 234 V270" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#cuda)"/><text x="1023" y="302" font-family="monospace" font-size="18" font-weight="700" fill="#0f172a">cudaEventRecord(E17, S0)</text><text x="1023" y="346" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">E17 follows the frame write.</text><path d="M873 205 H1003" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#cuda)"/><rect x="900" y="172" width="64" height="25" rx="4" fill="#f8fafc"/><text x="905" y="190" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#7c3aed">submit</text><path d="M1003 330 H873" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#cuda)"/><rect x="919" y="297" width="37" height="25" rx="4" fill="#f8fafc"/><text x="924" y="315" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#7c3aed">E17</text><rect x="468" y="460" width="405" height="105" rx="12" fill="#ede9fe" stroke="#94a3b8"/><text x="484" y="491" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a">COMPLETION WORKER</text><text x="488" y="521" font-family="monospace" font-size="19" font-weight="700" fill="#0f172a">cudaEventQuery(job.event)</text><text x="488" y="549" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#0f172a">NotReady → retain this same job.</text><path d="M670 390 V460" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#owner)"/><rect x="681" y="414" width="127" height="25" rx="4" fill="#f8fafc"/><text x="686" y="432" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#b45309">owns job #108</text><rect x="28" y="460" width="310" height="105" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="44" y="491" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a">DORA PUBLICATION</text><text x="48" y="520" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">Receives the ready lease 42.</text><text x="48" y="547" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">Readers retain its ownership.</text><path d="M468 515 H338" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#msg)"/><rect x="360" y="482" width="73" height="25" rx="4" fill="#f8fafc"/><text x="365" y="500" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#2563eb">Success</text><rect x="1003" y="460" width="349" height="105" rx="12" fill="#f1f5f9" stroke="#94a3b8"/><text x="1019" y="491" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a">WHAT MATCHES THE FRAME?</text><text x="1023" y="519" font-family="monospace" font-size="18" font-weight="700" fill="#0f172a">job.lease and job.event</text><text x="1023" y="548" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">Kept together until completion.</text><rect x="28" y="632" width="1324" height="190" rx="12" fill="#f1f5f9" stroke="#94a3b8"/><text x="44" y="663" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a">LATER · after every reader / device user releases frame 42</text><rect x="48" y="690" width="365" height="105" rx="12" fill="#dcfce7" stroke="#94a3b8"/><text x="64" y="721" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a">Same physical slot</text><text x="65" y="750" font-family="monospace" font-size="20" font-weight="700" fill="#0f172a">slot 3 → 0x400000</text><text x="65" y="779" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">Now acquired as generation 43.</text><rect x="508" y="690" width="365" height="105" rx="12" fill="#ffedd5" stroke="#94a3b8"/><text x="524" y="721" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a">New pending job #109</text><text x="525" y="750" font-family="monospace" font-size="20" font-weight="700" fill="#0f172a">lease = (A, 3, 43)</text><text x="525" y="779" font-family="monospace" font-size="20" font-weight="700" fill="#0f172a">event = E18</text><rect x="968" y="690" width="364" height="105" rx="12" fill="#ede9fe" stroke="#94a3b8"/><text x="984" y="721" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a">Old job #108 is retired</text><text x="985" y="750" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">E17 stays associated with 42.</text><text x="985" y="779" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">It cannot complete job #109.</text><path d="M413 741 H508" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#owner)"/><rect x="420" y="708" width="73" height="25" rx="4" fill="#f8fafc"/><text x="425" y="726" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#b45309">acquire</text><text x="28" y="864" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">The generation is in the lease record. CUDA E17 has no knowledge of “slot 3” or “generation 42”.</text></g></svg>