rx="12" fill="#ede9fe" stroke="#94a3b8"/><text x="48" y="314" font-size="18" font-weight="700">Local tensor-pool implementation</text><text x="48" y="340" font-size="16" font-weight="400">Shared segments • seqlock • pinned host memory</text><text x="48" y="363" font-size="16" font-weight="400">CUDA DMA / IPC paths</text><rect x="603" y="285" width="485" height="110" rx="12" fill="#ede9fe" stroke="#94a3b8"/><text x="619" y="314" font-size="18" font-weight="700">Remote extension implementation</text><text x="619" y="340" font-size="16" font-weight="400">Daemon-side mirror segments</text><text x="619" y="363" font-size="16" font-weight="400">Dedicated TCP data path</text><path d="M174,215 L174,285" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M945,215 L945,285" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M517,340 L603,340" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="32" y="438" font-size="20" font-weight="700">Evaluate as prior work; do not assume immutable per-frame leases.</text><text x="32" y="474" font-size="16" font-weight="400">Upstream reports known cleanup defects and no automated GPU-path coverage.</text><text x="32" y="505" font-size="14" font-weight="400">Not covered by Dora’s stable API guarantee. CUDA events / safe slot reuse need a source-level audit.</text></g></svg>