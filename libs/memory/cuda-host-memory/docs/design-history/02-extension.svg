<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs><rect width="1120" height="530" rx="18" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#0f172a"><text x="32" y="42" font-size="26" font-weight="700">2 / Dora generic extension</text><text x="32" y="72" font-size="16" fill="#475569">EXISTING INTERFACE • Dora routes handles and manages descriptor lifecycle; the extension defines buffer semantics.</text><rect x="32" y="110" width="285" height="105" rx="12" fill="#ffedd5" stroke="#94a3b8"/><text x="48" y="139" font-size="18" font-weight="700">Producer adapter</text><text x="48" y="165" font-size="16" font-weight="400">Register pool descriptor</text><text x="48" y="188" font-size="16" font-weight="400">Publish frame handle</text><rect x="418" y="110" width="284" height="105" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="434" y="139" font-size="18" font-weight="700">Dora IPC</text><text x="434" y="165" font-size="16" font-weight="400">Normal output / input</text><text x="434" y="188" font-size="16" font-weight="400">Pool + slot + generation</text><rect x="803" y="110" width="285" height="105" rx="12" fill="#ffedd5" stroke="#94a3b8"/><text x="819" y="139" font-size="18" font-weight="700">Consumer adapter</text><text x="819" y="165" font-size="16" font-weight="400">Resolve / import allocation</text><text x="819" y="188" font-size="16" font-weight="400">Acquire and release use</text><path d="M317,160 L418,160" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="367.5" y="150.0" text-anchor="middle" font-size="14" fill="#334155">handle</text><path d="M702,160 L803,160" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="752.5" y="150.0" text-anchor="middle" font-size="14" fill="#334155">handle</text><rect x="32" y="285" width="425" height="110" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="48" y="314" font-size="18" font-weight="700">Dora extension registry</text><text x="48" y="340" font-size="16" font-weight="400">Opaque descriptor store / load / drop</text><text x="48" y="363" font-size="16" font-weight="400">Owner-exit and removal notifications</text><rect x="558" y="285" width="530" height="110" rx="12" fill="#ffedd5" stroke="#94a3b8"/><text x="574" y="314" font-size="18" font-weight="700">Extension-owned memory transport</text><text x="574" y="340" font-size="16" font-weight="400">Map pool • track readers • wait for DMA / GPU</text><text x="574" y="363" font-size="16" font-weight="400">Define slot reuse • define remote transfer</text><path d="M174,215 L174,285" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M945,215 L945,285" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M457,340 L558,340" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="507.5" y="330.0" text-anchor="middle" font-size="14" fill="#334155">lookup</text><text x="32" y="441" font-size="20" font-weight="700">REGISTRY LIFETIME ≠ FRAME-READER LIFETIME</text><text x="32" y="476" font-size="16" font-weight="400">A custom extension must supply leases and fences, or delegate them to a suitable existing backend.</text><text x="32" y="506" font-size="14" font-weight="400">The extension interface alone does not protect a ring slot against overwrite.</text></g></svg>