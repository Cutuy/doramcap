<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="735" viewBox="0 0 1120 735"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#475569"/></marker></defs><rect width="1120" height="735" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#0f172a"><text x="28" y="40" font-size="26" font-weight="700">4 / Tensor-pool internals</text><text x="28" y="70" font-size="16" fill="#475569">VERIFIED UPSTREAM · Persistent overwriteable storage; caller-controlled reuse.</text><rect x="28" y="110" width="240" height="72" rx="10" fill="#ede9fe" stroke="#94a3b8"/><text x="42" y="138" font-size="18" font-weight="700">Producer tensor</text><text x="42" y="163" font-size="15" font-weight="400">CPU or GPU</text><rect x="350" y="110" width="420" height="72" rx="10" fill="#ede9fe" stroke="#94a3b8"/><text x="364" y="138" font-size="18" font-weight="700">write_tensor_pool</text><text x="364" y="163" font-size="15" font-weight="400">Copy into persistent pool storage</text><rect x="852" y="110" width="240" height="72" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="866" y="138" font-size="18" font-weight="700">Dora output</text><text x="866" y="163" font-size="15" font-weight="400">Pool ID</text><path d="M268 146L350 146" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M770 146L852 146" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="28" y="244" width="320" height="72" rx="10" fill="#ede9fe" stroke="#94a3b8"/><text x="42" y="272" font-size="18" font-weight="700">DORADMA header</text><text x="42" y="297" font-size="15" font-weight="400">IPC handle · write_gen · layout</text><rect x="400" y="244" width="300" height="72" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="414" y="272" font-size="18" font-weight="700">Host payload</text><text x="414" y="297" font-size="15" font-weight="400">Shared segment / pinned RAM</text><rect x="752" y="244" width="340" height="72" rx="10" fill="#ede9fe" stroke="#94a3b8"/><text x="766" y="272" font-size="18" font-weight="700">GPU payload</text><text x="766" y="297" font-size="15" font-weight="400">Persistent cudaMalloc allocation</text><path d="M530 182L550 244" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M650 182L922 244" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="35" y="350" font-size="18" font-weight="700">write_gen: even → odd → write completes → even</text><text x="35" y="383" font-size="16" font-weight="400">CUDA copy helpers call cudaMemcpy + cudaDeviceSynchronize.</text><rect x="28" y="425" width="320" height="72" rx="10" fill="#ede9fe" stroke="#94a3b8"/><text x="42" y="453" font-size="18" font-weight="700">CPU read</text><text x="42" y="478" font-size="15" font-weight="400">Cached mmap → tensor view</text><rect x="400" y="425" width="300" height="72" rx="10" fill="#ede9fe" stroke="#94a3b8"/><text x="414" y="453" font-size="18" font-weight="700">GPU IPC read</text><text x="414" y="478" font-size="15" font-weight="400">Cached import → device pointer</text><rect x="752" y="425" width="340" height="72" rx="10" fill="#ede9fe" stroke="#94a3b8"/><text x="766" y="453" font-size="18" font-weight="700">Remote GPU read</text><text x="766" y="478" font-size="15" font-weight="400">Mirror RAM → cached GPU buffer</text><path d="M550 316L188 425" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M922 316L550 425" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M922 316L922 425" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="28" y="555" width="310" height="72" rx="10" fill="#ffedd5" stroke="#94a3b8"/><text x="42" y="583" font-size="18" font-weight="700">Consumer work</text><text x="42" y="608" font-size="15" font-weight="400">Finish CPU reads / GPU kernels</text><rect x="405" y="555" width="310" height="72" rx="10" fill="#ffedd5" stroke="#94a3b8"/><text x="419" y="583" font-size="18" font-weight="700">Application ACK</text><text x="419" y="608" font-size="15" font-weight="400">e.g. next_require</text><rect x="782" y="555" width="310" height="72" rx="10" fill="#ede9fe" stroke="#94a3b8"/><text x="796" y="583" font-size="18" font-weight="700">Next overwrite</text><text x="796" y="608" font-size="15" font-weight="400">Producer may now reuse pool</text><path d="M338 591L405 591" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M715 591L782 591" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="28" y="676" font-size="19" font-weight="700">Seqlock re-check covers the read call; the returned view has no reader lease.</text><text x="28" y="710" font-size="15" font-weight="400">No per-frame Zenoh ownership here. Mapping caches preserve addresses; caller ACKs protect reuse.</text></g></svg>