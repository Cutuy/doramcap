<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><marker id="msg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#2563eb"/></marker><marker id="gpu" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#7c3aed"/></marker><marker id="own" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#b45309"/></marker></defs><rect width="1440" height="1080" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#0f172a"><text x="28" y="40" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#0f172a">Slot 3: frame 42 → frame 43, with immediate descriptor publication</text><text x="28" y="73" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">Concrete proposed workflow · one producer, one local consumer · event handles are illustrative</text><rect x="28" y="105" width="425" height="790" rx="12" fill="white" stroke="#cbd5e1"/><text x="43" y="137" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">PRODUCER CPU / STREAM P</text><rect x="493" y="105" width="320" height="790" rx="12" fill="white" stroke="#cbd5e1"/><text x="508" y="137" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">DORA IPC / POOL</text><rect x="853" y="105" width="559" height="790" rx="12" fill="white" stroke="#cbd5e1"/><text x="868" y="137" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">CONSUMER CPU / STREAM C</text><rect x="48" y="167" width="385" height="91" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="63" y="196" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Acquire slot 3</text><text x="63" y="222" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">Lease = (pool A, slot 3, gen 42)</text><text x="63" y="246" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">Device pointer = 0x400000</text><rect x="48" y="291" width="385" height="111" rx="10" fill="#ede9fe" stroke="#94a3b8"/><text x="63" y="320" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Queue on producer stream P</text><text x="63" y="346" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">fill_frame_42(ptr)</text><text x="63" y="370" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">cudaEventRecord(E17, P)</text><text x="63" y="394" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">E17 is recorded; may still be pending.</text><path d="M240 258 V291" fill="none" stroke="#b45309" stroke-width="2.3" marker-end="url(#own)"/><rect x="513" y="320" width="280" height="111" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="528" y="349" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Reserve + publish</text><text x="528" y="375" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">Reserve delivery lease 42.</text><text x="528" y="399" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">Send (A, 3, 42, IPC(E17)).</text><text x="528" y="423" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">Payload stays in place.</text><path d="M433 346 H513" fill="none" stroke="#2563eb" stroke-width="2.3" marker-end="url(#msg)"/><rect x="873" y="320" width="519" height="111" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="888" y="349" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Receive descriptor while frame 42 is pending</text><text x="888" y="375" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">Import memory + E17; adopt reserved reader lease 42.</text><text x="888" y="399" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">Choose consumer stream C.</text><path d="M793 374 H873" fill="none" stroke="#2563eb" stroke-width="2.3" marker-end="url(#msg)"/><rect x="873" y="470" width="519" height="111" rx="10" fill="#ede9fe" stroke="#94a3b8"/><text x="888" y="499" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Queue on consumer stream C</text><text x="888" y="525" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">cudaStreamWaitEvent(C, E17, 0)</text><text x="888" y="549" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">consume_frame_42(ptr); cudaEventRecord(D42, C)</text><text x="888" y="573" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">Wait is queued; consumer CPU can continue.</text><path d="M1130 431 V470" fill="none" stroke="#7c3aed" stroke-width="2.3" marker-end="url(#gpu)"/><rect x="48" y="470" width="385" height="111" rx="10" fill="#ede9fe" stroke="#94a3b8"/><text x="63" y="499" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Producer writes finish</text><text x="63" y="525" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">E17 completes.</text><text x="63" y="549" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">Release producer’s writer lease 42.</text><text x="63" y="573" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">Delivery / reader lease protects slot 3.</text><path d="M240 402 V470" fill="none" stroke="#7c3aed" stroke-width="2.3" marker-end="url(#gpu)"/><path d="M433 518 H873" fill="none" stroke="#7c3aed" stroke-width="2.3" marker-end="url(#gpu)"/><rect x="458" y="487" width="347.29999999999995" height="24" rx="3" fill="#f8fafc"/><text x="462" y="505" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#7c3aed">E17 completion releases stream C’s wait</text><rect x="873" y="620" width="519" height="91" rx="10" fill="#ede9fe" stroke="#94a3b8"/><text x="888" y="649" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Consumer kernel finishes</text><text x="888" y="675" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">D42 completes → release reader lease 42.</text><text x="888" y="699" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">Earlier receipt / wait submission does not release it.</text><path d="M1130 581 V620" fill="none" stroke="#7c3aed" stroke-width="2.3" marker-end="url(#gpu)"/><rect x="513" y="646" width="280" height="91" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="528" y="675" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Slot 3 becomes reusable</text><text x="528" y="701" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">Writer done + reader done</text><text x="528" y="725" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">All gen 42 leases released.</text><path d="M873 672 H793" fill="none" stroke="#b45309" stroke-width="2.3" marker-end="url(#own)"/><path d="M240 581 V692 H513" fill="none" stroke="#b45309" stroke-width="2.3" marker-end="url(#own)"/><rect x="273" y="662" width="138.5" height="24" rx="3" fill="#f8fafc"/><text x="277" y="680" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#b45309">writer released</text><rect x="48" y="785" width="385" height="91" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="63" y="814" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Acquire slot 3 again</text><text x="63" y="840" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">Same pointer: 0x400000</text><text x="63" y="864" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">New lease: (A, 3, 43); new event: E18</text><path d="M653 737 V830 H433" fill="none" stroke="#b45309" stroke-width="2.3" marker-end="url(#own)"/><rect x="485" y="800" width="129.79999999999998" height="24" rx="3" fill="#f8fafc"/><text x="489" y="818" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#b45309">reuse only now</text><rect x="873" y="785" width="519" height="91" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="888" y="814" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Frame 43 uses a new dependency</text><text x="888" y="840" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">Receive (A, 3, 43, IPC(E18)).</text><text x="888" y="864" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">Stream C waits on E18; completion event is D43.</text><path d="M433 859 H873" fill="none" stroke="#2563eb" stroke-width="2.3" marker-end="url(#msg)"/><rect x="473" y="830" width="242.89999999999998" height="24" rx="3" fill="#f8fafc"/><text x="477" y="848" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#2563eb">record E18 → publish gen 43</text><rect x="28" y="927" width="1384" height="110" rx="10" fill="#fff7ed" stroke="#94a3b8"/><text x="43" y="956" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">The binding is explicit and remains stable until that use retires</text><text x="43" y="982" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">Frame 42: lease (A,3,42) ↔ readiness E17 ↔ consumer completion D42</text><text x="43" y="1006" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">Frame 43: lease (A,3,43) ↔ readiness E18 ↔ consumer completion D43</text><text x="28" y="1065" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">With multiple consumers, each retains a lease until its own completion. Zero consumers still requires the writer to finish.</text></g></svg>