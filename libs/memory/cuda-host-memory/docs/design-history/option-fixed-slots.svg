<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960"><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#2563eb"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#b45309"/></marker><marker id="q" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#7c3aed"/></marker><marker id="d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#15803d"/></marker></defs><rect width="1440" height="960" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#0f172a"><text x="28" y="42" font-size="28" font-weight="700" fill="#0f172a">B / Fixed-slot pool — recommended for frames</text><text x="28" y="74" font-size="17" font-weight="400" fill="#0f172a">PROPOSED · immediate descriptors · local CPU polling · aggregate ownership · no CUDA host callbacks</text><rect x="28" y="120" width="350" height="104" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="43" y="149" font-size="20" font-weight="700" fill="#0f172a">Producer API</text><text x="43" y="175" font-size="16" font-weight="400" fill="#0f172a">acquire(max_frame_size)</text><text x="43" y="198" font-size="16" font-weight="400" fill="#0f172a">No capacity → await credit / try-acquire</text><text x="43" y="221" font-size="16" font-weight="400" fill="#0f172a">No silent heap or VRAM growth</text><rect x="548" y="120" width="344" height="104" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="563" y="149" font-size="20" font-weight="700" fill="#0f172a">Dora / Zenoh routing</text><text x="563" y="175" font-size="16" font-weight="400" fill="#0f172a">Lease-bearing descriptor + ready event</text><text x="563" y="198" font-size="16" font-weight="400" fill="#0f172a">Reserve ownership before delivery</text><text x="563" y="221" font-size="16" font-weight="400" fill="#0f172a">Dynamic subscriber fan-out</text><rect x="1062" y="120" width="350" height="104" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="1077" y="149" font-size="20" font-weight="700" fill="#0f172a">Consumers 1 … N</text><text x="1077" y="175" font-size="16" font-weight="400" fill="#0f172a">CPU / GPU / DMA adapters</text><text x="1077" y="198" font-size="16" font-weight="400" fill="#0f172a">Also: source-side network bridge</text><text x="1077" y="221" font-size="16" font-weight="400" fill="#0f172a">Each owns its received lease</text><path d="M378 160 H548" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#m)"/><rect x="402" y="130" width="99.30000000000001" height="23" fill="#f8fafc" rx="3"/><text x="406" y="147" font-size="15" font-weight="400" fill="#2563eb">publish now</text><path d="M892 160 H1062" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#m)"/><rect x="924" y="130" width="91.0" height="23" fill="#f8fafc" rx="3"/><text x="928" y="147" font-size="15" font-weight="400" fill="#2563eb">descriptor</text><rect x="458" y="304" width="524" height="134" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="473" y="333" font-size="20" font-weight="700" fill="#0f172a">Preallocated payload slots</text><text x="473" y="359" font-size="16" font-weight="400" fill="#0f172a">N slots × S bytes; logical length ≤ S</text><text x="473" y="382" font-size="16" font-weight="400" fill="#0f172a">Free-slot queue; optional several size classes</text><rect x="478" y="396" width="87" height="26" rx="4" fill="#bbf7d0"/><text x="490" y="414" font-size="14" font-weight="400" fill="#0f172a">free</text><rect x="576" y="396" width="87" height="26" rx="4" fill="#bfdbfe"/><text x="588" y="414" font-size="14" font-weight="400" fill="#0f172a">g42</text><rect x="674" y="396" width="87" height="26" rx="4" fill="#bfdbfe"/><text x="686" y="414" font-size="14" font-weight="400" fill="#0f172a">busy</text><rect x="772" y="396" width="87" height="26" rx="4" fill="#bbf7d0"/><text x="784" y="414" font-size="14" font-weight="400" fill="#0f172a">free</text><rect x="870" y="396" width="87" height="26" rx="4" fill="#bfdbfe"/><text x="882" y="414" font-size="14" font-weight="400" fill="#0f172a">busy</text><path d="M458 345 H203 V224" fill="none" stroke="#15803d" stroke-width="2.2" marker-end="url(#d)"/><rect x="226" y="315" width="115.9" height="23" fill="#f8fafc" rx="3"/><text x="230" y="332" font-size="15" font-weight="400" fill="#15803d">payload lease</text><path d="M982 345 H1237 V224" fill="none" stroke="#15803d" stroke-width="2.2" marker-end="url(#d)"/><rect x="1006" y="315" width="99.30000000000001" height="23" fill="#f8fafc" rx="3"/><text x="1010" y="332" font-size="15" font-weight="400" fill="#15803d">mapped data</text><rect x="458" y="512" width="524" height="104" rx="10" fill="#ffedd5" stroke="#94a3b8"/><text x="473" y="541" font-size="20" font-weight="700" fill="#0f172a">Ownership bridge / reclaim service *</text><text x="473" y="567" font-size="16" font-weight="400" fill="#0f172a">Producer + delivery + reader leases</text><text x="473" y="590" font-size="16" font-weight="400" fill="#0f172a">Last lease released → reclaim range / slot</text><text x="473" y="613" font-size="16" font-weight="400" fill="#0f172a">Wake a capacity waiter; producer knows no readers</text><path d="M720 512 V438" fill="none" stroke="#b45309" stroke-width="2.2" marker-end="url(#r)"/><rect x="735" y="462" width="132.5" height="23" fill="#f8fafc" rx="3"/><text x="739" y="479" font-size="15" font-weight="400" fill="#b45309">return capacity</text><rect x="28" y="512" width="350" height="104" rx="10" fill="#ede9fe" stroke="#94a3b8"/><text x="43" y="541" font-size="20" font-weight="700" fill="#0f172a">Producer CPU poller</text><text x="43" y="567" font-size="16" font-weight="400" fill="#0f172a">Query ready event; retain writer lease</text><text x="43" y="590" font-size="16" font-weight="400" fill="#0f172a">On success: release writer lease</text><text x="43" y="613" font-size="16" font-weight="400" fill="#0f172a">Covers zero-subscriber publications</text><rect x="1062" y="512" width="350" height="104" rx="10" fill="#ede9fe" stroke="#94a3b8"/><text x="1077" y="541" font-size="20" font-weight="700" fill="#0f172a">Per-process consumer CPU poller</text><text x="1077" y="567" font-size="16" font-weight="400" fill="#0f172a">Query done events; retain reader leases</text><text x="1077" y="590" font-size="16" font-weight="400" fill="#0f172a">On success: release completed leases</text><text x="1077" y="613" font-size="16" font-weight="400" fill="#0f172a">CPU readers release after CPU use</text><path d="M378 565 H458" fill="none" stroke="#b45309" stroke-width="2.2" marker-end="url(#r)"/><rect x="383" y="534" width="66.10000000000001" height="23" fill="#f8fafc" rx="3"/><text x="387" y="551" font-size="15" font-weight="400" fill="#b45309">release</text><path d="M1062 565 H982" fill="none" stroke="#b45309" stroke-width="2.2" marker-end="url(#r)"/><rect x="989" y="534" width="66.10000000000001" height="23" fill="#f8fafc" rx="3"/><text x="993" y="551" font-size="15" font-weight="400" fill="#b45309">release</text><rect x="28" y="704" width="350" height="83" rx="10" fill="#ede9fe" stroke="#94a3b8"/><text x="43" y="733" font-size="20" font-weight="700" fill="#0f172a">Producer CUDA stream</text><text x="43" y="759" font-size="16" font-weight="400" fill="#0f172a">write → record ready event R[g]</text><rect x="1062" y="704" width="350" height="83" rx="10" fill="#ede9fe" stroke="#94a3b8"/><text x="1077" y="733" font-size="20" font-weight="700" fill="#0f172a">Each consumer CUDA stream</text><text x="1077" y="759" font-size="16" font-weight="400" fill="#0f172a">wait R[g] → read → record D[g]</text><rect x="458" y="704" width="234" height="83" rx="10" fill="#fef3c7" stroke="#94a3b8"/><text x="473" y="733" font-size="20" font-weight="700" fill="#0f172a">Ready event R[g]</text><text x="473" y="759" font-size="16" font-weight="400" fill="#0f172a">GPU completion status</text><rect x="748" y="704" width="234" height="83" rx="10" fill="#fef3c7" stroke="#94a3b8"/><text x="763" y="733" font-size="20" font-weight="700" fill="#0f172a">Done event D[g]</text><text x="763" y="759" font-size="16" font-weight="400" fill="#0f172a">Local to each consumer</text><path d="M378 746 H458" fill="none" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#q)"/><rect x="383" y="716" width="57.800000000000004" height="23" fill="#f8fafc" rx="3"/><text x="387" y="733" font-size="15" font-weight="400" fill="#7c3aed">record</text><path d="M1062 746 H982" fill="none" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#q)"/><rect x="987" y="716" width="57.800000000000004" height="23" fill="#f8fafc" rx="3"/><text x="991" y="733" font-size="15" font-weight="400" fill="#7c3aed">record</text><path d="M203 616 V659 H575 V704" fill="none" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#q)"/><rect x="225" y="632" width="198.9" height="23" fill="#f8fafc" rx="3"/><text x="229" y="649" font-size="15" font-weight="400" fill="#7c3aed">poll via cudaEventQuery</text><path d="M1237 616 V659 H865 V704" fill="none" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#q)"/><rect x="928" y="632" width="198.9" height="23" fill="#f8fafc" rx="3"/><text x="932" y="649" font-size="15" font-weight="400" fill="#7c3aed">poll via cudaEventQuery</text><text x="28" y="850" font-size="21" font-weight="700" fill="#0f172a">Two-way contract: readiness travels forward; released capacity travels back.</text><text x="28" y="885" font-size="16" font-weight="400" fill="#0f172a">* Reuse Zenoh reference tracking only through an explicit allocation-owning lease token. A plain pool ID is insufficient.</text><text x="28" y="919" font-size="16" font-weight="400" fill="#0f172a">All event queries and lease releases run on CPU workers. The producer stream never waits on individual reader events.</text></g></svg>