<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1110" viewBox="0 0 1040 1110" role="img"><title>Shared slot ownership and two-way CUDA fences</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#56718a"/></marker></defs><rect width="1040" height="1110" fill="#f7f9fc"/><style>text{font-family:Arial,sans-serif;fill:#19334b;font-size:16px}.title{font-size:23px;font-weight:600}.head{font-size:18px;font-weight:600}.small{font-size:14px;fill:#4c657b}.edge{fill:none;stroke:#56718a;stroke-width:2;marker-end:url(#a)}</style><text x="28" y="34" class="title">One shared slot. Separate local owners. Two-way fences.</text><text x="28" y="60" class="small">Proposed adapter • same machine • one consumer shown</text><text x="28" y="100" class="head">1   OWNERSHIP — retained before any work or message is queued</text><rect x="28" y="120" width="390" height="128" rx="9" fill="#ffffff" stroke="#9db0c2"/><text x="44" y="147" class="head">Producer process: Arc&lt;SlotOwner&gt;</text><text x="44" y="173" class="">CPU-use lease     |     queued GPU-use lease</text><text x="44" y="196" class="">Remote proxy lease: held before publication</text><text x="44" y="219" class="">Runtime access state: readers / writer</text><rect x="622" y="120" width="390" height="128" rx="9" fill="#ffffff" stroke="#9db0c2"/><text x="638" y="147" class="head">Consumer process: its own Arc</text><text x="638" y="173" class="">Owns the imported mapping + local leases</text><text x="638" y="196" class="">CPU and GPU uses tracked locally</text><text x="638" y="219" class="">Return only after all uses are accounted for</text><path d="M418 155H622" class="edge"/><text x="438" y="143" class="small">descriptor + Ready42</text><path d="M622 221H418" class="edge"/><text x="441" y="211" class="small">Return + Done42</text><rect x="260" y="295" width="520" height="95" rx="9" fill="#eaf2fa" stroke="#9db0c2"/><text x="276" y="322" class="head">Slot 7: shared physical storage</text><text x="276" y="348" class="">CPU and GPU can address these same bytes.</text><text x="276" y="371" class="">Coherence ≠ race prevention. Arc ≠ reader/writer lock.</text><path d="M220 248V342H260" class="edge"/><path d="M820 248V342H780" class="edge"/><text x="38" y="281" class="small">mapping</text><text x="912" y="281" class="small">mapping</text><text x="28" y="435" class="head">2   EXECUTION — fences order accesses to that same slot</text><rect x="28" y="456" width="310" height="100" rx="9" fill="#ffffff" stroke="#9db0c2"/><text x="44" y="483" class="head">Producer GPU stream</text><text x="44" y="509" class="">Write generation 42</text><text x="44" y="532" class="">Record Ready42</text><rect x="692" y="456" width="320" height="100" rx="9" fill="#ffffff" stroke="#9db0c2"/><text x="708" y="483" class="head">Consumer GPU stream</text><text x="708" y="509" class="">Wait Ready42 → read generation 42</text><text x="708" y="532" class="">Record Done42 after last GPU use</text><rect x="404" y="470" width="220" height="72" rx="9" fill="#e8f4ed" stroke="#9db0c2"/><text x="420" y="497" class="head">Ready42</text><text x="420" y="523" class="">GPU-write completion</text><path d="M338 506H404" class="edge"/><path d="M624 506H692" class="edge"/><rect x="404" y="596" width="220" height="72" rx="9" fill="#fff2df" stroke="#9db0c2"/><text x="420" y="623" class="head">Done42</text><text x="420" y="649" class="">GPU-read completion</text><path d="M852 556V632H624" class="edge"/><text x="788" y="604" class="small">return fence</text><rect x="28" y="596" width="310" height="95" rx="9" fill="#ffffff" stroke="#9db0c2"/><text x="44" y="623" class="head">Producer reuse dependency</text><text x="44" y="649" class="">All remote returns collected</text><text x="44" y="672" class="">Join every consumer’s Done42</text><path d="M404 632H338" class="edge"/><text x="28" y="727" class="head">3   REUSE — GPU waiting and CPU waiting are different</text><rect x="28" y="748" width="465" height="98" rx="9" fill="#e8f4ed" stroke="#9db0c2"/><text x="44" y="775" class="head">Next GPU write</text><text x="44" y="801" class="">Enqueue wait Done42 → write generation 43</text><text x="44" y="824" class="">CPU can enqueue before Done42 completes.</text><rect x="547" y="748" width="465" height="98" rx="9" fill="#fff2df" stroke="#9db0c2"/><text x="563" y="775" class="head">Next CPU write</text><text x="563" y="801" class="">Observe completion of every Done42 first</text><text x="563" y="824" class="">Then CPU may overwrite the host mapping.</text><path d="M180 691V748" class="edge"/><path d="M338 675H780V748" class="edge"/><text x="28" y="886" class="head">LOCAL Arc DETAIL — if you choose CUDA host callbacks</text><rect x="28" y="907" width="290" height="104" rx="9" fill="#ffffff" stroke="#9db0c2"/><text x="44" y="934" class="head">CPU submission thread</text><text x="44" y="960" class="">Clone lease before enqueue</text><text x="44" y="983" class="">Reserve read/write access</text><rect x="375" y="907" width="290" height="104" rx="9" fill="#ffffff" stroke="#9db0c2"/><text x="391" y="934" class="head">CUDA stream</text><text x="391" y="960" class="">GPU work</text><text x="391" y="983" class="">→ tail host callback</text><rect x="722" y="907" width="290" height="104" rx="9" fill="#ffffff" stroke="#9db0c2"/><text x="738" y="934" class="head">CPU callback thread</text><text x="738" y="960" class="">Release access + drop lease</text><text x="738" y="983" class="">No CUDA calls in destructor</text><path d="M318 960H375" class="edge"/><path d="M665 960H722" class="edge"/><text x="28" y="1047" class="head">No acquire callback is needed: the queued work already owns its lease.</text><text x="28" y="1077" class="small">Each Return transfers a pending completion obligation; receiving Return does not itself free the slot.</text></svg>