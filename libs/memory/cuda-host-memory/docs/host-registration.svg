<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img">
<title>Registered and managed allocation share checked CPU and GPU leases</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#49647e"/></marker></defs>
<rect width="960" height="470" fill="#f7f9fc"/>
<g font-family="sans-serif" font-size="17" fill="#18334b">
<text x="24" y="32" font-size="22">cuda-host-memory · two backends, one ownership API</text>
<g fill="white" stroke="#96aabd">
<rect x="24" y="65" width="410" height="100" rx="8"/>
<rect x="526" y="65" width="410" height="100" rx="8"/>
<rect x="240" y="225" width="480" height="80" rx="8"/>
<rect x="24" y="365" width="410" height="75" rx="8"/>
<rect x="526" y="365" width="410" height="75" rx="8"/>
</g>
<text x="40" y="95">Registered · default</text>
<text x="40" y="123">mmap → cudaHostRegister → device alias</text>
<text x="40" y="148">Cleanup: unregister → munmap</text>
<text x="542" y="95">Managed · explicit opt-in</text>
<text x="542" y="123">cudaMallocManaged → zero initialize</text>
<text x="542" y="148">Cleanup: cudaFree</text>
<text x="260" y="255">Arc-owned storage + runtime borrow state</text>
<text x="260" y="283">Shared readers / exclusive writer; completion tracking</text>
<text x="40" y="394">CPU read / write guards</text>
<text x="40" y="421">Safe slices; retain storage until guard drop</text>
<text x="542" y="394">GPU stream lease</text>
<text x="542" y="421">Unsafe enqueue; wait or drop retires access</text>
<g fill="none" stroke="#49647e" stroke-width="2" marker-end="url(#a)">
<path d="M229 165V200H355V225"/><path d="M731 165V200H605V225"/>
<path d="M355 305V335H229V365"/><path d="M605 305V335H731V365"/>
</g>
</g></svg>
