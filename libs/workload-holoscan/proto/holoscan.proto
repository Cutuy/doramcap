syntax = "proto3";
package doramcap.holoscan.v1;
import "launch.proto";
import "filesystem.proto";
import "cgroup.proto";
import "compose.proto";

// Existing CLI context. Both paths are absolute; native search settings stay in the project.
message DiscoverRequest {
  string project_root = 1;
  string cli = 2;
}

// Application identity within the source project supplied with the request.
message Selection {
  string application = 1;
  // Native language name; empty keeps the CLI default.
  string language = 2;
  // Empty retains the upstream default when no mode was selected.
  string mode = 3;
}

enum CatalogOutcome {
  CATALOG_OUTCOME_UNSPECIFIED = 0;
  CATALOG_OUTCOME_AVAILABLE = 1;
  CATALOG_OUTCOME_EMPTY = 2;
  CATALOG_OUTCOME_UNAVAILABLE = 3;
  CATALOG_OUTCOME_FAILED = 4;
}

// One complete discovery response, or retained observations when a query fails.
message Catalog {
  string project_root = 1;
  CatalogOutcome outcome = 2;
  repeated CatalogEntry entries = 3;
  repeated QueryDiagnostic diagnostics = 4;
  string error = 5;
}

// Native project type distinguishes applications from operators and other components.
message CatalogEntry {
  string name = 1;
  string project_type = 2;
  string source_folder = 3;
  repeated LanguageVariant variants = 4;
  repeated string declared_modes = 5;
}

message LanguageVariant {
  string language = 1;
  repeated Mode modes = 2;
}
message Mode {
  string name = 1;
  string description = 2;
}

// Full process evidence for one list or modes query; streams are retained verbatim.
message QueryDiagnostic {
  repeated string argv = 1;
  bytes stdout = 2;
  bytes stderr = 3;
  oneof termination {
    int32 exit_code = 4;
    int32 signal = 5;
  }
  // Spawn/wait failure, with no invented exit status.
  string error = 6;
}

// Root envelopes observed in metadata.json; native validation determines the effective context.
enum DeclaredProjectKind {
  DECLARED_PROJECT_KIND_UNSPECIFIED = 0;
  DECLARED_PROJECT_KIND_SOURCE = 1;
  DECLARED_PROJECT_KIND_APPLICATION = 2;
  DECLARED_PROJECT_KIND_MODULE = 3;
  DECLARED_PROJECT_KIND_AMBIGUOUS = 4;
}

// Raw project inputs for later Prepare/Build; these do not establish applied native defaults.
message ProjectDockerInputs {
  string project_root = 1;
  DeclaredProjectKind declared_kind = 2;
  NativeInputFile metadata = 3;
  NativeInputFile configuration = 4;
  // Message absence distinguishes an undeclared array from an explicitly empty one.
  DockerOptionTokens docker_build_args = 5;
  DockerOptionTokens docker_run_args = 6;
  repeated string declarations = 7;
}

// Whole-file byte identity; unrelated TOML changes also change this digest.
message NativeInputFile {
  string path = 1;
  string sha256 = 2;
}

// One value per native TOML array token; original whitespace is preserved.
message DockerOptionTokens {
  repeated string values = 1;
}

// Backend-specific launch inputs; RunPlan owns shared write and host-shm policy.
message HoloscanPlan {
  string cli = 1;
  Selection selection = 2;
  repeated string extra_data_folders = 3;
  // Actual Compose Dora/system inputs; the native application is selected separately.
  repeated doramcap.compose.v1.ComposeProject system_projects = 4;
}

// Artifact and source facts of a successful Build; absent source facts remain unverified.
// The caller scopes this record to the same canonical project root as admission.
message BuildRecord {
  Selection selection = 1;
  string image_id = 2;
  doramcap.launch.v1.SourceRecord source = 3;
}

// Record/selection/source assessment; image availability is independently checked by Prepare.
enum BuildState {
  BUILD_STATE_UNSPECIFIED = 0;
  BUILD_STATE_NOT_BUILT = 1;
  BUILD_STATE_REBUILD_NEEDED = 2;
  BUILD_STATE_UNVERIFIED = 3;
  BUILD_STATE_FRESH = 4;
}
message BuildAssessment {
  BuildState state = 1;
  repeated string diagnostics = 2;
}

// Supplied observations for native Review; the common RunPlan supplies canonical admission scope.
// The Build record must belong to that same canonical repository root.
message PrepareRequest {
  reserved 1;
  HoloscanPlan plan = 2;
  BuildRecord build_record = 3;
  doramcap.launch.v1.SourceRecord current_source = 4;
  // Actual Console inspection reads current eligible evidence from this private local store.
  string build_store_root = 5;
}

// Stable verified Review inputs; this partial snapshot does not certify the next native launch.
// Human dry-run text stays in diagnostics and never contributes to sha256.
message ConfigurationSnapshot {
  Selection selection = 1;
  reserved 2; // Human display is lossy and contains generated runtime values.
  string image_id = 3; // Observed Build artifact; next-launch image remains unknown.
  ProjectDockerInputs project_inputs = 4;
  string sha256 = 5; // SHA-256 of this message encoded with this field empty.
  string repository_root = 6;
  string cli = 7;
  repeated NativeInputFile observed_metadata = 8;
  string daemon_id = 9;
  doramcap.launch.v1.HostShmAccess host_shm_access = 10;
  doramcap.filesystem.v1.WritePolicy write_policy = 11;
  repeated string extra_data_folders = 12;
  repeated string passthrough_folders = 13;
  string catalog_sha256 = 14; // Canonical selected catalog/modes query JSON; diagnostic text excluded.
  uint64 readiness_seconds = 15;
  uint64 stop_seconds = 16;
  doramcap.launch.v1.SourceRecord current_source = 17;
  string build_record_sha256 = 18;
  repeated string resolved_extra_data_folders = 19; // Same order as supplied paths; host identities.
  repeated string resolved_passthrough_folders = 20;
  doramcap.compose.v1.ConfigurationSnapshot system_configuration = 21;
}
message Preparation {
  BuildAssessment build = 1;
  ConfigurationSnapshot snapshot = 2;
  repeated QueryDiagnostic diagnostics = 3;
  repeated string warnings = 4;
  repeated string rejections = 5; // Required constraints that could not be satisfied.
  repeated string unknown = 6; // Unavailable launch details; empty observations never establish absence.
  RecordedImageObservation recorded_image = 7;
}

// Independent observation of the stored Build artifact, never a native launch prediction.
enum RecordedImageState {
  RECORDED_IMAGE_STATE_UNSPECIFIED = 0;
  RECORDED_IMAGE_STATE_PRESENT = 1;
  RECORDED_IMAGE_STATE_MISSING = 2;
  RECORDED_IMAGE_STATE_MISMATCH = 3;
  RECORDED_IMAGE_STATE_FAILED = 4;
}
message RecordedImageObservation {
  RecordedImageState state = 1;
  string recorded_id = 2;
  string observed_id = 3;
  string error = 4;
}

// Attempt-owned host helper, persisted before launch independently from Engine resources.
// Zero cgroup inode means cgroupfs creation was not durably verified and cannot authorize signals.
message CliProcessOwnership {
  doramcap.compose_plan.v1.CgroupPlacement placement = 1;
  string application_parent = 2;
  string helper_name = 3;
  string helper_path = 4;
  string description = 5;
  string boot_id = 6;
  uint64 cgroup_device = 7;
  uint64 cgroup_inode = 8;
  string repository_root = 9; // Canonical admission identity; retained when source disappears.
  string artifacts_root = 10; // Identity only; recovery does not require this directory to exist.
}

// Exact requested selection within the canonical repository covered by admission.
message BuildKey {
  string repository_root = 1;
  Selection selection = 2;
}

// Console supplies its private local builds directory; the backend alone derives selection paths.
message BuildStoreRequest {
  string root = 1;
  BuildKey key = 2;
}

// Start a new persisted attempt under repository admission, before launching any builder.
message BuildAttemptRequest {
  BuildStoreRequest store = 1;
  string id = 2;
  doramcap.launch.v1.SourceRecord source = 3;
}

// One latest attempt. Missing result means incomplete, without asserting a process is alive.
message BuildAttempt {
  uint32 version = 1;
  BuildKey key = 2;
  string id = 3;
  doramcap.launch.v1.SourceRecord source = 4;
  BuildResult result = 5;
}

// Process, output, image observation and cleanup remain independent facts.
// A usable record is published only with successful complete evidence.
message BuildResult {
  oneof termination {
    int32 exit_code = 1;
    int32 signal = 2;
  }
  string process_error = 3;
  string output_error = 4;
  string cleanup_error = 5;
  bool cleanup_verified = 6;
  bool cancelled = 7;
  BuildRecord record = 8;
  string image_error = 9;
  string observed_image_id = 10; // Retained even when another completion fact fails.
}

// Latest observations plus the backend's eligible record; errors never fall back to older success.
message BuildLookup {
  BuildAttempt latest = 1;
  BuildRecord record = 2;
  repeated string diagnostics = 3;
  BuildLogs logs = 4;
}

// Backend-derived private absolute paths; files can be absent after a prelaunch failure.
message BuildLogs {
  string stdout = 1;
  string stderr = 2;
}

// Disk-log progress; stdout/stderr contents are never accumulated in this message.
message BuildProgress {
  string attempt_id = 1;
  uint64 stdout_bytes = 2;
  uint64 stderr_bytes = 3;
  BuildLogs logs = 4;
}

// One native application Build; the store request supplies canonical admission and output scope.
message BuildRequest {
  BuildAttemptRequest attempt = 1;
  string cli = 2;
  uint64 readiness_seconds = 3;
  uint64 stop_seconds = 4;
  doramcap.launch.v1.HostShmAccess host_shm_access = 5;
}

// Terminal invocation facts; publication failure does not make this candidate stored Build evidence.
// Prepare obtains eligible evidence only through the authoritative store lookup.
message BuildOutcome {
  BuildAttempt attempt = 1;
  string error = 2;
  string publication_error = 3;
  BuildLogs logs = 4;
}

// Actual Engine mount fields; absent values remain unknown and imply no coverage guarantee.
message NativeMount {
  string kind = 1;
  string source = 2;
  string destination = 3;
  string volume_name = 4;
  oneof access { bool read_only = 5; }
}

// Application-only execution, filesystem evidence and cleanup remain independent observations.
message HoloscanRunReport {
  string id = 1;
  string container_id = 2;
  string image_id = 3;
  oneof container_termination { int64 container_exit_code = 4; }
  string execution_error = 5;
  doramcap.launch.v1.StopRecord stopped = 6;
  doramcap.launch.v1.RemovalPermit permit = 7;
  doramcap.launch.v1.CleanupRecord cleanup = 8;
  doramcap.filesystem.v1.FileChangeReference file_changes = 9;
  doramcap.filesystem.v1.ReportState file_changes_state = 10;
  repeated string diagnostics = 11;
  oneof cli_termination {
    int32 cli_exit_code = 12;
    int32 cli_signal = 13;
  }
  string cli_error = 14;
  string stdout = 15;
  string stderr = 16;
  string runtime_log = 17;
  bool event_stream_healthy = 18;
  repeated NativeMount observed_mounts = 19;
  repeated string untracked_mounts = 20;
  string report_error = 22; // Report publication/acknowledgement failure, independent of application exit.
  Selection selection = 21;
}
