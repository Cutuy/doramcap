syntax = "proto3";
package doramcap.holoscan.v1;
import "launch.proto";

// Existing CLI context. Both paths are absolute; native search settings stay in the project.
message DiscoverRequest {
  string project_root = 1;
  string cli = 2;
}

// Application identity within the source project supplied with the request.
message Selection {
  string application = 1;
  // Native language name; empty keeps the CLI default.
  string language = 2;
  // Empty retains the upstream default when no mode was selected.
  string mode = 3;
}

enum CatalogOutcome {
  CATALOG_OUTCOME_UNSPECIFIED = 0;
  CATALOG_OUTCOME_AVAILABLE = 1;
  CATALOG_OUTCOME_EMPTY = 2;
  CATALOG_OUTCOME_UNAVAILABLE = 3;
  CATALOG_OUTCOME_FAILED = 4;
}

// One complete discovery response, or retained observations when a query fails.
message Catalog {
  string project_root = 1;
  CatalogOutcome outcome = 2;
  repeated CatalogEntry entries = 3;
  repeated QueryDiagnostic diagnostics = 4;
  string error = 5;
}

// Native project type distinguishes applications from operators and other components.
message CatalogEntry {
  string name = 1;
  string project_type = 2;
  string source_folder = 3;
  repeated LanguageVariant variants = 4;
  repeated string declared_modes = 5;
}

message LanguageVariant {
  string language = 1;
  repeated Mode modes = 2;
}
message Mode {
  string name = 1;
  string description = 2;
}

// Full process evidence for one list or modes query; streams are retained verbatim.
message QueryDiagnostic {
  repeated string argv = 1;
  bytes stdout = 2;
  bytes stderr = 3;
  oneof termination {
    int32 exit_code = 4;
    int32 signal = 5;
  }
  // Spawn/wait failure, with no invented exit status.
  string error = 6;
}

// Root envelopes observed in metadata.json; native validation determines the effective context.
enum DeclaredProjectKind {
  DECLARED_PROJECT_KIND_UNSPECIFIED = 0;
  DECLARED_PROJECT_KIND_SOURCE = 1;
  DECLARED_PROJECT_KIND_APPLICATION = 2;
  DECLARED_PROJECT_KIND_MODULE = 3;
  DECLARED_PROJECT_KIND_AMBIGUOUS = 4;
}

// Raw project inputs for later Prepare/Build; these do not establish applied native defaults.
message ProjectDockerInputs {
  string project_root = 1;
  DeclaredProjectKind declared_kind = 2;
  NativeInputFile metadata = 3;
  NativeInputFile configuration = 4;
  // Message absence distinguishes an undeclared array from an explicitly empty one.
  DockerOptionTokens docker_build_args = 5;
  DockerOptionTokens docker_run_args = 6;
  repeated string declarations = 7;
}

// Whole-file byte identity; unrelated TOML changes also change this digest.
message NativeInputFile {
  string path = 1;
  string sha256 = 2;
}

// One value per native TOML array token; original whitespace is preserved.
message DockerOptionTokens {
  repeated string values = 1;
}

// Backend-specific launch inputs; RunPlan owns shared write and host-shm policy.
message HoloscanPlan {
  string cli = 1;
  Selection selection = 2;
  repeated string extra_data_folders = 3;
}

// Artifact and source facts of a successful Build; absent source facts remain unverified.
// The caller scopes this record to the same canonical project root as admission.
message BuildRecord {
  Selection selection = 1;
  string image_id = 2;
  doramcap.launch.v1.SourceRecord source = 3;
}

// Record/selection/source assessment; image availability is independently checked by Prepare.
enum BuildState {
  BUILD_STATE_UNSPECIFIED = 0;
  BUILD_STATE_NOT_BUILT = 1;
  BUILD_STATE_REBUILD_NEEDED = 2;
  BUILD_STATE_UNVERIFIED = 3;
  BUILD_STATE_FRESH = 4;
}
message BuildAssessment {
  BuildState state = 1;
  repeated string diagnostics = 2;
}

// Current source facts come from Console's existing capture, independently of the stored Build facts.
// The Build record must belong to run.repository_root after canonicalization.
message PrepareInput {
  doramcap.launch.v1.RunPlan run = 1;
  HoloscanPlan plan = 2;
  BuildRecord build_record = 3;
  doramcap.launch.v1.SourceRecord current_source = 4;
}

// Reviewed launch observations; project inputs alone do not establish applied native defaults.
message ConfigurationSnapshot {
  Selection selection = 1;
  string normalized_dry_run = 2;
  string image_id = 3;
  ProjectDockerInputs project_inputs = 4;
  string sha256 = 5;
}
message Preparation {
  BuildAssessment build = 1;
  ConfigurationSnapshot snapshot = 2;
  repeated QueryDiagnostic diagnostics = 3;
  repeated string warnings = 4;
}
