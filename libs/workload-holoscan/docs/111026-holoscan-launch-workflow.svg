<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
<title id="title">Holoscan adapter in the Console workflow</title>
<desc id="desc">Build precedes the review capture. During Start the native CLI reaches a gated adapter. The backend validates launch settings and prepares shared filesystem views before releasing Docker creation. Stop, finalization and cleanup remain backend-owned.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#526579"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#203143}.heading{font-size:25px;font-weight:600}.name{font-size:21px;font-weight:600}.detail{font-size:17px;fill:#4a5e72}.label{font-size:17px;fill:#4a5e72}.box{fill:#f6f8fb;stroke:#a8b6c5;stroke-width:1.6}.console{fill:#eaf3ff;stroke:#3979b9;stroke-width:2}.flow{fill:none;stroke:#526579;stroke-width:2;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="860" fill="white"/>
<text class="heading" x="35" y="32">Build and review capture</text>
<rect class="console" x="35" y="60" width="230" height="90" rx="10"/><text class="name" x="150" y="96" text-anchor="middle">Cleanup + Build</text><text class="detail" x="150" y="126" text-anchor="middle">Separate backend steps</text>
<rect class="box" x="335" y="60" width="230" height="90" rx="10"/><text class="name" x="450" y="96" text-anchor="middle">Holoscan CLI</text><text class="detail" x="450" y="126" text-anchor="middle">Capture invocation</text>
<rect class="console" x="635" y="60" width="230" height="90" rx="10"/><text class="name" x="750" y="96" text-anchor="middle">Capture adapter</text><text class="detail" x="750" y="126" text-anchor="middle">Describe run; finish</text>
<rect class="console" x="935" y="60" width="230" height="90" rx="10"/><text class="name" x="1050" y="96" text-anchor="middle">Review snapshot</text><text class="detail" x="1050" y="126" text-anchor="middle">Stable launch settings</text>
<path class="flow" d="M265 105 H335"/>
<path class="flow" d="M565 105 H635"/><text class="label" x="600" y="90" text-anchor="middle">run args</text>
<path class="flow" d="M865 105 H935"/><text class="label" x="900" y="90" text-anchor="middle">settings</text>
<text class="heading" x="35" y="258">Start workflow</text>
<rect class="console" x="35" y="300" width="230" height="100" rx="10"/><text class="name" x="150" y="336" text-anchor="middle">Holoscan backend</text><text class="detail" x="150" y="366" text-anchor="middle">Admit and recheck review</text>
<rect class="box" x="335" y="300" width="230" height="100" rx="10"/><text class="name" x="450" y="336" text-anchor="middle">Holoscan CLI</text><text class="detail" x="450" y="366" text-anchor="middle">Generate run arguments</text>
<rect class="console" x="635" y="300" width="230" height="100" rx="10"/><text class="name" x="750" y="336" text-anchor="middle">Gated adapter</text><text class="detail" x="750" y="366" text-anchor="middle">Wait for the backend</text>
<rect class="box" x="935" y="300" width="230" height="100" rx="10"/><text class="name" x="1050" y="336" text-anchor="middle">Docker</text><text class="detail" x="1050" y="366" text-anchor="middle">Native application</text>
<path class="flow" d="M265 350 H335"/><text class="label" x="300" y="333" text-anchor="middle">invoke</text>
<path class="flow" d="M565 350 H635"/><text class="label" x="600" y="333" text-anchor="middle">run args</text>
<path class="flow" d="M865 350 H935"/><text class="label" x="900" y="333" text-anchor="middle">release</text>
<rect class="console" x="35" y="540" width="230" height="90" rx="10"/><text class="name" x="150" y="576" text-anchor="middle">Backend preparation</text><text class="detail" x="150" y="606" text-anchor="middle">Shared filesystem steps</text>
<path class="flow" d="M680 400 V460 H290 V375 H265"/><text class="label" x="485" y="444" text-anchor="middle">resolved settings</text>
<path class="flow" d="M150 400 V540"/><text class="label" x="195" y="502" text-anchor="middle">prepare</text>
<path class="flow" d="M265 585 H820 V400"/><text class="label" x="545" y="568" text-anchor="middle">prepared mounts + allow</text>
<path class="flow" d="M1050 400 V685 H150 V740"/><text class="label" x="1110" y="668" text-anchor="middle">exit or stop</text>
<rect class="console" x="35" y="740" width="230" height="90" rx="10"/><text class="name" x="150" y="776" text-anchor="middle">Stop writers</text><text class="detail" x="150" y="806" text-anchor="middle">Verify termination</text>
<rect class="console" x="335" y="740" width="230" height="90" rx="10"/><text class="name" x="450" y="776" text-anchor="middle">Finalize files</text><text class="detail" x="450" y="806" text-anchor="middle">Changes and write-back</text>
<rect class="console" x="635" y="740" width="230" height="90" rx="10"/><text class="name" x="750" y="776" text-anchor="middle">Cleanup</text><text class="detail" x="750" y="806" text-anchor="middle">Owned resources</text>
<rect class="console" x="935" y="740" width="230" height="90" rx="10"/><text class="name" x="1050" y="776" text-anchor="middle">Run evidence</text><text class="detail" x="1050" y="806" text-anchor="middle">Independent outcomes</text>
<path class="flow" d="M265 785 H335"/>
<path class="flow" d="M565 785 H635"/>
<path class="flow" d="M865 785 H935"/>
</svg>
