<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="975" viewBox="0 0 1360 975" role="img" aria-labelledby="title desc">
<title id="title">Planned Console–Holoscan phase workflow</title>
<desc id="desc">A separate Build step precedes Console's existing Prepare, Review, Start, Run/Stop and Results phases. Each row shows the Holoscan backend work and CLI calls. Prepare saves a Docker command through a helper. Start checks the settings, prepares OverlayFS and lets the helper launch Docker.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#526579"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#203143}.heading{font-size:27px;font-weight:600}.column{font-size:20px;font-weight:600}.phaseName{font-size:23px;font-weight:600}.name{font-size:20px;font-weight:600}.detail{font-size:17px;fill:#3e5368}.small{font-size:17px;fill:#4a5e72}.code{font-family:DejaVu Sans Mono,Liberation Mono,monospace;font-size:16px;fill:#203143}.phase{fill:#eaf3ff;stroke:#3979b9;stroke-width:1.8}.newphase,.work{fill:#f0f8f3;stroke:#7da68c;stroke-width:1.5}.call{fill:#f6f8fb;stroke:#a8b6c5;stroke-width:1.5}.flow{fill:none;stroke:#526579;stroke-width:1.7;marker-end:url(#arrow)}</style></defs>
<rect width="1360" height="975" fill="white"/>
<text class="heading" x="30" y="36" text-anchor="start">Planned Console–Holoscan phase workflow</text>
<text class="detail" x="30" y="69" text-anchor="start">Prepare and Start use HOLOSCAN_CLI_DOCKER_EXE to send Docker calls to our helper.</text>
<text class="column" x="30" y="108" text-anchor="start">Console phase</text>
<text class="column" x="275" y="108" text-anchor="start">Holoscan steps to add</text>
<text class="column" x="805" y="108" text-anchor="start">CLI call / returned result</text>
<rect class="newphase" x="30" y="130" width="190" height="112" rx="9"/><text class="phaseName" x="125" y="182" text-anchor="middle">Build</text><text class="small" x="125" y="210" text-anchor="middle">new step</text><rect class="work" x="275" y="130" width="475" height="112" rx="9"/><text class="name" x="291" y="158" text-anchor="start">Clean up, then build</text><text class="detail" x="291" y="184" text-anchor="start">Stop lingering runs owned by this project.</text><text class="detail" x="291" y="206" text-anchor="start">Build the image and application.</text><text class="detail" x="291" y="228" text-anchor="start">Keep Build as a separate step.</text><rect class="call" x="805" y="130" width="525" height="112" rx="9"/><text class="code" x="820" y="157" text-anchor="start">holoscan --project-root PROJECT \</text><text class="code" x="820" y="179" text-anchor="start">  build APP MODE --language LANG</text><path class="flow" d="M220 186 H275"/><path class="flow" d="M750 186 H805"/><path class="flow" d="M125 242 V260"/><rect class="phase" x="30" y="260" width="190" height="140" rx="9"/><text class="phaseName" x="125" y="326" text-anchor="middle">Prepare</text><text class="small" x="125" y="354" text-anchor="middle">existing request</text><rect class="work" x="275" y="260" width="475" height="140" rx="9"/><text class="name" x="291" y="288" text-anchor="start">Save the launch command</text><text class="detail" x="291" y="314" text-anchor="start">Call the CLI with builds disabled.</text><text class="detail" x="291" y="336" text-anchor="start">Helper receives its Docker command.</text><text class="detail" x="291" y="358" text-anchor="start">Helper sends the settings back and exits.</text><rect class="call" x="805" y="260" width="525" height="140" rx="9"/><text class="code" x="820" y="287" text-anchor="start">holoscan --project-root PROJECT \</text><text class="code" x="820" y="309" text-anchor="start">  run APP MODE --language LANG \</text><text class="code" x="820" y="331" text-anchor="start">  --no-docker-build --no-local-build \</text><text class="code" x="820" y="353" text-anchor="start">  --persistent \</text><text class="code" x="820" y="375" text-anchor="start">  --docker-opts="--cidfile RUN/container.id"</text><path class="flow" d="M220 330 H275"/><path class="flow" d="M750 330 H805"/><path class="flow" d="M125 400 V418"/><rect class="phase" x="30" y="418" width="190" height="82" rx="9"/><text class="phaseName" x="125" y="455" text-anchor="middle">Review</text><text class="small" x="125" y="483" text-anchor="middle">existing state</text><rect class="work" x="275" y="418" width="475" height="82" rx="9"/><text class="name" x="291" y="446" text-anchor="start">Keep expected settings</text><text class="detail" x="291" y="472" text-anchor="start">Save the selected image and launch settings.</text><rect class="call" x="805" y="418" width="525" height="82" rx="9"/><text class="detail" x="820" y="452" text-anchor="start">Console saves Review</text><text class="detail" x="820" y="477" text-anchor="start">Expected inputs, image and mounts</text><path class="flow" d="M220 459 H275"/><path class="flow" d="M750 459 H805"/><path class="flow" d="M125 500 V518"/><rect class="phase" x="30" y="518" width="190" height="145" rx="9"/><text class="phaseName" x="125" y="586.5" text-anchor="middle">Start</text><text class="small" x="125" y="614.5" text-anchor="middle">existing request</text><rect class="work" x="275" y="518" width="475" height="145" rx="9"/><text class="name" x="291" y="546" text-anchor="start">Check, prepare files, then launch</text><text class="detail" x="291" y="572" text-anchor="start">Repeat cleanup; check settings against Review.</text><text class="detail" x="291" y="594" text-anchor="start">Backend creates the OverlayFS views.</text><text class="detail" x="291" y="616" text-anchor="start">Helper applies approved paths and run labels.</text><text class="detail" x="291" y="638" text-anchor="start">Backend allows the helper to start Docker.</text><rect class="call" x="805" y="518" width="525" height="145" rx="9"/><text class="code" x="820" y="545" text-anchor="start">holoscan --project-root PROJECT \</text><text class="code" x="820" y="567" text-anchor="start">  run APP MODE --language LANG \</text><text class="code" x="820" y="589" text-anchor="start">  --no-docker-build --no-local-build \</text><text class="code" x="820" y="611" text-anchor="start">  --persistent \</text><text class="code" x="820" y="633" text-anchor="start">  --docker-opts="--cidfile RUN/container.id"</text><path class="flow" d="M220 590.5 H275"/><path class="flow" d="M750 590.5 H805"/><path class="flow" d="M125 663 V681"/><rect class="phase" x="30" y="681" width="190" height="120" rx="9"/><text class="phaseName" x="125" y="737" text-anchor="middle">Run / Stop</text><text class="small" x="125" y="765" text-anchor="middle">existing control</text><rect class="work" x="275" y="681" width="475" height="120" rx="9"/><text class="name" x="291" y="709" text-anchor="start">Observe, stop and verify</text><text class="detail" x="291" y="735" text-anchor="start">Collect Console observations and logs.</text><text class="detail" x="291" y="757" text-anchor="start">Signal the CLI when stopping.</text><text class="detail" x="291" y="779" text-anchor="start">Verify that the container's writers have stopped.</text><rect class="call" x="805" y="681" width="525" height="120" rx="9"/><text class="code" x="820" y="708" text-anchor="start">holoscan run … waits for Docker</text><text class="code" x="820" y="730" text-anchor="start">SIGTERM → Holoscan CLI</text><text class="code" x="820" y="752" text-anchor="start">helper → docker stop --time 10 ID</text><path class="flow" d="M220 741 H275"/><path class="flow" d="M750 741 H805"/><path class="flow" d="M125 801 V819"/><rect class="phase" x="30" y="819" width="190" height="122" rx="9"/><text class="phaseName" x="125" y="876" text-anchor="middle">Results</text><text class="small" x="125" y="904" text-anchor="middle">existing run flow</text><rect class="work" x="275" y="819" width="475" height="122" rx="9"/><text class="name" x="291" y="847" text-anchor="start">Collect files, then remove resources</text><text class="detail" x="291" y="873" text-anchor="start">Collect filesystem changes and recording results.</text><text class="detail" x="291" y="895" text-anchor="start">Apply the selected write-back / discard policy.</text><text class="detail" x="291" y="917" text-anchor="start">Remove owned resources and save the run report.</text><rect class="call" x="805" y="819" width="525" height="122" rx="9"/><text class="detail" x="820" y="853" text-anchor="start">Shared filesystem finalization</text><text class="detail" x="820" y="878" text-anchor="start">Docker resource removal</text><text class="detail" x="820" y="903" text-anchor="start">Saved run report</text><path class="flow" d="M220 880 H275"/><path class="flow" d="M750 880 H805"/>
</svg>
