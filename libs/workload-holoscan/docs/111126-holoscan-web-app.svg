<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-labelledby="title desc">
<title id="title">Holoscan web app journey</title>
<desc id="desc">Five steps in order: choose an application, build, review, run and result. Choosing and building happen on the start screen. Build is the step added for Holoscan.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#536779"/></marker></defs>
<rect width="960" height="250" fill="#f7fafc"/>
<g font-family="sans-serif" fill="#182b3a" text-anchor="middle">
<text x="480" y="34" font-size="22" font-weight="600">Holoscan journey in the web app</text>
<rect x="30" y="58" width="364" height="134" rx="12" fill="#eef4f8" stroke="#8ca6b8"/>
<text x="212" y="82" font-size="13">Start screen</text>
<g fill="#dbeaf2" stroke="#8ca6b8">
<rect x="46" y="96" width="160" height="78" rx="8"/><rect x="418" y="96" width="160" height="78" rx="8"/><rect x="602" y="96" width="160" height="78" rx="8"/><rect x="786" y="96" width="144" height="78" rx="8"/>
</g>
<rect x="222" y="96" width="156" height="78" rx="8" fill="#fcebdc" stroke="#bc906b"/>
<text x="126" y="130" font-size="16" font-weight="600">Choose app</text><text x="126" y="152" font-size="13">search · language · mode</text>
<text x="300" y="130" font-size="16" font-weight="600">Build</text><text x="300" y="152" font-size="13">build state shown</text>
<text x="498" y="130" font-size="16" font-weight="600">Review</text><text x="498" y="152" font-size="13">summary · notes</text>
<text x="682" y="130" font-size="16" font-weight="600">Run</text><text x="682" y="152" font-size="13">steps · activity</text>
<text x="858" y="130" font-size="16" font-weight="600">Result</text><text x="858" y="152" font-size="13">exit code · notes</text>
<g fill="none" stroke="#536779" stroke-width="1.5" marker-end="url(#arrow)"><path d="M206 135 H218"/><path d="M378 135 H414"/><path d="M578 135 H598"/><path d="M762 135 H782"/></g>
<text x="480" y="224" font-size="15">Review is enabled once the build is current</text>
</g></svg>
