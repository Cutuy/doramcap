<text x="745" y="124">systemd overlays</text>
<text x="745" y="147" class="label">#316 milestone 4 · can start</text>
</g>
<g id="apps">
<rect x="910" y="100" width="250" height="56" rx="10" class="overlay"/>
<text x="1035" y="124">Apps crate: system apps</text>
<text x="1035" y="147" class="label">#324 · merged</text>
</g>
<g id="keep">
<rect x="620" y="200" width="250" height="56" rx="10" class="base"/>
