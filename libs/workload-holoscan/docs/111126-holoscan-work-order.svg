<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
<title id="title">Order of work</title>
<desc id="desc">Shared foundations run in sequence: admission lock, move capture, shared apps crate, show changes, keep files. systemd capture follows move capture and the log dump follows keep files. The Holoscan runner runs in parallel: probes, Prepare, Build and run, system apps. Build and run waits for the lock and for move capture. System apps wait for the shared apps crate.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#536779"/></marker></defs>
<rect width="960" height="430" fill="#f7fafc"/>
<g font-family="sans-serif" fill="#182b3a" text-anchor="middle">
<text x="480" y="34" font-size="22" font-weight="600">Order of work</text>
<text x="40" y="68" font-size="13" text-anchor="start">Shared foundations, one at a time</text>
<g fill="#dbeaf2" stroke="#8ca6b8">
<rect x="40" y="80" width="160" height="62" rx="8"/><rect x="220" y="80" width="160" height="62" rx="8"/><rect x="400" y="80" width="160" height="62" rx="8"/><rect x="580" y="80" width="160" height="62" rx="8"/><rect x="760" y="80" width="160" height="62" rx="8"/>
<rect x="220" y="190" width="136" height="62" rx="8"/><rect x="760" y="190" width="160" height="62" rx="8"/>
</g>
<text x="120" y="106" font-size="16" font-weight="600">Admission lock</text><text x="120" y="128" font-size="13">#315</text>
<text x="300" y="106" font-size="16" font-weight="600">Move capture</text><text x="300" y="128" font-size="13">#316 milestone 1</text>
<text x="480" y="106" font-size="16" font-weight="600">Shared apps crate</text><text x="480" y="128" font-size="13">#317</text>
<text x="660" y="106" font-size="16" font-weight="600">Show changes</text><text x="660" y="128" font-size="13">#316 milestone 3</text>
<text x="840" y="106" font-size="16" font-weight="600">Keep files</text><text x="840" y="128" font-size="13">#316 milestone 4</text>
<text x="288" y="216" font-size="15" font-weight="600">systemd capture</text><text x="288" y="238" font-size="13">#316 milestone 2</text>
<text x="840" y="216" font-size="16" font-weight="600">Log dump</text><text x="840" y="238" font-size="13">#314</text>
<text x="40" y="318" font-size="13" text-anchor="start">Holoscan runner, in parallel</text>
<g fill="#fcebdc" stroke="#bc906b">
<rect x="40" y="330" width="190" height="62" rx="8"/><rect x="260" y="330" width="190" height="62" rx="8"/><rect x="480" y="330" width="190" height="62" rx="8"/><rect x="700" y="330" width="190" height="62" rx="8"/>
</g>
<text x="135" y="356" font-size="16" font-weight="600">Probes</text><text x="135" y="378" font-size="13">runner milestone 1</text>
<text x="355" y="356" font-size="16" font-weight="600">Prepare</text><text x="355" y="378" font-size="13">runner milestones 2–3</text>
<text x="575" y="356" font-size="16" font-weight="600">Build and run</text><text x="575" y="378" font-size="13">runner milestones 4–5</text>
<text x="795" y="356" font-size="16" font-weight="600">System apps</text><text x="795" y="378" font-size="13">runner milestones 6–7</text>
