<path data-from="report" data-to="keep" d="M165 100 V86 H890 V228 H870" class="line prerequisite"/>
<path data-from="uppers" data-to="keep" d="M580 140 H595 V216 H620" class="line prerequisite"/>
<path data-from="uppers" data-to="run" d="M455 156 V286 H745 V400" class="line prerequisite"/>
<path data-from="admission" data-to="build" d="M455 366 V400" class="line prerequisite"/>
<path data-from="apps" data-to="acceptance" d="M1035 156 V400" class="line prerequisite"/>
<path data-from="journal" data-to="export" d="M290 628 H330" class="line prerequisite"/>
<path data-from="prepare" data-to="build" d="M290 428 H330" class="line"/>
<path data-from="build" data-to="run" d="M580 428 H620" class="line"/>
<path data-from="run" data-to="acceptance" d="M870 428 H910" class="line"/>
<path data-from="run" data-to="web" d="M745 456 V500" class="line"/>
<path data-from="export" data-to="logs" d="M580 628 H910" class="line"/>
