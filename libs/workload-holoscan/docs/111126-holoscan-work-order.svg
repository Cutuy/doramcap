<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Order of work</title>
<desc id="desc">Status checked November 13, 2026. Merged prerequisites: the change-list report #320, the change list from the uppers #326, apps crate system apps #324, the admission lock #315 and the Compose journal driver #314. Dashed arrows show merged prerequisites: the uppers enable systemd overlays, keeping files and the Holoscan run; the report also enables keeping files; #324 enables system apps and acceptance; #315 enables Build; #314 enables journal export. Solid arrows show the remaining work order: Holoscan probes, discovery and Prepare lead to Build, then Run. Run precedes system apps and acceptance and the web app screens. The Holoscan run and journal export both lead to saved application logs, a follow-up outside the initial runner.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#52677c"/></marker></defs>
<style>text{font:17px sans-serif;fill:#17324d;text-anchor:middle}.title{font-size:23px;font-weight:600}.label{font-size:15px;fill:#3d5468}.base{fill:#f0f6fa;stroke:#8aa4ba;stroke-width:1.5}.overlay{fill:#e7f4ee;stroke:#68a188;stroke-width:1.5}.upper{fill:#fbefe9;stroke:#cf8a6a;stroke-width:1.5}.prerequisite{stroke-dasharray:7 5}.line{fill:none;stroke:#52677c;stroke-width:2;stroke-linejoin:round;marker-end:url(#arrow)}</style>
<rect width="1200" height="690" fill="white"/>
<text x="600" y="40" class="title">Order of work</text>
