<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Order of work</title>
<desc id="desc">Six pieces can start now in parallel: the journal log driver for Compose, show file changes, move capture, the apps crate pieces, the admission lock, and the Holoscan probes with discovery and Prepare. Move capture comes before systemd capture, keep files and the apps crate's system apps sequences. Keep files also needs show file changes. The log dump needs the journal log driver and keep files. Holoscan Build and run needs the admission lock. Holoscan system apps need the apps crate's system apps sequences. Web app screens come last.</desc>
