<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Order of work</title>
<desc id="desc">Merged: the admission lock and the apps crate pieces. In review: the journal log driver, the overlay code move, showing the change list and the apps crate system apps. The change list from the uppers follows the overlay code move and comes before systemd overlays, keeping files with the run and the Holoscan run. Keeping files also needs showing the change list. The log dump needs the journal log driver and keeping files. Holoscan probes, discovery and Prepare lead to Build, which also uses the admission lock, then to the run, then to system apps and acceptance, which also need the apps crate system apps, then to the web app screens.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#52677c"/></marker></defs>
<style>text{font:17px sans-serif;fill:#17324d;text-anchor:middle}.title{font-size:23px;font-weight:600}.label{font-size:15px;fill:#3d5468}.base{fill:#f0f6fa;stroke:#8aa4ba;stroke-width:1.5}.declare{fill:#eef0fb;stroke:#8a92c8;stroke-width:1.5}.overlay{fill:#e7f4ee;stroke:#68a188;stroke-width:1.5}.upper{fill:#fbefe9;stroke:#cf8a6a;stroke-width:1.5}.line{fill:none;stroke:#52677c;stroke-width:2;marker-end:url(#arrow)}.join{fill:none;stroke:#52677c;stroke-width:2}</style>
