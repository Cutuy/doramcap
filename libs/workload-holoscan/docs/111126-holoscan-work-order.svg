</g>
<g id="prepare">
<rect x="40" y="400" width="250" height="56" rx="10" class="upper"/>
<text x="165" y="424">Probes, discovery, Prepare</text>
<text x="165" y="447" class="label">Holoscan milestones 1–3</text>
</g>
<g id="build">
<rect x="330" y="400" width="250" height="56" rx="10" class="upper"/>
<text x="455" y="424">Build</text>
<text x="455" y="447" class="label">Holoscan milestone 4</text>
</g>
<g id="run">
