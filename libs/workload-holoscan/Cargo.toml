[package]
name = "workload-holoscan"
description = "Native Holoscan CLI application discovery"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
compose-apps = { path = "../compose-apps" }
docker-engine = { path = "../docker-engine" }
host-filesystem = { path = "../host-filesystem" }
orchestrator = { path = "../orchestrator" }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "=0.9.12"
tokio = { version = "1", features = ["process", "rt", "macros", "fs", "io-util", "net", "sync"] }
workload-lifecycle = { path = "../workload-lifecycle" }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[lints]
workspace = true
