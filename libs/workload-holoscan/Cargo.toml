[package]
name = "workload-holoscan"
description = "Native Holoscan CLI application discovery"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
orchestrator = { path = "../orchestrator" }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "rt", "macros", "io-util", "sync"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[lints]
workspace = true
