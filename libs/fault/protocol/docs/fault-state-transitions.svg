<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#9aaec8" stroke-width="1.6"/></marker><style>text{font-family:Arial,sans-serif;fill:#ebf2fa;font-size:20px}.title{font-size:29px;font-weight:700}.h{font-size:22px;font-weight:700}.s{font-size:16px;fill:#b3c3d8}.box{fill:#1b3049;stroke:#6686aa;stroke-width:1.5;rx:12}.panel{fill:#112138;stroke:#334b68;rx:16}.green{fill:#153e3a;stroke:#61d6b6}.red{fill:#452b35;stroke:#fa929d}.amber{fill:#403621;stroke:#dfbf70}.edge{fill:none;stroke:#9aaec8;stroke-width:2;marker-end:url(#a)}.dep{fill:none;stroke:#9aaec8;stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#a)}</style></defs><rect width="1280" height="850" rx="20" fill="#0b1525"/><text x="35" y="48" class="title" text-anchor="start">Fault state transitions</text><text x="35" y="78" class="s" text-anchor="start">PROPOSED · aggregation owns health · reporter carries recovery evidence</text><rect class="panel" x="30" y="110" width="1220" height="420"/><text x="55" y="147" class="h" text-anchor="start">Health</text><rect class="box " x="75" y="220" width="200" height="70"/><text x="175.0" y="252" class="" text-anchor="middle">Unknown</text><rect class="box green" x="520" y="190" width="220" height="70"/><text x="630.0" y="222" class="" text-anchor="middle">Healthy</text><rect class="box red" x="520" y="380" width="220" height="70"/><text x="630.0" y="412" class="" text-anchor="middle">Active</text><rect class="box amber" x="965" y="380" width="220" height="70"/><text x="1075.0" y="412" class="" text-anchor="middle">Recovering</text><path class="edge" d="M275 240H400V225H520"/><text x="374" y="220" class="s" text-anchor="middle">success</text><path class="edge" d="M175 290V415H520"/><text x="325" y="402" class="s" text-anchor="middle">failure</text><path class="edge" d="M585 260V380"/><text x="570" y="323" class="s" text-anchor="end">failure</text><path class="edge" d="M740 415H965"/><text x="850" y="401" class="s" text-anchor="middle">first success</text><path class="edge" d="M1075 380V225H740"/><text x="932" y="209" class="s" text-anchor="middle">success confirms ≥ 1 s</text><path class="edge" d="M1075 450V490H630V450"/><text x="850" y="481" class="s" text-anchor="middle">failure resets recovery</text><path class="edge" d="M740 215H790V165H675V190"/><text x="825" y="171" class="s" text-anchor="start">success</text><path class="edge" d="M520 435H460V480H570V450"/><text x="450" y="467" class="s" text-anchor="end">failure</text><path class="edge" d="M1185 415H1220V345H1120V380"/><text x="1160" y="334" class="s" text-anchor="middle">early success</text><rect class="panel" x="30" y="560" width="1220" height="235"/><text x="55" y="598" class="h" text-anchor="start">Freshness · independent of health</text><rect class="box " x="75" y="655" width="200" height="65"/><text x="175.0" y="687" class="" text-anchor="middle">Unknown</text><rect class="box green" x="520" y="655" width="220" height="65"/><text x="630.0" y="687" class="" text-anchor="middle">Fresh</text><rect class="box amber" x="965" y="655" width="220" height="65"/><text x="1075.0" y="687" class="" text-anchor="middle">Stale</text><path class="edge" d="M275 687H520"/><text x="395" y="672" class="s" text-anchor="middle">new evidence</text><path class="edge" d="M740 676H965"/><text x="852" y="645" class="s" text-anchor="middle">deadline / disconnect</text><path class="edge" d="M1075 720V760H630V720"/><text x="850" y="751" class="s" text-anchor="middle">new timely evidence</text><text x="55" y="826" class="s" text-anchor="start">Silence never clears health. Deadlines are opt-in. Zero recovery interval clears on first success.</text><path class="edge" d="M175 655V625H1075V655"/><text x="700" y="619" class="s" text-anchor="middle">deadline before first observation</text></svg>