<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#9aaec8" stroke-width="1.6"/></marker><style>text{font-family:Arial,sans-serif;fill:#ebf2fa;font-size:20px}.title{font-size:29px;font-weight:700}.h{font-size:22px;font-weight:700}.s{font-size:16px;fill:#b3c3d8}.box{fill:#1b3049;stroke:#6686aa;stroke-width:1.5;rx:12}.panel{fill:#112138;stroke:#334b68;rx:16}.green{fill:#153e3a;stroke:#61d6b6}.red{fill:#452b35;stroke:#fa929d}.amber{fill:#403621;stroke:#dfbf70}.edge{fill:none;stroke:#9aaec8;stroke-width:2;marker-end:url(#a)}.dep{fill:none;stroke:#9aaec8;stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#a)}</style></defs><rect width="1280" height="850" rx="20" fill="#0b1525"/><text x="35" y="48" class="title" text-anchor="start">Event-driven publication</text><text x="35" y="78" class="s" text-anchor="start">PROPOSED · wakeups carry hints; queues + sequence counters carry truth</text><rect class="box " x="385" y="105" width="510" height="70"/><text x="640.0" y="137" class="" text-anchor="middle">Caller reports outcome</text><text x="640.0" y="163" class="s" text-anchor="middle">update sequence + counts + success-run evidence</text><path class="edge" d="M640 175V215H270V255"/><path class="edge" d="M640 215H1010V255"/><rect class="box red" x="45" y="255" width="450" height="95"/><text x="270.0" y="287" class="" text-anchor="middle">Urgent evidence</text><text x="270.0" y="313" class="s" text-anchor="middle">failure edge · first success · recovery confirmation</text><text x="270" y="337" class="s" text-anchor="middle">initial evidence · standalone failure event</text><rect class="box amber" x="785" y="255" width="450" height="95"/><text x="1010.0" y="287" class="" text-anchor="middle">Repeated observations</text><text x="1010.0" y="313" class="s" text-anchor="middle">coalesce latest evidence + counts</text><text x="290" y="390" class="s" text-anchor="start">reserved capacity</text><text x="1030" y="390" class="s" text-anchor="start">latest + counts</text><path class="edge" d="M270 350V425"/><path class="edge" d="M1010 350V425"/><rect class="box red" x="65" y="425" width="410" height="70"/><text x="270.0" y="457" class="" text-anchor="middle">Enqueue + signal publisher</text><text x="270.0" y="483" class="s" text-anchor="middle">no intentional publication delay</text><rect class="box amber" x="805" y="425" width="410" height="70"/><text x="1010.0" y="457" class="" text-anchor="middle">Summary deadline fires</text><text x="1010.0" y="483" class="s" text-anchor="middle">configurable bounded delay</text><path class="edge" d="M270 495V550H480"/><path class="edge" d="M1010 495V550H800"/><rect class="box green" x="480" y="515" width="320" height="75"/><text x="640.0" y="547" class="" text-anchor="middle">Publisher wakes</text><text x="640.0" y="573" class="s" text-anchor="middle">drain urgent · bounded fairness</text><path class="edge" d="M640 590V635"/><rect class="box " x="385" y="635" width="510" height="70"/><text x="640.0" y="667" class="" text-anchor="middle">Encode → Dora send → aggregate</text><text x="640.0" y="693" class="s" text-anchor="middle">one-record publication allowed; no fill threshold</text><path class="edge" d="M895 670H1040V740H895"/><text x="1065" y="673" class="s" text-anchor="start">state change</text><text x="1065" y="697" class="s" text-anchor="start">or expiry</text><rect class="box green" x="385" y="730" width="510" height="65"/><text x="640.0" y="762" class="" text-anchor="middle">Signal live-output publisher</text><rect class="panel" x="35" y="590" width="290" height="205"/><text x="55" y="625" class="h" text-anchor="start">Overflow</text><text x="55" y="660" class="s" text-anchor="start">count loss + mark dirty</text><text x="55" y="692" class="s" text-anchor="start">signal reconciliation</text><text x="55" y="724" class="s" text-anchor="start">retain latest evidence</text><text x="55" y="756" class="s" text-anchor="start">missing history stays visible</text><text x="35" y="830" class="s" text-anchor="start">Wait protocol: drain → arm notification → recheck generation → sleep until signal / deadline.</text></svg>