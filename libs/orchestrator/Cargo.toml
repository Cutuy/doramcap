[package]
name = "orchestrator"
description = "Observable local coroutine steps for procedural Rust orchestration"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
workflow-protocol = { path = "../telemetry/workflow-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "time"] }

[lints]
workspace = true
