<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">Orchestrator execution and observation boundaries</title>
  <desc id="desc">A procedural workflow invokes LocalExecutor, which validates JSON boundaries and constructs fresh steps. ProcessStep owns direct-child I/O. Executor events pass through TelemetryObserver and workflow-protocol to a caller-owned sink and viewer.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526479"/></marker></defs>
  <rect width="960" height="280" rx="12" fill="#f7f9fc"/>
  <g fill="#fff" stroke="#91a6be" stroke-width="1.5">
    <rect x="20" y="35" width="170" height="70" rx="8"/>
    <rect x="270" y="35" width="190" height="70" rx="8"/>
    <rect x="540" y="35" width="180" height="70" rx="8"/>
    <rect x="790" y="35" width="150" height="70" rx="8"/>
    <rect x="270" y="190" width="190" height="65" rx="8"/>
    <rect x="540" y="190" width="180" height="65" rx="8"/>
    <rect x="790" y="190" width="150" height="65" rx="8"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle" fill="#172b42" font-size="16">
    <text x="105" y="64">Workflow</text><text x="105" y="87" font-size="12">policy and cleanup</text>
    <text x="365" y="64">LocalExecutor</text><text x="365" y="87" font-size="12">factories and lineage</text>
    <text x="630" y="64">Step / ProcessStep</text><text x="630" y="87" font-size="12">fresh instance</text>
    <text x="865" y="64">Direct child</text><text x="865" y="87" font-size="12">bounded I/O</text>
    <text x="365" y="217">TelemetryObserver</text><text x="365" y="239" font-size="12">sequence and loss counts</text>
    <text x="630" y="217">workflow-protocol</text><text x="630" y="239" font-size="12">Protobuf event</text>
    <text x="865" y="217">Sink / viewer</text><text x="865" y="239" font-size="12">caller-owned retention</text>
  </g>
  <g fill="none" stroke="#526479" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M190 70 H270"/><path d="M460 70 H540"/><path d="M720 70 H790"/>
    <path d="M365 105 V190"/><path d="M460 222 H540"/><path d="M720 222 H790"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle" fill="#455a72" font-size="11">
    <text x="230" y="57">Input / Output</text><text x="500" y="57">JSON checks</text>
    <text x="755" y="57">stdio / exit</text><text x="401" y="151">Event</text>
    <text x="500" y="209">encode</text><text x="755" y="209">bytes</text>
  </g>
</svg>
