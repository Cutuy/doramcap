<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1090" viewBox="0 0 1440 1090"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#55718b"/></marker></defs><rect width="1440" height="1090" fill="#f5f8fc"/><text x="40" y="48" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="700" fill="#19354f">Step provenance · event-driven measurements</text><text x="40" y="80" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#19354f">Standalone subsystem · fixed selectors · two probes per measurement · bounded generation history</text><rect x="40" y="120" width="390" height="125" rx="12" fill="#eaf3ff" stroke="#b4c8da" stroke-width="1.5"/><text x="58" y="152" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#19354f">Dora reporting nodes</text><text x="58" y="184" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#19354f">Generation ref + input refs</text><text x="58" y="211" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#19354f">Start / end arrive separately</text><rect x="530" y="120" width="390" height="125" rx="12" fill="#eaf3ff" stroke="#b4c8da" stroke-width="1.5"/><text x="548" y="152" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#19354f">Protobuf definitions</text><text x="548" y="184" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#19354f">Name + anchor + two probes</text><text x="548" y="211" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#19354f">Loaded at startup; immutable</text><rect x="1010" y="120" width="390" height="125" rx="12" fill="#fff8e9" stroke="#b4c8da" stroke-width="1.5" stroke-dasharray="6 5"/><text x="1028" y="152" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#19354f">Temporary API · future</text><text x="1028" y="184" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#19354f">Register → handle → one result</text><text x="1028" y="211" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#19354f">Cancel / result → unregister</text><rect x="500" y="290" width="900" height="660" rx="12" fill="#edf2f8" stroke="#b4c8da" stroke-width="1.5"/><text x="518" y="322" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#19354f">Dora collector node · serialized updates</text><rect x="40" y="355" width="390" height="125" rx="12" fill="#ffffff" stroke="#b4c8da" stroke-width="1.5"/><text x="58" y="387" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#19354f">Ingress</text><text x="58" y="419" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#19354f">Validate identity / clock domain</text><text x="58" y="446" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#19354f">Merge partial updates; deduplicate</text><path d="M235 245V355" fill="none" stroke="#55718b" stroke-width="2" marker-end="url(#a)"/><text x="250" y="305" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#19354f">Dora / protobuf</text><rect x="530" y="355" width="390" height="135" rx="12" fill="#ffffff" stroke="#b4c8da" stroke-width="1.5"/><text x="548" y="387" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#19354f">Generation store</text><text x="548" y="419" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#19354f">Inputs + available timestamps</text><text x="548" y="446" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#19354f">Latest N per producer + step</text><text x="548" y="473" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#19354f">Evict in generation order</text><path d="M430 417H530" fill="none" stroke="#55718b" stroke-width="2" marker-end="url(#a)"/><text x="449" y="402" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#19354f">patch</text><rect x="1010" y="355" width="360" height="135" rx="12" fill="#ffffff" stroke="#b4c8da" stroke-width="1.5"/><text x="1028" y="387" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#19354f">Definition registry + index</text><text x="1028" y="419" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#19354f">Step / boundary → definitions</text><text x="1028" y="446" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#19354f">Anchor → instance creation</text><text x="1028" y="473" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#19354f">Compile selectors once</text><path d="M725 245V270H1100V355" fill="none" stroke="#55718b" stroke-width="2" marker-end="url(#a)"/><text x="800" y="263" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#19354f">compile</text><path d="M1205 245V355" fill="none" stroke="#55718b" stroke-width="2" marker-end="url(#a)" stroke-dasharray="6 5"/><text x="1215" y="305" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#19354f">same definition type</text><rect x="530" y="565" width="840" height="140" rx="12" fill="#eaf3ff" stroke="#b4c8da" stroke-width="1.5"/><text x="548" y="597" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#19354f">Affected-instance resolver</text><text x="548" y="629" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#19354f">Find affected definitions and waiting instances; create anchor instances</text><text x="548" y="656" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#19354f">Resolve probe generations; read timestamps already available</text><text x="548" y="683" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#19354f">Freeze resolved selections; retry unresolved links as records arrive</text><path d="M725 490V565" fill="none" stroke="#55718b" stroke-width="2" marker-end="url(#a)"/><text x="740" y="531" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#19354f">record / edge / eviction delta</text><path d="M1190 490V565" fill="none" stroke="#55718b" stroke-width="2" marker-end="url(#a)"/><text x="1200" y="531" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#19354f">affected definitions</text><rect x="530" y="785" width="390" height="135" rx="12" fill="#ffffff" stroke="#b4c8da" stroke-width="1.5"/><text x="548" y="817" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#19354f">Pending instances + wait index</text><text x="548" y="849" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#19354f">Key: definition + anchor generation</text><text x="548" y="876" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#19354f">Ref / boundary → waiting instances</text><text x="548" y="903" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#19354f">Missing ref → unresolved instances</text><rect x="1010" y="785" width="360" height="135" rx="12" fill="#edf8f1" stroke="#b4c8da" stroke-width="1.5"/><text x="1028" y="817" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#19354f">Evaluate affected pairs</text><text x="1028" y="849" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#19354f">Both ready → end − start</text><text x="1028" y="876" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#19354f">Missing → pending</text><text x="1028" y="903" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#19354f">Evicted history → incomplete</text><path d="M685 705V785" fill="none" stroke="#55718b" stroke-width="2" marker-end="url(#a)"/><text x="700" y="747" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#19354f">register / wake / remove</text><path d="M1190 705V785" fill="none" stroke="#55718b" stroke-width="2" marker-end="url(#a)"/><text x="1200" y="747" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#19354f">resolved probes</text><path d="M920 853H1010" fill="none" stroke="#55718b" stroke-width="2" marker-end="url(#a)"/><text x="938" y="840" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#19354f">state</text><rect x="40" y="565" width="390" height="200" rx="12" fill="#ffffff" stroke="#b4c8da" stroke-width="1.5"/><text x="58" y="597" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#19354f">Probe definition</text><text x="58" y="629" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#19354f">Step + boundary + fixed selector</text><text x="58" y="656" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#19354f">Consumed ancestor / same invocation</text><text x="58" y="683" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#19354f">Previous / latest known at anchor</text><text x="58" y="710" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#19354f">min / max: future milestone</text><rect x="40" y="805" width="390" height="115" rx="12" fill="#ffffff" stroke="#b4c8da" stroke-width="1.5"/><text x="58" y="837" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#19354f">Bounded lifecycle</text><text x="58" y="869" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#19354f">Evict records + associated waiters</text><text x="58" y="896" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#19354f">Finalize pending anchors on eviction</text><rect x="530" y="995" width="840" height="75" rx="12" fill="#edf8f1" stroke="#b4c8da" stroke-width="1.5"/><text x="548" y="1027" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#19354f">Protobuf results → Dora → monitoring / recording / live subscriber</text><text x="548" y="1059" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#19354f">Duration + selected refs + completeness + clock validity</text><path d="M1190 920V995" fill="none" stroke="#55718b" stroke-width="2" marker-end="url(#a)"/><text x="1200" y="970" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#19354f">emit once</text><text x="40" y="1008" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#19354f">Every incoming update drives evaluation.</text><text x="40" y="1038" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#19354f">Deadlines can add timers later.</text></svg>