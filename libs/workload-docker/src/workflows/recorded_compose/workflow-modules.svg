<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1110" viewBox="0 0 1440 1110" role="img" aria-labelledby="title desc">
  <title id="title">Docker workflow modules — shared Dora experiment</title>
  <desc id="desc">ComposeRunner prepares one Compose project, starts Dora then system and adopted apps, monitors the run, drains workloads, stops Dora and finalizes outputs. The recorded_compose directory contains preparation, phase orchestration, observation and finalization. Dora configuration, runtime control, graph ownership, step registration, filesystem checkpoints and crash recovery are supporting modules.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#64748b"/></marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #18324a; }
      .title { font-size: 30px; font-weight: 750; }
      .heading { font-size: 21px; font-weight: 700; }
      .file { font-family: ui-monospace, monospace; font-size: 20px; font-weight: 650; }
      .body { font-size: 19px; }
      .label { font-size: 16px; fill: #53677c; }
      .group { fill: #f6f9fd; stroke: #cbd5e1; stroke-width: 1.5; }
      .run { fill: white; stroke: #a8c4e8; stroke-width: 1.5; }
      .dora { fill: white; stroke: #96c8bd; stroke-width: 1.5; }
      .line { fill: none; stroke: #64748b; stroke-width: 1.8; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1440" height="1110" fill="#ffffff"/>
  <text x="40" y="47" class="title">One experiment · workflow modules</text>
  <text x="40" y="79" class="body">libs/workload-docker/src/workflows/</text>

  <rect x="40" y="108" width="1360" height="88" rx="12" fill="#183b60"/>
  <text x="64" y="143" class="file" style="fill:white">recorded_compose/mod.rs · ComposeRunner</text>
  <text x="64" y="175" class="body" style="fill:#e5effb">ComposeRun → one Compose project → ComposeRunReport</text>
  <path d="M365 196V228" class="line"/>

  <rect x="40" y="230" width="650" height="554" rx="12" class="group"/>
  <text x="62" y="267" class="heading">recorded_compose/</text>

  <rect x="60" y="289" width="610" height="92" rx="9" class="run"/>
  <text x="80" y="321" class="file">preparation.rs</text>
  <text x="80" y="351" class="body">Merge inputs · shared IPC · frozen plan and graph</text>
  <text x="80" y="374" class="label">preparation/model.rs · rules     preparation/tests.rs · tests</text>
  <path d="M365 381V408" class="line"/>

  <rect x="60" y="410" width="610" height="158" rx="9" class="run"/>
  <text x="80" y="442" class="file">mod.rs · ComposePhases</text>
  <text x="80" y="476" class="body">Start: Dora → system stable → adopted apps</text>
  <text x="80" y="510" class="body">Monitor: container health + Dora graph</text>
  <text x="80" y="544" class="body">Stop: adopted apps → system drain → Dora</text>
  <path d="M365 568V595" class="line"/>

  <rect x="60" y="597" width="610" height="86" rx="9" class="run"/>
  <text x="80" y="629" class="file">finalization.rs</text>
  <text x="80" y="659" class="body">Recordings · filesystem changes · removal gates · report</text>

  <rect x="60" y="706" width="610" height="60" rx="9" class="run"/>
  <text x="80" y="733" class="file">observation.rs</text>
  <text x="360" y="748" class="label">Docker events · host snapshots</text>

  <rect x="770" y="230" width="630" height="554" rx="12" fill="#f3faf7" stroke="#c5dcd3" stroke-width="1.5"/>
  <text x="792" y="267" class="heading">Dora control and step registration</text>

  <rect x="790" y="289" width="590" height="92" rx="9" class="dora"/>
  <text x="810" y="321" class="file">shared_dora.rs</text>
  <text x="810" y="351" class="body">Ports · graph validation · frozen graph + Zenoh config</text>
  <path d="M790 335H672" class="line"/>
  <text x="705" y="323" class="label">inputs</text>

  <rect x="790" y="410" width="590" height="88" rx="9" class="dora"/>
  <text x="810" y="442" class="file">dora.rs</text>
  <text x="810" y="474" class="body">Coordinator + daemon containers · start / inspect / stop</text>
  <path d="M790 454H672" class="line"/>
  <text x="697" y="442" class="label">runtime</text>

  <rect x="790" y="528" width="590" height="108" rx="9" class="dora"/>
  <text x="810" y="560" class="file">experiment.rs · ExperimentOwner</text>
  <text x="810" y="591" class="body">Register graph · track identity · stop roots and drain</text>
  <text x="810" y="618" class="label">dora.rs also implements methods on this owner</text>
  <path d="M790 550H730V524H672" class="line"/>
  <text x="688" y="512" class="label">graph</text>

  <rect x="790" y="666" width="590" height="100" rx="9" class="dora"/>
  <text x="810" y="699" class="file">steps.rs</text>
  <text x="810" y="730" class="body">Register step factories and shared dependencies</text>
  <text x="810" y="754" class="label">Docker · Dora · preparation · finalization</text>

  <text x="40" y="828" class="heading">Saved checkpoints and crash recovery</text>
  <rect x="40" y="848" width="650" height="96" rx="10" fill="#fff8ed" stroke="#dcc7a0" stroke-width="1.5"/>
  <text x="62" y="881" class="file">compose_lifecycle.rs</text>
  <text x="62" y="915" class="body">StopReport · durable filesystem checkpoints</text>
  <rect x="770" y="848" width="630" height="96" rx="10" fill="#fff8ed" stroke="#dcc7a0" stroke-width="1.5"/>
  <text x="792" y="881" class="file">recovery.rs</text>
  <text x="792" y="915" class="body">Verify saved ownership → stop → collect → remove</text>
  <path d="M770 898H692" class="line"/>

  <text x="40" y="987" class="heading">Shared execution and Docker operations</text>
  <g fill="#eef2f6" stroke="#cbd5e1" stroke-width="1.5">
    <rect x="40" y="1007" width="430" height="77" rx="9"/>
    <rect x="505" y="1007" width="430" height="77" rx="9"/>
    <rect x="970" y="1007" width="430" height="77" rx="9"/>
  </g>
  <text x="60" y="1038" class="file">orchestrator</text>
  <text x="60" y="1067" class="body">Execute steps · record step events</text>
  <text x="525" y="1038" class="file">workload-lifecycle</text>
  <text x="525" y="1067" class="body">Common run phases · recording checks</text>
  <text x="990" y="1038" class="file">compose/ · DockerAdapter</text>
  <text x="990" y="1067" class="body">Docker Engine · Compose · filesystem</text>
</svg>
