<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1250" viewBox="0 0 1600 1250" role="img" aria-labelledby="title desc">
  <title id="title">workload-docker directory relationships</title>
  <desc id="desc">The recorded Compose workflow chooses experiment order and policy. It calls lifecycle steps and Docker adapter capabilities inside the compose module. The adapter directory is nested inside compose and separates configuration, project execution and experiment resource cleanup. Inspection shares preparation resolution and emits a configuration snapshot; execution compares it at preflight before reservation. Compose commands use a logged CLI runner; Engine operations use Bollard. Filesystem and overlay operations are separate compose capabilities.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#52677c"/></marker>
    <style>
      text { font-family: 'DejaVu Sans', sans-serif; fill: #18324a; }
      .title { font-size: 32px; font-weight: 700; }
      .heading { font-family: 'DejaVu Sans Mono', monospace; font-size: 23px; font-weight: 700; }
      .file { font-family: 'DejaVu Sans Mono', monospace; font-size: 20px; font-weight: 700; }
      .body { font-size: 19px; }
      .small { font-size: 17px; fill: #52677c; }
      .edge { font-size: 16px; fill: #52677c; text-anchor: middle; }
      .card { fill: white; stroke: #bed0e2; stroke-width: 1.5; }
      .call { fill: none; stroke: #52677c; stroke-width: 2; marker-end: url(#arrow); }
      .transport { fill: none; stroke: #52677c; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="1250" fill="white"/>
  <text x="40" y="50" class="title">workload-docker · module boundaries</text>
  <text x="40" y="86" class="body">libs/workload-docker/src/</text>

  <rect x="40" y="140" width="580" height="950" rx="16" fill="#edf4ff" stroke="#afc9eb" stroke-width="2"/>
  <text x="65" y="182" class="heading">workflows/recorded_compose/</text>
  <text x="65" y="213" class="body">Experiment sequence and policy</text>

  <rect x="65" y="245" width="530" height="100" rx="10" class="card"/>
  <text x="85" y="278" class="file">mod.rs · ComposeRunner</text>
  <text x="85" y="307" class="body">ComposeRun in · ComposeRunReport out</text>
  <text x="85" y="333" class="small">Reset → prepare → preflight → reserve</text>
  <path d="M330 345V373" class="call"/>

  <rect x="65" y="375" width="530" height="100" rx="10" class="card"/>
  <text x="85" y="408" class="file">reset.rs</text>
  <text x="85" y="438" class="body">Lock · stop old writers · clear overlays</text>
  <text x="85" y="463" class="small">Block launch unless reset succeeds</text>
  <path d="M330 475V533" class="call"/>

  <rect x="65" y="535" width="530" height="100" rx="10" class="card"/>
  <text x="85" y="568" class="file">preparation.rs · resolve()</text>
  <text x="85" y="598" class="body">Merge apps · validate graph · pin images</text>
  <text x="85" y="623" class="small">snapshot.rs · ConfigurationSnapshot</text>
  <path d="M330 635V693" class="call"/>

  <rect x="65" y="695" width="530" height="155" rx="10" class="card"/>
  <text x="85" y="728" class="file">execution.rs</text>
  <text x="85" y="758" class="body">Start: Dora → system stable → adopted apps</text>
  <text x="85" y="787" class="body">Stop: adopted apps → system drain → Dora</text>
  <text x="85" y="816" class="small">observation.rs · Docker events + snapshots</text>
  <text x="85" y="840" class="small">Dora helpers: ../dora.rs + ../experiment.rs</text>
  <path d="M330 850V898" class="call"/>

  <rect x="65" y="900" width="530" height="160" rx="10" class="card"/>
  <text x="85" y="933" class="file">finalization.rs</text>
  <text x="85" y="963" class="body">Recordings · filesystem changes · report</text>
  <text x="85" y="993" class="body">Allow resource removal after verification</text>
  <text x="85" y="1040" class="small">Uses workload-lifecycle recording steps</text>

  <rect x="770" y="140" width="790" height="950" rx="16" fill="#f0f8f5" stroke="#acd1c1" stroke-width="2"/>
  <text x="795" y="182" class="heading">compose/</text>
  <text x="795" y="213" class="body">Docker capabilities and execution contracts</text>

  <rect x="795" y="240" width="355" height="85" rx="10" class="card"/>
  <text x="815" y="272" class="file">model.rs + state.rs</text>
  <text x="815" y="303" class="small">Protobuf inputs/results · readiness</text>
  <rect x="1180" y="240" width="355" height="85" rx="10" class="card"/>
  <text x="1200" y="272" class="file">steps.rs</text>
  <text x="1200" y="303" class="small">Lifecycle operations as Step types</text>

  <rect x="790" y="350" width="750" height="510" rx="12" fill="#dceee6" stroke="#7fb298" stroke-width="2"/>
  <text x="815" y="383" class="heading">adapter/</text>
  <text x="1040" y="383" class="small">adapter.rs · DockerAdapter connection</text>

  <rect x="815" y="400" width="700" height="75" rx="9" class="card"/>
  <text x="835" y="429" class="file">scope.rs · ExperimentResources</text>
  <text x="835" y="459" class="body">Stop, verify and remove resources in the controller scope</text>

  <rect x="815" y="535" width="700" height="100" rx="9" class="card"/>
  <text x="835" y="567" class="file">configuration.rs · ComposeConfiguration</text>
  <text x="835" y="597" class="body">Normalize Compose · pin images · freeze launch artifacts</text>
  <text x="835" y="623" class="small">ResolvedComposeProject + manifest files</text>

  <rect x="815" y="695" width="700" height="110" rx="9" class="card"/>
  <text x="835" y="728" class="file">project.rs · ComposeExecution</text>
  <text x="835" y="758" class="body">Start selected services · inspect · stop · remove</text>
  <text x="835" y="788" class="small">Borrows one ResolvedComposeProject</text>
  <text x="815" y="840" class="small">Views share the DockerAdapter connection and startup tasks</text>

  <path d="M595 437H813" class="call"/>
  <text x="700" y="425" class="edge">scope cleanup</text>
  <path d="M595 585H813" class="call"/>
  <text x="700" y="573" class="edge">normalize / resolve</text>
  <path d="M595 750H813" class="call"/>
  <text x="700" y="738" class="edge">lifecycle steps</text>

  <rect x="795" y="900" width="355" height="160" rx="10" class="card"/>
  <text x="815" y="933" class="file">filesystem.rs</text>
  <text x="815" y="962" class="file">overlay.rs</text>
  <text x="815" y="994" class="small">Baseline · changes · mounts</text>
  <text x="815" y="1022" class="small">Write back or discard uppers</text>
  <path d="M595 990H793" class="call"/>
  <text x="700" y="978" class="edge">filesystem steps</text>

  <rect x="1180" y="900" width="355" height="160" rx="10" class="card"/>
  <text x="1200" y="933" class="file">command.rs</text>
  <text x="1200" y="964" class="body">Logged Compose CLI runner</text>
  <text x="1200" y="996" class="small">config · create · up · exec</text>
  <text x="1200" y="1024" class="small">Timeouts · cancellation · logs</text>
  <path d="M1358 860V898" class="transport"/>
  <text x="1422" y="884" class="edge">CLI calls</text>

  <rect x="795" y="1150" width="740" height="75" rx="12" fill="#183b60"/>
  <text x="820" y="1181" class="file" style="fill:white">Docker Engine</text>
  <text x="820" y="1210" class="body" style="fill:#e5effb">Containers · images · networks · volumes · events</text>
  <path d="M1358 1060V1148" class="transport"/>
  <text x="1410" y="1108" class="edge">Compose</text>
  <path d="M1540 750H1580V1188H1537" class="transport"/>
  <text x="1512" y="1136" class="edge">Bollard API</text>
  <rect x="65" y="1140" width="530" height="85" rx="10" fill="#fff6df" stroke="#d6bb75" stroke-width="1.5"/>
  <text x="85" y="1173" class="file">Inspection · preparation::resolve</text>
  <text x="85" y="1203" class="body">Frozen plan + ConfigurationSnapshot</text>
  <path d="M65 585H20V1182H63" class="call"/>
</svg>
