<text x="1190" y="130" class="small" text-anchor="middle">Next start after crash</text>
<text x="734" y="710" class="small" text-anchor="start">Stable project per repo · one experiment per machine</text>
<rect x="40" y="780" width="1320" height="117" rx="12" fill="#edf4fa" stroke="#bacbdf" stroke-width="1.5"/>
<text x="64" y="817" class="heading" text-anchor="start">Common cleanup</text>
<text x="64" y="850" class="body" text-anchor="start">Stop writers → unmount owned overlays → remove owned Docker resources</text>
<text x="64" y="878" class="small" text-anchor="start">Pre-run: discard old uppers    ·    Normal teardown: copy-back or discard    ·    Outputs: kept</text>
</svg>
