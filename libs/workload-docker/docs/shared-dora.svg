<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="870" viewBox="0 0 1320 870" role="img" aria-labelledby="title desc">
  <title id="title">Current app-local Dora and proposed shared host Dora</title>
  <desc id="desc">Currently each hosted Dora app has its own coordinator and daemon containers, with nodes inside the daemon container. The proposal gives the shared Docker workflow ownership of one host Dora runtime, starts recording and system containers before user containers, and supplies IPC and connection settings to participating nodes. Ordinary third-party Docker workloads keep their source unchanged; Dora messaging needs an existing integration or an external adapter.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#475569"/></marker>
    <style>
      text { font-family: sans-serif; fill: #17324d; }
      .title { font-size: 23px; font-weight: 700; }
      .head { font-size: 18px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; }
      .center { text-anchor: middle; }
      .container { fill: #eff6ff; stroke: #94a3b8; stroke-width: 1.4; }
      .arrow { fill: none; stroke: #475569; stroke-width: 1.6; marker-end: url(#arrow); }
      .attach { fill: none; stroke: #15803d; stroke-width: 1.7; stroke-dasharray: 6 4; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1320" height="870" fill="white"/>
  <text x="30" y="36" class="title">Docker workflows: current vs proposed Dora ownership</text>
  <text x="30" y="64" class="body">Gallery and other callers use the same shared Docker workflow.</text>

  <rect x="25" y="90" width="605" height="535" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="660" y="90" width="635" height="535" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="45" y="120" class="head">CURRENT — independent app runtimes</text>
  <text x="680" y="120" class="head">PROPOSED — shared runtime owned by workflow</text>
  <rect x="50" y="140" width="555" height="55" rx="7" fill="#e2e8f0"/>
  <text x="327" y="173" class="body center">Docker workflow starts Compose, then app Dora flows</text>
  <rect x="685" y="140" width="585" height="55" rx="7" fill="#e2e8f0"/>
  <text x="977" y="173" class="body center">Docker workflow owns infrastructure and container groups</text>

  <rect x="50" y="225" width="265" height="305" rx="9" fill="white" stroke="#94a3b8"/>
  <rect x="335" y="225" width="270" height="305" rx="9" fill="white" stroke="#94a3b8"/>
  <text x="182" y="254" class="head center">App A Compose project</text>
  <text x="470" y="254" class="head center">App B Compose project</text>
  <rect x="65" y="273" width="235" height="55" rx="6" class="container"/>
  <text x="182" y="307" class="body center">Coordinator container</text>
  <rect x="350" y="273" width="240" height="55" rx="6" class="container"/>
  <text x="470" y="307" class="body center">Coordinator container</text>
  <rect x="65" y="355" width="235" height="155" rx="6" class="container"/>
  <text x="182" y="384" class="body center">Daemon container</text>
  <text x="182" y="415" class="small center">App / collector / recorder nodes</text>
  <text x="182" y="443" class="small center">spawned inside this container</text>
  <text x="182" y="484" class="small center">App-local runtime / IPC setup</text>
  <rect x="350" y="355" width="240" height="155" rx="6" class="container"/>
  <text x="470" y="384" class="body center">Daemon container</text>
  <text x="470" y="415" class="small center">App-specific nodes</text>
  <text x="470" y="443" class="small center">spawned inside this container</text>
  <text x="470" y="484" class="small center">App-local runtime / IPC setup</text>
  <g class="arrow"><path d="M182 195V225"/><path d="M470 195V225"/><path d="M182 328V355"/><path d="M470 328V355"/></g>
  <text x="327" y="566" class="body center">No shared cross-app IPC domain is configured.</text>
  <text x="327" y="596" class="small center">This panel describes the current Dora-based app profiles.</text>

  <rect x="685" y="225" width="585" height="375" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-dasharray="7 4"/>
  <text x="977" y="253" class="head center">Common Dora / IPC access for participating nodes</text>
  <rect x="715" y="273" width="525" height="65" rx="7" fill="#dcfce7" stroke="#86a892"/>
  <text x="977" y="300" class="head center">Host processes: Dora coordinator + daemon</text>
  <text x="977" y="323" class="small center">Host deployment shown; container deployment is optional</text>
  <rect x="715" y="375" width="245" height="70" rx="7" class="container"/>
  <rect x="985" y="375" width="255" height="70" rx="7" class="container"/>
  <text x="837" y="403" class="body center">Recording container</text>
  <text x="837" y="427" class="small center">Attach / subscribe, then signal ready</text>
  <text x="1112" y="403" class="body center">Other system containers</text>
  <text x="1112" y="427" class="small center">Collectors / supporting services</text>
  <rect x="715" y="500" width="245" height="75" rx="7" class="container"/>
  <rect x="985" y="500" width="255" height="75" rx="7" class="container"/>
  <text x="837" y="528" class="body center">Dora-aware user container</text>
  <text x="837" y="552" class="small center">Attach with explicit node configuration</text>
  <text x="1112" y="528" class="body center">Ordinary user container</text>
  <text x="1112" y="552" class="small center">Existing image / unchanged app source</text>
  <g class="attach">
    <path d="M837 375V338"/><path d="M1112 375V338"/>
    <path d="M715 538H700V306H715"/>
  </g>
  <path d="M977 195V225" class="arrow"/>
  <text x="977" y="479" class="small center">Workflow supplies IPC, mounts, connectivity and startup order</text>

  <rect x="25" y="650" width="1270" height="95" rx="9" fill="#e2e8f0"/>
  <text x="45" y="680" class="head">Proposed lifetime barriers</text>
  <text x="45" y="707" class="body">Start: Dora → recording / system apps ready → user apps</text>
  <text x="45" y="732" class="body">Stop: user apps → recording / system apps drain and stop → Dora → finalize / remove</text>
  <text x="30" y="783" class="body">Zero app-source changes for ordinary third-party Compose workloads; deployment configuration still changes.</text>
  <text x="30" y="811" class="body">Dora messages require an existing Dora integration or an external adapter. Shared IPC does not create message topics.</text>
  <text x="30" y="839" class="small">Dashed green arrows: node attachment. Cross-container attachment and actual shared-memory delivery still need qualification.</text>
</svg>
