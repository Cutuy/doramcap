<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
 <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="none" stroke="#52677f"/></marker></defs>
 <rect width="1100" height="620" fill="#f8fafc"/>
 <g font-family="sans-serif" fill="#172b43">
  <text x="35" y="38" font-size="23" font-weight="bold">One host · one experiment · one Dora communication domain</text>
  <rect x="30" y="60" width="1040" height="510" rx="15" fill="#eef4fa" stroke="#7894b4"/>
  <text x="50" y="90" font-size="18">Shared Rust Docker workflow · exclusive admission · frozen pbtxt + graph + launch arguments</text>
  <rect x="65" y="118" width="970" height="76" rx="9" fill="#dbeafe" stroke="#507ba8"/>
  <text x="550" y="148" text-anchor="middle" font-size="20">Host Dora coordinator + daemon</text>
  <text x="550" y="176" text-anchor="middle" font-size="15">Explicit endpoints · graph registration · experiment-owned lifetime</text>
  <g stroke="#52677f" stroke-width="2" marker-end="url(#a)"><path d="M220 194V235"/><path d="M550 194V235"/><path d="M880 194V235"/></g>
  <g fill="#fff" stroke="#7894b4"><rect x="65" y="240" width="300" height="120" rx="9"/><rect x="400" y="240" width="300" height="120" rx="9"/><rect x="735" y="240" width="300" height="120" rx="9"/></g>
  <g text-anchor="middle" font-size="18"><text x="215" y="272">Recording consumers</text><text x="550" y="272">System producers</text><text x="885" y="272">User participants</text></g>
  <g text-anchor="middle" font-size="15"><text x="215" y="302">Attach → drain → finalize MCAP</text><text x="550" y="302">Monitoring and supporting services</text><text x="885" y="302">Host processes / Docker containers</text><text x="215" y="333">Explicit input routes</text><text x="550" y="333">Explicit node IDs and outputs</text><text x="885" y="333">Shared qualified IPC / SHM setup</text></g>
  <text x="550" y="390" text-anchor="middle" font-size="15">Foreign Compose apps remain unchanged; internal messages require an explicit adapter or integration.</text>
  <rect x="65" y="415" width="970" height="120" rx="9" fill="#e2f1e8" stroke="#58866c"/>
  <text x="85" y="444" font-size="17">Start: Dora → graph → recorders / system services ready → users</text>
  <text x="85" y="476" font-size="17">Stop: users → remaining producers → recorder completion → Dora</text>
  <text x="85" y="508" font-size="17">Then: existing filesystem finalization / write-back → removal → release admission</text>
  <text x="35" y="600" font-size="15">Independent work overlaps within phases. Observable barriers order phases. Cross-container transport is the first qualification gate.</text>
 </g>
</svg>
