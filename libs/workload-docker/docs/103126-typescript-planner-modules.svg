<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1440" viewBox="0 0 1600 1440" role="img" aria-labelledby="title desc">
<title id="title">Compose planner source layout with TypeScript configuration planning</title>
<desc id="desc">The Rust recorded Compose workflow coordinates preparation and lifecycle. Within the Rust compose module, adapter configuration handles native Compose and Engine facts, while scope and project retain Docker lifecycle operations. An embedded QuickJS bridge calls the pure TypeScript planner. Protobuf contracts generate types in both languages. The runtime exposes a pure UTF-8 codec and bounded protobuf byte-buffer calls.</desc>
