<svg xmlns="http://www.w3.org/2000/svg" width="920" height="580" viewBox="0 0 920 580" role="img" aria-labelledby="title desc">
  <title id="title">Dora, shared memory and apps</title>
  <desc id="desc">System apps, recorders and user apps share the run's dev shm through the doramcap-shm service. The holder runs sleep infinity. Dora's coordinator and daemon manage the dataflow and connect participating apps.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536779"/></marker>
  </defs>
  <rect width="920" height="580" fill="#f7fafc"/>
  <g font-family="sans-serif" fill="#182b3a" text-anchor="middle">
    <text x="460" y="35" font-size="22" font-weight="600">Dora, shared memory and apps</text>
    <rect x="250" y="65" width="420" height="100" rx="10" fill="#e5f1e8" stroke="#8ba895"/>
    <text x="460" y="97" font-size="18" font-weight="600">doramcap-shm</text>
    <text x="460" y="124" font-size="16">Run-scoped /dev/shm</text>
    <text x="460" y="148" font-size="14">sleep infinity</text>
    <g fill="#dbeaf2" stroke="#8ca6b8">
      <rect x="55" y="255" width="350" height="85" rx="10"/>
      <rect x="515" y="255" width="350" height="85" rx="10"/>
    </g>
    <text x="230" y="304" font-size="18" font-weight="600">System apps / recorders</text>
    <text x="690" y="304" font-size="18" font-weight="600">User apps</text>
    <rect x="250" y="445" width="420" height="95" rx="10" fill="#fcebdc" stroke="#bc906b"/>
    <text x="460" y="480" font-size="18" font-weight="600">Dora coordinator + daemon</text>
    <text x="460" y="510" font-size="15">Dataflow control · node communication</text>
    <g fill="none" stroke="#536779" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)">
      <path d="M 330 170 V 195 H 230 V 250"/>
      <path d="M 590 170 V 195 H 690 V 250"/>
      <path d="M 230 345 V 410 H 330 V 440"/>
      <path d="M 690 345 V 410 H 590 V 440"/>
    </g>
    <g font-size="15" fill="#182b3a" stroke="#f7fafc" stroke-width="8" paint-order="stroke">
      <text x="230" y="231">Shared-memory access</text>
      <text x="690" y="231">Shared-memory access</text>
      <text x="230" y="384" dx="0" fill="#182b3a" stroke="#f7fafc" stroke-width="8" paint-order="stroke">Dora communication</text>
      <text x="690" y="384" dx="0" fill="#182b3a" stroke="#f7fafc" stroke-width="8" paint-order="stroke">Dora communication</text>
    </g>
  </g>
</svg>
