<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-labelledby="t desc"><title id="t">Upper-driven write-back MVP</title><desc id="desc">After writers stop, strictly unmount. Inspect upper and validate actions with targeted lower checks. Apply deletions and rsync selected files directly to host. Unsupported semantics fail before mutation.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52657d"/></marker></defs><rect width="1100" height="330" rx="12" fill="#f5f8fc"/><g font-family="sans-serif" fill="#172b44"><text x="30" y="38" font-size="22" font-weight="bold">MVP: upper → host with rsync</text><text x="30" y="65" font-size="15">Writers stopped • lower stable • rsync retained</text></g><g fill="#fff" stroke="#6c829e" stroke-width="2"><rect x="30" y="112" width="200" height="62" rx="8"/><rect x="290" y="112" width="180" height="62" rx="8"/><rect x="530" y="112" width="200" height="62" rx="8"/><rect x="790" y="112" width="275" height="62" rx="8"/><rect x="790" y="222" width="275" height="48" rx="8"/></g><g font-family="sans-serif" fill="#172b44" font-size="17" text-anchor="middle"><text x="130" y="149">Strict unmount</text><text x="380" y="149">Inspect upper</text><text x="630" y="149">Validate actions</text><text x="927" y="139">Apply to host lower</text><text x="927" y="161" font-size="14">Deletes • rsync archive mode</text><text x="927" y="252">Upper payloads</text></g><g fill="none" stroke="#52657d" stroke-width="2" marker-end="url(#a)"><path d="M230 143H290"/><path d="M470 143H530"/><path d="M730 143H790"/><path d="M927 222V174"/></g><g font-family="sans-serif" fill="#334963" font-size="15"><text x="30" y="235">Separate metadata manifest / streaming observer</text><text x="30" y="301">No payload staging • upper survives unmount • next run waits for completed disposition</text></g></svg>