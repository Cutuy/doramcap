<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400" role="img" aria-labelledby="title desc">
<title id="title">Current OverlayFS write-back</title><desc id="desc">Host lower and fresh upper form a merged view. After writers stop, selected paths are copied into staging. All overlays are strictly unmounted before deletions and a second rsync transfer update the host. Optimization is deferred.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657d"/></marker></defs>
<rect width="1040" height="400" rx="12" fill="#f5f8fc"/>
<g font-family="sans-serif" fill="#172b44"><text x="32" y="38" font-size="22" font-weight="bold">Current write-back • rsync retained</text><text x="32" y="65" font-size="15">Writers stopped; host source stable throughout finalization</text></g>
<g fill="#fff" stroke="#6c829e" stroke-width="2"><rect x="32" y="104" width="170" height="58" rx="8"/><rect x="32" y="204" width="170" height="58" rx="8"/><rect x="265" y="154" width="170" height="58" rx="8"/><rect x="505" y="154" width="170" height="58" rx="8"/><rect x="745" y="154" width="250" height="58" rx="8"/></g>
<g font-family="sans-serif" fill="#172b44" font-size="17" text-anchor="middle"><text x="117" y="139">Host lower</text><text x="117" y="239">Per-run upper</text><text x="350" y="189">Merged view</text><text x="590" y="189">Staging</text><text x="870" y="189">Original host directory</text></g>
<g fill="none" stroke="#52657d" stroke-width="2" marker-end="url(#arrow)"><path d="M202 133L231 133L231 173L265 173"/><path d="M202 233L231 233L231 193L265 193"/><path d="M435 183H505"/><path d="M675 183H745"/></g>
<g font-family="sans-serif" fill="#334963" font-size="14" text-anchor="middle"><text x="470" y="136">rsync #1</text><text x="470" y="239">Selected paths</text><text x="710" y="136">rsync #2</text></g>
<rect x="696" y="275" width="310" height="51" rx="8" fill="#fff0d8" stroke="#c58d29"/><g font-family="sans-serif" fill="#714b0b" font-size="15" text-anchor="middle"><text x="851" y="296">Apply gate: strict unmount first</text><text x="851" y="316">Deletions + staged writes</text></g><path d="M851 275V220" fill="none" stroke="#c58d29" stroke-width="2" marker-end="url(#arrow)"/>
<g font-family="sans-serif" fill="#334963" font-size="15"><text x="32" y="320">Metadata capture → separate manifest / warning</text><text x="32" y="366">Two payload copies • retain mode copies full view • merge optimization deferred</text></g></svg>