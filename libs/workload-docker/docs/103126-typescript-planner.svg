<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1130" viewBox="0 0 1520 1130" role="img" aria-labelledby="title desc">
<title id="title">Planned workflow: TypeScript planner and Rust executor</title>
<desc id="desc">Rust prepares native Compose documents, image facts and file snapshots. Binary protobuf messages cross into an embedded TypeScript planner. TypeScript merges documents, applies IPC and ownership settings, checks dependencies and emits diagnostics. Its binary protobuf response crosses back into Rust for validation, artifact publication and the ordered experiment lifecycle.</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#bd651b"/></marker>
<marker id="blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#536b80"/></marker>
<style>
text{font-family:'DejaVu Sans',sans-serif;fill:#19334a}.title{font-size:31px;font-weight:700}.heading{font-size:25px;font-weight:700}.file{font-family:'DejaVu Sans Mono',monospace;font-size:20px;font-weight:700}.body{font-size:21px}.small{font-size:18px;fill:#496277}.wire{font-family:'DejaVu Sans Mono',monospace;font-size:17px;fill:#9d4c0e;text-anchor:middle}.cross{fill:none;stroke:#bd651b;stroke-width:3;marker-start:url(#arrow);marker-end:url(#arrow)}.flow{fill:none;stroke:#536b80;stroke-width:2;marker-end:url(#blue-arrow)}
</style>
</defs>
<rect width="1520" height="1130" fill="white"/>
<text x="40" y="50" class="title">Planned workflow · TypeScript planner → protobuf → Rust executor</text>
<text x="40" y="88" class="body">Two planning passes · embedded TypeScript execution</text>

<rect x="40" y="140" width="650" height="850" rx="16" fill="#edf4fb" stroke="#a9c4df" stroke-width="2"/>
<text x="65" y="183" class="heading">Rust · workload-docker</text>
<rect x="65" y="210" width="600" height="260" rx="12" fill="white" stroke="#b5cbdf"/>
<text x="90" y="247" class="file">1. Normalize and validate inputs</text>
<text x="90" y="291" class="body">Docker Compose: YAML → normalized JSON</text>
<text x="90" y="328" class="body">Validate native Dora graph and endpoints</text>
<text x="90" y="365" class="body">Collect explicit app and runtime settings</text>
<text x="90" y="409" class="small">AnalyzeInput: normalized documents + typed settings</text>
<text x="90" y="442" class="small">AnalyzeOutput: image, file and name requirements</text>

<rect x="865" y="140" width="615" height="650" rx="16" fill="#edf8f4" stroke="#91c4b0" stroke-width="2"/>
<text x="890" y="183" class="heading">TypeScript · embedded QuickJS</text>
<rect x="890" y="210" width="565" height="475" rx="12" fill="white" stroke="#acd1c1"/>
<text x="915" y="247" class="file">2. Analyze / complete configuration</text>
<text x="915" y="300" class="body">Merge documents; reject naming conflicts</text>
<text x="915" y="344" class="body">Edit fields; preserve adopted app settings</text>
<text x="915" y="388" class="body">Wire shared IPC and approved Dora inputs</text>
<text x="915" y="432" class="body">Check dependencies and graph bindings</text>
<text x="915" y="476" class="body">Apply image, file and ownership facts</text>
<text x="915" y="520" class="body">Produce diagnostics and launch metadata</text>
<text x="915" y="579" class="small">CompleteOutput: typed Compose model</text>
<text x="915" y="611" class="small">Typed services + startup groups + diagnostics</text>
<text x="915" y="660" class="small">Native Docker JSON export from the typed model</text>
<text x="890" y="734" class="file">planner/</text>
<text x="890" y="767" class="small">Document processing moves out of Rust</text>

<path d="M665 325H888" class="cross"/>
<text x="777" y="278" class="wire">binary protobuf</text>
<text x="777" y="305" class="wire">AnalyzeInput</text>
<text x="777" y="353" class="wire">AnalyzeOutput</text>

<rect x="65" y="530" width="600" height="180" rx="12" fill="white" stroke="#b5cbdf"/>
<text x="90" y="568" class="file">3. Supply facts and publish</text>
<text x="90" y="610" class="body">Inspect images / names; snapshot input files</text>
<text x="90" y="649" class="body">Validate, save and hash the final manifest</text>
<text x="90" y="688" class="small">CompleteInput: facts → CompleteOutput: typed plan</text>
<path d="M890 603H667" class="cross"/>
<text x="777" y="556" class="wire">binary protobuf</text>
<text x="777" y="583" class="wire">CompleteInput</text>
<text x="777" y="632" class="wire">CompleteOutput</text>

<path d="M365 710V748" class="flow"/>
<rect x="65" y="750" width="600" height="215" rx="12" fill="white" stroke="#b5cbdf"/>
<text x="90" y="788" class="file">4. Execute the experiment</text>
<text x="90" y="831" class="body">Dora → system apps stable → adopted apps</text>
<text x="90" y="869" class="body">Observe → stop and drain → finalize → remove</text>
<text x="90" y="916" class="small">recorded_compose/ · workflow and cancellation</text>
<text x="90" y="946" class="small">compose/adapter/ · Docker lifecycle operations</text>

<rect x="865" y="835" width="615" height="155" rx="12" fill="#fff6e9" stroke="#dfc39a"/>
<text x="890" y="873" class="file">Binary protobuf contract</text>
<text x="890" y="913" class="body">Strong types for settings, facts and plan</text>
<text x="890" y="951" class="body">Compose input bytes → typed output model</text>

<path d="M365 990V1033" class="flow"/>
<rect x="65" y="1035" width="1390" height="70" rx="12" fill="#183b60"/>
<text x="90" y="1079" class="body" style="fill:white">Docker Compose CLI + Engine · containers, networks and volumes     |     Host · overlays, recordings and reports</text>
</svg>