<g font-family="sans-serif" font-size="16" fill="#0f172a" text-anchor="middle"><text x="90" y="104">Compose files</text><text x="90" y="126">and fixtures</text><text x="285" y="104">Compose config</text><text x="285" y="126">resolved JSON</text><text x="490" y="104">Rust models</text><text x="490" y="126">read / write</text><text x="685" y="104">Compose config</text><text x="685" y="126">resolved JSON</text><text x="835" y="115">Compare</text></g>
