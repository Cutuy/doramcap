<text x="48" y="985" font-size="18">Project borders = Docker resource grouping. Green connections = common IPC and /dev/shm.</text>
<text x="48" y="1010" font-size="17">Startup: Dora ready → system apps stable → user apps. Shutdown keeps the IPC owner until apps stop.</text>
