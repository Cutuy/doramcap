<text x="241" y="455" font-size="14" fill="#3266ac">TCP</text>
<rect x="30" y="733" width="600" height="122" rx="11" fill="#edf1f7" stroke="#94a9be"/>
<text x="48" y="762" font-size="19" font-weight="bold">Project: dc-run-user-app</text>
