<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1070" viewBox="0 0 1320 1070" role="img" aria-labelledby="title desc">
<title id="title">Today on main versus planned experiment containers and shared IPC</title>
<desc id="desc">Today on main each app input gets a separate Compose project. The optional injected System Monitor writes files without Dora. CPU Viewer's coordinator is one container; its daemon launches System Monitor, CPU Viewer and recorder processes inside another container, sharing that container's dev shm. Adopted app containers have their own dev shm. Planned: one experiment Compose project, with steps starting coordinator and daemon, ordinary system app containers, then adopted user containers. All containers join one IPC namespace and the same dev shm; user Dora attachment is optional. Every experiment supplies coordinator and daemon. A directory-derived daemon container name reserves ownership through verified cleanup.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3266ac"/></marker></defs>
<rect width="1320" height="1070" fill="#f7f9fc"/><g font-family="Arial,sans-serif" fill="#19324b">
<text x="30" y="42" font-size="30" font-weight="bold">Containers and IPC: today → planned</text>
<text x="30" y="76" font-size="19">Example: CPU Viewer + an adopted app, on one Linux host</text>
<text x="30" y="126" font-size="25" font-weight="bold">TODAY · main</text>
<text x="680" y="126" font-size="25" font-weight="bold">PLANNED · agreed target</text>
<text x="30" y="153" font-size="17">App inputs become separate Compose projects.</text>
<text x="680" y="153" font-size="17">One experiment project. Steps control selected services.</text>
<rect x="30" y="174" width="600" height="175" rx="11" fill="#edf1f7" stroke="#94a9be"/>
<text x="48" y="203" font-size="19" font-weight="bold">Project: dc-run-system · optional injected monitor</text>
<rect x="50" y="220" width="560" height="108" rx="11" fill="#fff" stroke="#94a9be"/>
<text x="68" y="249" font-size="20" font-weight="bold">System Monitor container</text>
<text x="68" y="280" font-size="17">cpu-monitor · Dora OFF · writes cpu.pb / cpu.mcap</text>
<text x="68" y="309" font-size="17" fill="#946126">Own IPC namespace and /dev/shm</text>
<rect x="30" y="369" width="600" height="344" rx="11" fill="#edf1f7" stroke="#94a9be"/>
<text x="48" y="400" font-size="19" font-weight="bold">Project: dc-run-cpu-viewer</text>
<rect x="50" y="423" width="185" height="122" rx="11" fill="#e0ebfa" stroke="#94a9be"/>
<text x="65" y="454" font-size="20" font-weight="bold">Coordinator</text>
<text x="65" y="484" font-size="16">dora coordinator</text>
<text x="65" y="519" font-size="16" fill="#946126">Own /dev/shm</text>
