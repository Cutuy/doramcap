<text x="313" y="569" font-size="17">CPU Viewer process</text>
<rect x="301" y="591" width="293" height="36" rx="6" fill="#fff" stroke="#94a9be"/>
<text x="313" y="615" font-size="17">MCAP Recorder process</text>
<rect x="301" y="644" width="293" height="32" rx="6" fill="#d6eee5" stroke="#24816a"/>
<text x="314" y="666" font-size="16" fill="#176a56">One /dev/shm for these processes</text>
