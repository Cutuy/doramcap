syntax = "proto3";
package doramcap.system_apps.v1;

// Supporting services for the shared Compose workflow.
message SystemAppsConfig {
  CpuMonitor cpu_monitor = 1;
  repeated DoraFlow dora_flows = 2;
}

// A fresh System Monitor service using apps/system-monitor/deploy/recording.yaml.
// The collector records CPU telemetry through its embedded MCAP writer.
message CpuMonitor {
  string image = 1; // Prebuilt local Docker image, pinned to its ID during resolution.
}

// A Dora flow managed inside an owned Compose service. The service runs a
// foreground daemon connected to a project-local coordinator.
message DoraFlow {
  string project = 1;
  string service = 2;
  string descriptor = 3; // Absolute descriptor path inside the daemon image.
  string name = 4;
  repeated DoraStopStage shutdown = 5; // Workloads, producers, then draining consumers.
  string readiness_url = 6; // Loopback HTTP probe inside the daemon's namespace.
  string readiness_field = 7; // Optional JSON boolean required at startup.
  string snapshot_url = 8;
  string snapshot_file = 9; // Result filename for the pre-stop public snapshot.
  string count_node = 10; // Collector whose Dora summary must report no loss.
  string count_file = 11; // Decimal published count for independent MCAP readback.
  string completion_file = 12;
  string results_directory = 13; // Absolute host path supplied by the run owner.
}
message DoraStopStage {
  repeated string nodes = 1; // Independent nodes in this stage stop concurrently.
  bool drain = 2; // Wait for natural input closure instead of issuing a stop.
}
