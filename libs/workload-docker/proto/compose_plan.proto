syntax = "proto3";
package doramcap.compose_plan.v1;
import "compose.proto";

// Flat launch inputs keyed by app ID; RunPlan owns roles and communication settings.
message ComposePlan {
  reserved 1, 2, 4, 5;
  repeated doramcap.compose.v1.ComposeProject projects = 3;
  string dora_image = 6;
  uint64 dora_shm_bytes = 7;
}
