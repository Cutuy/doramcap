services:
  app:
    image: busybox:1.37
    volumes:
      - type: bind
        source: /tmp/compose-type-evaluation-input
        target: /input
        read_only: true
        bind: {create_host_path: false, propagation: rprivate, selinux: z}
      - type: volume
        source: data
        target: /data
        volume: {nocopy: true, subpath: cache}
      - type: tmpfs
        target: /scratch
        tmpfs: {size: 1048576, mode: 0700}
volumes:
  data:
    labels: {example.owner: evaluation}
