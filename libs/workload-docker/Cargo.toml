[package]
name = "workload-docker"
description = "Recorded Compose workflow, observation and finalization"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
host-filesystem = { path = "../host-filesystem" }
compose-apps = { path = "../compose-apps" }
docker-engine = { path = "../docker-engine" }
workload-lifecycle = { path = "../workload-lifecycle" }
orchestrator = { path = "../orchestrator" }
system-config = { path = "../resources/system-config" }
prost = "0.14"
prost-reflect = { version = "0.16", features = ["text-format"] }
bollard = { version = "=0.21.1", default-features = false, features = ["http", "pipe"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
libc = "0.2"
rustix = { version = "1.1.5", features = ["fs"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "signal", "sync", "time"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
mcap = { version = "=0.26.0", default-features = false }
telemetry-protocol = { path = "../telemetry/protocol" }

[lints]
workspace = true
