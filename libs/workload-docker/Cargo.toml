[package]
name = "workload-docker"
description = "Docker Compose lifecycle steps and recorded-run workflow"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dora-app = { path = "../dora-app", default-features = false }
workload-lifecycle = { path = "../workload-lifecycle" }
orchestrator = { path = "../orchestrator" }
prost = "0.14"
prost-reflect = { version = "0.16", features = ["text-format"] }
dora-core = { version = "=1.1.0", default-features = false }
bollard = { version = "=0.21.1", default-features = false, features = ["http", "pipe"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.11"
hex = "0.4"
futures-util = "0.3"
libc = "0.2"
rustix = { version = "1.1.5", features = ["fs"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "signal", "sync", "time"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
mcap = { version = "=0.26.0", default-features = false }
telemetry-protocol = { path = "../telemetry/protocol" }

[lints]
workspace = true
