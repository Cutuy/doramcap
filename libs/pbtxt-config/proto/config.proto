syntax = "proto3";
package pbtxt_config.v1;
import "google/protobuf/any.proto";
message App {
  string id = 1;
  google.protobuf.Any config = 2;
}
message Fragment {
  repeated string include = 1; // Relative paths, ordered depth-first.
  repeated App app = 2;
}
message Deployment {
  uint32 version = 1;
  repeated App app = 2; // Sorted by ID; payloads normalized by the domain adapter.
}
