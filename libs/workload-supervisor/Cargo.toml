[package]
name = "workload-supervisor"
description = "Owned Supervisor System Monitor lifecycle"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
workload-lifecycle = { path = "../workload-lifecycle" }
orchestrator = { path = "../orchestrator" }
prost = "0.14"
prost-reflect = { version = "0.16", features = ["text-format"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
sha2 = "0.11"
hex = "0.4"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "signal", "sync", "time"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
mcap = { version = "=0.26.0", default-features = false }

[lints]
workspace = true
