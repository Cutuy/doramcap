<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="760" viewBox="0 0 1040 760" role="img" aria-labelledby="title desc">
 <title id="title">Dora control sequence and interrupted-start cleanup</title>
 <desc id="desc">Startup negotiates Hello, checks daemon readiness, starts the graph, retains its UUID and waits for spawn. Shutdown stops the graph before Destroy. A cancelled Start retains its attempt, reconnects to reconcile the exact owned run, and continues backend teardown when the outcome is unknown.</desc>
 <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
 <rect width="1040" height="760" rx="16" fill="#f8fafc"/>
 <g font-family="sans-serif" fill="#0f172a" font-size="16" text-anchor="middle">
  <text x="260" y="36" font-size="22">Startup and shutdown</text><text x="780" y="36" font-size="22">Interrupted Start</text>
  <text x="90" y="79">Workflow</text><text x="290" y="79">Client</text><text x="455" y="79">Coordinator</text>
  <text x="605" y="79">Workflow</text><text x="800" y="79">Client</text><text x="970" y="79">Coordinator</text>
 </g>
 <g stroke="#cbd5e1" stroke-width="1"><path d="M90 96V714M290 96V714M455 96V714M605 96V714M800 96V714M970 96V714" fill="none"/></g>
 <g font-family="sans-serif" fill="#0f172a" font-size="15" text-anchor="middle">
  <rect x="22" y="111" width="218" height="38" rx="6" fill="#dbeafe"/><text x="131" y="135">Launch native runtime</text>
  <text x="373" y="172">Connect + Hello</text><text x="373" y="211">HelloOk</text>
  <text x="373" y="250">DaemonConnected → true</text>
  <text x="190" y="296">Frozen descriptor + session</text>
  <text x="373" y="341">Start</text><text x="373" y="383">StartTriggered(UUID)</text>
  <rect x="212" y="410" width="156" height="34" rx="6" fill="#ccfbf1"/><text x="290" y="432">Retain UUID</text>
  <text x="373" y="474">WaitForSpawn(UUID)</text><text x="373" y="515">DataflowSpawned</text>
  <rect x="22" y="542" width="218" height="38" rx="6" fill="#dbeafe"/><text x="131" y="566">Launch apps → drain apps</text>
  <text x="373" y="610">Stop(UUID) → stopped</text><text x="373" y="655">Destroy → DestroyOk</text>
  <rect x="22" y="685" width="330" height="38" rx="6" fill="#dbeafe"/><text x="187" y="709">Verify native exit → finalize → remove</text>
  <rect x="541" y="111" width="218" height="38" rx="6" fill="#dbeafe"/><text x="650" y="135">Retain run + start attempt</text>
  <text x="885" y="188">Start sent once</text>
  <rect x="863" y="225" width="156" height="65" rx="6" fill="#e0e7ff"/><text x="941" y="249">May accept Start</text><text x="941" y="272">Reply lost</text>
  <rect x="541" y="326" width="270" height="64" rx="6" fill="#dbeafe"/><text x="676" y="350">Stop cancels request wait</text><text x="676" y="374">Client retains attempted operation</text>
  <text x="885" y="432">Reconnect + Hello</text><text x="885" y="482">List owned run</text>
  <text x="885" y="532">One match → Stop(UUID)</text>
  <rect x="541" y="585" width="465" height="65" rx="6" fill="#fef3c7"/><text x="773" y="610">Unknown / ambiguous → record outcome</text><text x="773" y="634">Continue owned native teardown</text>
  <rect x="541" y="685" width="465" height="38" rx="6" fill="#dbeafe"/><text x="773" y="709">Verify actual exit → finalize → permitted removal</text>
 </g>
 <g fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)">
  <path d="M300 184H445"/><path d="M445 222H300" stroke-dasharray="4 4"/>
  <path d="M300 263H445"/>
  <path d="M100 309H280"/>
  <path d="M300 354H445"/><path d="M445 396H300" stroke-dasharray="4 4"/>
  <path d="M300 487H445"/><path d="M445 528H300" stroke-dasharray="4 4"/>
  <path d="M300 623H445"/><path d="M300 668H445"/>
  <path d="M810 201H960"/><path d="M810 445H960"/><path d="M810 495H960"/><path d="M810 545H960"/>
 </g>
</svg>
