<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
<title id="title">Launch forms architecture</title>
<desc id="desc">Static config becomes shared role IDs, a dataflow artifact and flat backend inputs. Rust enforces Dora, system-app and user-app startup phases. Shared sub-workflows alternate with form-owned start, stop and remove calls on a typed handle. Launchers build on step libraries grouped by substrate.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#536779"/></marker></defs>
<rect width="1120" height="480" fill="#f7fafc"/>
<g font-family="sans-serif" fill="#182b3a" text-anchor="middle">
<text x="560" y="34" font-size="22" font-weight="600">Launch forms: shared run sequence, form-owned launchers</text>
<g stroke="#a9b4bf" fill="#eef1f4"><rect x="20" y="56" width="340" height="56" rx="6"/><rect x="390" y="56" width="340" height="56" rx="6"/><rect x="760" y="56" width="340" height="56" rx="6"/></g>
<text x="190" y="80" font-size="16" font-weight="600">App manifests + variant pbtxts</text><text x="190" y="101" font-size="13">ships with each app</text>
<text x="560" y="80" font-size="16" font-weight="600">deployment.pbtxt</text><text x="560" y="101" font-size="13">form · apps · variants · placement</text>
<text x="930" y="80" font-size="16" font-weight="600">Repo launch config</text><text x="930" y="101" font-size="13">compose.yaml · .service units</text>
