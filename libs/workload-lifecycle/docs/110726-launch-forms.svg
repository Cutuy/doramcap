<text x="246" y="175" font-size="16" font-weight="600">start</text><text x="246" y="196" font-size="13">returns handle</text>
<text x="404" y="175" font-size="16" font-weight="600">Run monitor</text><text x="404" y="196" font-size="13">until stop request</text>
<text x="562" y="175" font-size="16" font-weight="600">stop</text><text x="562" y="196" font-size="13">StopRecord</text>
