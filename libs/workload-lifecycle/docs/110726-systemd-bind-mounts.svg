<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" role="img" aria-labelledby="title description">
  <title id="title">Console systemd directory views</title>
  <desc id="description">Console supplies a SystemdPlan to systemd. Each generated unit receives a private root. Host system directories and the executable are read-only bind mounts. An example config maps to /config/app.pbtxt read-only; an output directory maps to /results writable. Kernel filesystems are available inside the unit. The private root holds mount points under /run/doramcap.</desc>
  <defs>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#2563eb"/></marker>
    <marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#b45309"/></marker>
    <marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #172554; }
      .title { font-size: 27px; font-weight: 700; }
      .heading { font-size: 20px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 14px; fill: #475569; }
      .path { font-family: monospace; font-size: 16px; }
      .label { font-size: 14px; font-weight: 700; }
      .ro { fill: #1d4ed8; }
      .rw { fill: #92400e; }
    </style>
  </defs>
  <rect width="1120" height="800" rx="18" fill="#f8fafc"/>
  <text x="40" y="46" class="title">Console systemd directory views</text>
  <g text-anchor="middle">
    <rect x="40" y="74" width="260" height="70" rx="10" fill="#e0e7ff"/>
    <text x="170" y="104" class="heading">Console</text><text x="170" y="127" class="small">App manifests + run paths</text>
    <path d="M300 109H458" stroke="#64748b" stroke-width="2" marker-end="url(#gray)"/>
    <text x="380" y="96" class="small">SystemdPlan</text>
    <rect x="470" y="74" width="610" height="70" rx="10" fill="#e0e7ff"/>
    <text x="775" y="104" class="heading">systemd creates each generated unit</text>
    <text x="775" y="127" class="small">RootDirectory + BindReadOnlyPaths + BindPaths</text>
  </g>
  <rect x="40" y="178" width="420" height="491" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <rect x="660" y="178" width="420" height="491" rx="12" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
  <text x="62" y="212" class="heading">Host filesystem</text>
  <text x="682" y="212" class="heading">One unit's private root  /</text>
  <text x="62" y="237" class="small">Source files and directories</text>
  <text x="682" y="237" class="small">Paths seen by the app</text>

  <g fill="#eff6ff"><rect x="58" y="257" width="384" height="62" rx="8"/><rect x="678" y="257" width="384" height="62" rx="8"/></g>
  <text x="74" y="281" class="path">/usr  /etc  /bin</text><text x="74" y="304" class="path">/sbin  /lib  /lib64</text>
  <text x="694" y="281" class="path">/usr  /etc  /bin</text><text x="694" y="304" class="path">/sbin  /lib  /lib64</text>
  <path d="M448 291H672" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
  <text x="560" y="278" text-anchor="middle" class="label ro">Read-only binds</text>

  <g fill="#eff6ff"><rect x="58" y="338" width="384" height="52" rx="8"/><rect x="678" y="338" width="384" height="52" rx="8"/></g>
  <text x="74" y="370" class="path">/opt/binaries/app</text><text x="694" y="370" class="path">/opt/binaries/app</text>
  <path d="M448 367H672" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
  <text x="560" y="354" text-anchor="middle" class="label ro">Read-only executable</text>

  <g fill="#eff6ff"><rect x="58" y="412" width="384" height="52" rx="8"/><rect x="678" y="412" width="384" height="52" rx="8"/></g>
  <text x="74" y="444" class="path">/srv/project/app.pbtxt</text><text x="694" y="444" class="path">/config/app.pbtxt</text>
  <path d="M448 441H672" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
  <text x="560" y="428" text-anchor="middle" class="label ro">Read-only config bind</text>

  <g fill="#fff7ed"><rect x="58" y="486" width="384" height="52" rx="8"/><rect x="678" y="486" width="384" height="52" rx="8"/></g>
  <text x="74" y="518" class="path">/srv/runs/r1/</text><text x="694" y="518" class="path">/results/</text>
  <path d="M448 515H672" stroke="#b45309" stroke-width="2" marker-start="url(#orange)" marker-end="url(#orange)"/>
  <text x="560" y="502" text-anchor="middle" class="label rw">Writable output bind</text>

  <g fill="#f1f5f9"><rect x="58" y="560" width="384" height="52" rx="8"/><rect x="678" y="560" width="384" height="52" rx="8"/></g>
  <text x="74" y="592" class="path">/proc  /sys  /dev</text><text x="694" y="592" class="path">/proc  /sys  /dev</text>
  <path d="M448 589H672" stroke="#64748b" stroke-width="2" marker-end="url(#gray)"/>
  <text x="560" y="576" text-anchor="middle" class="label">Kernel filesystems</text>
  <text x="682" y="644" class="small">Bind targets are created inside this root.</text>

  <rect x="40" y="700" width="1040" height="66" rx="10" fill="#e2e8f0"/>
  <text x="62" y="726" class="body">Private root backing directory</text>
  <text x="62" y="751" class="path">/run/doramcap/&lt;repository&gt;/roots/&lt;unit&gt;/</text>
  <text x="1054" y="739" text-anchor="end" class="small">Created for the unit; removed after verified shutdown</text>
  <path d="M870 700V675" stroke="#64748b" stroke-width="2" marker-end="url(#gray)"/>
</svg>
