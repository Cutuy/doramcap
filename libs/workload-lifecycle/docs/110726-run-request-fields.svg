<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
<title id="title">Shared run fields and native launch inputs</title>
<desc id="desc">Console supplies shared run facts and backend launch inputs. Rust starts Dora, system apps with recording readiness, then users.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#536779"/></marker></defs>
<rect width="960" height="400" fill="#f7fafc"/>
<g font-family="sans-serif" fill="#182b3a" text-anchor="middle">
<text x="480" y="34" font-size="22" font-weight="600">Shared run fields</text>
<rect x="40" y="55" width="880" height="44" rx="6" fill="#eef1f4" stroke="#a9b4bf"/>
<text x="480" y="83" font-size="16">Console · app pbtxt · native Compose files and systemd units</text>
<path d="M480 99 V120" stroke="#536779" marker-end="url(#arrow)"/>
<rect x="40" y="125" width="880" height="90" rx="6" fill="#dbeaf2" stroke="#8ca6b8"/>
<text x="480" y="150" font-size="16" font-weight="600">RunPlan</text>
<text x="480" y="176" font-size="14">Identity · paths · recordings · budgets · Dora / system / writer app IDs · dataflow file</text>
<text x="480" y="199" font-size="14">Preparation → resolved Dora runtime</text>
<rect x="40" y="230" width="430" height="65" rx="6" fill="#fcebdc" stroke="#bc906b"/>
<text x="255" y="254" font-size="16" font-weight="600">ComposePlan</text>
<text x="255" y="279" font-size="14">Native projects keyed by app ID</text>
<rect x="490" y="230" width="430" height="65" rx="6" fill="#fcebdc" stroke="#bc906b"/>
<text x="705" y="254" font-size="16" font-weight="600">SystemdPlan</text>
<text x="705" y="279" font-size="14">Programs · unit files · app binds · binaries</text>
<path d="M255 295 V317 H480 V330 M705 295 V317 H480" fill="none" stroke="#536779" marker-end="url(#arrow)"/>
<rect x="40" y="335" width="880" height="44" rx="6" fill="#eef1f4" stroke="#a9b4bf"/>
<text x="480" y="363" font-size="16">Rust: Dora → system apps + recording readiness → users</text>
</g></svg>
