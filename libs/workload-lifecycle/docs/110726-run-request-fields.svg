<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
<title id="title">Run request fields: end state</title>
<desc id="desc">Console sends one RunRequest. Its shared RunPlan holds start groups, MCAP writers and Dora settings; the Compose or systemd part holds only how each app launches.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#536779"/></marker></defs>
<rect width="960" height="450" fill="#f7fafc"/>
<g font-family="sans-serif" fill="#182b3a">
<text x="480" y="34" font-size="22" font-weight="600" text-anchor="middle">Run request fields: end state</text>
<rect x="40" y="56" width="880" height="44" rx="6" fill="#eef1f4" stroke="#a9b4bf"/>
<text x="480" y="84" font-size="16" font-weight="600" text-anchor="middle">Console (TypeScript): resolves apps, groups and launch facts</text>
<path d="M480 100 V120" fill="none" stroke="#536779" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="124" width="880" height="234" rx="10" fill="#ffffff" stroke="#8a99a8" stroke-dasharray="6 4"/>
<text x="60" y="148" font-size="15" font-weight="600">RunRequest</text>
<rect x="60" y="160" width="840" height="86" rx="6" fill="#dbeaf2" stroke="#8ca6b8"/>
<text x="80" y="184" font-size="16" font-weight="600">RunPlan (shared)</text>
<text x="80" y="208" font-size="14">id · repository · artifacts · recordings · budgets · groups of app IDs with gates</text>
<text x="80" y="230" font-size="14">MCAP writer apps · Dora: graph, ports, runtime directory, memlock, participant</text>
<rect x="60" y="260" width="410" height="84" rx="6" fill="#fcebdc" stroke="#bc906b"/>
<text x="80" y="284" font-size="16" font-weight="600">oneof compose: ComposePlan</text>
<text x="80" y="308" font-size="14">projects: one per app, keyed by app ID</text>
<text x="80" y="330" font-size="14">Dora image</text>
<rect x="490" y="260" width="410" height="84" rx="6" fill="#fcebdc" stroke="#bc906b"/>
<text x="510" y="284" font-size="16" font-weight="600">oneof systemd: SystemdPlan</text>
<text x="510" y="308" font-size="14">programs · adopted unit files (ID = file stem)</text>
<text x="510" y="330" font-size="14">Dora executable · host_shm</text>
<path d="M480 358 V378" fill="none" stroke="#536779" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="382" width="880" height="44" rx="6" fill="#eef1f4" stroke="#a9b4bf"/>
<text x="480" y="410" font-size="16" font-weight="600" text-anchor="middle">Native addon (Rust): maps by app ID into ComposeRun or SystemdRunner</text>
</g></svg>
