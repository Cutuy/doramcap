<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">Two shared-memory modes</title>
<desc id="desc">By default, apps share memory inside their run. In host mode, apps use host memory. Run memory is removed after the apps stop; host memory remains.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#526679"/></marker></defs>
<rect width="1000" height="440" fill="#f7fafc"/>
<g font-family="sans-serif" fill="#182b3a" text-anchor="middle">
<text x="250" y="36" font-size="21" font-weight="600">Default: share within the run</text>
<text x="750" y="36" font-size="21" font-weight="600">Host mode: pass through host shm</text>
<rect x="40" y="60" width="420" height="275" rx="12" fill="#edf5f8" stroke="#8ca6b8" stroke-width="1.5"/>
<text x="250" y="89" font-size="15" font-weight="600">Run</text>
<rect x="540" y="60" width="420" height="130" rx="12" fill="#edf5f8" stroke="#8ca6b8" stroke-width="1.5"/>
<text x="750" y="89" font-size="15" font-weight="600">Run</text>
<g fill="#dbeaf2" stroke="#8ca6b8">
<rect x="75" y="108" width="145" height="54" rx="7"/><rect x="280" y="108" width="145" height="54" rx="7"/>
<rect x="575" y="108" width="145" height="54" rx="7"/><rect x="780" y="108" width="145" height="54" rx="7"/>
</g>
<text x="147.5" y="141" font-size="17">App A</text><text x="352.5" y="141" font-size="17">App B</text>
<text x="647.5" y="141" font-size="17">App A</text><text x="852.5" y="141" font-size="17">App B</text>
<rect x="100" y="222" width="300" height="80" rx="8" fill="#e0efe5" stroke="#7ea68d"/>
<text x="250" y="253" font-size="18" font-weight="600">Run memory</text>
<text x="250" y="280" font-size="15">Removed after apps stop</text>
<rect x="100" y="366" width="300" height="48" rx="8" fill="#f0f1f3" stroke="#a9b4bf"/>
<text x="250" y="396" font-size="17">Host memory</text>
<rect x="600" y="222" width="300" height="80" rx="8" fill="#fcebdc" stroke="#bc906b"/>
<text x="750" y="253" font-size="18" font-weight="600">Host memory</text>
<text x="750" y="280" font-size="15">Kept after the run</text>
</g>
<g fill="none" stroke="#526679" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)">
<path d="M147.5 168V216"/><path d="M352.5 168V216"/>
<path d="M647.5 168V216"/><path d="M852.5 168V216"/>
</g>
</svg>
