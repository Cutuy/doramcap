<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
<title id="title">Run shared-memory policy</title>
<desc id="desc">Explicit native declarations and the global mode resolve into a per-app mount and IPC plan. Docker and systemd attach apps to shared run memory or host memory and report owned resource cleanup.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526679"/></marker>
</defs>
<rect width="1000" height="650" fill="#f7fafc"/>
<g font-family="sans-serif" fill="#182b3a" text-anchor="middle">
<text x="500" y="34" font-size="22" font-weight="600">Run shared memory</text>
<rect x="60" y="60" width="400" height="76" rx="9" fill="#dbeaf2" stroke="#8ca6b8"/>
<text x="260" y="89" font-size="17" font-weight="600">Global policy</text>
<text x="260" y="115" font-size="15">Host-invisible · Host-pass-through</text>
<rect x="540" y="60" width="400" height="76" rx="9" fill="#fcebdc" stroke="#bc906b"/>
<text x="740" y="89" font-size="17" font-weight="600">Explicit native declarations</text>
<text x="740" y="115" font-size="15">Compose · Unit files · Bind inputs</text>
<rect x="240" y="190" width="520" height="72" rx="9" fill="#eef1f4" stroke="#a9b4bf"/>
<text x="500" y="218" font-size="17" font-weight="600">Preparation</text>
<text x="500" y="243" font-size="15">Native overrides → Global → Default</text>
<text x="500" y="295" font-size="14">Resolved IPC and mount plan</text>
<rect x="80" y="325" width="350" height="70" rx="9" fill="#dbeaf2" stroke="#8ca6b8"/>
<text x="255" y="353" font-size="17" font-weight="600">Docker</text>
<text x="255" y="378" font-size="15">User · System · Dora apps</text>
<rect x="570" y="325" width="350" height="70" rx="9" fill="#dbeaf2" stroke="#8ca6b8"/>
<text x="745" y="353" font-size="17" font-weight="600">systemd</text>
<text x="745" y="378" font-size="15">Programs · Project units · App units</text>
<rect x="135" y="455" width="300" height="70" rx="9" fill="#e0efe5" stroke="#7ea68d"/>
<text x="285" y="483" font-size="17" font-weight="600">Run shm</text>
<text x="285" y="508" font-size="15">Shared by participating apps</text>
<rect x="565" y="455" width="300" height="70" rx="9" fill="#fcebdc" stroke="#bc906b"/>
<text x="715" y="483" font-size="17" font-weight="600">Host shm</text>
<text x="715" y="508" font-size="15">Host mode · Native mounts</text>
<rect x="135" y="580" width="300" height="44" rx="9" fill="#e0efe5" stroke="#7ea68d"/>
<text x="285" y="608" font-size="15">Verified stop → Owned cleanup</text>
<rect x="565" y="580" width="300" height="44" rx="9" fill="#fcebdc" stroke="#bc906b"/>
<text x="715" y="608" font-size="15">Host objects remain</text>
</g>
<g fill="none" stroke="#526679" stroke-width="1.6" marker-end="url(#arrow)">
<path d="M260 136V163H360V187"/><path d="M740 136V163H640V187"/>
<path d="M365 262V307H255V322"/><path d="M635 262V307H745V322"/>
<path d="M255 395V425H285V452"/><path d="M745 395V425H715V452"/>
<path d="M385 395V414H605V452"/><path d="M615 395V435H395V452"/>
<path d="M285 525V577"/><path d="M715 525V577"/>
</g>
</svg>
