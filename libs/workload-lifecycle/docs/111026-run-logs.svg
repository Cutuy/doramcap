<svg xmlns="http://www.w3.org/2000/svg" width="960" height="148" viewBox="0 0 960 148" role="img" aria-labelledby="title">
  <title id="title">Application output through the host journal</title>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
    <style>
      text { font-family: sans-serif; fill: #172554; text-anchor: middle; }
      .label { font-size: 17px; }
      .edge { font-size: 13px; fill: #475569; }
      .box { fill: white; stroke: #94a3b8; stroke-width: 1.5; rx: 10; }
      .flow { stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="960" height="148" rx="14" fill="#f0fdf4"/>
  <rect class="box" x="20" y="54" width="150" height="60"/><text class="label" x="95" y="89">Programs</text>
  <rect class="box" x="280" y="54" width="174" height="60"/><text class="label" x="367" y="89">Host journal</text>
  <rect class="box" x="564" y="54" width="160" height="60"/><text class="label" x="644" y="89">Log export</text>
  <rect class="box" x="828" y="54" width="112" height="60"/><text class="label" x="884" y="89">Run files</text>
  <path class="flow" d="M170 84H270"/><text class="edge" x="220" y="69">stdout / stderr</text>
  <path class="flow" d="M454 84H554"/><text class="edge" x="504" y="69">entries</text>
  <path class="flow" d="M724 84H818"/><text class="edge" x="774" y="69">files</text>
</svg>
