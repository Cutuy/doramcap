<title id="title">Foreign workload adoption and session evidence</title>
<desc id="desc">Compose sources and experiment policy feed a frozen plan. The lifecycle coordinator uses host executors and boundary checks, and records evidence under the session contract. Native launch adapters are future inputs.</desc>
