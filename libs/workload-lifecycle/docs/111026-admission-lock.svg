<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
<title id="title">Shared admission lock</title>
<desc id="desc">Compose, systemd and Holoscan each ask one shared admission lock for a repository before a run, build or cleanup. The lock is held on the repository folder. A second caller for the same repository is refused.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#536779"/></marker></defs>
<rect width="960" height="400" fill="#f7fafc"/>
<g font-family="sans-serif" fill="#182b3a" text-anchor="middle">
<text x="480" y="34" font-size="22" font-weight="600">One admission lock per repository</text>
<g fill="#dbeaf2" stroke="#8ca6b8">
<rect x="60" y="64" width="250" height="78" rx="8"/><rect x="355" y="64" width="250" height="78" rx="8"/><rect x="650" y="64" width="250" height="78" rx="8"/>
</g>
<text x="185" y="96" font-size="16" font-weight="600">Compose</text><text x="185" y="120" font-size="13">run</text>
<text x="480" y="96" font-size="16" font-weight="600">systemd</text><text x="480" y="120" font-size="13">run · operator cleanup</text>
<text x="775" y="96" font-size="16" font-weight="600">Holoscan</text><text x="775" y="120" font-size="13">build · run</text>
<g fill="none" stroke="#536779" stroke-width="1.5" marker-end="url(#arrow)">
<path d="M185 142 V172 H400 V196"/><path d="M480 142 V196"/><path d="M775 142 V172 H560 V196"/>
</g>
<text x="572" y="164" font-size="13" text-anchor="start">acquire(repository)</text>
<rect x="300" y="200" width="360" height="78" rx="8" fill="#fcebdc" stroke="#bc906b"/>
<text x="480" y="232" font-size="16" font-weight="600">workload-lifecycle admission</text>
<text x="480" y="256" font-size="13">held, or refused when busy</text>
<path d="M480 278 V310" fill="none" stroke="#536779" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="492" y="298" font-size="13" text-anchor="start">exclusive lock</text>
<rect x="340" y="314" width="280" height="56" rx="8" fill="#eef4f8" stroke="#8ca6b8"/>
<text x="480" y="347" font-size="16" font-weight="600">Repository folder</text>
</g></svg>
