<g stroke-width="1"><rect x="40" y="412" width="164" height="40" rx="6" fill="#fcebdc" stroke="#bc906b"/><rect x="219" y="412" width="164" height="40" rx="6" fill="#dbeaf2" stroke="#8ca6b8"/><rect x="398" y="412" width="164" height="40" rx="6" fill="#fcebdc" stroke="#bc906b"/><rect x="577" y="412" width="164" height="40" rx="6" fill="#dbeaf2" stroke="#8ca6b8"/><rect x="756" y="412" width="164" height="40" rx="6" fill="#fcebdc" stroke="#bc906b"/></g>
<g font-size="15" font-weight="600"><text x="122" y="437">start</text><text x="301" y="437">monitor</text><text x="480" y="437">stop</text><text x="659" y="437">finalize</text><text x="838" y="437">remove(self)</text></g>
