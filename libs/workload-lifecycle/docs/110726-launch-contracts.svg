<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
<title id="title">Launch contracts</title>
<desc id="desc">Console's config names app manifests. A manifest may carry both a Compose and a systemd section, each pointing at native files. Console resolves the selected form into one RunRequest: a shared RunPlan plus exactly one backend part, which the native addon runs.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#536779"/></marker></defs>
<rect width="960" height="620" fill="#f7fafc"/>
<g font-family="sans-serif" fill="#182b3a">
<text x="480" y="34" font-size="22" font-weight="600" text-anchor="middle">Launch contracts: config, manifests and the run request</text>

<rect x="30" y="60" width="270" height="170" rx="8" fill="#eef1f4" stroke="#a9b4bf"/>
<text x="46" y="84" font-size="16" font-weight="600">ConsoleConfig</text>
<text x="46" y="102" font-size="12" fill="#4a5d6e">console-config.proto · one per machine</text>
<g font-size="13"><text x="46" y="128">form: COMPOSE or SYSTEMD</text><text x="46" y="150">binaries · dora · runtime</text><text x="46" y="172">system_apps[]:</text><text x="58" y="194">manifest · default_selected</text><text x="58" y="214">live_outputs · health_inputs</text></g>

<rect x="330" y="60" width="330" height="170" rx="8" fill="#dbeaf2" stroke="#8ca6b8"/>
<text x="346" y="84" font-size="16" font-weight="600">AppManifest</text>
<text x="346" y="102" font-size="12" fill="#4a5d6e">launch.proto · ships with each app</text>
<g font-size="13"><text x="346" y="124">id · label · graph · variants · recordings</text><text x="346" y="144">config_target · output_targets</text></g>
<rect x="346" y="156" width="146" height="60" rx="6" fill="#fcebdc" stroke="#bc906b"/>
<text x="360" y="178" font-size="14" font-weight="600">compose</text><text x="360" y="200" font-size="13">files · service</text>
<rect x="500" y="156" width="146" height="60" rx="6" fill="#fcebdc" stroke="#bc906b"/>
<text x="514" y="178" font-size="14" font-weight="600">systemd</text><text x="514" y="200" font-size="13">unit · files</text>

<rect x="690" y="60" width="240" height="170" rx="8" fill="#eef1f4" stroke="#a9b4bf"/>
<text x="706" y="84" font-size="16" font-weight="600">Native launch files</text>
<text x="706" y="102" font-size="12" fill="#4a5d6e">every launcher detail</text>
<rect x="706" y="114" width="208" height="44" rx="6" fill="#ffffff" stroke="#a9b4bf"/>
<text x="720" y="141" font-size="13">compose.yaml</text>
<rect x="706" y="168" width="208" height="44" rx="6" fill="#ffffff" stroke="#a9b4bf"/>
<text x="720" y="195" font-size="13">cpu-monitor.service</text>

<g fill="none" stroke="#536779" stroke-width="1.5" marker-end="url(#arrow)">
<path d="M300 116 H326"/><path d="M660 136 H702"/><path d="M660 190 H702"/>
<path d="M480 230 V262"/><path d="M480 310 V330"/><path d="M480 520 V540"/>
</g>

<rect x="30" y="266" width="900" height="44" rx="8" fill="#eef1f4" stroke="#a9b4bf"/>
<text x="480" y="294" font-size="15" font-weight="600" text-anchor="middle">Console server (TypeScript): form picks the manifest section; resolves variants, binds and units</text>

<rect x="30" y="334" width="900" height="186" rx="10" fill="#ffffff" stroke="#8a99a8" stroke-dasharray="6 4"/>
<text x="46" y="356" font-size="15" font-weight="600">RunRequest</text>
<text x="146" y="356" font-size="12" fill="#4a5d6e">execution.proto · one per run, built by TypeScript, run by Rust</text>
<rect x="50" y="368" width="860" height="38" rx="6" fill="#dbeaf2" stroke="#8ca6b8"/>
<text x="66" y="392" font-size="14"><tspan font-weight="600">run: RunPlan</tspan> · id · repository · artifacts · recordings · readiness and stop budgets</text>
<text x="480" y="424" font-size="12" fill="#4a5d6e" text-anchor="middle">oneof backend: exactly one</text>
<rect x="50" y="432" width="410" height="76" rx="6" fill="#fcebdc" stroke="#bc906b"/>
<text x="66" y="456" font-size="14" font-weight="600">compose: ComposePlan</text>
<text x="66" y="478" font-size="13">system_apps · projects (ComposeProject)</text>
<text x="66" y="498" font-size="13">dora (DoraRuntime) · mcap_services</text>
<text x="480" y="474" font-size="14" font-weight="600" text-anchor="middle">or</text>
<rect x="500" y="432" width="410" height="76" rx="6" fill="#fcebdc" stroke="#bc906b"/>
<text x="516" y="456" font-size="14" font-weight="600">systemd: SystemdPlan</text>
<text x="516" y="478" font-size="13">groups: app_units · unit_files · programs</text>
<text x="516" y="498" font-size="13">dora (DoraUnits) · binaries</text>

<rect x="30" y="544" width="900" height="40" rx="8" fill="#eef1f4" stroke="#a9b4bf"/>
<text x="480" y="569" font-size="15" font-weight="600" text-anchor="middle">Native addon (Rust): ComposeRun or SystemdRunner; drop-ins and overrides add run facts</text>

<g font-size="12">
<rect x="30" y="596" width="18" height="12" rx="3" fill="#dbeaf2" stroke="#8ca6b8"/><text x="56" y="606">Every launcher</text>
<rect x="180" y="596" width="18" height="12" rx="3" fill="#fcebdc" stroke="#bc906b"/><text x="206" y="606">One launcher</text>
<rect x="320" y="596" width="18" height="12" rx="3" fill="#eef1f4" stroke="#a9b4bf"/><text x="346" y="606">Machine, process or native file</text>
<text x="600" y="606">Manifest sections: any may be set · RunRequest: exactly one</text>
</g>
</g></svg>
