<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="610" viewBox="0 0 1040 610" role="img" aria-labelledby="title desc">
 <title id="title">DoraCoordinatorClient ownership and injection</title>
 <desc id="desc">The selected Compose or systemd workflow and executor factories retain a shared DoraCoordinatorClient. Transient steps call it through typed methods. Each experiment reuses its own WebSocket to its owned coordinator. The workflow manages native teardown and retained artifacts.</desc>
 <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
 <rect width="1040" height="610" rx="16" fill="#f8fafc"/>
 <g font-family="sans-serif" fill="#0f172a" text-anchor="middle">
  <text x="520" y="35" font-size="23">One client per experiment</text>
  <rect x="25" y="110" width="225" height="145" rx="10" fill="#dbeafe"/>
  <text x="137" y="145" font-size="18">Compose / systemd</text><text x="137" y="173" font-size="18">workflow</text>
  <text x="137" y="210" font-size="15">Startup · drain · native teardown</text><text x="137" y="236" font-size="15">Retains shared client reference</text>
  <rect x="310" y="70" width="285" height="220" rx="10" fill="#e2e8f0"/>
  <text x="452" y="101" font-size="18">LocalExecutor</text>
  <rect x="332" y="120" width="241" height="50" rx="8" fill="#fff"/><text x="452" y="150" font-size="17">Step factories</text>
  <rect x="332" y="222" width="241" height="48" rx="8" fill="#fff"/><text x="452" y="251" font-size="17">Transient steps</text>
  <rect x="310" y="380" width="340" height="150" rx="10" fill="#ccfbf1"/>
  <text x="480" y="417" font-size="21">DoraCoordinatorClient</text>
  <text x="480" y="450" font-size="16">Connection · attempted start · graph UUID</text>
  <text x="480" y="480" font-size="16">Typed methods · explicit close</text>
  <text x="480" y="508" font-size="16">Ownership retained through cleanup</text>
  <rect x="805" y="398" width="210" height="125" rx="10" fill="#e0e7ff"/>
  <text x="910" y="442" font-size="19">Dora coordinator</text><text x="910" y="480" font-size="16">Graph lifecycle</text>
  <rect x="25" y="475" width="225" height="85" rx="10" fill="#fef3c7"/>
  <text x="137" y="511" font-size="18">Retained artifacts</text><text x="137" y="539" font-size="15">Graph · sessions · recordings</text>
