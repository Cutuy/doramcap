syntax = "proto3";
package doramcap.launch.v1;

// Process manager that launches every app of one run.
enum Form {
  FORM_UNSPECIFIED = 0;
  COMPOSE = 1;
  SYSTEMD = 2;
  SUPERVISOR = 3;
}

// Access to the host's /dev/shm filesystem; callers must choose a supported value.
enum HostShmAccess {
  HOST_SHM_ACCESS_UNSPECIFIED = 0;
  HOST_SHM_ACCESS_PASSTHROUGH = 1;
  HOST_SHM_ACCESS_BLOCKED = 2;
}

// One recording checked after its writers stop. Paths are absolute.
message Recording {
  string stream = 1;
  string recording = 2;
}

// Inputs every form shares for one run, resolved before launch. A launch request
// pairs this plan with exactly one form's own launch inputs.
message RunPlan {
  // Caller-selected run identifier, used in resource ownership and output names.
  string id = 1;
  // Absolute repository root defining admission and reset scope.
  string repository_root = 2;
  // Absolute, new artifact directory; its parent must already exist.
  string artifacts = 3;
  repeated Recording recordings = 4;
  // Positive startup and readiness budget in seconds.
  uint64 readiness_seconds = 5;
  // Stop grace period in seconds for apps declaring none.
  uint64 stop_seconds = 6;
  // App IDs started before user apps and stopped after them.
  repeated string system_apps = 7;
  // App IDs whose services write MCAP through io_uring.
  repeated string mcap_apps = 8;
  // App IDs launched in the first phase, before system and user apps.
  repeated string dora_apps = 9;
  // Absolute path to the merged native Dora dataflow file; empty registers none.
  string dataflow_file = 10;
  // Filled by preparation from app inputs; callers must leave this absent.
  DoraRuntime dora_runtime = 11;
  // Required: PASSTHROUGH uses host /dev/shm; BLOCKED shares a private run filesystem.
  HostShmAccess host_shm_access = 12;
}

// Per-preparation Dora facts consumed by launch adapters and runtime control.
message DoraRuntime {
  uint32 coordinator_port = 1;
  uint32 daemon_port = 2;
  // Automatic endpoints vary between independent preparations of the same inputs.
  bool automatic_coordinator_port = 3;
  bool automatic_daemon_port = 4;
  // Absolute generated host directory for Dora session files.
  string runtime_directory = 5;
  // Read-only native Zenoh configuration attached to participant apps.
  ResolvedFileBinding zenoh = 6;
  // Frozen, expanded graph attached to the coordinator; absent registers none.
  ResolvedFileBinding dataflow = 7;
  string dataflow_sha256 = 8;
}

// One resolved read-only file binding, with absolute host and app-visible paths.
message ResolvedFileBinding {
  string source = 1;
  string target = 2;
}

// Writers and form-owned evidence after every app stopped.
message StopRecord {
  // Every app's writers stopped, so recordings may be checked.
  bool writers_stopped = 1;
  // Evidence the form must keep before removal is durable.
  bool evidence_durable = 2;
}

// What removal may discard, decided after writers stop.
message RemovalPermit {
  // Owned resources may be removed.
  bool remove = 1;
  bool recording_finalized = 2;
}

// Removal evidence.
message CleanupRecord {
  // Owned resources were verified gone.
  bool verified = 1;
}

// Kernel identity of one experiment's system-app accounting boundary.
message SystemAppCgroup {
  string slice = 1;
  // Absolute path in the host's cgroup v2 filesystem.
  string path = 2;
  uint64 id = 3;
}

// Launch facts of one app, shipped beside it. File sources resolve relative to
// this file's directory and must stay beneath it.
message AppManifest {
  string id = 1;
  string label = 2;
  // Dora dataflow file listing the app's nodes, unless a variant replaces it.
  string graph = 3;
  ComposeLaunch compose = 4;
  // Ways to launch the app; the first is the default.
  repeated Variant variants = 5;
  // Recordings every variant writes.
  repeated RecordingOutput recordings = 6;
  // Where the chosen variant's config appears in the app's own view, read-only.
  string config_target = 7;
  // Where the run's artifact directory appears in the app's own view.
  repeated string output_targets = 8;
  SystemdLaunch systemd = 9;
  // Common process settings applied by every backend.
  AppProcess process = 10;
  // App-owned files, read-only at the same targets in every backend.
  repeated FileMount files = 11;
}

// Backend-independent process configuration. Zero limits/grace use deployment defaults.
message AppProcess {
  // Executable basename followed by arguments; the backend resolves its installed path.
  repeated string argv = 1;
  // Absolute path in the app's view; empty keeps the backend default.
  string working_directory = 2;
  uint64 memlock_bytes = 3;
  // Decimal Linux cpulist; empty keeps deployment placement.
  string cpus = 4;
  // Signal number; zero selects SIGTERM.
  int32 stop_signal = 5;
  uint64 stop_seconds = 6;
}

// Compose-specific settings; common process settings come from AppManifest.
message ComposeLaunch {
  // Compose files in merge order.
  repeated string files = 1;
  // Service that receives the config and output mounts.
  string service = 2;
}

// Optional native systemd launch for apps without common process settings.
message SystemdLaunch {
  // Unit file, adopted unchanged.
  string unit = 1;
  // Files beside the manifest that appear read-only at absolute targets.
  repeated FileMount files = 2;
}

message FileMount {
  // Relative file source beneath the manifest directory.
  string source = 1;
  // Absolute path in the app process view.
  string target = 2;
}

// One way to launch an app: its own config pbtxt and the recordings it adds.
message Variant {
  string id = 1;
  string label = 2;
  string config = 3;
  // Replaces the app's graph when this variant launches.
  string graph = 4;
  repeated RecordingOutput recordings = 5;
}

// One recording an app writes beneath the run's artifact directory.
message RecordingOutput {
  string id = 1;
  string path = 2;
  string stream = 3;
  // The recording holds CPU accounting.
  bool cpu = 4;
}
