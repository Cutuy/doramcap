syntax = "proto3";
package doramcap.launch.v1;

// Process manager that launches every app of one run.
enum Form {
  FORM_UNSPECIFIED = 0;
  COMPOSE = 1;
  SYSTEMD = 2;
  SUPERVISOR = 3;
}

// One recording checked after its writers stop. Paths are absolute.
message Recording {
  string stream = 1;
  string recording = 2;
}

// Inputs every form shares for one run, resolved before launch. A launch request
// pairs this plan with exactly one form's own launch inputs.
message RunPlan {
  // Caller-selected run identifier, used in resource ownership and output names.
  string id = 1;
  // Absolute repository root defining admission and reset scope.
  string repository_root = 2;
  // Absolute, new artifact directory; its parent must already exist.
  string artifacts = 3;
  reserved 4;
  repeated Recording recordings = 5;
  // Positive startup and readiness budget in seconds.
  uint64 readiness_seconds = 6;
  // Stop grace period in seconds for apps declaring none.
  uint64 stop_seconds = 7;
}

// Writers and form-owned evidence after every app stopped.
message StopRecord {
  // Every app's writers stopped, so recordings may be checked.
  bool writers_stopped = 1;
  // Evidence the form must keep before removal is durable.
  bool evidence_durable = 2;
}

// What removal may discard, decided after writers stop.
message RemovalPermit {
  // Owned resources may be removed.
  bool remove = 1;
  bool recording_finalized = 2;
}

// Removal evidence.
message CleanupRecord {
  // Owned resources were verified gone.
  bool verified = 1;
}

// Launch facts of one app, shipped beside it. Paths are relative to this file's
// directory and must stay beneath it.
message AppManifest {
  string id = 1;
  string label = 2;
  // Dora dataflow file listing the app's nodes, unless a variant replaces it.
  string graph = 3;
  ComposeLaunch compose = 4;
  // Ways to launch the app; the first is the default.
  repeated Variant variants = 5;
  // Recordings every variant writes.
  repeated RecordingOutput recordings = 6;
  ProgramLaunch program = 7;
}

// How the systemd form launches an app. Its unit sees configs and outputs through
// bind mounts at the same paths its container would.
message ProgramLaunch {
  // Executable name inside the deployment's binaries directory.
  string executable = 1;
  repeated string args = 2;
  // Zero keeps the service manager's default limit.
  uint64 memlock_bytes = 3;
  // Signal number sent first on stop; zero sends SIGTERM.
  int32 kill_signal = 4;
  // Where the chosen variant's config appears, read-only.
  string config_target = 5;
  // Where the run's artifact directory appears.
  repeated string output_targets = 6;
  // Files beside the manifest that appear read-only at absolute targets.
  repeated FileMount files = 7;
}

message FileMount {
  string source = 1;
  string target = 2;
}

// How the Compose form launches an app.
message ComposeLaunch {
  // Compose files in merge order.
  repeated string files = 1;
  // Where the chosen variant's config is mounted read-only.
  ServiceMount config_mount = 2;
  // Where the run's artifact directory is mounted.
  repeated ServiceMount output_mounts = 3;
}

// A service and an absolute path inside it.
message ServiceMount {
  string service = 1;
  string target = 2;
}

// One way to launch an app: its own config pbtxt and the recordings it adds.
message Variant {
  string id = 1;
  string label = 2;
  string config = 3;
  // Replaces the app's graph when this variant launches.
  string graph = 4;
  repeated RecordingOutput recordings = 5;
}

// One recording an app writes beneath the run's artifact directory.
message RecordingOutput {
  string id = 1;
  string path = 2;
  string stream = 3;
  // The recording holds CPU accounting.
  bool cpu = 4;
}
