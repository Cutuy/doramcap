[package]
name = "workload-lifecycle"
description = "Mechanism-neutral workload lifecycle design and contracts"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
host-filesystem = { path = "../host-filesystem" }
dora-control = { path = "../dora-control" }
dora-core.workspace = true
serde_json = "1"
libc = "0.2"
notify = { version = "8.2.1", default-features = false }
orchestrator = { path = "../orchestrator" }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "time", "rt", "sync", "process"] }
zbus = { version = "6", default-features = false, features = ["tokio"] }
zbus_systemd = { version = "0.26201", features = ["systemd1"] }

[dev-dependencies]
tokio = { version = "1", features = ["process"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[lints]
workspace = true
