name: Node CI

on:
  push:
    branches: [main]
    tags: ['console-v*']
    paths: &node-inputs
      - '.github/workflows/node.yml'
      - '.agents/**'
      - '.node-version'
      - 'scripts/ci/**'
      - 'console/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'apps/**'
      - 'libs/**'
  pull_request:
    paths: *node-inputs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ARM64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            apps/*/frontend/package-lock.json
            console/*/package-lock.json
            scripts/ci/package-lock.json
      - name: Install tooling
        run: npm --prefix scripts/ci ci --ignore-scripts --no-audit --no-fund
      - name: Set up Rust for the Console native bridge
        run: rustup show
      - name: Cache Cargo downloads and compiled dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.runner }}
          cache-bin: false
      - name: Check tooling libraries
        run: |
          npm --prefix scripts/ci test
          npm --prefix scripts/ci run typecheck
          node --test .agents/skills/worktree-pool/scripts/pool.test.ts
      - name: Test Node suites
        run: node scripts/ci/test-node.mts
      - name: Build Project Explorer
        working-directory: apps/project-explorer/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
