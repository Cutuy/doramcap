name: Node CI

on:
  push:
    paths: &node-inputs
      - '.github/workflows/node.yml'
      - '.node-version'
      - 'scripts/ci/**'
      - 'console/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'apps/**'
      - 'libs/**'
  pull_request:
    paths: *node-inputs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ARM64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            apps/*/frontend/package-lock.json
            console/*/package-lock.json
      - name: Set up Rust for the Console native bridge
        run: rustup show
      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: node-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: node-cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: Test Node suites
        run: node scripts/ci/test-node.mts
