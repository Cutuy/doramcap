name: Promote Console rc6 images

on:
  push:
    branches: [codex/console-release-latest]
    paths: [.github/workflows/promote-console-rc6.yml]

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Sign in to GHCR
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - name: Promote the published rc6 digests
        run: node console/scripts/release-images.mts promote --registry ghcr.io/cutuy/doramcap --version 0.0.1-rc6
