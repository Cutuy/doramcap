name: Rust CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ARM64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      # Fresh hosted VMs need compact artifacts across multiple feature builds.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CLANG: clang-18
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang-18 libclang-18-dev llvm-18-dev build-essential pkg-config \
            libelf-dev zlib1g-dev python3 rsync

      - name: Install pinned Rust toolchain
        run: |
          rustup show
          rustc --version
          cargo --version

      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (default features)
        run: cargo clippy --workspace --no-deps --all-targets --locked -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --workspace --no-deps --all-targets --all-features --locked -- -D warnings

      - name: Test storage without default features
        run: |
          # Registered I/O buffers need more than the hosted runner default.
          sudo prlimit --pid "$$" --memlock=268435456:268435456
          ulimit -l
          cargo test --locked -p storage-persistence --no-default-features

      - name: Test workspace (default features)
        run: |
          # Registered I/O buffers need more than the hosted runner default.
          sudo prlimit --pid "$$" --memlock=268435456:268435456
          ulimit -l
          cargo test --locked --workspace

      - name: Test workspace (all features)
        run: |
          # Registered I/O buffers need more than the hosted runner default.
          sudo prlimit --pid "$$" --memlock=268435456:268435456
          ulimit -l
          cargo test --locked --workspace --all-features

      - name: Build examples and binaries
        run: cargo build --locked --workspace --all-features --examples --bins

      - name: Test CI snapshot synchronization
        run: python3 -m unittest discover -s scripts/ci -p 'test_prepare_build.py'
