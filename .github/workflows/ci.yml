name: Rust CI

on:
  push:
    branches: [main]
    paths: &rust-inputs
      - '.github/workflows/ci.yml'
      - '.cargo/**'
      - '.node-version'
      - 'rust-toolchain*'
      - '*rustfmt.toml'
      - '*clippy.toml'
      - 'libs/**'
      - 'apps/**'
      - 'console/proto/**'
      - 'scripts/ci/**'
      - '!**/*.md'
      - '!**/*.svg'
      - '!apps/*/frontend/**'
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      # These frontend files are embedded by Rust or used as Rust test fixtures.
      - 'apps/cpu-viewer/frontend/src/fixtures/**'
      - 'apps/fault-demo/frontend/index.html'
      - 'apps/storage-demo/frontend/embedded/**'
  pull_request:
    paths: *rust-inputs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ARM64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CLANG: clang-18
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Install tooling
        run: npm --prefix scripts/ci ci --ignore-scripts --no-audit --no-fund
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang-18 libclang-18-dev llvm-18-dev build-essential pkg-config \
            libelf-dev zlib1g-dev python3 rsync

      - name: Install pinned Rust toolchain
        run: |
          rustup show
          rustc --version
          cargo --version

      - name: Cache Cargo downloads and compiled dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.runner }}
          env-vars: CLANG
          cache-bin: false

      - name: Check library boundaries
        run: |
          node scripts/ci/check-boundaries.mts --rules scripts/ci/boundaries.json
          node --test scripts/ci/test-boundaries.mts

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (default features)
        run: cargo clippy --profile ci --workspace --no-deps --all-targets --locked -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --profile ci --workspace --no-deps --all-targets --all-features --locked -- -D warnings

      - name: Test storage without default features
        run: |
          # Registered I/O buffers need more than the hosted runner default.
          sudo prlimit --pid "$$" --memlock=268435456:268435456
          ulimit -l
          cargo test --profile ci --locked -p storage-persistence --no-default-features

      - name: Test workspace (default features)
        run: |
          # Registered I/O buffers need more than the hosted runner default.
          sudo prlimit --pid "$$" --memlock=268435456:268435456
          ulimit -l
          cargo test --profile ci --locked --workspace

      - name: Test workspace (all features)
        run: |
          # Registered I/O buffers need more than the hosted runner default.
          sudo prlimit --pid "$$" --memlock=268435456:268435456
          ulimit -l
          cargo test --profile ci --locked --workspace --all-features

      - name: Test CI snapshot synchronization
        run: node --test scripts/ci/test-prepare-build.mts scripts/ci/test-snapshot.mts
