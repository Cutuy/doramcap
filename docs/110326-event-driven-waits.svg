<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
<title id="title">Event-driven workers</title>
<desc id="desc">Workers block on a channel, select, condition variable or kernel wait. Published blocks, Dora events, stop requests, I/O completions, external state changes and real deadlines wake them to do work.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526b80"/></marker></defs>
<style>text{font-family:DejaVu Sans,sans-serif;fill:#18334b}.title{font-size:26px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px;fill:#48647b}.edge{fill:none;stroke:#526b80;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1100" height="520" fill="#f7f9fc"/>
<text x="40" y="48" class="title">Event-driven workers</text>
<rect x="40" y="80" width="300" height="62" rx="10" fill="#fff" stroke="#c5d2dc"/>
<text x="190.0" y="106.0" class="h" text-anchor="middle">Published blocks</text>
<text x="190.0" y="129.0" class="s" text-anchor="middle">bounded channel</text>
<path d="M340 111 H470" class="edge"/>
<rect x="40" y="152" width="300" height="62" rx="10" fill="#fff" stroke="#c5d2dc"/>
<text x="190.0" y="178.0" class="h" text-anchor="middle">Dora events</text>
<text x="190.0" y="201.0" class="s" text-anchor="middle">EventStream recv</text>
<path d="M340 183 H470" class="edge"/>
<rect x="40" y="224" width="300" height="62" rx="10" fill="#fff" stroke="#c5d2dc"/>
<text x="190.0" y="250.0" class="h" text-anchor="middle">Stop request</text>
<text x="190.0" y="273.0" class="s" text-anchor="middle">stop channel</text>
<path d="M340 255 H470" class="edge"/>
<rect x="40" y="296" width="300" height="62" rx="10" fill="#fff" stroke="#c5d2dc"/>
<text x="190.0" y="322.0" class="h" text-anchor="middle">I/O completions</text>
<text x="190.0" y="345.0" class="s" text-anchor="middle">submit_and_wait</text>
<path d="M340 327 H470" class="edge"/>
<rect x="40" y="368" width="300" height="62" rx="10" fill="#fff" stroke="#c5d2dc"/>
<text x="190.0" y="394.0" class="h" text-anchor="middle">External state</text>
<text x="190.0" y="417.0" class="s" text-anchor="middle">watch · inotify · Docker events</text>
<path d="M340 399 H470" class="edge"/>
<rect x="40" y="440" width="300" height="62" rx="10" fill="#fff" stroke="#c5d2dc"/>
<text x="190.0" y="466.0" class="h" text-anchor="middle">Real deadline</text>
<text x="190.0" y="489.0" class="s" text-anchor="middle">batch age · sampling tick</text>
<path d="M340 471 H470" class="edge"/>
<rect x="472" y="80" width="230" height="422" rx="10" fill="#e5f3ed" stroke="#c5d2dc"/>
<text x="587.0" y="286.0" class="h" text-anchor="middle">Blocked worker</text>
<text x="587.0" y="309.0" class="s" text-anchor="middle">one wait, no timer loop</text>
<path d="M702 291 H830" class="edge"/>
<rect x="832" y="246" width="228" height="90" rx="10" fill="#fff" stroke="#c5d2dc"/>
<text x="946.0" y="286.0" class="h" text-anchor="middle">Work</text>
<text x="946.0" y="309.0" class="s" text-anchor="middle">drain · write · stop</text>
</svg>
