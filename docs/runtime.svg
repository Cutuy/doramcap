<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Current doramcap integration paths</title>
  <desc id="desc">Four paths show lifecycle execution, CPU telemetry, activity capture, and CUDA shared-memory communication with their exchanged artifacts.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <style>
      text { font-family: system-ui, sans-serif; fill: #0f172a; font-size: 16px; text-anchor: middle; }
      .label { font-size: 13px; fill: #475569; }
      .box { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; rx: 10; }
      .flow { fill: none; stroke: #475569; stroke-width: 1.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="960" height="460" rx="12" fill="#fff"/>
  <text x="480" y="32" font-weight="600" font-size="20">Runtime components and exchanged artifacts</text>
  <rect class="box" x="20" y="70" width="230" height="60"/>
  <text x="135" y="96">Orchestrator</text><text class="label" x="135" y="117">Recorded-run phases</text>
  <rect class="box" x="365" y="70" width="230" height="60"/>
  <text x="480" y="96">Compose / Supervisor</text><text class="label" x="480" y="117">Owned execution</text>
  <rect class="box" x="710" y="70" width="230" height="60"/>
  <text x="825" y="96">Workloads</text><text class="label" x="825" y="117">Readiness and artifacts</text>
  <path class="flow" d="M250 100 H365"/><text class="label" x="307" y="88">Run inputs</text>
  <path class="flow" d="M595 100 H710"/><text class="label" x="652" y="88">Launch / stop</text>
  <rect class="box" x="20" y="170" width="230" height="60"/>
  <text x="135" y="196">System Monitor</text><text class="label" x="135" y="217">Native CPU collection</text>
  <rect class="box" x="365" y="170" width="230" height="60"/>
  <text x="480" y="196">Dora</text><text class="label" x="480" y="217">Messaging</text>
  <rect class="box" x="710" y="170" width="230" height="60"/>
  <text x="825" y="196">Viewer / Recorder</text><text class="label" x="825" y="217">WebSocket / MCAP</text>
  <path class="flow" d="M250 200 H365"/><text class="label" x="307" y="188">Protobuf</text>
  <path class="flow" d="M595 200 H710"/><text class="label" x="652" y="188">CPU topics</text>
  <rect class="box" x="20" y="270" width="230" height="60"/>
  <text x="135" y="296">Application spans</text><text class="label" x="135" y="317">Registered threads</text>
  <rect class="box" x="365" y="270" width="230" height="60"/>
  <text x="480" y="296">Activity runtime</text><text class="label" x="480" y="317">Bounded capture and encoding</text>
  <rect class="box" x="710" y="270" width="230" height="60"/>
  <text x="825" y="296">Output workers</text><text class="label" x="825" y="317">MCAP / live / OTel</text>
  <path class="flow" d="M250 300 H365"/><text class="label" x="307" y="288">Records</text>
  <path class="flow" d="M595 300 H710"/><text class="label" x="652" y="288">Batch leases</text>
  <rect class="box" x="20" y="370" width="230" height="60"/>
  <text x="135" y="396">CUDA host storage</text><text class="label" x="135" y="417">Registered shared mapping</text>
  <rect class="box" x="365" y="370" width="230" height="60"/>
  <text x="480" y="396">Fixed-slot IPC adapter</text><text class="label" x="480" y="417">Same host / GPU</text>
  <rect class="box" x="710" y="370" width="230" height="60"/>
  <text x="825" y="396">GPU peers</text><text class="label" x="825" y="417">Ready / Done events</text>
  <path class="flow" d="M250 400 H365"/><text class="label" x="307" y="388">Slot leases</text>
  <path class="flow" d="M595 400 H710"/><text class="label" x="652" y="388">Descriptors</text>
</svg>
