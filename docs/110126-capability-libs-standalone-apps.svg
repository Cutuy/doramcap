<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif" font-size="14">
  <title id="title">Capability libs and standalone apps</title>
  <desc id="desc">Gallery and Console launch standalone apps from pbtxt. Apps link capability libs, write their own MCAP and publish live data to the bridge.</desc>
  <rect width="760" height="450" fill="#fff"/>
  <g fill="#e1f5ee" stroke="#0f6e56">
    <rect x="30" y="20" width="340" height="56" rx="8"/>
    <rect x="390" y="20" width="340" height="56" rx="8"/>
    <rect x="30" y="118" width="220" height="62" rx="8"/>
    <rect x="270" y="118" width="220" height="62" rx="8"/>
    <rect x="510" y="118" width="220" height="62" rx="8"/>
    <rect x="30" y="222" width="460" height="56" rx="8"/>
    <rect x="510" y="222" width="220" height="56" rx="8"/>
  </g>
  <g fill="#f1efe8" stroke="#5f5e5a">
    <rect x="30" y="350" width="166" height="62" rx="8"/>
    <rect x="212" y="350" width="166" height="62" rx="8"/>
    <rect x="394" y="350" width="166" height="62" rx="8"/>
    <rect x="576" y="350" width="154" height="62" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#04342c">
    <text x="200" y="44" font-weight="600">Gallery</text>
    <text x="200" y="63" font-size="12">prebuilt pbtxt</text>
    <text x="560" y="44" font-weight="600">Console</text>
    <text x="560" y="63" font-size="12">user-selected profile</text>
    <text x="140" y="143" font-weight="600">system-monitor</text>
    <text x="140" y="162" font-size="12">sampling loop, optional MCAP</text>
    <text x="380" y="143" font-weight="600">fault-watchdog</text>
    <text x="380" y="162" font-size="12">reconcile loop, optional MCAP</text>
    <text x="620" y="143" font-weight="600">mcap-recorder</text>
    <text x="620" y="162" font-size="12">records existing apps' messages</text>
    <text x="260" y="246" font-weight="600">Live bridge</text>
    <text x="260" y="265" font-size="12">Dora outputs to frontend</text>
    <text x="620" y="246" font-weight="600">Existing apps</text>
    <text x="620" y="265" font-size="12">Dora, ROS 2 later</text>
  </g>
  <text x="30" y="335" fill="#444" font-size="12">Capability libs, linked by apps</text>
  <g text-anchor="middle" fill="#2c2c2a">
    <text x="113" y="375" font-weight="600">CPU collection</text>
    <text x="113" y="394" font-size="12">BPF, buffers, dictionary</text>
    <text x="295" y="375" font-weight="600">Fault reconciliation</text>
    <text x="295" y="394" font-size="12">state, no sinks</text>
    <text x="477" y="375" font-weight="600">activity-tracing</text>
    <text x="477" y="394" font-size="12">capture, optional sinks</text>
    <text x="653" y="375" font-weight="600">storage-persistence</text>
    <text x="653" y="394" font-size="12">MCAP writer</text>
  </g>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#444" stroke-width="1.5"/></marker></defs>
  <g stroke="#444" stroke-width="1" fill="none" marker-end="url(#a)">
    <path d="M200 76V97H140V116"/>
    <path d="M200 76V97H380V116"/>
    <path d="M560 76V97H380V116"/>
    <path d="M560 76V97H620V116"/>
    <path d="M140 180V220"/>
    <path d="M380 180V220"/>
    <path d="M620 222V182"/>
  </g>
</svg>
