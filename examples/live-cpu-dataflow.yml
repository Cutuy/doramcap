nodes:
  - id: system-monitor
    path: ./run-native-monitor.sh
    args: --backend bpf --task-capacity 32768 --dora
    outputs:
      - snapshots
      - dictionary
  - id: cpu-viewer
    path: ../target/debug/cpu-viewer
    args: --port 8080
    inputs:
      snapshots:
        source: system-monitor/snapshots
        queue_size: 4
      dictionary:
        source: system-monitor/dictionary
        queue_size: 4
